<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 생산마감 · 하림펫푸드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230c2350'/><text y='73' x='50' text-anchor='middle' font-size='62' font-weight='bold' fill='white' font-family='sans-serif'>H</text></svg>">
<style>
:root{
  --navy:#3b556e; --navy2:#4a6784; --navy3:#6b85a0;
  --smoke:#eef3f8; --card:#fff; --line:#dce4ee;
  --ink:#1f2d3d; --sub:#5a6b82; --mut:#93a1b5;
  --red:#d15a4e; --grn:#4e9a72; --grn-soft:#eef4f0;
  --blue:#4a6784; --blue-soft:#eef2f6;
  --r:12px; --sh:0 1px 2px rgba(26,58,92,.06),0 4px 16px rgba(26,58,92,.05);
  --sh-lg:0 16px 48px rgba(26,58,92,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--smoke);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* 로그인 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0f1628,#1b2740);display:grid;place-items:center;z-index:50}
.loginbox{background:#fff;border-radius:20px;padding:38px 34px;width:380px;box-shadow:var(--sh-lg);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.loginbox h2{font-size:21px;font-weight:800}
.loginbox .en{font-size:10.5px;color:var(--mut);letter-spacing:.16em;font-weight:600;margin:4px 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:7px}
.field select,.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.field select:focus,.field input:focus{outline:none;border-color:var(--navy3);background:#fff}
.btn-lg{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:11px;font-weight:800;font-size:15px;margin-top:6px}
.btn-lg:hover{background:var(--navy2)}
.err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;font-weight:600}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:18px}
.admin-link{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer}
.admin-link:hover{color:var(--sub);text-decoration:underline}
.admin-link.on{color:var(--blue)}

/* 상단바/헤더 */
.topbar{background:var(--navy);color:var(--hdr-text,#fff);height:52px;display:flex;align-items:center;padding:0 22px;gap:14px;font-size:12.5px}
.topbar .brandtag{background:rgba(255,255,255,.92);color:var(--navy);font-weight:800;border-radius:6px;padding:5px 10px}
.topbar .sys{color:var(--hdr-text,#8ea0c8);opacity:.72;font-weight:600}
.topbar .spacer{flex:1}
.topbar .who b{color:var(--hdr-text,#fff)}.topbar .who{color:var(--hdr-text,#c9d4ec);opacity:.9}
.topbar .lo{color:var(--hdr-text,#8ea0c8);opacity:.82;font-weight:600}
.header{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;gap:16px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.header h1{font-size:19px;font-weight:800}
.header .en{font-size:11px;color:var(--mut);letter-spacing:.18em;font-weight:600;margin-top:2px}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--sub)}
.nav button:hover{background:var(--smoke)}
.nav button.on{background:var(--blue-soft);color:var(--blue)}
.nav button.primary{background:var(--navy);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 80px}

/* 캘린더 */
.cal-head{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:20px 24px;display:flex;align-items:center}
.cal-head h2{font-size:18px;font-weight:800}
.cal-head .sub{font-size:12px;color:#8ea0c8;margin-top:3px}
.cal-stats{margin-left:auto;display:flex;gap:10px}
.cal-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:10px 18px;text-align:center;min-width:92px}
.cal-stat .n{font-size:24px;font-weight:800;line-height:1}
.cal-stat .l{font-size:10.5px;color:#a9b7d6;margin-top:5px}
.cal-tool{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-top:none}
.cal-nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.cal-nav button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.cal-nav button:hover{background:var(--smoke)}
.cal-nav .ym{font-weight:800;font-size:15px;min-width:96px;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{margin-left:10px;padding:7px 14px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.refresh-btn:hover{background:var(--navy2)}
.cal-grid{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow div{padding:10px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.cal-dow div:first-child{color:var(--red)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.pad{background:#fafbfd}
.cal-cell .dn{font-size:13px;font-weight:700;color:var(--sub)}
.cal-cell.today{background:rgba(38,112,201,.06);box-shadow:inset 0 0 0 2.5px var(--blue);border-radius:4px}
.cal-cell.today .dn{color:var(--blue);display:flex;align-items:center;gap:5px}
.today-badge{background:var(--blue);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.03em}
.cal-tag{display:block;width:100%;text-align:left;margin-top:5px;font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;border:1px solid;background:#fff7ed;color:#c2410c;border-color:#fed7aa;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;transform-origin:left center}
.cal-tag:hover{transform:scale(1.05);box-shadow:0 3px 10px rgba(26,58,92,.18);filter:brightness(1.03);position:relative;z-index:3}
.cal-tag:active{transform:scale(.97)}
.cal-tag.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.cal-tag.submitted{background:#eff6ff;color:#2563eb;border-color:#c7dbff}
.cal-tag.done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.cal-tag.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca}
.cal-tag.draft{background:#f8fafc;color:#6b7690;border-color:#e4e8f0}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid}
.chip.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.chip.submitted{background:#eff6ff;color:#2563eb;border-color:#c7dbff}
.chip.done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.chip.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca}

/* 패널/업로드 */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.panel-hd{background:var(--navy);color:#fff;padding:20px 24px;border-radius:var(--r) var(--r) 0 0}
.panel-hd h2{font-size:19px;font-weight:800}
.panel-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.panel-bd{padding:24px}
.pick{margin-bottom:20px}
.pick label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:9px}
.pick input[type=date]{padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.paste-area{width:100%;min-height:220px;padding:14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke);font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.paste-area:focus{outline:none;border-color:var(--navy3);background:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.upload-result{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none}
.upload-result.ok{background:var(--grn-soft);color:var(--grn);display:block}
.upload-result.err{background:#fef2f2;color:var(--red);display:block}

/* 토스트 */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--sh-lg);opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#15803d}#toast.err{background:var(--red)}
.skel{background:linear-gradient(90deg,#eef1f7 25%,#e3e8f2 37%,#eef1f7 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== PO 화면 ===== */
.po-back{margin-bottom:14px}
.po-back button{padding:8px 16px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.po-back button:hover{background:var(--smoke)}
.day-hd{background:linear-gradient(135deg,#0f1628,#26365a);color:#fff;border-radius:var(--r);padding:22px 26px;display:flex;align-items:center;margin-bottom:16px}
.day-hd h2{font-size:20px;font-weight:800}
.day-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.day-hd .meta{margin-left:auto;text-align:right;font-size:13px;color:#a9b7d6}
.day-hd .meta b{color:#fff;font-size:18px}
.po-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.po-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s}
.po-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.po-card .po-t{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.po-card .po-team{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.po-card .po-sub{font-size:12px;color:var(--mut);margin-top:4px}
.po-card .po-stats{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.po-card .po-stat{flex:1}
.po-card .po-stat .l{font-size:10.5px;color:var(--sub);font-weight:600}
.po-card .po-stat .v{font-size:18px;font-weight:800;margin-top:3px}
.po-card .achieve-badge{margin-left:auto;font-size:20px;font-weight:800}
.po-card .achieve-badge.g{color:var(--grn)}.po-card .achieve-badge.r{color:var(--red)}
.po-card .scrap-warn{font-size:11px;color:var(--red);font-weight:700;margin-top:8px}

/* PO 상세 */
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.sec-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfe,#fff)}
.sec-hd .no{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(26,58,92,.25)}
/* 섹션별 색조 (스크롤 시 인지) */
.no.c1{background:linear-gradient(135deg,#2670c9,#4a90d9)!important}
.no.c2{background:linear-gradient(135deg,#0e8a8a,#16b3b3)!important}
.no.c3{background:linear-gradient(135deg,#c2410c,#e8813a)!important}
.no.c4{background:linear-gradient(135deg,#c0392b,#e0483a)!important}
.no.c5{background:linear-gradient(135deg,#6d28d9,#8b5cf6)!important}
.no.c6{background:linear-gradient(135deg,#15803d,#22a55a)!important}
.no.cx{background:linear-gradient(135deg,#475569,#64748b)!important}
.sec-hd{background:linear-gradient(100deg,#fbfdff,#f2f7fc)}
.sec-hd h3{font-size:15.5px;font-weight:800}
.sec-hd .desc{font-size:12px;color:var(--mut)}
.sec-hd .sp{flex:1}
.sec-bd{padding:16px 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:#fff;padding:10px;font-weight:700;font-size:12px;text-align:center;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid #eef3f8;text-align:center}
tbody tr:nth-child(even){background:#f8fbfe}
tbody tr:hover{background:var(--grn-soft)}
tbody td.l{text-align:left}
.inp-cell{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;background:#fffdf5}
.inp-cell:focus{outline:none;border-color:var(--navy3);background:#fff}
.kind-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.kind-badge.fin{background:var(--blue-soft);color:var(--blue)}
.kind-badge.semi{background:#fef9c3;color:#a16207}
.pos{color:var(--grn);font-weight:700}.neg{color:var(--red);font-weight:700}
.tbtn{padding:9px 15px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:13px;color:var(--sub);background:#fff}
.tbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.work-field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.work-field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--smoke)}
.work-field input:focus{outline:none;border-color:var(--navy3);background:#fff}
@media(max-width:640px){.work-grid{grid-template-columns:1fr 1fr}}
/* 스코어카드 */
.score-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.score-row .sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.score-row .sc:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.score-row .sc::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--navy3)}
.score-row .sc.g::after{background:var(--grn)}.score-row .sc.r::after{background:var(--red)}.score-row .sc.b::after{background:var(--blue)}
.score-row .sc .l{font-size:11px;color:var(--sub);font-weight:700}
.score-row .sc .v{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.score-row .sc .v .u{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px;letter-spacing:0}
.score-row .sc .sub{font-size:11px;font-weight:600;color:var(--mut);margin-top:3px;letter-spacing:0;font-variant-numeric:tabular-nums}
.score-row .sc .sub .u{font-size:10px;color:#9aa8bd;margin-left:1px}
@media(max-width:900px){.score-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.score-row{grid-template-columns:repeat(2,1fr)}}
/* 탭 */
.tabbar{display:flex;gap:6px;padding:12px 20px 0}
.tabbar .tab{padding:8px 16px;border-radius:9px 9px 0 0;font-weight:700;font-size:13px;color:var(--sub);border:1px solid transparent}
.tabbar .tab.on{background:var(--navy);color:#fff}
tfoot td{padding:11px 10px;border-top:2px solid var(--navy3)}
.delx{color:var(--red);font-weight:800;cursor:pointer;font-size:15px}
.type-tag{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.type-chips{display:flex;flex-wrap:wrap;gap:8px}
.type-chip{display:inline-flex;align-items:center;gap:6px;background:var(--grn-soft);color:var(--grn);border:1px solid #bbf0d2;font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px}
.type-chip .x{cursor:pointer;font-weight:800;color:var(--red)}
.type-panel{padding:14px 20px;background:#f8fbfe;border-bottom:1px solid var(--line)}
.pareto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pareto-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;transition:transform .15s,box-shadow .15s}
.pareto-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.pc-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pc-no{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.pc-hd b{font-size:15px}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.pc-l{font-size:11px;color:var(--sub);font-weight:600}
.pc-v{font-size:16px;font-weight:800;margin-top:2px}
.pc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pc-bar{height:5px;background:#eef3f8;border-radius:3px;margin-top:8px;overflow:hidden}
.pc-bar>div{height:100%;background:var(--red);border-radius:3px}
@media(max-width:900px){.pareto-grid{grid-template-columns:1fr}}
/* 행별 편집 버튼 */
.row-actions{white-space:nowrap}
.proc-tabbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:#f6f9fd;border-bottom:1px solid var(--line)}
.proc-tab{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;border:1.5px solid var(--line);
  background:#fff;color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.proc-tab .pt-no{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e2e8f2;color:#7b8595;font-size:10px;font-weight:800}
.proc-tab:hover{border-color:#2954a0;color:#2954a0}
.proc-tab.on{background:#2954a0;border-color:#2954a0;color:#fff}
.proc-tab.on .pt-no{background:rgba(255,255,255,.25);color:#fff}
.pt-cnt{font-size:11px;font-weight:800;opacity:.65;margin-left:1px}
/* ⑤ 블록 구조 */
.blk-hd{padding:12px 16px;background:#eef2f9;font-size:13.5px;font-weight:800;color:#1e3a6d;border-top:1px solid var(--line)}
.blk-hd .blk-sub{font-size:11.5px;font-weight:600;color:var(--mut);margin-left:8px}
.run-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#fbfcfe}
.run-form select,.run-form input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px}
.run-form select{background:#fff}
/* [D] 비가동 입력폼 */
.stop-form{padding:12px 16px;background:#fbfcfe;display:flex;flex-direction:column;gap:8px}
.sf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sf-row select,.sf-row input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px}
.sf-row select{background:#fff}
.se-lb{font-size:12px;font-weight:700;color:var(--sub)}
/* [F] 파레토 스코어카드 */
.pareto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px 16px}
.pareto-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pc-hd{display:flex;align-items:center;gap:8px;padding:10px 13px;background:#f6f9fd;font-weight:800;font-size:13.5px;color:#1e3a6d}
.pc-no{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2954a0;color:#fff;font-size:11px;font-weight:800}
.pc-body{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 13px}
.pc-k{font-size:10.5px;color:var(--mut);font-weight:700}
.pc-v{font-size:15px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:2px}
.pc2-foot{padding:8px 13px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut);display:flex;justify-content:space-between;position:relative}
.pc2-bar{position:absolute;left:0;bottom:0;width:100%;height:3px;background:#eef2f9}
.pc2-bar>div{height:100%;background:linear-gradient(90deg,#2954a0,#4a90d9)}
/* 문서 푸터 */
.doc-footer2{margin-top:16px;padding:18px 22px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;
  text-align:right;font-size:13px;line-height:1.9;color:var(--sub)}
.doc-footer2 b{color:var(--ink);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
/* 투입인원 고정행·노무비 */
.mp-fixed td{background:#fbfcf8}
.labor-note{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 18px;background:#f7f9fc;
  border-top:1px solid var(--line);font-size:14px;align-items:center}
.labor-note b{font-weight:800}
/* ── 생산2팀 전용 스타일 ── */
.closing-hd2{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#1e3a6d,#2954a0);
  color:#fff;padding:18px 22px;border-radius:14px;margin-bottom:16px}
.closing-hd2.t1{background:linear-gradient(120deg,#0f1f3d,#1e3a6d)}
.closing-hd2 .tbtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}
.closing-hd2 .tbtn:hover{background:rgba(255,255,255,.24)}
.ch2-title h1{margin:0;font-size:19px;font-weight:800}
.ch2-title h1 span{color:#93c5fd!important}
.ch2-sub{font-size:12.5px;opacity:.82;margin-top:3px}
/* 섹션 번호 색: 1팀·2팀 공통으로 타이틀별 색(.no.c1~c6) 사용 */
/* ── 생산1팀 마감화면 표 헤더를 2팀과 동일한 파랑으로 (섹션번호 색은 타이틀별 유지) ── */
.t2-theme .sec-hd{background:linear-gradient(100deg,#f4f8fd,#eef3fb)}
.t2-theme table thead th{background:#2954a0!important;color:#fff!important;border-color:#3b62a8!important}
.t2-theme table thead th *{color:#fff!important}
.t2-theme table tbody tr:nth-child(even){background:#f6f9fd}
.t2-table th{background:#2954a0;color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:7px 6px;border:1px solid #3b62a8}
.t2-table td{text-align:center;font-size:12.5px;border:1px solid var(--line);padding:7px 6px}
.t2-table td.l{text-align:left}
/* ③ 로스 테이블: 제품·자재명 칸이 좁아 세로로 벌어지는 것 방지 */
#lossTable td.l{min-width:120px;max-width:200px;word-break:keep-all}
#lossTable{min-width:1050px}
.t2-table tbody tr:nth-child(even){background:#f6f9fd}
.t2-lno{display:inline-block;background:#2954a0;color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:5px;margin-right:5px}
/* 접기/펼치기 상세 영역 */
.fold-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f7f9fc;border-top:1px solid var(--line);
  cursor:pointer;user-select:none;transition:background .15s}
.fold-bar:hover{background:#eef3fa}
.fold-arrow{font-size:11px;color:var(--mut);transition:transform .22s;display:inline-block}
.fold-bar.open .fold-arrow{transform:rotate(90deg)}
.fold-title{font-size:12.5px;font-weight:800;color:var(--sub)}
.fold-cnt{font-size:11px;font-weight:700;color:#fff;background:var(--mut);padding:1px 8px;border-radius:20px}
.fold-bar.open .fold-cnt{background:var(--navy)}
.fold-hint{margin-left:auto;font-size:11px;color:var(--mut)}
.fold-body{display:none}
.fold-body.open{display:block;animation:foldIn .18s ease}
@keyframes foldIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 요약 스트립 (타이틀 옆 핵심 수치) */
.sum-strip{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fbfcfe;border-top:1px solid var(--line)}
.sum-item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;min-width:96px}
.sum-item .k{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.02em}
.sum-item .v{font-size:15px;font-weight:800;color:var(--ink);margin-top:2px;font-family:'JetBrains Mono',monospace}
.sum-item.neg .v{color:var(--red)}
.sum-item.pos .v{color:var(--grn)}
.edit-badge{display:inline-block;background:#fef3c7;color:#b45309;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:middle}
/* 써머리 값: 금액 작게 + 본문 글자체 (mono 아님) */
.sum-strip.sm .v{font-size:12.5px;font-weight:700;font-family:inherit;letter-spacing:0}
.sum-strip.sm .sum-item{min-width:88px;padding:7px 12px}
/* 비가동 상세 라인 필터 */
.dt-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 14px;background:#f7f9fc;border-top:1px solid var(--line)}
.dtf-label{font-size:11.5px;font-weight:800;color:var(--mut);margin-right:4px;letter-spacing:.02em}
.dtf-chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--sub);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .16s;white-space:nowrap}
.dtf-chip b{font-weight:800;opacity:.6;margin-left:2px;font-size:11px}
.dtf-chip:hover{border-color:var(--navy);color:var(--navy)}
.dtf-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dtf-chip.on b{opacity:.75}
/* 인원표 관리자 행 (공정 공통, 1/n 배분) */
.mp-mgr td{background:#f7f9fc;border-top:2px solid #dde5f0}
.mp-mgr td.l{box-shadow:inset 3px 0 0 var(--blue)}
/* 데이터 출처 배지 (시트 자동 / 사이트 직접) */
.src-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;cursor:help}
.src-tag.auto{background:#eef2f7;color:#64748b;border:1px solid #dde3ec}
.src-tag.manual{background:var(--blue-soft);color:var(--blue);border:1px solid #c7dbff}
/* 수정 팝업 다이얼로그 */
.dlg-back{position:fixed;inset:0;background:rgba(12,35,80,.42);backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:dlgIn .16s ease}
@keyframes dlgIn{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(12,35,80,.28);width:100%;max-width:620px;max-height:90vh;overflow:auto;animation:dlgUp .2s cubic-bezier(.2,.8,.3,1)}
@keyframes dlgUp{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.dlg-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.dlg-hd h3{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
.dlg-bd{padding:18px 20px 22px}
.cap-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.cap-badge.on{background:var(--grn-soft);color:var(--grn)}
.cap-badge.off{background:#f1f3f6;color:#8a93a3}
.cap-linehd td{background:#f7f9fc;border-top:2px solid var(--line);font-size:13.5px}
/* 비활성 행: 텍스트·입력칸만 흐리게, 버튼(cap-act)은 선명하게 유지 */
.cap-off td{background:#fafbfc}
.cap-off td:not(.cap-act){opacity:.45}
.cap-off td.l{box-shadow:inset 3px 0 0 #b9c0cc}
.rowbtn.act{background:var(--grn-soft);color:var(--grn);border-color:var(--grn);font-weight:800}
.rowbtn.act:hover{background:var(--grn);color:#fff}
.rowbtn:disabled{opacity:.4;cursor:not-allowed}
.rowbtn{padding:5px 11px;border-radius:7px;font-weight:700;font-size:12px;margin:0 2px;border:1px solid var(--line)}
.rowbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.rowbtn.edit{background:var(--blue-soft);color:var(--blue);border-color:#c7dbff}
.rowbtn.del{background:#fef2f2;color:var(--red);border-color:#fecaca}
.rowbtn.cancel{background:#f1f4fa;color:var(--sub)}
.rowbtn.xcl{background:#fff7ed;color:#c2560c;border-color:#fed7aa;cursor:pointer}
.rowbtn.xcl:hover{background:#c2560c;color:#fff;border-color:#c2560c}
tr.row-saved{background:var(--grn-soft)!important}
tr.row-saved .inp-cell{background:transparent;border-color:transparent;font-weight:600;color:var(--ink)}
/* 긴 표 타이틀 고정 스크롤 */
.table-scroll{max-height:520px;overflow:auto;border-radius:8px}
table.sticky-head thead th{position:sticky;top:0;z-index:2;box-shadow:0 2px 0 rgba(26,58,92,.15)}
.input-row{background:#fffef5}
.input-row td{border-bottom:2px solid var(--line)}
/* 모바일/태블릿 반응형 */
@media(max-width:768px){
  .wrap{padding:14px 10px 60px}
  .header{padding:14px 16px;flex-wrap:wrap;gap:10px}
  .header h1{font-size:16px}
  .nav{margin-left:0;width:100%;overflow-x:auto}
  .nav button{padding:8px 12px;font-size:12.5px;white-space:nowrap}
  .day-hd{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
  .day-hd .meta{margin-left:0;text-align:left}
  .toolbar{flex-wrap:wrap}
  .toolbar .sp{display:none}
  .toolbar .tbtn{flex:1;min-width:calc(50% - 5px);text-align:center}
  .score-row{grid-template-columns:repeat(2,1fr)}
  .pareto-grid{grid-template-columns:1fr}
  .sec-hd{flex-wrap:wrap;gap:8px}
  .sec-hd .sp{display:none}
  .sec-hd .tbtn{font-size:12px;padding:7px 10px}
  .work-grid{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:70px;padding:4px}
  .cal-tag{font-size:9.5px;padding:3px 4px}
  .cal-stats{gap:6px}
  .cal-stat{padding:8px 12px;min-width:70px}
  .cal-stat .n{font-size:19px}
  table{font-size:12px}
  thead th{padding:8px 6px;font-size:11px}
  tbody td{padding:7px 6px}
}
@media(max-width:480px){
  .score-row{grid-template-columns:1fr 1fr}
  .work-grid{grid-template-columns:1fr}
  .loginbox{width:92vw;padding:28px 22px}
}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.toolbar .tb-status{font-size:13px;font-weight:800;color:var(--navy);background:var(--blue-soft);padding:6px 14px;border-radius:8px}
.tb-status.wait{background:#fff7ed;color:#c2410c}
.tb-status.done{background:var(--grn-soft);color:var(--grn)}
.tb-status.rej{background:#fef2f2;color:var(--red)}
/* 결재 진행바 */
.appr-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.appr-flow{display:flex;align-items:flex-start;justify-content:center;gap:0}
.appr-step{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:112px}
/* 이름이 들어가는 큰 둥근 네모 카드 */
.as-card{width:118px;padding:11px 8px 9px;border-radius:14px;background:#f4f6fa;border:2px solid #e2e8f2;
  text-align:center;transition:all .24s cubic-bezier(.2,.8,.3,1)}
.as-role{font-size:11px;font-weight:700;color:#9aa5b5;letter-spacing:.03em;margin-bottom:3px}
.as-name{font-size:15px;font-weight:800;color:#b3bccb;line-height:1.25;word-break:keep-all}
.as-en{font-size:9.5px;font-weight:600;color:#c2cad6;letter-spacing:.04em;margin-top:3px;text-transform:uppercase}
/* 완료: 아주 연한 세이지 */
.appr-step.done .as-card{background:#f2f8f4;border-color:#bcd9c6}
.appr-step.done .as-role{color:#7ba58c}
.appr-step.done .as-name{color:#4a8c66}
.appr-step.done .as-en{color:#a6c8b4}
/* 진행 중(현재 차례): 차분한 세이지 그린 + 확대 */
.appr-step.now .as-card{background:linear-gradient(135deg,#5faa7d,#4d9670);border-color:#41855f;
  transform:scale(1.13);box-shadow:0 8px 20px rgba(77,150,112,.26);animation:nowPulse 2.4s infinite}
.appr-step.now .as-role{color:rgba(255,255,255,.82)}
.appr-step.now .as-name{color:#fff;font-size:16px}
.appr-step.now .as-en{color:rgba(255,255,255,.6)}
@keyframes nowPulse{0%,100%{box-shadow:0 8px 20px rgba(77,150,112,.26)}50%{box-shadow:0 8px 28px rgba(77,150,112,.42)}}
/* 다음 차례(결재예정): 부드러운 앰버 */
.appr-step.next .as-card{background:#fdf8f0;border-color:#e8c89a}
.appr-step.next .as-role{color:#b08046}
.appr-step.next .as-name{color:#a9752f}
.appr-step.next .as-en{color:#d0b189}
/* 예정: 회색 (기본) */
.as-badge{padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.02em}
.as-badge.done{background:#eaf3ee;color:#4a8c66}
.as-badge.now{background:#4d9670;color:#fff;box-shadow:0 2px 6px rgba(77,150,112,.26)}
.as-badge.next{background:#fdf8f0;color:#a9752f;border:1px solid #e8c89a}
.as-badge.idle{background:#f1f3f6;color:#aab3c0}
.appr-line{flex:1;height:3px;border-radius:2px;background:#e2e8f2;margin:0 6px;margin-top:36px;min-width:18px;transition:background .3s}
.appr-line.fill{background:linear-gradient(90deg,#9ac7ac,#7ab894)}
@media(max-width:760px){
  .appr-flow{flex-wrap:wrap;gap:10px}
  .appr-line{display:none}
  .appr-step{min-width:calc(50% - 8px)}
  .as-card{width:100%}
}
.tbtn.approve{background:var(--grn);color:#fff;border-color:var(--grn)}
.tbtn.reject{background:#fff;color:var(--red);border-color:#fecaca}
.reject-box{margin-top:12px;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;color:var(--red);font-size:13px;font-weight:600}
.comment-box{margin-top:8px;padding:10px 14px;background:var(--blue-soft);border:1px solid #c7dbff;border-radius:9px;color:var(--blue);font-size:13px;font-weight:600}
.lock-banner{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:16px;color:#92660c;font-size:13px;font-weight:600}
/* 대시보드 */
.dash-filter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.dash-filter label{font-size:12px;font-weight:700;color:var(--sub)}
.dash-filter input,.dash-filter select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px}
.dash-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.dash-2col{grid-template-columns:1fr}.dash-filter{flex-direction:column;align-items:stretch}.dash-filter input,.dash-filter select{width:100%}}
.settings-tabs{display:flex;gap:8px;margin-bottom:16px}
.settings-tabs .stab{padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub);background:#fff;border:1px solid var(--line)}
.settings-tabs .stab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.status-toggle{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid;cursor:pointer;transition:all .15s}
.status-toggle:hover{transform:scale(1.06)}
.status-toggle.on{background:var(--grn-soft);color:var(--grn);border-color:var(--grn)}
.status-toggle.off{background:#f1f4fa;color:var(--mut);border-color:var(--line)}
/* 팀별 월 현황 카드 (캘린더 하단) */
.team-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.team-stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:transform .18s,box-shadow .18s}
.team-stat-card:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.tsc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tsc-hd h4{margin:0;font-size:15px;color:var(--ink)}
.tsc-badge{color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px}
.tsc-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tsc-num{background:#f8fafc;border-radius:8px;padding:10px;text-align:center}
.tsc-l{font-size:11px;color:var(--mut);margin-bottom:4px}
.tsc-v{font-size:22px;font-weight:800;color:var(--ink)}
.tsc-more{margin-top:12px;font-size:12px;color:var(--blue);font-weight:600;text-align:right}
/* 팀 리포트 드릴다운 */
.tr-hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--hdr-text,#fff);border-radius:16px;padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.tr-hero h2{margin:6px 0 2px;font-size:24px}
.tr-hero .en{font-size:11px;opacity:.8;letter-spacing:.05em}
.tr-crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:10px;padding:7px 14px;border-radius:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:var(--hdr-text,#fff);transition:background .15s}
.tr-crumb:hover{background:rgba(255,255,255,.32)}
.tr-nav{display:flex;gap:8px}
.tr-nav button{background:rgba(255,255,255,.15);color:var(--hdr-text,#fff);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.tr-nav button:hover{background:rgba(255,255,255,.28)}
.tr-nav .tr-cal{background:#fff;color:var(--navy)}
.line-row:hover{background:var(--blue-soft) !important}
/* 팀별 현황 */
.ts-grid{display:flex;flex-direction:column;gap:20px}
.ts-plant-hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px}
.ts-bar{width:4px;height:16px;border-radius:2px;display:inline-block}
.ts-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;max-width:560px}
.ts-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ts-card-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ts-card-hd h4{margin:0;font-size:17px;color:var(--ink)}
.ts-sub{font-size:12px;color:var(--mut);margin-top:2px}
.ts-count{background:var(--grn-soft);color:var(--grn);font-size:12px;font-weight:700;padding:4px 10px;border-radius:16px;white-space:nowrap}
.ts-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.line-chip{background:#f1f4fa;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:6px}
.ts-open{font-size:13px;color:var(--blue);font-weight:600}
/* 라인 상세 탭 */
.ld-tabs{display:flex;gap:8px;margin:18px 0}

const S = { user:null, ym:null, view:'cal' };
const $ = s => document.querySelector(s);
const fmt = (n)=> (n==null||isNaN(n))?'–':Number(n).toLocaleString('ko-KR');
// 금액: 부호 + 단위(원). 손실(양수)=빨강 -, 절감(음수)=초록 +
const fmtWon = (n)=>{
  if(n==null||isNaN(n))return '–';
  const v=Math.round(n);
  if(v===0)return '0원';
  const sign=v>0?'-':'+'; // 순로스 양수=손실이므로 -표기
  return sign+fmt(Math.abs(v))+'원';
};
const wonCls = (n)=> n>0?'neg':(n<0?'pos':'');
// 수량: 단위(KG)
const fmtKg = (n)=> (n==null||isNaN(n))?'–':fmt(Math.round(n))+' KG';

/* ── 스코어카드 표기: 큰 단위(ton/백만원) + 아래에 원본 수치를 작고 연하게 ── */
// 중량: 65,074kg → "65.0 ton" + "65,074 kg"
const scTon = (n)=>{
  const v=Number(n)||0;
  const t=v/1000;
  const main=`${t>=100?t.toFixed(0):t.toFixed(1)}<span class="u">ton</span>`;
  return `<div class="v mono">${main}</div><div class="sub">${fmt(Math.round(v))}<span class="u">kg</span></div>`;
};
// 금액: 22,701,543원 → "22.7 백만원" + "22,701,543 원"
const scWon = (n)=>{
  const v=Math.round(Number(n)||0);
  if(v===0) return `<div class="v mono">0<span class="u">원</span></div><div class="sub">&nbsp;</div>`;
  const a=Math.abs(v), m=a/1000000;
  const sign=v>0?'-':'+'; // 순로스 양수=손실이므로 - 표기
  const main=`${sign}${m>=100?m.toFixed(0):m.toFixed(1)}<span class="u">백만원</span>`;
  return `<div class="v mono">${main}</div><div class="sub">${sign}${fmt(a)}<span class="u">원</span></div>`;
};

async function renderCalendar(){
  $('#wrap').innerHTML='<div class="skel" style="height:70px;border-radius:14px 14px 0 0"></div><div class="skel" style="height:420px;margin-top:2px;border-radius:0 0 14px 14px"></div>';
  let list=[];
  try{
    const {data,error}=await sb.rpc('get_calendar_v2',{p_ym:S.ym});
    if(error)throw error;
    list=data||[];
  }catch(e){ toast('캘린더 로드 실패: '+(e.message||e),'err'); }

  const [y,m]=S.ym.split('-').map(Number);
  const byDate={};
  list.forEach(x=>{
    const d=String(x.work_date).slice(0,10);
    (byDate[d]=byDate[d]||[]).push(x);
  });
  // 상태별 카운트 (planned=미작성, submitted/lead_ok/div_ok=결재중, done=완료)
  let cntPlan=0,cntProg=0,cntDone=0;
  list.forEach(x=>{
    const st=x.status||'planned';
    if(st==='planned'||st==='draft') cntPlan++;
    else if(st==='done') cntDone++;
    else cntProg++;
  });

  const statusKo=s=>({planned:'계획',draft:'작성',submitted:'결재중',lead_ok:'팀장✓',div_ok:'본부장✓',done:'완료',rejected:'반려'}[s]||'계획');
  const statusCls=s=>({planned:'planned',draft:'draft',submitted:'submitted',lead_ok:'submitted',div_ok:'submitted',done:'done',rejected:'rejected'}[s]||'planned');

  let html=`
  <div class="cal-head">
    <div><h2>마감 진행 캘린더</h2><div class="sub">${y}년 ${m}월 · 생산계획 있는 팀 표시</div></div>
    <div class="cal-stats">
      <div class="cal-stat"><div class="n mono">${cntPlan}</div><div class="l">작성 대기</div></div>
      <div class="cal-stat"><div class="n mono">${cntProg}</div><div class="l">결재 진행</div></div>
      <div class="cal-stat"><div class="n mono">${cntDone}</div><div class="l">최종 완료</div></div>
    </div>
  </div>
  <div class="cal-tool">
    <div class="legend">
      <span class="chip planned">계획(미작성)</span>
      <span class="chip submitted">결재진행</span>
      <span class="chip done">완료</span>
      <span class="chip rejected">반려</span>
    </div>
    ${S.user.role==='admin'?`<button class="refresh-btn" onclick="go('upload')">＋ 계획 업로드</button>`:''}
    <div class="cal-nav">
      <button onclick="shiftMonth(-1)">이전</button>
      <span class="ym mono">${S.ym}</span>
      <button onclick="shiftMonth(1)">다음</button>
    </div>
  </div>
  <div class="cal-grid">
    <div class="cal-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="cal-body">`;
  const first=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  const todayStr=kstToday();
  for(let i=0;i<first;i++) html+='<div class="cal-cell pad"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${S.ym}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const tags=(byDate[ds]||[]).map(x=>
      `<div class="cal-tag ${statusCls(x.status)}" onclick="openDay('${ds}','${x.team}')">${x.team} ${statusKo(x.status)} ·${x.order_count}</div>`).join('');
    html+=`<div class="cal-cell ${isToday?'today':''}"><div class="dn">${d}${isToday?'<span class="today-badge">Today</span>':''}</div>${tags}</div>`;
  }
  html+='</div></div>';

  // ===== 하단: 팀별 월 현황 카드 =====
  const teamStat={};
  list.forEach(x=>{
    const t=x.team||'기타';
    if(!teamStat[t]) teamStat[t]={plan:new Set(),draft:new Set(),done:new Set()};
    const d=String(x.work_date).slice(0,10);
    const st=x.status||'planned';
    teamStat[t].plan.add(d);  // 계획 있는 날
    if(st==='done') teamStat[t].done.add(d);
    else if(st!=='planned') teamStat[t].draft.add(d);  // 작성/결재중
  });
  const teamColors={'생산1팀':'#2670c9','생산2팀':'#1a9d5c','공통':'#9b6dc9'};
  const cards=Object.keys(teamStat).sort().map(t=>{
    const s=teamStat[t];
    const badge=teamColors[t]||'#64748b';
    return `<div class="team-stat-card" onclick="openTeamReport('${t}','${y}-${String(m).padStart(2,'0')}')" style="cursor:pointer">
      <div class="tsc-hd">
        <h4>${t}</h4>
        <span class="tsc-badge" style="background:${badge}">${y}.${String(m).padStart(2,'0')}</span>
      </div>
      <div class="tsc-nums">
        <div class="tsc-num"><div class="tsc-l">계획일</div><div class="tsc-v mono">${s.plan.size}</div></div>
        <div class="tsc-num"><div class="tsc-l">작성일</div><div class="tsc-v mono" style="color:var(--blue)">${s.draft.size}</div></div>
        <div class="tsc-num"><div class="tsc-l">완료일</div><div class="tsc-v mono" style="color:var(--grn)">${s.done.size}</div></div>
      </div>
      <div class="tsc-more">월간 종합일보 열기 →</div>
    </div>`;
  }).join('');
  html+=`
  <div class="sec" style="margin-top:18px"><div class="sec-hd"><span class="no c2">◆</span><h3>팀별 월 현황</h3>
    <span class="desc">생산계획 있는 팀의 월 누적 요약 · 생산계획 기준</span></div>
    <div class="sec-bd"><div class="team-stat-grid">${cards||'<div style="color:var(--mut);padding:16px">데이터 없음</div>'}</div></div>
  </div>`;

  $('#wrap').innerHTML=html;
}
function shiftMonth(delta){
  let [y,m]=S.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  S.ym=`${y}-${String(m).padStart(2,'0')}`;
  renderCalendar();
}

/* ============ 개선접수 게시판 ============ */
let IMPROVE_FILTER=null;
let IMPROVE_CACHE=[];
async function renderImprove(){
  $('#wrap').innerHTML='<div class="skel" style="height:400px;border-radius:14px"></div>';
  await loadImprove();
}
async function loadImprove(){
  const isAdmin=S.user.role==='admin';
  let stats={},list=[];
  try{
    const [st,lst]=await Promise.all([
      sb.rpc('get_improve_stats'),
      sb.rpc('get_improvements',{p_status:IMPROVE_FILTER})
    ]);
    stats=st.data||{}; list=lst.data||[];
  }catch(e){ toast('개선접수 조회 실패: '+(e.message||e),'err'); }
  IMPROVE_CACHE=list;

  const statusMeta={
    received:{ko:'접수',cls:'st-received'},
    review:{ko:'검토중',cls:'st-review'},
    done:{ko:'완료',cls:'st-done'}
  };
  const cards=list.map(im=>{
    const sm=statusMeta[im.status]||statusMeta.received;
    const dt=new Date(im.created_at).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'});
    const answerBox=im.answer?`
      <div class="im-answer">
        <div class="im-answer-hd">💬 관리자 답변 · ${im.answer_by||''} · ${im.answer_at?new Date(im.answer_at).toLocaleDateString('ko-KR'):''}</div>
        <div class="im-answer-body">${(im.answer||'').replace(/\n/g,'<br>')}</div>
      </div>`:'';
    const isMine=im.writer===S.user.name;
    let btns='';
    if(isAdmin || isMine){
      btns=`<div class="im-admin">
        ${isAdmin?`<button class="rowbtn edit" onclick="openAnswer(${im.id})">답변/상태변경</button>`:''}
        ${isMine?`<button class="rowbtn edit" onclick="openEditImprove(${im.id})">수정</button>`:''}
        ${(isAdmin||isMine)?`<button class="rowbtn del" onclick="delImprove(${im.id})">삭제</button>`:''}
      </div>`;
    }
    return `<div class="im-card">
      <div class="im-top">
        <h4>${im.title}</h4>
        <span class="im-status ${sm.cls}">${sm.ko}</span>
      </div>
      <div class="im-meta">작성자 ${im.writer||'-'}${im.writer_team?' · '+im.writer_team:''} · ${dt}${isMine?' · <b style="color:var(--blue)">내 글</b>':''}</div>
      <div class="im-body">${(im.content||'').replace(/\n/g,'<br>')}</div>
      ${answerBox}
      ${btns}
    </div>`;
  }).join('');

  const chip=(key,label)=>`<button class="im-chip ${IMPROVE_FILTER===key?'on':''}" onclick="filterImprove(${key===null?'null':`'${key}'`})">${label}</button>`;

  $('#wrap').innerHTML=`
  <div class="day-hd"><div><h2>시스템 개선접수</h2>
    <div class="en">IMPROVEMENT REQUESTS · 현장 개선 제안</div></div>
    <div class="meta">전체 ${stats.total||0}건</div></div>

  <!-- 통계 스코어카드 -->
  <div class="score-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="sc"><div class="l">전체</div><div class="v mono">${stats.total||0}</div></div>
    <div class="sc" style="--acc:#c2410c"><div class="l">접수</div><div class="v mono" style="color:#c2410c">${stats.received||0}</div></div>
    <div class="sc b"><div class="l">검토중</div><div class="v mono" style="color:var(--blue)">${stats.review||0}</div></div>
    <div class="sc g"><div class="l">완료</div><div class="v mono" style="color:var(--grn)">${stats.done||0}</div></div>
  </div>

  <!-- 등록 폼 -->
  <div class="sec"><div class="sec-hd"><span class="no c1">＋</span><h3>개선요청 등록</h3>
    <span class="desc">작성자: ${S.user.name}</span></div>
    <div class="sec-bd">
      <input id="imTitle" placeholder="제목" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:10px;box-sizing:border-box">
      <textarea id="imContent" placeholder="요청 내용" style="width:100%;min-height:110px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;resize:vertical;font-family:inherit"></textarea>
      <div style="text-align:right;margin-top:12px"><button class="tbtn submit" onclick="addImprove()">등록</button></div>
    </div>
  </div>

  <!-- 필터 -->
  <div class="im-filters">
    ${chip(null,'전체')}${chip('received','접수')}${chip('review','검토중')}${chip('done','완료')}
  </div>

  <!-- 목록 -->
  <div class="im-list">${cards||'<div style="color:var(--mut);padding:30px;text-align:center">등록된 개선요청이 없습니다.</div>'}</div>`;
}
function filterImprove(status){ IMPROVE_FILTER=status; loadImprove(); }
async function addImprove(){
  const title=$('#imTitle').value.trim(), content=$('#imContent').value.trim();
  if(!title){ toast('제목을 입력하세요','err'); return; }
  try{
    const {error}=await sb.rpc('add_improvement',{p_title:title,p_content:content,p_writer:S.user.name,p_team:S.user.team});
    if(error)throw error;
    toast('개선요청 등록완료','ok');
    loadImprove();
  }catch(e){ toast('등록 실패: '+(e.message||e),'err'); }
}
function openAnswer(id){
  const im=(IMPROVE_CACHE||[]).find(x=>String(x.id)===String(id))||{};
  const cur=im.answer||''; const curSt=im.status||'received';
  const sel=(v)=>curSt===v?' selected':'';
  const esc=s=>String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const m=document.createElement('div');
  m.id='answerModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,22,40,.5);display:grid;place-items:center;z-index:999;padding:20px';
  m.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:26px;width:460px;max-width:100%;box-shadow:var(--sh-lg)">
      <h3 style="margin:0 0 16px;font-size:18px">${cur?'답변 수정':'답변'} / 상태 변경</h3>
      ${cur?`<div style="font-size:11.5px;color:var(--mut);margin-bottom:12px">기존 답변을 수정합니다 · 최초 작성 ${im.answer_by||''}</div>`:''}
      <label style="font-size:12px;font-weight:700;color:var(--sub)">상태</label>
      <select id="anStatus" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;margin:6px 0 14px">
        <option value="received"${sel('received')}>접수</option>
        <option value="review"${sel('review')}>검토중</option>
        <option value="done"${sel('done')}>완료</option>
      </select>
      <label style="font-size:12px;font-weight:700;color:var(--sub)">관리자 답변</label>
      <textarea id="anText" placeholder="답변 내용" style="width:100%;min-height:110px;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-top:6px;resize:vertical;font-family:inherit">${esc(cur)}</textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="tbtn" style="flex:1" onclick="document.getElementById('answerModal').remove()">취소</button>
        <button class="tbtn submit" style="flex:1" onclick="submitAnswer(${id})">저장</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  setTimeout(()=>{const t=$('#anText'); if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},60);
}
async function submitAnswer(id){
  const answer=$('#anText').value.trim(), status=$('#anStatus').value;
  try{
    const {error}=await sb.rpc('answer_improvement',{p_id:id,p_answer:answer,p_status:status,p_by:S.user.name});
    if(error)throw error;
    toast('답변 저장완료','ok');
    document.getElementById('answerModal').remove();
    loadImprove();
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function delImprove(id){
  if(!confirm('이 개선요청을 삭제할까요?'))return;
  try{ await sb.rpc('del_improvement',{p_id:id});
    toast('삭제완료','ok'); loadImprove();
  }catch(e){ toast('삭제 실패','err'); }
}
/* 작성자 본인 글 수정 */
function openEditImprove(id){
  const im=IMPROVE_CACHE.find(x=>x.id===id);
  if(!im){ toast('항목을 찾을 수 없습니다','err'); return; }
  const m=document.createElement('div');
  m.id='editImModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,22,40,.5);display:grid;place-items:center;z-index:999;padding:20px';
  m.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:26px;width:460px;max-width:100%;box-shadow:var(--sh-lg)">
      <h3 style="margin:0 0 16px;font-size:18px">개선요청 수정</h3>
      <input id="eimTitle" value="${(im.title||'').replace(/"/g,'&quot;')}" style="width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-bottom:10px">
      <textarea id="eimContent" style="width:100%;min-height:120px;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;resize:vertical;font-family:inherit">${im.content||''}</textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="tbtn" style="flex:1" onclick="document.getElementById('editImModal').remove()">취소</button>
        <button class="tbtn submit" style="flex:1" onclick="submitEditImprove(${im.id})">저장</button>
      </div>
    </div>`;
  document.body.appendChild(m);
}
async function submitEditImprove(id){
  const title=$('#eimTitle').value.trim(), content=$('#eimContent').value.trim();
  if(!title){ toast('제목을 입력하세요','err'); return; }
  try{
    const {error}=await sb.rpc('edit_improvement',{p_id:id,p_title:title,p_content:content,p_writer:S.user.name});
    if(error)throw error;
    toast('수정완료','ok');
    document.getElementById('editImModal').remove();
    loadImprove();
  }catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}

/* ============ 팀별 월간 종합일보 (드릴다운) ============ */
let TR={team:null,from:null,to:null,charts:[]};
function ymRange(ym){
  const [y,m]=ym.split('-').map(Number);
  const from=`${ym}-01`;
  const last=new Date(y,m,0).getDate();
  const to=`${ym}-${String(last).padStart(2,'0')}`;
  return {from,to};
}
async function openTeamReport(team,ym){
  const {from,to}=ymRange(ym);
  TR={team,from,to,ym,unit:'day',kind:null,charts:[]};
  S.view='teamreport';
  $('#wrap').innerHTML='<div class="skel" style="height:500px;border-radius:14px"></div>';
  await loadTeamReport();
}
async function loadTeamReport(){
  TR.charts.forEach(c=>{try{c.destroy()}catch(e){}}); TR.charts=[];
  const teamParam = TR.team==='전체' ? null : TR.team;
  const p={p_team:teamParam,p_from:TR.from,p_to:TR.to,p_kind:TR.kind};
  try{
    const [sum,trend,lines]=await Promise.all([
      sb.rpc('report_summary',p),
      sb.rpc('report_trend',{...p,p_unit:TR.unit}),
      sb.rpc('team_line_detail',{p_team:teamParam||TR.team,p_from:TR.from,p_to:TR.to})
    ]);
    const s=sum.data||{}, dd=trend.data||[], ld=lines.data||[];
    const teamBtns=['전체','생산1팀','생산2팀','공통'].map(t=>
      `<button class="seg-btn ${TR.team===t?'on':''}" onclick="setTRTeam('${t}')">${t}</button>`).join('');

function setTRTeam(t){ TR.team=t; loadTeamReport(); }
function setTRUnit(u){ TR.unit=u; loadTeamReport(); }
function setTRKind(k){ TR.kind=k||null; loadTeamReport(); }
function shiftTeamReport(delta){
  let [y,m]=TR.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  openTeamReport(TR.team,`${y}-${String(m).padStart(2,'0')}`);
}

/* ============ 팀별 현황 (팀→라인 드릴다운) ============ */
async function renderTeamStatus(){
  $('#wrap').innerHTML='<div class="skel" style="height:400px;border-radius:14px"></div>';
  // 이번 달 기준
  const ym=kstMonth();
  const {from,to}=ymRange(ym);
  let teams=[];
  try{ const {data}=await sb.rpc('team_list_overview',{p_from:from,p_to:to}); teams=data||[]; }
  catch(e){ toast('팀 목록 조회 실패: '+(e.message||e),'err'); }
  const teamColors={'생산1팀':'#4a6784','생산2팀':'#4e9a72','공통':'#8a6da0'};
  const blocks=teams.map(t=>{
    const lines=(t.lines||'').split(', ').filter(Boolean);
    const chips=lines.map(l=>`<span class="line-chip">${l}</span>`).join('');
    return `<div class="ts-plant">
      <div class="ts-plant-hd"><span class="ts-bar" style="background:${teamColors[t.team]||'#64748b'}"></span>${t.team}</div>
      <div class="ts-card" onclick="openTeamDetail('${t.team}','${ym}')" style="cursor:pointer">
        <div class="ts-card-hd">
          <div><h4>${t.team}</h4><div class="ts-sub">${t.line_count}개 라인 · ${t.day_count}일 작성</div></div>
          <span class="ts-count">일보 ${t.day_count}일</span>
        </div>
        <div class="ts-chips">${chips}</div>
        <div class="ts-open">오더별 · 제품별 상세 →</div>
      </div>
    </div>`;
  }).join('');
  $('#wrap').innerHTML=`
  <div class="day-hd"><div><h2>팀별 현황</h2>
    <div class="en">TEAM STATUS · 오더별 · 제품별 상세</div></div>
    <div class="meta">${ym} 기준</div></div>
  <div class="ts-grid">${blocks||'<div style="color:var(--mut);padding:30px">데이터 없음</div>'}</div>`;
}

let TD={team:null,ym:null,from:null,to:null,tab:'order',kind:null,charts:[]};
async function openTeamDetail(team,ym){
  const {from,to}=ymRange(ym);
  TD={team,ym,from,to,tab:'order',kind:null,charts:[]};
  S.view='teamdetail';
  $('#wrap').innerHTML='<div class="skel" style="height:500px;border-radius:14px"></div>';
  await loadTeamDetail();
}
function shiftTeamDetail(delta){
  let [y,m]=TD.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  openTeamDetail(TD.team,`${y}-${String(m).padStart(2,'0')}`);
}
function applyTDPeriod(){
  const f=$('#tdFrom').value, t=$('#tdTo').value;
  if(f&&t){ TD.from=f; TD.to=t; TD.ym=f.slice(0,7); loadTeamDetail(); }
}

      </div>`).join('')||'<div style="color:var(--mut);padding:16px">데이터 없음</div>';
    });

    loadTDTab();
  }catch(e){ toast('팀 상세 조회 실패: '+(e.message||e),'err'); }
}

  LD.charts.forEach(c=>{try{c.destroy()}catch(e){}}); LD.charts=[];

      sb.rpc('team_line_detail',p),

      sb.rpc('line_capa_metrics',pLine),
      sb.rpc('line_order_detail',pLine)
    ]);

function renderParetoRows(data){
  const tot=data.reduce((s,d)=>s+Number(d.total_loss||0),0);
  return data.map(d=>{
    const pctv=tot>0?(Number(d.total_loss)/tot*100):0;
    return `<tr><td class="l">${d.scrap_type}</td>
      <td class="mono neg">${fmt(Math.round(d.total_loss))}원</td>
      <td class="mono">${d.cnt}</td>
      <td class="mono">${pctv.toFixed(1)}%</td></tr>`;
  }).join('')||'<tr><td colspan="4" style="color:var(--mut);padding:16px">로스유형 저장 데이터 없음</td></tr>';
}

function drawAchieveChart(data){
  const ctx=$('#chartAchieve'); if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',
    data:{labels:data.map(d=>d.ym),
      datasets:[
        {type:'bar',label:'계획',data:data.map(d=>Math.round(d.plan_sum)),backgroundColor:'#c7dbff',order:2},
        {type:'bar',label:'실적',data:data.map(d=>Math.round(d.actual_sum)),backgroundColor:'#2670c9',order:2},
        {type:'line',label:'달성률(%)',data:data.map(d=>(d.achieve*100).toFixed(1)),borderColor:'#e0483a',backgroundColor:'#e0483a',yAxisID:'y1',tension:.3,order:1,pointRadius:4}
      ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      scales:{y:{title:{display:true,text:'KG'}},y1:{position:'right',title:{display:true,text:'달성률 %'},grid:{drawOnChartArea:false},min:80,max:140}},
      plugins:{legend:{position:'top'}}}});
  DASH.charts.push(c);
}
function drawLossChart(data){
  const ctx=$('#chartLoss'); if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',
    data:{labels:data.map(d=>d.ym),
      datasets:[
        {label:'손실(초과사용)',data:data.map(d=>Math.round(d.over_loss)),backgroundColor:'#e0483a'},
        {label:'절감',data:data.map(d=>Math.round(d.save_amt)),backgroundColor:'#1a9d5c'}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{title:{display:true,text:'원'}}},
      plugins:{legend:{position:'top'}}}});
  DASH.charts.push(c);
}

function switchSettingsTab(tab){
  SETTINGS_TAB=tab;
  const btns=document.querySelectorAll('.stab');
  btns.forEach(b=>b.classList.remove('on'));
  if(tab==='users'){ btns[0]&&btns[0].classList.add('on'); renderUserMgmt(); }
  else if(tab==='notice'){ btns[2]&&btns[2].classList.add('on'); renderNoticeMgmt(); }
  else if(tab==='capa'){ btns[3]&&btns[3].classList.add('on'); renderCapaMgmt(); }
  else if(tab==='stdtime'){ btns[4]&&btns[4].classList.add('on'); renderStdTimeMgmt(); }
  else if(tab==='matx'){ btns[5]&&btns[5].classList.add('on'); renderMatExcludeMgmt(); }
  else { btns[1]&&btns[1].classList.add('on'); renderApprLine(); }
}

async function saveStd(i){
  const s=STD_LIST[i]; if(!s)return;
  const std=Number($('#std_'+i).value)||0;
  const plan=Number($('#plan_'+i).value)||0;
  try{
    const {error}=await sb.rpc('set_std_time',{p_team:'생산2팀',p_line:s.line,p_std:std,p_plan:plan,p_active:s.active!==false});
    if(error)throw error;
    s.std_hours=std; s.plan_hours=plan;
    toast(`${s.line} 저장완료`,'ok');
    const b=document.querySelector(`button[onclick="saveStd(${i})"]`);
    if(b){const o=b.textContent;b.textContent='✓ 저장됨';b.style.cssText='background:var(--grn);color:#fff;border-color:var(--grn)';
      setTimeout(()=>{b.textContent=o;b.style.cssText='';},1400);}
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function toggleStd(i){
  const s=STD_LIST[i]; if(!s)return;
  const next=!(s.active!==false);
  try{
    const {error}=await sb.rpc('set_std_time',{p_team:'생산2팀',p_line:s.line,
      p_std:Number($('#std_'+i).value)||s.std_hours||0,
      p_plan:Number($('#plan_'+i).value)||s.plan_hours||0,p_active:next});
    if(error)throw error;
    toast(`${s.line} ${next?'활성화':'비활성'}`,'ok');
    renderStdTimeMgmt();
  }catch(e){ toast('변경 실패: '+(e.message||e),'err'); }
}

/* --- CAPA 관리 탭 (호기별 + 활성/비활성) --- */
let CAPA_LIST=[];
async function renderCapaMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:300px;border-radius:14px"></div>';
  try{ const {data}=await sb.rpc('get_capa_list',{p_team:null}); CAPA_LIST=data||[]; }
  catch(e){ toast('CAPA 조회 실패: '+(e.message||e),'err'); CAPA_LIST=[]; }

  // 팀 > 라인 단위로 그룹핑
  const groups={};
  CAPA_LIST.forEach((c,i)=>{
    const k=c.team+'||'+c.line;
    if(!groups[k])groups[k]={team:c.team,line:c.line,line_active:c.line_active!==false,items:[]};
    groups[k].items.push({...c,_i:i});
  });
  const gk=Object.keys(groups);
  let offCnt=0; CAPA_LIST.forEach(c=>{ if(c.active===false||c.line_active===false)offCnt++; });

  const body=gk.map(k=>{
    const g=groups[k]; const lOff=!g.line_active;
    const esc=s=>String(s).replace(/'/g,"\\'");
    const rows=g.items.map(c=>{
      const off=lOff||c.active===false;
      return `<tr class="${off?'cap-off':''}">
        <td class="l" style="padding-left:22px">${c.hoki?`<b>${c.hoki}</b>호기`:'<span style="color:var(--mut)">호기 미지정</span>'}</td>
        <td><input type="number" id="capa_${c._i}" value="${c.capa_hourly||''}" placeholder="0" ${off?'disabled':''}

        <td><input type="number" id="days_${c._i}" value="${c.work_days_month||22}" ${off?'disabled':''}
          style="width:66px;padding:7px;border:1.5px solid var(--line);border-radius:7px;text-align:right"></td>
        <td><span class="cap-badge ${off?'off':'on'}">${off?'비활성':'활성'}</span></td>
        <td style="white-space:nowrap" class="cap-act">
          <button class="rowbtn edit" ${off?'disabled':''} onclick="saveCapa(${c._i})">저장</button>
          <button class="rowbtn ${c.active===false?'act':'del'}" ${lOff?'disabled':''}
            onclick="toggleHoki(${c._i})">${c.active===false?'↻ 활성화':'비활성'}</button>
        </td></tr>`;
    }).join('');
    return `<tr class="cap-linehd ${lOff?'cap-off':''}">
        <td class="l"><b>${g.line}</b> <span style="color:var(--mut);font-size:12px">· ${g.team} · 호기 ${g.items.length}</span></td>
        <td colspan="3"></td>
        <td class="cap-act"><button class="rowbtn ${lOff?'act':'del'}" onclick="toggleLine('${esc(g.team)}','${esc(g.line)}',${lOff})">
          ${lOff?'↻ 라인 활성화':'라인 전체 비활성'}</button></td>
      </tr>${rows}`;
  }).join('');

  $('#settingsBody').innerHTML=`
  <div class="lock-banner" style="background:var(--blue-soft);border-color:#c7dbff;color:var(--blue)">
    ℹ <b>호기별</b> 시간당 생산능력(kg/hr)을 입력하면 성능가동률이 계산됩니다. (예: EP 1호기·2호기 능력이 다를 때)<br>
    · <b>비활성</b> 처리하면 해당 호기(또는 라인 전체)는 <b>계획·실적·가동시간·비가동·생산량 등 모든 지표에서 제외</b>됩니다.<br>
    · 성능가동률 = 실제 생산량 ÷ (호기 CAPA 합계 × 실제 가동시간) × 100
  </div>
  <div class="sec"><div class="sec-hd"><span class="no c1">⚙</span><h3>호기별 CAPA · 활성 관리</h3>
    <span class="desc">${gk.length}개 라인 · ${CAPA_LIST.length}개 호기${offCnt?` · <b style="color:var(--red)">비활성 ${offCnt}</b>`:''}</span></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>라인 / 호기</th><th>시간당 능력(kg/hr)</th><th>월 가동일수</th><th>상태</th><th>관리</th></tr></thead>
      <tbody>${body||'<tr><td colspan="5" style="color:var(--mut);padding:16px">라인 없음</td></tr>'}</tbody>
    </table></div>

/* ===== 단가 마스터 등록 ===== */
function parseCostPaste(txt){
  const rows=[];
  (txt||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t');
    const code=(c[0]||'').trim();
    if(!code)return;
    // 단가는 마지막 숫자 컬럼 (품목명/단위가 없을 수도 있어 유연 처리)
    let name=(c[1]||'').trim(), unit=(c[2]||'').trim(), priceRaw=(c[3]||'').trim();
    // 4열이 안 되면: 품번+단가만 있는 경우 (2열)
    if(c.length===2){ name=''; unit=''; priceRaw=(c[1]||'').trim(); }
    else if(c.length===3){ // 품번+품목명+단가 (단위 생략)
      const maybe=(c[2]||'').trim();
      if(/^[\d,.\-]+$/.test(maybe)){ priceRaw=maybe; unit=''; }
    }
    const price=Number(priceRaw.replace(/,/g,''));
    rows.push({item_code:code, item_name:name, unit:unit, unit_price:isNaN(price)?0:price});
  });
  return rows;
}
async function checkCostUpload(){
  const res=$('#costResult');
  const rows=parseCostPaste($('#costPaste').value);
  if(!rows.length){ res.className='upload-result err'; res.style.display='block';
    res.textContent='붙여넣은 데이터가 없습니다. (품번·품목명·단위·단가)'; return; }
  const withPrice=rows.filter(r=>r.unit_price>0).length;
  const noPrice=rows.length-withPrice;
  const sample=rows.slice(0,3).map(r=>`· ${r.item_code} ${r.item_name||''} → ${r.unit_price.toLocaleString()}원`).join('\n');
  const msg=`[단가 등록 대상]\n· 총 ${rows.length}건 (단가있음 ${withPrice} · 단가0 ${noPrice})\n\n${sample}${rows.length>3?'\n  …':''}\n\n같은 품번은 단가가 갱신됩니다. 진행할까요?`;
  if(!confirm(msg)){ res.className='upload-result'; res.style.display='block';
    res.style.background='#f1f4fa'; res.style.color='var(--sub)'; res.textContent='취소되었습니다.'; return; }
  doCostUpload(rows);
}
async function doCostUpload(rows){
  const res=$('#costResult');
  res.className='upload-result'; res.style.display='block';
  res.style.background='#eff6ff'; res.style.color='#2563eb'; res.textContent='단가 등록 중…';
  try{
    const {data,error}=await sb.rpc('upsert_cost_bulk',{p_rows:rows});
    if(error)throw error;
    res.className='upload-result ok';
    res.textContent=`✓ 단가 등록 완료 · ${(data&&data.count)||rows.length}건 반영됨. ③ 로스관리에 즉시 적용됩니다.`;
    toast('단가 등록 완료','ok');

/* 붙여넣기 파싱: 탭 구분 15컬럼 (작업일자 포함) → JSON 배열 */
function parsePaste(text){
  const num=v=>{const n=Number(String(v).replace(/,/g,'').trim());return isNaN(n)?0:n;};
  const cleanTeam=t=>String(t).trim().replace(/생산\s+/,'생산').replace(/\s/g,'');
  const normDate=d=>{
    d=String(d).trim();
    // 2026.1.3 / 2026/1/3 → 2026-01-03
    const m=d.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    return d;
  };
  const out=[];
  text.trim().split('\n').forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t');
    if(c.length<15)return;  // 15컬럼 필요
    out.push({
      work_date:normDate(c[0]), team:cleanTeam(c[1]), process:c[2].trim(),
      prod_code:c[3].trim(), prod_name:c[4].trim(), hoki:c[5].trim(),
      mat_code:c[6].trim(), mat_name:c[7].trim(), mat_type:c[8].trim(),
      plan_qty:num(c[9]), actual_qty:num(c[10]), diff:num(c[11]), mat_unit:c[12].trim(),
      proc_sub1:c[13].trim(), proc_sub2:c[14].trim()
    });
  });
  return out;
}

/* ═══════════════════════════════════════════════════════════
   생산2팀 전용 렌더 (B안: 별도 로직)
   ① 완제품 라인별 가동 요약 — 계획/실적 가동시간·생산량·생산성 자동계산
   ═══════════════════════════════════════════════════════════ */
let T2_KIND='fin'; // (구) 호환용 — 미사용
let T2_SUM='fin';  // ① 라인별 요약: fin | semi | all
let T2_ORD='fin';  // ② 오더별 실적: fin | semi
function renderClosing2(){
  const {lines,orders,stdTime,mhMap,downtime}=CUR_DAY;
  const c=CUR_DAY.closing||{};

  // 공정별 기준시간 맵 (설정값)
  const stdMap={}; (stdTime||[]).forEach(s=>{ stdMap[s.line]={std:Number(s.std_hours||0)}; });

  // 완제품/반제품 분류: get_order_detail의 kind 우선(1팀과 동일 기준), 없으면 prod_code 앞자리
  const isFin=(o)=>{
    if(o&&typeof o==='object'){ if(o.kind==='fin'||o.kind==='완제품')return true;
      if(o.kind==='semi'||o.kind==='반제품')return false;
      return ['2','3'].includes(String(o.prod_code||'')[0]); }
    return ['2','3'].includes(String(o||'')[0]);
  };
  const isSemi=(o)=>{
    if(o&&typeof o==='object'){ if(o.kind==='semi'||o.kind==='반제품')return true;
      if(o.kind==='fin'||o.kind==='완제품')return false;
      return String(o.prod_code||'')[0]==='6'; }
    return String(o||'')[0]==='6';
  };

  // 라인별 가동시간: 계획=run 합, 실적=run - (계획정지+비계획정지)
  const runByLine={}, planStopByLine={}, unplanStopByLine={};
  (downtime||[]).forEach(t=>{
    const k=(t.proc_sub1||'')+'/'+(t.proc_sub2||'');
    const dur=diffMin(t.start_time,t.end_time);
    if(t.category==='run') runByLine[k]=(runByLine[k]||0)+dur;
    else if(t.category==='plan') planStopByLine[k]=(planStopByLine[k]||0)+dur;
    else if(t.category==='unplan'||t.category==='sudden') unplanStopByLine[k]=(unplanStopByLine[k]||0)+dur;
  });

  const kindFilter=(o)=>T2_SUM==='all'?(isFin(o)||isSemi(o)):(T2_SUM==='fin'?isFin(o):isSemi(o));
  const qtyByLine={};  // {line:{plan,actual,mh}}
  (orders||[]).forEach(o=>{
    if(!kindFilter(o))return;
    const k=(o.proc_sub1||'')+'/'+(o.proc_sub2||'');
    const q=qtyByLine[k]||(qtyByLine[k]={plan:0,actual:0,mh:0});
    q.plan+=Number(o.plan_sum??o.plan_qty??0); q.actual+=Number(o.actual_sum??o.actual_qty??0);
    const mh=mhMap[o.prod_code]; if(mh)q.mh+=Number(mh.mh||0);
  });

  const lineNames=[...new Set([...lines.map(l=>l.line_name), ...Object.keys(qtyByLine)])].sort();
  const finCnt=orders.filter(o=>isFin(o)).length;
  const semiCnt=orders.filter(o=>isSemi(o)).length;

  // ── 스코어카드 집계 (완제품+반제품 전체 기준, 탭 선택과 무관) ──
  let scPlan=0, scActual=0;
  (orders||[]).forEach(o=>{
    if(!isFin(o)&&!isSemi(o))return;
    scPlan+=Number(o.plan_sum??o.plan_qty??0); scActual+=Number(o.actual_sum??o.actual_qty??0);
  });
  const scAch=scPlan>0?scActual/scPlan:0;
  const scLoss=(CUR_DAY.losses||[]).reduce((a,l)=>a+Math.round((l.diff||0)*(l.unit_price||0)),0);
  const scScrap=(CUR_DAY.losses||[]).length;

  let T={std:0,planH:0,actH:0,planQ:0,actQ:0,mh:0};
  const rows=lineNames.map((name,i)=>{
    const st=stdMap[name]||{std:0};
    const planH=(runByLine[name]||0)/60;          // 계획 가동시간 = run 합(작업시간)
    const stopH=((planStopByLine[name]||0)+(unplanStopByLine[name]||0))/60;
    const actH=Math.max(planH-stopH,0);           // 실적 가동시간 = 계획 - 정지
    const q=qtyByLine[name]||{plan:0,actual:0,mh:0};

      <div class="sec-bd" style="overflow-x:auto"><table class="t2-table">

        <tbody>${eRows||'<tr><td colspan="12" style="color:var(--mut);padding:14px">등록된 비가동 없음</td></tr>'}</tbody>

/* ⑥ 투입인원 — 1팀·2팀 공용. 2팀 레이아웃(라인 + 공통부문·예비인력 고정행) +

  const manpower=CUR_DAY.manpower||[];

/* ② 오더별 생산실적·투입공수 — 1팀·2팀 공용.

/* 결재 진행바 + 액션 버튼 */
function renderApprovalBar(){
  const c=CUR_DAY.closing||{};
  const status=c.status||'none';
  const role=S.user.role||'writer';
  const AL=CUR_DAY.apprLine||{};
  const writerName = c.writer || (S.user&&S.user.name) || '';
  const steps=[
    {key:'draft',  label:'작성자', en:'Preparer',       by:c.writer,  plan:writerName},
    {key:'lead_ok',label:'팀장',   en:'Reviewer',       by:c.lead_by, plan:AL.lead||''},
    {key:'div_ok', label:'본부장', en:'Approver',       by:c.div_by,  plan:AL.division||''},
    {key:'done',   label:'CEO',    en:'Final Approver', by:c.ceo_by,  plan:AL.ceo||''}
  ];
  const order=['draft','submitted','lead_ok','div_ok','done'];
  const curIdx=order.indexOf(status);
  const stepDone=(k)=>({draft:curIdx>=1,lead_ok:curIdx>=2,div_ok:curIdx>=3,done:curIdx>=4}[k]||false);
  // 현재 진행 중(=지금 이 사람 차례)
  const stepNow=(k)=>(
    ((status==='none'||status==='draft'||status==='rejected')&&k==='draft')||
    (status==='submitted'&&k==='lead_ok')||
    (status==='lead_ok'&&k==='div_ok')||
    (status==='div_ok'&&k==='done')
  );
  // 다음 차례(대기)
  const nextKey=(()=>{
    const ks=['draft','lead_ok','div_ok','done'];
    const ni=ks.findIndex(k=>stepNow(k));
    return ni>=0&&ni<ks.length-1?ks[ni+1]:null;
  })();
  const parts=[];
  steps.forEach((s,i)=>{
    const done=stepDone(s.key), now=stepNow(s.key), next=(s.key===nextKey);
    const who = done ? (s.by||s.plan||'') : (s.plan||s.by||'');
    const cls = done?'done':(now?'now':(next?'next':'idle'));
    const badge = done?'완료':(now?'진행 중':(next?'결재예정':''));
    if(i>0) parts.push(`<div class="appr-line ${stepDone(steps[i-1].key)?'fill':''}"></div>`);
    parts.push(`<div class="appr-step ${cls}">
      <div class="as-card">
        <div class="as-role">${s.label}</div>
        <div class="as-name">${who||'미지정'}</div>
        <div class="as-en">${s.en}</div>
      </div>
      ${badge?`<div class="as-badge ${cls}">${done?'✓ ':''}${badge}</div>`:'<div class="as-badge idle">예정</div>'}
    </div>`);
  });
  const stepFlow=parts.join('');
  const statusLabel={
    none:'미작성',draft:'작성 중',submitted:'팀장 결재 대기',
    lead_ok:'본부장 결재 대기',div_ok:'CEO 결재 대기',done:'최종 완료',rejected:'반려됨'
  }[status]||status;
  const statusCls={none:'',draft:'',submitted:'wait',lead_ok:'wait',div_ok:'wait',done:'done',rejected:'rej'}[status]||'';
  // ── 권한 판정: 결재라인에 등록된 '본인'만 결재 가능 (관리자는 예외) ──
  const me=(S.user&&S.user.name)||'';
  const isAdmin=role==='admin';
  const isLineMember=(step)=>isAdmin||(AL[step]&&AL[step]===me);
  const canApprove=(
    (status==='submitted'&&['lead','admin'].includes(role)&&isLineMember('lead'))||
    (status==='lead_ok'&&['division','admin'].includes(role)&&isLineMember('division'))||
    (status==='div_ok'&&['ceo','admin'].includes(role)&&isLineMember('ceo'))
  );
  // 작성/제출: 해당 팀 결재라인에 속한 사람만 (작성자·팀장·본부장·CEO 중 본인)
  const inTeamLine = isAdmin || [AL.writer,AL.lead,AL.division,AL.ceo].filter(Boolean).includes(me)
    || (c.writer && c.writer===me);
  const isWriter=['writer','admin'].includes(role) && inTeamLine;
  // 권한 없음 안내
  const noPermNote = (!isAdmin && !inTeamLine && ['none','draft','rejected'].includes(status))
    ? `<div class="lock-banner" style="background:#f8f9fb;border-color:#e2e8f2;color:#7b8595;margin-top:10px">
        🔒 <b>${CUR_DAY.team||''} 결재라인에 등록되지 않아</b> 작성·제출할 수 없습니다. 관리자에게 결재라인 등록을 요청하세요.
       </div>` : '';
  const rejectBox = status==='rejected'
    ? `<div class="reject-box">⚠ 반려 (${c.reject_by||''}): ${c.reject_reason||''}</div>` : '';
  const commentBox = c.submit_comment
    ? `<div class="comment-box">💬 작성자 의견: ${c.submit_comment}</div>` : '';
  return `
  <div class="appr-wrap">
    <div class="appr-flow">${stepFlow}</div>
    <div class="toolbar" style="margin-top:12px;margin-bottom:0">
      <span class="tb-status ${statusCls}" id="tbStatus">${statusLabel}</span>
      <button class="tbtn" onclick="showApprovalLog()">결재이력</button>
      <span class="sp"></span>
      ${isWriter&&['none','draft','rejected'].includes(status)?`
        <button class="tbtn" onclick="saveClosing(false)">임시저장</button>
        <button class="tbtn submit" onclick="saveClosing(true)">제출</button>`:''}
      ${canApprove?`
        <button class="tbtn reject" onclick="doReject()">반려</button>
        <button class="tbtn approve" onclick="doApprove()">승인</button>`:''}
      <button class="tbtn" onclick="printClosing()">인쇄 / PDF</button>
      <button class="tbtn" onclick="go('cal')">대시보드</button>
    </div>
    ${rejectBox}
    ${commentBox}
    ${noPermNote}
  </div>`;
}
/* ── 인쇄 / PDF : 보고문서 형식으로 출력 ──
   화면 UI(결재카드·툴바·탭)는 숨기고, 문서 헤더 + 결재란 + 푸터를 생성해 A4로 인쇄 */
function printClosing(){
  const {date,team}=CUR_DAY;
  const c=CUR_DAY.closing||{};
  const AL=CUR_DAY.apprLine||{};
  const docNo=c.doc_no||`DPC-${date}-K${team==='생산2팀'?'2':'1'}-${team}`;
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
  // 결재 4단계: 이름 + 승인여부
  const sign=[
    {t:'작성',  nm:c.writer||AL.writer||(S.user&&S.user.name)||'', ok:!!c.writer},
    {t:'팀장',  nm:c.lead_by||AL.lead||'',      ok:!!c.lead_by},
    {t:'본부장',nm:c.div_by ||AL.division||'',  ok:!!c.div_by},
    {t:'대표',  nm:c.ceo_by ||AL.ceo||'',       ok:!!c.ceo_by}
  ];
  const statusLabel={none:'미작성',draft:'임시저장',submitted:'결재 진행(팀장)',
    lead_ok:'결재 진행(본부장)',div_ok:'결재 진행(대표)',done:'결재 완료',rejected:'반려'}[c.status||'none']||'';
  const printedAt=(()=>{const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;})();

  const html=`
  <div class="pd-top">
    <div class="pd-title">
      <h1>일일 생산마감 관리표</h1>
      <div class="pd-sub">하림펫푸드 정안공장 · ${esc(team)} · ${esc(date)}</div>
    </div>
    <div class="pd-meta">
      문서번호 <b>${esc(docNo)}</b><br>
      결재상태 <b>${esc(statusLabel)}</b><br>
      출력일시 ${printedAt}
    </div>
    <table class="pd-sign"><tbody>
      <tr><td class="lbl" rowspan="3">결<br>재</td>
        ${sign.map(s=>`<th>${s.t}</th>`).join('')}</tr>
      <tr>${sign.map(s=>`<td class="nm">${esc(s.nm)}</td>`).join('')}</tr>
      <tr>${sign.map(s=>`<td class="st">${s.ok?'승인':''}</td>`).join('')}</tr>
    </tbody></table>
  </div>
  ${c.submit_comment?`<div style="font-size:8.5pt;border:1px solid #bbb;padding:2mm 3mm;margin-bottom:3mm">
     <b>작성자 의견</b> · ${esc(c.submit_comment)}</div>`:''}
  ${c.status==='rejected'&&c.reject_reason?`<div style="font-size:8.5pt;border:1px solid #b3261e;color:#b3261e;padding:2mm 3mm;margin-bottom:3mm">
     <b>반려 (${esc(c.reject_by||'')})</b> · ${esc(c.reject_reason)}</div>`:''}`;

  const foot=`<div class="fnote">
    <span>${esc(docNo)} · ${esc(team)} · ${esc(date)}</span>
    <span>하림펫푸드 정안공장 · 생산본부</span></div>`;

  let box=document.getElementById('printDoc');
  if(!box){ box=document.createElement('div'); box.id='printDoc'; }
  box.innerHTML=html;
  let fbox=document.getElementById('printFoot');
  if(!fbox){ fbox=document.createElement('div'); fbox.id='printFoot'; fbox.className='pd-foot'; }
  fbox.innerHTML=foot;

  const wrap=document.querySelector('#wrap')||document.body;
  wrap.insertBefore(box,wrap.firstChild);
  wrap.appendChild(fbox);

  window.print();
}
async function notifyNextApprover(date,team,newStatus,actorName){
  // 다음 결재 단계가 없으면(완료·반려) 발송 안 함
  if(!['submitted','lead_ok','div_ok'].includes(newStatus)) return;
  try{
    const {data,error}=await sb.rpc('get_next_approver',{p_team:team,p_status:newStatus});
    if(error||!data||!data.length) return;
    const n=data[0];
    if(!n.email){ toast(`${n.approver_name||'다음 결재자'} 이메일 미등록 — 알림 미발송`,'err'); return; }
    const q=new URLSearchParams({
      action:'mail', to:n.email, name:n.approver_name||'',
      role:n.role_label||'', team, date,
      from_name:actorName||'', url:location.origin
    });
    // JSONP로 호출 (응답 대기 안 함 — 결재 흐름을 막지 않기 위해)
    const cb='mailCb_'+Date.now();
    window[cb]=(r)=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s);
      if(r&&r.ok&&r.sent) toast(`${n.approver_name}님께 결재 알림 발송`,'ok'); };
    const s=document.createElement('script');
    s.src=`${MES_WEBAPP_URL}?${q.toString()}&callback=${cb}`;
    s.onerror=()=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); };
    document.body.appendChild(s);
  }catch(e){ /* 알림 실패가 결재를 막지 않도록 조용히 처리 */ }
}
async function doApprove(){
  const {date,team}=CUR_DAY;
  const memo=prompt('결재 의견 (선택). 예: "코터기 수율저하 별도 보고"\n없으면 그냥 확인:');
  if(memo===null) return; // 취소
  try{
    const {data,error}=await sb.rpc('do_approval',{
      p_date:date,p_team:team,p_action:'approve',
      p_actor:S.user.name,p_role:S.user.role,p_memo:memo||null});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'승인 불가','err'); return; }
    toast('승인 완료','ok');
    // 다음 결재자에게 메일 알림
    notifyNextApprover(date,team,data.status||data.new_status,S.user.name);
    openDay(date,team);
  }catch(e){ toast('승인 실패: '+(e.message||e),'err'); }
}

function renderClosing(){
