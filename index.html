/* ═══════════════════════════════════════════════════════════════════
   비가동 사유유형 마스터 (계획정지 / 비계획정지 각각 별도 관리)
   ── 저장소 : t_app_config (get_config/set_config RPC) — 새 테이블 불필요
        key = dt_types_plan | dt_types_unplan | dt_types_sudden
   ── 등록 즉시 사용 : 화면 전체를 다시 그리지 않고 select 만 갱신하므로
        스크롤이 상단으로 튀지 않는다.
   ═══════════════════════════════════════════════════════════════════ */
const DT_DEF={
  plan  :['생산준비','품목교체','청소','계획보전','식사/휴게','교육/회의','기타'],
  unplan:['설비고장','자재부족','생산대기','품질이상','전력/유틸리티','작업자부재','기타'],
  sudden:['설비돌발','안전사고','정전','기타']
};
const DT_CAT_KO={plan:'계획정지',unplan:'비계획정지',sudden:'돌발정지'};
function dtTypeList(cat){
  const c=(CUR_DAY.dtTypes||{})[cat];
  return (Array.isArray(c)&&c.length)?c.slice():(DT_DEF[cat]||[]).slice();
}
function dtTypeOpts(cat,sel){
  return dtTypeList(cat).map(t=>`<option value="${t.replace(/"/g,'&quot;')}"${t===sel?' selected':''}>${t}</option>`).join('');
}
async function loadDtTypes(){
  CUR_DAY.dtTypes=CUR_DAY.dtTypes||{};
  await Promise.all(['plan','unplan','sudden'].map(async cat=>{
    try{
      const {data}=await sb.rpc('get_config',{p_key:'dt_types_'+cat});
      const arr=data?JSON.parse(data):null;
      if(Array.isArray(arr)) CUR_DAY.dtTypes[cat]=arr;
    }catch(_){ }
  }));
}
async function saveDtTypes(cat,list){
  CUR_DAY.dtTypes=CUR_DAY.dtTypes||{};
  CUR_DAY.dtTypes[cat]=list;
  const {error}=await sb.rpc('set_config',{p_key:'dt_types_'+cat,p_value:JSON.stringify(list),p_by:(S.user&&S.user.name)||'-'});
  if(error) throw error;
}
/* 화면 갱신 — 재렌더 없이 해당 select 들만 다시 채운다 (스크롤 유지) */
function refreshDtSelects(){
  const sc=$('#stCat'), st=$('#stType');
  if(sc&&st){ const keep=st.value; st.innerHTML='<option value="">유형 *</option>'+dtTypeOpts(sc.value,keep); }
  const dc=$('#dtCat'), dr=$('#dtReason');
  if(dc&&dr&&dr.tagName==='SELECT'){ const keep=dr.value; dr.innerHTML='<option value="">유형 선택</option>'+dtTypeOpts(dc.value,keep); }
  const ec=$('#edCat'), er=$('#edReason');
  if(ec&&er&&er.tagName==='SELECT'){ const keep=er.value; er.innerHTML='<option value="">유형 선택</option>'+dtTypeOpts(ec.value,keep); }
}
function onDtCatChange(){ refreshDtSelects(); const b=$('#dtTypeMgr'); if(b&&b.style.display!=='none') renderDtMgr(); }
/* 유형 관리 패널 — 입력칸 바로 아래에 인라인으로 열린다 (모달 아님 = 위치 이동 없음) */
function toggleDtMgr(anchorSelId){
  const host=$('#dtTypeMgr');
  if(!host) return;
  if(host.style.display!=='none'){ host.style.display='none'; return; }
  host.dataset.anchor=anchorSelId||'stCat';
  host.style.display='block';
  renderDtMgr();
}
function curDtCat(){
  const host=$('#dtTypeMgr'); const a=host?host.dataset.anchor:'stCat';
  const el=$('#'+(a||'stCat'));
  const v=el?el.value:'unplan';
  return DT_CAT_KO[v]?v:'unplan';
}
function renderDtMgr(){
  const host=$('#dtTypeMgr'); if(!host) return;
  const cat=curDtCat(), list=dtTypeList(cat);
  host.innerHTML=`
    <div style="border:1.5px solid #cfd8e6;background:#f7f9fc;border-radius:10px;padding:11px 13px;margin-top:8px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <b style="font-size:12.5px;color:#243b63">${DT_CAT_KO[cat]} 유형 관리</b>
        <span style="font-size:11px;color:#7a8699">등록하면 바로 아래 선택칸에서 쓸 수 있습니다 · 팀 공용</span>
        <span class="sp" style="flex:1"></span>
        <button class="rowbtn" onclick="$('#dtTypeMgr').style.display='none'">닫기</button>

        <input id="dtNewType" placeholder="새 유형명 입력 후 Enter" style="flex:1;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addDtType();}">
        <button class="tbtn save" style="padding:6px 14px" onclick="addDtType()">＋ 등록</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${list.length?list.map((t,i)=>`
          <span style="display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #d8e0ec;border-radius:99px;padding:3px 6px 3px 11px;font-size:11.5px;font-weight:700;color:#33415c">
            <span style="cursor:pointer" title="이름 수정" onclick="renameDtType(${i})">${t}</span>
            <span style="cursor:pointer;color:#b42318;font-weight:900;padding:0 3px" title="삭제" onclick="removeDtType(${i})">×</span>
          </span>`).join('')
          :'<span style="font-size:11.5px;color:#98a2b3">등록된 유형이 없습니다</span>'}
      </div>
    </div>`;
}
async function addDtType(){
  const el=$('#dtNewType'); if(!el) return;
  const v=String(el.value||'').trim();
  if(!v){ toast('유형명을 입력하세요','err'); el.focus(); return; }
  const cat=curDtCat(), list=dtTypeList(cat);
  if(list.some(x=>x===v)){ toast('이미 있는 유형입니다','err'); el.select(); return; }
  try{
    await saveDtTypes(cat,[...list,v]);
    el.value=''; renderDtMgr(); refreshDtSelects();
    const st=$('#stType'), dr=$('#dtReason'), er=$('#edReason');
    [st,dr,er].forEach(sel=>{ if(sel&&sel.tagName==='SELECT'&&[...sel.options].some(o=>o.value===v)) sel.value=v; });
    toast(`'${v}' 등록 · 바로 선택되었습니다`,'ok');
    el.focus();
  }catch(e){ toast('등록 실패: '+(e.message||e),'err'); }
}
async function renameDtType(i){
  const cat=curDtCat(), list=dtTypeList(cat), old=list[i];
  const v=prompt('유형명 수정',old); if(v==null) return;
  const nv=String(v).trim(); if(!nv||nv===old) return;
  if(list.some((x,j)=>j!==i&&x===nv)){ toast('이미 있는 유형입니다','err'); return; }
  try{ list[i]=nv; await saveDtTypes(cat,list); renderDtMgr(); refreshDtSelects();
    toast('수정되었습니다 · 기존 등록건의 유형명은 그대로 유지됩니다','ok'); }
  catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}
async function removeDtType(i){
  const cat=curDtCat(), list=dtTypeList(cat), t=list[i];
  const used=(CUR_DAY.downtime||[]).filter(d=>d.reason_type===t).length;
  if(!confirm(`'${t}' 유형을 목록에서 삭제할까요?`+(used?`\n\n이 날짜에 ${used}건이 이 유형으로 등록돼 있습니다. 기존 등록건은 지워지지 않고 그대로 남습니다.`:''))) return;
  try{ await saveDtTypes(cat,list.filter((_,j)=>j!==i)); renderDtMgr(); refreshDtSelects(); toast('삭제되었습니다','ok'); }
  catch(e){ toast('삭제 실패: '+(e.message||e),'err'); }
}

/* ⑤ [D/E] 비가동 입력·수정 */
/* 라인명 → [대분류, 소분류] 분해
   "주식/계량/배합 자동계량" 처럼 소분류에 '/'가 포함된 라인이 있어
   split('/') 를 쓰면 뒷부분이 잘려 다른 키로 저장됨(저장 실패처럼 보임).
   반드시 첫 '/' 기준으로만 나눈다.                                        */
function splitLine(ln){
  const s=String(ln||''); const i=s.indexOf('/');
  return i<0 ? [s,''] : [s.slice(0,i), s.slice(i+1)];
}
/* ═══════════════════════════════════════════════════════════════════
   라인별 호기 선택
   ── 주식/포장(1~4호기), 주식/EP(1~2호기)처럼 한 라인에 여러 호기가 있는
      공정은 비가동을 호기 단위로 기록해야 ① 라인별 가동요약에서 호기별로
      갈라 볼 수 있다.
   ── 호기 후보는 ①당일 오더 ②CAPA 마스터에서 모아 만든다.
      목록에 없는 호기는 직접 입력할 수 있게 datalist 로 제공한다.
   ═══════════════════════════════════════════════════════════════════ */
function hokiListOf(line){
  const raw=String(line||'');
  // dtLine 은 "sub1|sub2", stLine 은 "sub1/sub2" 형식을 쓴다
  const [s1,s2]= raw.indexOf('|')>=0 ? [raw.slice(0,raw.indexOf('|')), raw.slice(raw.indexOf('|')+1)]
                                     : splitLine(raw);
  const set=new Set();
  (CUR_DAY.orders||[]).forEach(o=>{
    if((o.proc_sub1||'')===s1 && (o.proc_sub2||'')===s2){
      const h=String(o.hoki||'').trim(); if(h) set.add(h);
    }
  });
  (CUR_DAY.capa||[]).forEach(c=>{
    if(String(c.line||'')===((s1?s1+'/':'')+s2)){
      const h=String(c.hoki||'').trim(); if(h) set.add(h);
    }
  });
  (CUR_DAY.downtime||[]).forEach(t=>{
    if((t.proc_sub1||'')===s1 && (t.proc_sub2||'')===s2){
      const h=String(t.hoki||'').trim(); if(h) set.add(h);
    }
  });
  return [...set].sort((a,b)=>(Number(a)||99)-(Number(b)||99)||String(a).localeCompare(String(b)));
}

function syncHokiBadge(lineSelId,prodSelId,hiddenId){
  const ls=$('#'+lineSelId), ps=$('#'+prodSelId), hd=$('#'+hiddenId);
  const box=$('#'+hiddenId+'Box');
  if(!hd) return;
  let h='', src='';
  if(ps&&ps.selectedIndex>0){
    const op=ps.options[ps.selectedIndex];
    h=String((op&&op.dataset.hoki)||'').trim(); src='오더';
  }
  if(!h&&ls){
    const list=hokiListOf(ls.value);
    if(list.length===1){ h=list[0]; src='라인'; }
  }
  hd.value=h;
  if(box){
    box.innerHTML=h?`<b>${h}</b>호기 <span class="hb-src">${src}</span>`:'호기 –';
    box.classList.toggle('on',!!h);
    box.title=h?`MES 원본 ${src} 기준으로 자동 표기된 호기입니다. 값이 틀리면 MES 데이터를 바로잡아야 합니다.`
               :'오더를 선택하면 해당 오더의 호기가 자동 표기됩니다. 호기 구분이 없는 라인은 비워둡니다.';
  }
}

let LOSS_LINE='';   // 현재 선택된 라인 필터 (편차율 필터와 함께 적용)
function filterLossLine(ln){
  LOSS_LINE=ln||'';
  document.querySelectorAll('#lossFilterBar .dtf-chip, #lossFilterBar1 .dtf-chip').forEach(b=>{
    b.classList.toggle('on',(b.dataset.ln||'')===LOSS_LINE);

/* 라인 필터 + 편차율 필터를 함께 적용 (서로 덮어쓰지 않도록 단일 창구) */
function applyLossFilters(){
  const m=Number(DEV_MIN)||0;
  let shown=0, hid=0, hidAmt=0;
  let tinyHid=0, zeroHid=0, zeroTot=0;
  document.querySelectorAll('#lossBody2 tr[data-loss], #lossBody1 tr[data-loss]').forEach(tr=>{
    const lnOk=!LOSS_LINE||tr.dataset.ln===LOSS_LINE;
    const dr=tr.dataset.dr===''?null:Number(tr.dataset.dr);
    const isZero=(tr.dataset.d0==='1');                     // 편차 0 (계획=실적)
    if(lnOk&&isZero) zeroTot++;
    const tinyHide=(tr.dataset.tiny==='1' && !SHOW_TINY);   // 1kg 미만 미량 자재
    const devHide=(dr!=null && dr<m);                       // 편차율 하한 미만
    const zeroHide=(HIDE_ZERO && isZero);                   // 편차 0 수동 숨김(기본 OFF)
    const hide=tinyHide||devHide||zeroHide;
    tr.style.display=(lnOk&&!hide)?'':'none';
    if(lnOk&&hide){
      if(tinyHide) tinyHid++; else if(zeroHide) zeroHid++; else hid++;
      const c=tr.querySelector('td:nth-child(9)');
      if(c) hidAmt+=Math.abs(Number(String(c.textContent).replace(/[^0-9.-]/g,''))||0);
    }
    if(lnOk&&!hide) shown++;
  });
  const tb=$('#tinyBtn');
  if(tb) tb.innerHTML=SHOW_TINY?`1kg미만 포함 중 (${tinyHid||''}${tinyHid?'건':''})`:`1kg미만 ${tinyHid}건 제외`;
  // 라인 칩 숫자 갱신 : 편차율·1kg미만 필터를 반영한 "실제 남는 건수"를 표시
  //  · 라인 필터(LOSS_LINE)와는 무관하게 계산 → 다른 라인을 눌러도 숫자가 흔들리지 않음
  //  · 남는 건이 0인 라인은 칩 자체를 숨김
  (function(){
    const per={}; let all=0;
    document.querySelectorAll('#lossBody2 tr[data-loss], #lossBody1 tr[data-loss]').forEach(tr=>{
      const dr=tr.dataset.dr===''?null:Number(tr.dataset.dr);
      const hide=(tr.dataset.tiny==='1'&&!SHOW_TINY)||(dr!=null&&dr<m)||(HIDE_ZERO&&tr.dataset.d0==='1');
      if(hide)return;
      const ln=tr.dataset.ln||''; per[ln]=(per[ln]||0)+1; all++;
    });
    document.querySelectorAll('#lossFilterBar .dtf-chip, #lossFilterBar1 .dtf-chip').forEach(b=>{
      const ln=b.dataset.ln||'', n=(ln===''?all:(per[ln]||0));
      const nb=b.querySelector('.dtf-n');
      if(nb) nb.textContent=n;
      else{ // 구버전 마크업(.dtf-n 없음) 대비 — 마지막 <b> 를 숫자로 간주
        const bs=b.querySelectorAll('b'); if(bs.length) bs[bs.length-1].textContent=n;
      }
      b.style.display=(ln!==''&&n===0)?'none':'';
    });
  })();
  // 요약 카드(총 로스금액·건수·공정·유형)를 "화면에 표시 중인 행" 기준으로 다시 계산
  (function(){
    const strip=$('#lossSumStrip'); if(!strip)return;
    const vis=[];
    document.querySelectorAll('#lossBody2 tr[data-loss], #lossBody1 tr[data-loss]').forEach(tr=>{
      if(tr.style.display==='none')return;
      const i=Number(tr.dataset.loss); const l=(CUR_DAY.losses||[])[i];
      if(l) vis.push(l);
    });
    const byLine={},byType={}; let tot=0,cnt=0;
    vis.forEach(l=>{ const amt=lossOf(l), df=diffOf(l);
      if(!amt&&!df)return; cnt++; tot+=amt;
      const k=(l.proc_sub1||'')+'/'+(l.proc_sub2||''); byLine[k]=(byLine[k]||0)+amt;
      const t=l.scrap_type||'(미분류)'; byType[t]=(byType[t]||0)+amt; });
    const all=(CUR_DAY.losses||[]).reduce((a,l)=>a+lossOf(l),0);
    const top=(o,n)=>Object.entries(o).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,n);
    const cell=(k,v)=>`<div class="sum-item ${v>0?'neg':(v<0?'pos':'')}"><div class="k">${k}</div><div class="v">${v>0?'-':'+'}${fmt(Math.abs(v))}</div></div>`;
    const filtered=(vis.length!==(CUR_DAY.losses||[]).length);
    strip.innerHTML=
      `<div class="sum-item neg" style="border-color:#fecaca"><div class="k">총 로스금액${filtered?' <span style="font-size:9.5px;color:#98a2b3;font-weight:700">표시분</span>':''}</div>`
      +`<div class="v">${tot>0?'-':'+'}${fmt(Math.abs(tot))}</div>`
      +(filtered?`<div style="font-size:10px;color:#98a2b3;margin-top:1px">전체 ${all>0?'-':'+'}${fmt(Math.abs(all))}</div>`:'')+`</div>`
      +`<div class="sum-item"><div class="k">발생 건수</div><div class="v">${cnt}</div>${filtered?`<div style="font-size:10px;color:#98a2b3;margin-top:1px">전체 ${(CUR_DAY.losses||[]).length}</div>`:''}</div>`
      +top(byLine,3).map(([k,v])=>cell('공정 · '+k,v)).join('')
      +top(byType,3).map(([k,v])=>cell('유형 · '+k,v)).join('');
    document.querySelectorAll('.loss-total-amt').forEach(el=>{ el.textContent=fmt(tot)+'원'; });
    // ── 상단 스코어카드 동기화 ──────────────────────────────────
    //  ③ 로스관리의 필터(편차율 하한·1kg미만·편차0·라인칩)를 그대로 반영한다.
    //  금액과 건수가 서로 다른 기준을 쓰면 합이 안 맞으므로 둘 다 같이 움직인다.
    //  전체값은 부제로 남겨 필터로 가려진 물량을 놓치지 않게 한다.
    const totalCnt=(CUR_DAY.losses||[]).length;
    const sv=$('#scScrapV'), ss=$('#scScrapSub'), sl=$('#scLossBox');
    if(sv) sv.textContent=cnt;
    if(ss){
      ss.innerHTML=filtered
        ? `표시 기준 · <span style="color:#98a2b3">전체 ${totalCnt}</span>`
        : '로스 등록 건수';
      ss.title=filtered
        ? `③ 원부자재 로스관리의 필터가 반영된 건수입니다 (표시 ${vis.length}행 중 편차·금액이 있는 ${cnt}건 / 전체 ${totalCnt}행)`
        : '';
    }
    if(sl){
      sl.innerHTML=scWon(tot)+(filtered
        ? `<div style="font-size:9.5px;color:#98a2b3;font-weight:700;margin-top:1px">전체 ${all>0?'-':'+'}${fmt(Math.abs(all))}원</div>` : '');
      sl.title=filtered?'③ 로스관리 필터가 반영된 금액입니다':'';
    }
    // 접기 헤더 옆 건수도 표시 중인 행 기준으로 갱신
    document.querySelectorAll('.loss-fold-cnt').forEach(el=>{
      el.textContent=vis.length;
      el.title=filtered?`표시 ${vis.length}건 / 전체 ${(CUR_DAY.losses||[]).length}건`:'';
    });
  })();
  // 편차 0 행이 "왜 안 보이는지"를 명시적으로 알려준다 (숨김 원인 분해)
  const zb=$('#zeroBtn');
  if(zb) zb.innerHTML=HIDE_ZERO?`편차0 ${zeroTot}건 제외 중`:`편차0 ${zeroTot}건 포함`;
  const st=$('#devStat');
  const parts=[];
  if(m>0&&hid) parts.push(`<b style="color:#b42318">편차율 하한 ${hid}건</b>`);
  if(tinyHid)  parts.push(`<b style="color:#8a94a6">1kg미만 ${tinyHid}건</b>`);
  if(zeroHid)  parts.push(`<b style="color:#8a94a6">편차0 ${zeroHid}건</b>`);
  const zeroNote = (zeroTot && m>0 && !HIDE_ZERO)
    ? ` <span style="color:#b54708;font-weight:800" title="편차율 0% 는 하한(${m}%) 미만이라 '편차율 하한' 필터에 함께 숨겨집니다. 편차 0 건을 보려면 하한을 0 으로 내리세요.">⚠ 편차0 ${zeroTot}건은 하한 ${m}% 필터에 포함되어 숨겨집니다</span>` : '';
  if(st) st.innerHTML=(parts.length
    ? `${parts.join(' · ')} 숨김 · 표시 ${shown}건 · 숨긴 로스금액 ${fmtWon(hidAmt)}`
    : `전체 ${shown}건 표시 · 편차0 ${zeroTot}건 포함`)+zeroNote;
  const em=$('#lossEmptyMsg'); if(em) em.style.display=shown?'none':'block';
}

async function saveT2MH(){
  const {date,team}=CUR_DAY;
  const rows=[];
  document.querySelectorAll('.t2-mh').forEach(inp=>{
    const code=inp.dataset.code;
    const mh=Number(inp.value)||0;
    const noteEl=document.querySelector(`.t2-note[data-code="${code}"]`);
    const note=noteEl?noteEl.value:'';
    if(mh||note) rows.push({work_date:date,team,prod_code:code,mh,note});
  });
  // ── 미적용 계획(KG) 변경분 수집 : '적용' 버튼을 안 눌러도 함께 저장 (값 유실 방지) ──
  const planMap={};
  document.querySelectorAll('.op-plan').forEach(inp=>{
    const code=inp.dataset.code;
    const orig=Number(inp.dataset.orig||0);
    const cur=Number(String(inp.value).replace(/,/g,'').trim());
    if(code && !isNaN(cur) && cur!==orig) planMap[code]=cur;   // 동일 품번 중복행은 마지막 입력 기준
  });
  const planJobs=Object.keys(planMap);
  if(!rows.length && !planJobs.length){toast('저장할 입력값 없음','err');return;}
  try{
    if(rows.length){
      const {error}=await sb.from('t_cl_mh').upsert(rows,{onConflict:'work_date,team,prod_code'});
      if(error)throw error;
      rows.forEach(r=>{CUR_DAY.mhMap[r.prod_code]={mh:r.mh,note:r.note};});
    }
    let planOk=0, planFail=[];
    for(const code of planJobs){
      const {error}=await sb.rpc('set_order_override',{
        p_work_date:date, p_team:team, p_prod_code:code, p_plan:planMap[code],
        p_by:(S.user&&S.user.name)||'-'
      });
      if(error){ planFail.push(code); } else { planOk++; }
    }
    const msg=[rows.length?`투입공수 ${rows.length}건`:'',planOk?`계획 ${planOk}건`:''].filter(Boolean).join(' · ');
    if(planFail.length) toast(`${msg} 저장 · 계획 실패 ${planFail.length}건(${planFail.join(',')})`,'err');
    else toast((msg||'저장')+' 저장완료 · 화면 위치 유지','ok');
    // 저장된 행만 제자리에서 확정 표시 (전체 리로드 없음 → 스크롤·탭·미저장값 유지)
    planJobs.forEach(code=>{
      if(planFail.includes(code))return;
      const el=document.querySelector(`.op-plan[data-code="${code}"]`);
      applyOrderSaved(code, el?el.dataset.rid:null, planMap[code]);
    });
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

/* 결재 진행바 + 액션 버튼 */
function renderApprovalBar(){
  const c=CUR_DAY.closing||{};
  const status=c.status||'none';
  const role=S.user.role||'writer';
  const AL=CUR_DAY.apprLine||{};
  const writerName = c.writer || (S.user&&S.user.name) || '';
  const steps=[
    {key:'draft',  label:'작성자', en:'Preparer',       by:c.writer,  plan:writerName},
    {key:'lead_ok',label:'팀장',   en:'Reviewer',       by:c.lead_by, plan:AL.lead||''},
    {key:'div_ok', label:'본부장', en:'Approver',       by:c.div_by,  plan:AL.division||''},
    {key:'done',   label:'CEO',    en:'Final Approver', by:c.ceo_by,  plan:AL.ceo||''}
  ];
  const order=['draft','submitted','lead_ok','div_ok','done'];
  const curIdx=order.indexOf(status);
  const stepDone=(k)=>({draft:curIdx>=1,lead_ok:curIdx>=2,div_ok:curIdx>=3,done:curIdx>=4}[k]||false);
  // 현재 진행 중(=지금 이 사람 차례)
  const stepNow=(k)=>(
    ((status==='none'||status==='draft'||status==='rejected')&&k==='draft')||
    (status==='submitted'&&k==='lead_ok')||
    (status==='lead_ok'&&k==='div_ok')||
    (status==='div_ok'&&k==='done')
  );
  // 다음 차례(대기)
  const nextKey=(()=>{
    const ks=['draft','lead_ok','div_ok','done'];
    const ni=ks.findIndex(k=>stepNow(k));
    return ni>=0&&ni<ks.length-1?ks[ni+1]:null;
  })();
  const parts=[];
  steps.forEach((s,i)=>{
    const done=stepDone(s.key), now=stepNow(s.key), next=(s.key===nextKey);
    const who = done ? (s.by||s.plan||'') : (s.plan||s.by||'');
    const cls = done?'done':(now?'now':(next?'next':'idle'));
    const badge = done?'완료':(now?'진행 중':(next?'결재예정':''));
    // 단계 사이 연결부 : 진행 방향 화살표(▶) — 4단계 간격을 시각적으로 메움
    if(i>0){
      const prevDone=stepDone(steps[i-1].key);
      // 직전 단계가 끝나고 이 단계가 지금 차례 → 흐르는 애니메이션으로 이동 표현
      const flowing=prevDone&&now;
      parts.push(`<div class="appr-conn ${flowing?'fill flow':(prevDone?'fill':'')}">
        <span class="ac-line"></span><span class="ac-arw"></span><span class="ac-line"></span></div>`);
    }
    // 결재 의견 : 그 단계에서 남긴 메모를 카드 바로 아래 표시
    const mm=(CUR_DAY.apprMemo||{})[s.key];
    const rj=(status==='rejected'&&s.key==='draft')?(CUR_DAY.apprMemo||{}).reject:null;
    const note=rj||mm;
    parts.push(`<div class="appr-step ${cls}">
      <div class="as-card">
        <div class="as-role">${s.label}</div>
        <div class="as-name">${who||'미지정'}</div>
        <div class="as-en">${s.en}</div>
      </div>
      ${badge?`<div class="as-badge ${cls}">${done?'✓ ':''}${badge}</div>`:'<div class="as-badge idle">예정</div>'}
      ${note?`<div class="as-memo ${rj?'rej':''}" title="${String(note.memo).replace(/"/g,'&quot;')}">
        <span class="am-i">${rj?'⊘':'💬'}</span><span class="am-t">${note.memo}</span></div>`:''}
    </div>`);
  });
  const stepFlow=parts.join('');
  const statusLabel={
    none:'미작성',draft:'작성 중',submitted:'팀장 결재 대기',
    lead_ok:'본부장 결재 대기',div_ok:'CEO 결재 대기',done:'최종 완료',rejected:'반려됨'
  }[status]||status;
  const statusCls={none:'',draft:'',submitted:'wait',lead_ok:'wait',div_ok:'wait',done:'done',rejected:'rej'}[status]||'';
  // ── 권한 판정: 결재라인에 등록된 '본인'만 결재 가능 (관리자는 예외) ──
  const me=(S.user&&S.user.name)||'';
  const isAdmin=role==='admin';
  const isLineMember=(step)=>isAdmin||(AL[step]&&AL[step]===me);
  const canApprove=(
    (status==='submitted'&&['lead','admin'].includes(role)&&isLineMember('lead'))||
    (status==='lead_ok'&&['division','admin'].includes(role)&&isLineMember('division'))||
    (status==='div_ok'&&['ceo','admin'].includes(role)&&isLineMember('ceo'))
  );
  // ── 작성/제출(상신) 권한 ────────────────────────────────────────
  // 전 팀 상신: 본부장·CEO·관리자 (팀 소속 무관 — 어느 팀 마감이든 대리 상신 가능)
  // 관련 팀 상신: 팀원·팀장 → 결재라인 등록 팀 / 본인 소속팀 / 공통
  const inTeamLine = isAdmin || [AL.writer,AL.lead,AL.division,AL.ceo].filter(Boolean).includes(me)
    || (c.writer && c.writer===me);
  const myTeam = (S.user&&S.user.team)||'';
  const isMyTeam = !!myTeam && (myTeam===(CUR_DAY.team||'') || (CUR_DAY.team||'')==='공통');
  const canSubmitAnyTeam = ['division','ceo','admin'].includes(role);
  const isWriter = canSubmitAnyTeam || (['writer','lead'].includes(role) && (inTeamLine || isMyTeam));
  // 대리 상신 안내(팀장·본부장·CEO가 작성자 대신 올리는 경우)
  const roleKo={writer:'작성자',lead:'팀장',division:'본부장',ceo:'CEO',admin:'관리자'}[role]||role;
  const proxyNote = (isWriter && role!=='writer' && ['none','draft','rejected'].includes(status))
    ? `<span style="font-size:11.5px;color:#7b8595;margin-right:8px">대리 상신 가능 · ${roleKo}</span>` : '';
  // 권한 없음 안내
  const noPermNote = (!isWriter && ['none','draft','rejected'].includes(status))
    ? `<div class="lock-banner" style="background:#f8f9fb;border-color:#e2e8f2;color:#7b8595;margin-top:10px">
        🔒 <b>${CUR_DAY.team||''} 마감을 작성·제출할 권한이 없습니다.</b>
        팀원·팀장은 본인 소속팀 또는 결재라인 등록 팀만, 본부장·CEO·관리자는 전 팀 상신이 가능합니다.
        관리자에게 소속팀 또는 결재라인 등록을 요청하세요.
       </div>` : '';
  // 본인이 상신한 건을 본인이 결재하는 경우 주의 표시
  const selfNote = (canApprove && c.writer && c.writer===me)
    ? `<span style="font-size:11.5px;color:#c2410c;margin-right:8px">⚠ 본인 상신 건</span>` : '';
  const rejectBox = status==='rejected'
    ? `<div class="reject-box">⚠ 반려 (${c.reject_by||''}): ${c.reject_reason||''}</div>` : '';
  const commentBox = c.submit_comment
    ? `<div class="comment-box">💬 작성자 의견: ${c.submit_comment}</div>` : '';
  return `
  <div class="appr-wrap">
    <div class="appr-flow">${stepFlow}</div>
    <div class="toolbar" style="margin-top:12px;margin-bottom:0">
      <span class="tb-status ${statusCls}" id="tbStatus">${statusLabel}</span>
      <button class="tbtn" onclick="showApprovalLog()">결재이력</button>
      <span class="sp"></span>
      ${proxyNote}${selfNote}
      ${isWriter&&['none','draft','rejected'].includes(status)?`
        <button class="tbtn" onclick="saveClosing(false)">임시저장</button>
        <button class="tbtn submit" onclick="saveClosing(true)">제출</button>`:''}
      ${canApprove?`
        <button class="tbtn reject" onclick="doReject()">반려</button>
        <button class="tbtn approve" onclick="doApprove()">승인</button>`:''}
      <button class="tbtn" onclick="printClosing()">인쇄 / PDF</button>
      <button class="tbtn" onclick="go('cal')">대시보드</button>
    </div>
    ${rejectBox}
    ${commentBox}
    ${noPermNote}
  </div>`;
}
/* ── 인쇄 / PDF : 보고문서 형식으로 출력 ──
   화면 UI(결재카드·툴바·탭)는 숨기고, 문서 헤더 + 결재란 + 푸터를 생성해 A4로 인쇄 */
function printClosing(){

  const docNo=c.doc_no||`DPC-${date}-K${team==='생산2팀'?'2':'1'}-${team}`;
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
  // 결재 4단계: 이름 + 승인여부
  const sign=[
    {t:'작성',  nm:c.writer||AL.writer||(S.user&&S.user.name)||'', ok:!!c.writer},
    {t:'팀장',  nm:c.lead_by||AL.lead||'',      ok:!!c.lead_by},
    {t:'본부장',nm:c.div_by ||AL.division||'',  ok:!!c.div_by},
    {t:'CEO',   nm:c.ceo_by ||AL.ceo||'',       ok:!!c.ceo_by}
  ];
  const statusLabel={none:'미작성',draft:'임시저장',submitted:'결재 진행(팀장)',
    lead_ok:'결재 진행(본부장)',div_ok:'결재 진행(CEO)',done:'결재 완료',rejected:'반려'}[c.status||'none']||'';
  const printedAt=(()=>{const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;})();

  const html=`
  <div class="pd-top">
    <div class="pd-title">
      <h1>일일 생산마감 관리표</h1>
      <div class="pd-sub">하림펫푸드 정안공장 · ${esc(team)} · ${esc(date)}</div>
    </div>
    <div class="pd-meta">
      문서번호 <b>${esc(docNo)}</b><br>
      결재상태 <b>${esc(statusLabel)}</b><br>
      출력일시 ${printedAt}
    </div>
    <table class="pd-sign"><tbody>
      <tr><td class="lbl" rowspan="3">결<br>재</td>
        ${sign.map(s=>`<th>${s.t}</th>`).join('')}</tr>
      <tr>${sign.map(s=>`<td class="nm">${esc(s.nm)}</td>`).join('')}</tr>

     <b>반려 (${esc(c.reject_by||'')})</b> · ${esc(c.reject_reason)}</div>`:''}`;

/* ════════════════════════════════════════════════════════════════════
   결재 알림 메일 (재설계)
   ── 발신 주소는 시스템 계정 고정(Apps Script 소유자 제약). 대신
      · 표시이름 = 행위자     "안영곤 (하림펫푸드 생산마감)"
      · Reply-To = 행위자 메일 → 회신하면 실제 결재자에게 감
   ── 통보 매트릭스
      제출        → 팀장                          (행위자: 작성자)
      팀장 승인    → 본부장                        (행위자: 팀장)
      본부장 승인  → CEO                           (행위자: 본부장)
      CEO 승인     → 작성자+팀장+본부장 (완료통보)   (행위자: CEO)
      반려        → 작성자 + 반려자보다 하위 결재자  (행위자: 반려자, 사유 포함)
   ════════════════════════════════════════════════════════════════════ */
const APPR_ROLE_KO={writer:'작성자',lead:'팀장',division:'본부장',ceo:'CEO',admin:'관리자'};
const APPR_STEP_KO={writer:'작성자',lead:'팀장',division:'본부장',ceo:'CEO'};

/* 공통 JSONP 발송 (응답 대기 안 함 — 결재 흐름을 막지 않음) */
function apprMail(action, params){
  const q=new URLSearchParams(Object.assign({action, url:location.origin}, params||{}));
  const cb='apprCb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  window[cb]=(r)=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s);
    if(r&&r.ok&&r.sent) toast(`결재 알림 발송 (${r.count||1}명)`,'ok');
    else if(r&&r.ok===false) toast('알림 발송 실패: '+(r.error||''),'err'); };
  const s=document.createElement('script');
  s.src=`${MES_WEBAPP_URL}?${q.toString()}&callback=${cb}`;
  s.onerror=()=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); };
  document.body.appendChild(s);
}

/* 팀 결재라인 4단계의 이름·이메일 (RPC 2회로 일괄 확보) */
async function apprLineContacts(team){
  let names={}, users=[];
  try{ const {data}=await sb.rpc('get_approval_line',{p_team:team});
       (data||[]).forEach(r=>{ names[r.step]=r.approver_name; }); }catch(_){}
  try{ const {data}=await sb.rpc('get_users',{p_team:null}); users=data||[]; }catch(_){}
  const mail=n=>{ if(!n)return ''; const u=users.find(x=>x.name===n&&x.email); return u?u.email:''; };
  // 작성자는 실제 마감 작성자(대리 상신 포함) 우선, 없으면 결재라인 등록자
  const w=(CUR_DAY.closing&&CUR_DAY.closing.writer)||names.writer||'';
  return {
    writer:{name:w,               email:mail(w)},
    lead:{name:names.lead||'',         email:mail(names.lead)},
    division:{name:names.division||'', email:mail(names.division)},
    ceo:{name:names.ceo||'',           email:mail(names.ceo)}
  };
}
/* 수신자 목록 조립 — 중복 제거 + 이메일 미등록자 안내 */
function apprPick(contacts, steps){
  const seen=new Set(), to=[], miss=[];
  steps.forEach(k=>{
    const p=contacts[k]; if(!p||!p.name)return;
    if(p.email){ if(!seen.has(p.email)){ seen.add(p.email); to.push(p.email); } }
    else miss.push(`${p.name}(${APPR_STEP_KO[k]||k})`);
  });
  return {to, miss};
}

/* ① 다음 결재자 요청 알림 */
async function notifyNextApprover(date,team,newStatus,actorName){
  if(!['submitted','lead_ok','div_ok'].includes(newStatus)) return;
  try{
    const {data,error}=await sb.rpc('get_next_approver',{p_team:team,p_status:newStatus});
    if(error||!data||!data.length) return;
    const n=data[0];
    if(!n.email){ toast(`${n.approver_name||'다음 결재자'} 이메일 미등록 — 알림 미발송`,'err'); return; }
    let customMsg='';
    try{ const {data:cfg}=await sb.rpc('get_config',{p_key:'approval_mail_msg'}); customMsg=cfg||''; }catch(_){}
    const actorEmail=await getEmailByName(actorName);
    const p={ to:n.email, name:n.approver_name||'', role:n.role_label||'', team, date,
      from_name:actorName||'', actor:actorName||'',
      actor_role:APPR_ROLE_KO[(S.user&&S.user.role)]||'', actor_email:actorEmail||'' };
    if(customMsg) p.custom_msg=customMsg;
    apprMail('mail', p);
  }catch(e){ /* 알림 실패가 결재를 막지 않도록 */ }
}

/* ② 반려 알림 — 작성자 + 반려자보다 하위 단계 결재자 전원 (사유 포함) */
async function notifyReject(date,team,reason,actorRole,actorName){
  try{
    const c=await apprLineContacts(team);
    const below={ lead:['writer'], division:['writer','lead'],
                  ceo:['writer','lead','division'], admin:['writer','lead','division'] }[actorRole]||['writer'];
    const {to,miss}=apprPick(c, below);
    if(miss.length) toast('이메일 미등록: '+miss.join(', '),'err');
    if(!to.length){ toast('반려 알림 대상 이메일이 없습니다','err'); return; }
    const actorEmail=await getEmailByName(actorName);
    apprMail('appr_reject',{ to:to.join(','), team, date, reason:reason||'',
      actor:actorName||'', actor_role:APPR_ROLE_KO[actorRole]||'', actor_email:actorEmail||'' });
  }catch(e){ }
}

/* ③ 최종 완료 알림 — 작성자 + 팀장 + 본부장 (CEO 본인 제외) */
async function notifyDone(date,team,actorName){
  try{
    const c=await apprLineContacts(team);
    const {to,miss}=apprPick(c, ['writer','lead','division']);
    if(miss.length) toast('이메일 미등록: '+miss.join(', '),'err');
    if(!to.length) return;
    const actorEmail=await getEmailByName(actorName);
    apprMail('appr_done',{ to:to.join(','), team, date,
      actor:actorName||'', actor_role:'CEO', actor_email:actorEmail||'',
      ceo_name:(c.ceo&&c.ceo.name)||actorName||'' });
  }catch(e){ }
}

  const {date,team}=CUR_DAY;

  if(memo===null) return; // 취소
  try{
    const {data,error}=await sb.rpc('do_approval',{
      p_date:date,p_team:team,p_action:'approve',
      p_actor:S.user.name,p_role:S.user.role,p_memo:memo||null});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'승인 불가','err'); return; }
    calInvalidate(String(date).slice(0,7));
    toast('승인 완료','ok');

/* ── 호기 분리 대상 라인 ────────────────────────────────────────────
   설비가 2대여도 관리 단위가 아니면 나눌 이유가 없다.
   포장(4대·CAPA 편차 큼)과 EP(2대)만 호기별로 본다.
   여기 배열만 고치면 ① 라인별 요약 전체에 반영된다.                */
const HOKI_SPLIT=['주식/포장','주식/EP'];
/* 호기 미지정으로 숨긴 과거 등록분 (탭별) — 표 아래에 안내만 남긴다 */
const LINE_SUM_NOHK={};
function hkKey(line,hoki){
  const h=String(hoki||'').trim();
  return (HOKI_SPLIT.includes(line)&&h) ? (line+'#'+h) : line;
}
function hkSplit(key){
  const i=String(key).indexOf('#');
  return i<0 ? [String(key),''] : [String(key).slice(0,i), String(key).slice(i+1)];
}
function renderClosing(){
  const {date,team,lines,orders,losses}=CUR_DAY;
  // 결재 진행/완료 시 작성자 수정 잠금 (draft/rejected/none만 편집 가능)
  const cst=(CUR_DAY.closing||{}).status||'none';
  const isAdmin=S.user.role==='admin';
  const dlLocked=isDeadlineLocked(CUR_DAY.date, CUR_DAY.team);   // 월+10일 기한마감(관리자 임시해제 반영됨)
  // 결재완료 잠금은 관리자 예외. 기한마감 잠금은 관리자도 '명시적 해제' 전까지 유지(실수 방지)
  const isLocked = dlLocked || (cst==='done' && !isAdmin);
  CUR_DAY.locked=isLocked;
  CUR_DAY._dlLocked=dlLocked;   // 기한마감 여부 (배너 표시용)
  // 합계 계산
  let totPlan=0,totActual=0,totOrders=0,totScrap=0,totLoss=0;
  lines.forEach(l=>{totPlan+=Number(l.plan_sum);totActual+=Number(l.actual_sum);totOrders+=Number(l.order_count);totScrap+=Number(l.scrap_count);});
  losses.forEach(s=>{totLoss+=Number(s.loss_amount||0);});
  const totAch=totPlan>0?totActual/totPlan:0;
  const finCount=orders.filter(o=>o.kind==='fin').length;
  const semiCount=orders.filter(o=>o.kind==='semi').length;
  // ── 스코어카드 : 완제품 기준(반제품은 EP·계량/배합·진공코터 등 공정마다 재집계되어 중복) ──
  let scPlan=0, scActual=0, scSemiPlan=0, scSemiActual=0;
  (orders||[]).forEach(o=>{
    const p=Number(o.plan_sum??o.plan_qty??0), a=Number(o.actual_sum??o.actual_qty??0);
    const fin=(o.kind==='fin')||(!o.kind&&['2','3'].includes(String(o.prod_code||'').charAt(0)));
    const semi=(o.kind==='semi')||(!o.kind&&String(o.prod_code||'').charAt(0)==='6');
    if(fin){ scPlan+=p; scActual+=a; } else if(semi){ scSemiPlan+=p; scSemiActual+=a; }
  });
  // 당일 계획·실적 기준 확정 (1팀=코터·오븐 산출 / 2팀=MES)
  const SC=dayPlanActual(scPlan, scActual);
  const scAch=SC.plan>0?SC.actual/SC.plan:0;

  // ① 라인별 요약 — 완제품/반제품 탭으로 필터 (오더 기준 재집계)
  const lineRowsAll=lines.map((l,i)=>{
    const ach=Number(l.achieve||0);
    return `<tr>
      <td class="l"><span class="t2-lno">L${i+1}</span> <b>${l.line_name}</b></td>
      <td class="mono">${l.order_count}</td>
      <td class="mono">${fmt(l.plan_sum)}</td>
      <td class="mono">${fmt(l.actual_sum)}</td>
      <td class="mono ${ach>=.98?'pos':'neg'}">${pct(ach)}</td>
      <td class="mono ${Number(l.scrap_count)>0?'neg':''}">${l.scrap_count}</td>
    </tr>`;
  }).join('');
  const lineRowsByKind=(kind)=>{
    const {stdTime,mhMap,downtime}=CUR_DAY;
    // 기준시간 맵
    const stdMap={}; (stdTime||[]).forEach(s=>{ stdMap[s.line]={std:Number(s.std_hours||0)}; });
    // 라인별 가동/정지 시간 — 호기 분리 대상 라인만 호기 단위로 쪼갠다
    const runByLine={}, stopByLine={};
    (downtime||[]).forEach(t=>{
      const k=hkKey((t.proc_sub1||'')+'/'+(t.proc_sub2||''), t.hoki);
      const dur=diffMin(t.start_time,t.end_time);
      if(t.category==='run') runByLine[k]=(runByLine[k]||0)+dur;
      else if(['plan','unplan','sudden'].includes(t.category)) stopByLine[k]=(stopByLine[k]||0)+dur;
    });
    // 오더 집계 (해당 kind만, all이면 완+반 전체)
    //  ※ 이 탭에 '속한 라인'은 오더 기준으로만 정한다.
    //    가동시간만 있고 그 구분의 오더가 없는 라인(예: 완제품 탭의 주식/생육)은
    //    끌어들이지 않는다 — 완제품 탭에 반제품 라인이 섞이는 원인이었음.
    const agg={}, allowBase=new Set();
    orders.filter(o=> kind==='all' ? (o.kind==='fin'||o.kind==='semi') : o.kind===kind).forEach(o=>{
      const base=o.line_name||((o.proc_sub1||'')+'/'+(o.proc_sub2||''));
      const k=hkKey(base, o.hoki);
      allowBase.add(base);
      if(!agg[k])agg[k]={plan:0,act:0,cnt:0,mh:0};
      agg[k].plan+=Number(o.plan_sum||0); agg[k].act+=Number(o.actual_sum||0); agg[k].cnt++;
      const mh=mhMap&&mhMap[o.prod_code]; if(mh)agg[k].mh+=Number(mh.mh||0);
    });
    // [default 노출] 계획이 있는 라인은 실적·가동이 없어도 표에 남긴다.
    //   → 표에서 사라지면 '안 돌린 것'인지 '기록을 안 한 것'인지 구분이 안 된다.
    (lines||[]).forEach(l=>{
      const base=l.line_name||((l.proc_sub1||'')+'/'+(l.proc_sub2||''));
      const has = kind==='fin'  ? (Number(l.fin_plan||0)>0||Number(l.fin_order_count||0)>0)
                : kind==='semi' ? (Number(l.semi_plan||0)>0)
                : (Number(l.plan_sum||0)>0);
      if(!has) return;
      allowBase.add(base);
      if(HOKI_SPLIT.includes(base)){
        // 호기 분리 라인은 계획에 등장한 호기들을 모두 자리 잡아둔다
        const hs=[...new Set((orders||[]).filter(o=>((o.proc_sub1||'')+'/'+(o.proc_sub2||''))===base)
                    .map(o=>String(o.hoki||'').trim()).filter(Boolean))];
        hs.forEach(h=>{ const k=hkKey(base,h); if(!agg[k])agg[k]={plan:0,act:0,cnt:0,mh:0}; });
      }else if(!agg[base]) agg[base]={plan:0,act:0,cnt:0,mh:0};
    });
    // 가동시간은 '이 탭에 속한 라인'에 대해서만 행을 만든다
    Object.keys(runByLine).forEach(k=>{
      const [b]=hkSplit(k);
      if(!allowBase.has(b)) return;
      if(!agg[k])agg[k]={plan:0,act:0,cnt:0,mh:0};
    });
    // 호기 분리 라인인데 호기가 없는 행(과거 등록분)은 표시하지 않는다
    let noHkMin=0, noHkCnt=0;
    Object.keys(agg).forEach(k=>{
      const [b,h]=hkSplit(k);
      if(HOKI_SPLIT.includes(b) && !h){
        noHkMin+=(runByLine[k]||0); noHkCnt++;
        delete agg[k];
      }
    });
    LINE_SUM_NOHK[kind]={min:noHkMin, cnt:noHkCnt};
    const keys=Object.keys(agg).sort((a,b)=>{
      const [la,ha]=hkSplit(a), [lb,hb]=hkSplit(b);
      const c=procOrderCmp(la,lb); if(c) return c;

/* ════════════════════════════════════════════════════════════════════
   24시간제 시각 입력
   ── <input type="time"> 은 브라우저 UI 로케일을 따라가 한국어 환경에서
      오전/오후로 표시된다. lang 속성으로는 최신 Chrome 에서 강제되지 않는다.
   ── 그래서 텍스트 입력 + 자동 포맷으로 바꾼다. 값은 항상 'HH:MM' 24시간제.
      2230 처럼 숫자만 쳐도 22:30 으로 완성된다.
   ════════════════════════════════════════════════════════════════════ */
function fmtTime24(el){
  let v=String(el.value||'').replace(/[^0-9]/g,'').slice(0,4);
  if(v.length>=3) v=v.slice(0,v.length-2)+':'+v.slice(-2);
  el.value=v;
  el.style.borderColor='';
}
function normTime24(el){
  const raw=String(el.value||'').replace(/[^0-9]/g,'');
  if(!raw){ el.value=''; el.style.borderColor=''; return ''; }
  let h,m;
  if(raw.length<=2){ h=+raw; m=0; }                       // 22  → 22:00
  else if(raw.length===3){ h=+raw.slice(0,1); m=+raw.slice(1); }   // 930 → 09:30
  else { h=+raw.slice(0,2); m=+raw.slice(2,4); }
  if(!(h>=0&&h<=23)||!(m>=0&&m<=59)){                     // 잘못된 시각은 비운다
    el.value=''; el.style.borderColor='#f04438';
    toast('시각은 00:00 ~ 23:59 범위로 입력하세요','err');
    return '';
  }
  el.value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  el.style.borderColor='';
  return el.value;
}
/* 저장 직전 호출 — 화면의 모든 시각칸을 정규화해 'HH:MM' 을 보장한다 */
function normAllTime24(){ document.querySelectorAll('input.t24').forEach(normTime24); }

/* 종료시각이 시작시각보다 이르면 익일로 넘어간 것 — diffMin 이 +1440 처리한다.
   숫자만으로는 오해하기 쉬워 화면에 '익일' 배지를 붙여 명시한다. */
function isOvernight(s,e){
  if(!s||!e) return false;
  const p=x=>{const[h,m]=String(x).split(':').map(Number);return h*60+m;};
  return p(e)<p(s);
}
function overnightBadge(t){
  return isOvernight(t&&t.start_time,t&&t.end_time)
    ? ` <span style="display:inline-block;font-size:9.5px;font-weight:800;color:#5a3fb8;background:#f4f1ff;border:1px solid #cfc3f0;border-radius:4px;padding:0 4px;vertical-align:1px" title="종료가 시작보다 이른 시각이라 익일로 계산했습니다">익일</span>`
    : '';
}
function diffMin(s,e){
  if(!s||!e)return 0;
  const p=x=>{const[h,m]=x.split(':').map(Number);return h*60+m;};
  let a=p(s),b=p(e); if(b<a)b+=1440; return b-a;
}

/* 불량등록: 라인 선택 시 그 라인의 제품만 표시 (로그 정확성) */
function filterDefectProds(){
  const lineVal=$('#dfLine').value; // "proc_sub1|proc_sub2"
  const [s1,s2]=(lineVal||'|').split('|');
  const prodSel=$('#dfProd');
  if(!lineVal){ prodSel.innerHTML='<option value="">먼저 라인 선택</option>'; return; }
  // 그 라인에 속한 제품만 (중복 제거)
  const seen=new Set(); const opts=[];
  (CUR_DAY.orders||[]).forEach(o=>{
    if(o.proc_sub1===s1 && o.proc_sub2===s2){
      const key=o.prod_code;
      if(!seen.has(key)){ seen.add(key);
        opts.push(`<option value="${o.prod_code}|${o.prod_name}">${o.prod_code} ${o.prod_name}</option>`);
      }
    }
  });
  prodSel.innerHTML=`<option value="">제품선택</option>${opts.join('')}`;
}

/* ④ 불량 등록 (인라인 입력행 → 즉시 목록 추가, 포커스 유지) */
async function saveDefectNew(){
  const {date,team}=CUR_DAY;
  const lineV=$('#dfLine').value;
  const typeVal=$('#dfType').value;
  if(!lineV){ alert('라인을 선택하세요.'); return; }
  if(!$('#dfProd').value){ alert('제품을 선택하세요. 라인에 맞는 제품을 선택해야 기록이 정확합니다.'); return; }
  if(!typeVal){ alert('불량유형을 선택하세요. 유형을 선택해야 나중에 불량 집계·개선분석이 가능합니다.'); return; }
  const [s1,s2]=(lineV||'|').split('|');
  const [pc,pn]=($('#dfProd').value||'|').split('|');
  const [,typeName]=typeVal.split('|');
  const qty=Number($('#dfQty').value)||0;
  const unit=$('#dfUnit').value, reason=$('#dfReason').value;

      defect_type:typeName,qty,unit,reason
    }).select();
    if(error)throw error;

    const tr=document.createElement('tr');
    tr.setAttribute('data-defect',newRow.id);
    tr.innerHTML=`
      <td class="l">${s1}/${s2}</td>
      <td class="l">${pn||pc||'–'}</td>
      <td><span class="type-tag">${typeName}</span></td>
      <td class="mono">${fmt(qty)}</td><td>${unit||'EA'}</td>
      <td class="l">${reason||'–'}</td>
      <td class="row-actions"><button class="rowbtn del" onclick="delDefect(${newRow.id})">삭제</button></td>`;
    const inputRow=document.querySelector('#defectBody .input-row');
    inputRow.insertAdjacentElement('afterend',tr);
    // 입력행 초기화 (라인은 유지 → 연속 입력 편의) + 포커스
    $('#dfQty').value=''; $('#dfReason').value=''; $('#dfType').value='';
    $('#dfProd').focus();
    CUR_DAY.defects=CUR_DAY.defects||[]; CUR_DAY.defects.push(newRow);
    toast('불량 등록완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function delDefect(id){
  if(!confirm('이 불량을 삭제할까요?'))return;
  try{
    await sb.from('t_cl_defect').delete().eq('id',id);

    if(tr) tr.remove();
    CUR_DAY.defects=(CUR_DAY.defects||[]).filter(d=>String(d.id)!==String(id));
    toast('삭제완료','ok');
  }catch(e){ toast('삭제 실패: '+(e.message||e),'err'); }
}

/* ⑥ 투입인원: 파트 고정 일괄 저장 */
async function saveManpowerAll(){
  const {date,team}=CUR_DAY;
  const rows=[];
  // mp-reg 기준으로 순회 (관리자 행은 mp-plan이 없으므로)
  document.querySelectorAll('.mp-reg').forEach(inp=>{
    const line=inp.dataset.line;
    const [s1,s2]=splitLine(line);
    const planEl=document.querySelector(`.mp-plan[data-line="${line}"]`);
    const plan=planEl?(Number(planEl.value)||0):0;
    const reg=Number(inp.value)||0;
    const dispEl=document.querySelector(`.mp-disp[data-line="${line}"]`);
    const disp=dispEl?(Number(dispEl.value)||0):0;
    const memoEl=document.querySelector(`.mp-memo[data-line="${line}"]`);
    const memo=memoEl?(memoEl.value||''):'';
    if(plan||reg||disp||memo) rows.push({work_date:date,team,proc_sub1:s1,proc_sub2:s2,
      plan_head:plan,regular_head:reg,dispatch_head:disp,input_head:reg+disp,memo});
  });
  if(rows.length===0){toast('입력된 인원 없음','err');return;}
  try{
    const {data,error}=await sb.from('t_cl_manpower')
      .upsert(rows,{onConflict:'work_date,team,proc_sub1,proc_sub2'}).select();
    if(error)throw error;
    const saved=(data||[]).length;
    // 저장된 행만 메모리에 병합 (기존 다른 라인 값은 유지)
    const keep=(CUR_DAY.manpower||[]).filter(m=>
      !rows.some(r=>r.proc_sub1===m.proc_sub1 && r.proc_sub2===m.proc_sub2));
    CUR_DAY.manpower=keep.concat(data&&data.length?data:rows);
    if(saved && saved<rows.length)
      toast(`인원 ${saved}/${rows.length}건만 저장됨 — 라인명을 확인하세요`,'err');
    else
      toast(`인원 ${saved||rows.length}건 저장완료`,'ok');
    rerenderClosing();      // 위치 유지 (팀별 재렌더)
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

/* ② 오더 계획(KG) 수정 — 자재 로스와 별개, 달성률 조정용 */
/* ════════════════════════════════════════════════════════════════════
   ③ 원부자재 로스관리 — 편차율(Deviation Rate)
   편차율 = |실적 − 계획| ÷ 계획 × 100
   · 기준값 이하 행은 목록에서 숨김(허용 오차 범위로 간주)
   · 기준값은 t_app_config 에 '날짜|팀' 단위로 저장 → 그 일자에 고정
   ════════════════════════════════════════════════════════════════════ */
let DEV_MIN=0;          // 현재 적용된 편차율 하한(%)
let DEV_MAX=100;        // 해당 일자 최대 편차율(슬라이더 상한)

/* 1kg 미만 미량 자재 판정
   계량 오차 1g 만으로도 편차율이 수십~수천 %가 되어 관리 지표로 쓸 수 없음.
   계획·실적이 모두 1kg 미만이면 목록에서 제외한다.                         */
const TINY_KG=1;
function isTinyMat(s){
  const p=Math.abs(planOf(s)||0), a=Math.abs(Number(s.actual_qty)||0);
  return Math.max(p,a) < TINY_KG;
}
/* ── ③ 로스관리 계획 기준 : MES / BOM 토글 ─────────────────────────
   BOM 모드에서는 진공코터·분체배합 공정의 원료 계획을
   "코터 키블 실적 × 현장배합률" 로 대체하고 편차·편차율·로스금액을 재계산한다.
   대상 밖(포장·부자재 등)은 MES 계획 그대로 사용.                       */
let LOSS_BASIS='bom';   // 코터·분체배합은 BOM 배합률을 기본 기준으로 사용
function bomOf(s){ return (CUR_DAY.bom||{})[s.prod_code+'|'+s.mat_code]||null; }
/* 현재 기준(MES/BOM)에 따른 편차·로스금액 — 행·합계·카드가 모두 이 함수를 쓴다 */
function diffOf(s){ return Math.round(Number(s.actual_qty)||0)-Math.round(planOf(s)); }
function lossOf(s){ return Math.round(diffOf(s)*(Number(s.unit_price)||0)); }
/* 화면에 쓸 계획값 (기준에 따라 분기) */
function planOf(s){
  if(LOSS_BASIS==='bom'){ const b=bomOf(s); if(b&&Number(b.bom_plan)>0) return Number(b.bom_plan); }
  return Number(s.plan_qty)||0;
}
function switchLossBasis(b){
  if(LOSS_BASIS===b)return;
  LOSS_BASIS=b;
  rerenderClosing();
  if(typeof recalcLossTotals==='function') recalcLossTotals();
  setTimeout(()=>{ if(typeof applyLossFilters==='function') applyLossFilters(); },0);
  toast(b==='bom'?'BOM 기준 — 진공코터·분체배합 원료 계획을 배합률로 산출':'MES 기준 — 원본 계획 사용','ok');
}
/* 기준 전환 바 (③ 섹션) */
function lossBasisBar(){
  const n=Object.keys(CUR_DAY.bom||{}).length;
  const hit=(CUR_DAY.losses||[]).filter(l=>bomOf(l)).length;
  if(!n) return '';
  // 화면 기준(BOM)과 DB 저장값(MES)이 다르면 대시보드·월현황에는 반영되지 않으므로 안내
  const applied=(CUR_DAY.losses||[]).filter(l=>{
    const b=bomOf(l); return b && Math.abs(Number(l.plan_qty)-Number(b.bom_plan))<0.5; }).length;
  const need=hit-applied;
  return `<div class="lb-bar">
    <span class="lb-t">계획 기준</span>
    <button class="lb-btn ${LOSS_BASIS==='bom'?'on':''}" onclick="switchLossBasis('bom')">BOM 배합률</button>
    <button class="lb-btn ${LOSS_BASIS==='mes'?'on':''}" onclick="switchLossBasis('mes')">MES 원본</button>
    <span class="lb-i">진공코터·분체배합 원료 <b>${hit}</b>건</span>
    ${LOSS_BASIS==='bom'
      ? (need>0
        ? `<span class="lb-warn">⚠ 화면만 BOM 기준 — 대시보드·월현황에 반영하려면 저장이 필요합니다 (<b>${need}</b>건)</span>
           <button class="tbtn save" onclick="applyBomPlan()">BOM 계획 저장</button>`
        : `<span class="lb-on" title="저장이 끝났으므로 MES 원본 탭도 같은 값(저장된 BOM 계획)을 보여줍니다. 되돌리려면 각 행의 ↺ 버튼을 사용하세요.">✓ DB 반영 완료 — 두 탭 값이 같습니다</span>`)
      : `<span class="lb-i">${need>0?'DB 저장값(MES 원본) 기준':'DB에 BOM 계획이 저장돼 있어 BOM 기준과 동일합니다'}</span>`}
  </div>`;
}
/* BOM 계획을 t_plan_override 에 일괄 저장 → 대시보드·월현황·라인상세까지 전파 */
async function applyBomPlan(){
  const {date,team}=CUR_DAY;
  if(!confirm(`${date} ${team}\n진공코터·분체배합 원료의 계획을 BOM 배합률 기준으로 저장합니다.\n\n· 로스금액이 대시보드·월현황에도 반영됩니다\n· 각 행의 ↺ 버튼으로 언제든 MES 원본 복원 가능\n\n계속할까요?`)) return;
  try{
    const {data,error}=await sb.rpc('apply_bom_plan',{p_date:date,p_team:team,p_by:(S.user&&S.user.name)||'-'});
    if(error)throw error;
    toast(`BOM 계획 ${fmt(data||0)}건 저장 — 대시보드에도 반영됩니다`,'ok');
    const _sy=window.scrollY; await openDay(date,team); window.scrollTo(0,_sy);
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
function devRate(s){
  // 로스관리는 정수 기준으로 판단 (표시·저장 모두 정수) · 계획은 현재 기준(MES/BOM) 적용
  const pl=planOf(s);
  const p=Math.abs(Math.round(pl)), d=Math.abs(Math.round(Number(s.actual_qty))-Math.round(pl));
  if(!(p>0)) return null;
  return d/p*100;
}
function drCls(v){
  if(v==null) return '';
  return v>=10?'neg':v>=3?'':'pos';    // 10%↑ 빨강 · 3~10% 기본 · 3%↓ 초록
}
function devCfgKey(){
  return 'loss_dev_'+(CUR_DAY.date||'')+'_'+(CUR_DAY.team||'');
}
/* 저장된 기준값 불러오기 (openDay에서 호출) */
async function loadDevMin(){

/* 슬라이더/입력 변경 → 화면만 반영(저장은 별도 버튼) */

}
/* 필터 바 HTML — ③ 섹션에 삽입 */
function devFilterBar(){

  return `<div class="dev-bar">

    <input type="number" id="devNum" min="0" step="0.1" value="${DEV_MIN}"
      oninput="devSlide(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();saveDevMin();}" class="dev-num" title="직접 입력 (상한 없음) · Enter 로 고정">
    <span class="dev-u">%</span>
    <span class="dev-mx">슬라이더 0~${mx}% · 최대 ${realMax.toLocaleString()}%${extreme?` (구간 밖 ${extreme}건)`:''}</span>
    <button class="tbtn save" onclick="saveDevMin()">편차율 고정</button>
    <button class="rowbtn" onclick="resetDevMin()">해제</button>
    <button class="rowbtn" id="tinyBtn" onclick="toggleTiny()" title="계획·실적이 모두 1kg 미만인 미량 자재입니다. 저울 오차 1g 만으로도 편차율이 수십 % 이상 나와 기본적으로 제외합니다.">1kg미만 제외</button>
    <button class="rowbtn" id="zeroBtn" onclick="toggleZero()" title="편차 0(계획=실적) 행의 표시 여부입니다. 기본은 '포함'이며, 편차율 하한을 0보다 크게 고정하면 편차율 0% 도 하한 미만이라 함께 숨겨집니다.">편차0 포함</button>
    <span id="devSavedBadge" class="dev-saved" style="display:${DEV_MIN>0?'':'none'}">고정됨</span>
    <span class="dev-stat" id="devStat"></span>
  </div>`;
}
/* 소수점 1자리 고정 표기 (② 계획·실적·투입공수용) */
function fmt1(v){ const n=Number(v); if(!isFinite(n))return '0.0';
  return n.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
/* 정수 표기 (③ 로스 계획·실적용) */
function fmt0(v){ const n=Number(v); if(!isFinite(n))return '0';
  return Math.round(n).toLocaleString('ko-KR'); }
function markOrderPlanEdit(key){
  // key = 행 고유 rid('op3') 또는 구버전 prod_code — 둘 다 지원
  const btn=document.getElementById(key+'_btn')||document.getElementById('opApply_'+key);
  if(btn) btn.style.display='';
  const inp=document.getElementById(key+'_in')||document.querySelector(`.op-plan[data-code="${key}"]`);
  if(inp){ // 미저장 상태 시각화
    const orig=Number(inp.dataset.orig||0);
    const cur=Number(String(inp.value).replace(/,/g,'').trim());
    const dirty=!isNaN(cur)&&cur!==orig;
    inp.style.border=dirty?'2px solid #d97706':'';
    inp.style.background=dirty?'#fff3dd':(inp.dataset.coat==='1'?'#f3f0ff':'#fff8e8');
    recalcOrderAchieve(inp.dataset.rid||key);   // 달성률 즉시 반영
  }
}
/* 계획 입력값 기준으로 달성률 셀을 즉시 다시 계산 (서버 왕복 없음) */
function recalcOrderAchieve(rid){
  const inp=document.getElementById(rid+'_in'), cell=document.getElementById(rid+'_ach');
  const tr=document.getElementById(rid+'_tr');
  if(!inp||!cell||!tr)return;
  const plan=Number(String(inp.value).replace(/,/g,'').trim());
  const act=Number(tr.dataset.act||0);
  if(!(plan>0)){
    cell.innerHTML='<span style="color:#b42318;font-size:11.5px">계획 미입력</span>'; return;
  }
  const a=act/plan*100;
  const clr=a>=90?'var(--grn)':a>0?'var(--org,#d97706)':'var(--red)';
  const dirty=inp.style.border&&inp.style.border.indexOf('2px')===0;
  cell.innerHTML=`<b style="color:${clr}">${a.toFixed(1)}%</b>${dirty?' <span style="font-size:10px;color:#d97706">미저장</span>':''}`;
}
async function saveOrderOverride(code,rid){
  const {date,team}=CUR_DAY;
  const unfmt=v=>{ const n=Number(String(v).replace(/,/g,'').trim()); return isNaN(n)?null:n; };
  const el=(rid&&document.getElementById(rid+'_in'))||document.querySelector(`.op-plan[data-code="${code}"]`);
  const plan=unfmt(el?el.value:'');
  if(plan===null){ toast('계획 값을 확인하세요','err'); return; }
  try{
    const {error}=await sb.rpc('set_order_override',{
      p_work_date:date, p_team:team, p_prod_code:code, p_plan:plan,
      p_by:(S.user&&S.user.name)||'-'
    });
    if(error)throw error;
    applyOrderSaved(code, rid, plan);          // 화면 재렌더 없이 그 행만 확정 표시 (스크롤·입력 유지)
    toast('오더 계획 저장 (MES 재업로드해도 유지)','ok');
  }catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}
/* 저장 성공한 행을 제자리에서 '저장됨' 상태로 전환 — 전체 리로드 없음
   · 메모리(CUR_DAY.orders)도 갱신해 탭 전환 시에도 값이 유지됨
   · data-orig 갱신 → 미저장 표시(주황) 해제, ✎계획 배지 부착              */
function applyOrderSaved(code, rid, plan){
  (CUR_DAY.orders||[]).forEach(o=>{
    if(o.prod_code===code){ o.plan_sum=plan; o.plan_qty=plan; o.plan_edited=true;
      const a=Number(o.actual_sum??o.actual_qty??0); o.achieve=plan>0?(a/plan):0; }
  });
  const el=rid?document.getElementById(rid+'_in'):document.querySelector(`.op-plan[data-code="${code}"]`);
  if(el){
    el.dataset.orig=plan;
    el.value=fmt1(plan);
    el.style.border=''; el.style.background='#eef7ee';   // 저장 완료 = 연녹색
    setTimeout(()=>{ if(el) el.style.background=(el.dataset.coat==='1'?'#f3f0ff':'#fff8e8'); }, 1200);
    const b=document.getElementById((el.dataset.rid||rid)+'_btn'); if(b) b.style.display='none';
    recalcOrderAchieve(el.dataset.rid||rid);
  }
  // ✎계획 배지 + ↺복원 버튼 부착 (아직 없으면)
  const r=el&&(el.dataset.rid||rid);
  const nm=r?document.getElementById(r+'_nm'):null;
  if(nm && nm.querySelector('.edit-badge')===null){
    const sp=document.createElement('span'); sp.className='edit-badge'; sp.title='계획 수정됨';
    sp.textContent='✎계획'; nm.appendChild(document.createTextNode(' ')); nm.appendChild(sp);
  }
  if(el && !el.parentNode.querySelector('.rowbtn.del')){
    const rb=document.createElement('button'); rb.className='rowbtn del';
    rb.title='MES 원본 계획으로 복원'; rb.textContent='↺'; rb.style.marginLeft='3px';
    rb.onclick=()=>resetOrderOverride(code); el.parentNode.appendChild(rb);
  }
}

/* ③ 계획/실적 인라인 수정 (MES값 override) — 1·2팀 공용 */
function markPlanEdit(i){
  const btn=document.getElementById('peApply_'+i);
  if(btn) btn.style.display='';   // 값 바꾸면 '적용' 버튼 노출
}
/* ③ 계획 입력 : 정수 강제 + 편차·편차율 실시간 미리보기 + 계획<실적 경고 */
function onPlanInput(i){
  const el=document.querySelector(`.pe-plan[data-i="${i}"]`);
  if(!el)return;
  // 숫자 외 문자 제거(소수점 포함) → 정수만 남김
  const raw=String(el.value).replace(/[^0-9-]/g,'');
  if(String(el.value)!==raw && document.activeElement===el){
    const p=el.selectionStart; el.value=raw; try{el.setSelectionRange(p,p);}catch(_){}
  }
  markPlanEdit(i);
  const plan=Math.round(Number(String(el.value).replace(/,/g,''))||0);
  const act=Number(el.dataset.act||0);
  const tr=document.querySelector(`tr[data-loss="${i}"]`);
  if(!tr)return;
  const tds=tr.querySelectorAll('td');
  const diff=act-plan;
  const dr=plan>0?Math.abs(diff)/plan*100:null;
  const bad=plan<act;   // 계획이 실적보다 작으면 저장 불가
  el.style.border=bad?'2px solid #b42318':'2px solid #d97706';
  el.style.background=bad?'#fef3f2':'#fff3dd';
  el.title=bad?`계획이 실적(${fmt0(act)})보다 적습니다 — 저장할 수 없습니다`:'정수만 입력 · 계획은 실적 이상이어야 합니다';
  if(tds[5]){ const dc=diff>0?'neg':diff<0?'pos':'';
    tds[5].className='mono '+dc; tds[5].textContent=diff===0?'0':(diff>0?'+':'')+fmt0(diff); }
  if(tds[6]){ tds[6].className='mono '+drCls(dr); tds[6].textContent=(dr==null?'–':dr.toFixed(1)+'%'); }
  if(tds[8]){ const lv=diff>0?-Math.abs(diff*Number(CUR_DAY.losses[i].unit_price||0)):Math.abs(diff*Number(CUR_DAY.losses[i].unit_price||0));
    const lc=lv<0?'neg':lv>0?'pos':''; tds[8].className='mono '+lc;
    tds[8].textContent=diff===0?'0':(lv<0?'-':'+')+fmt0(Math.abs(lv)); }
}
async function savePlanOverride(i){
  const s=CUR_DAY.losses[i]; if(!s)return;
  const {date,team}=CUR_DAY;
  // 로스관리 계획·실적은 정수 단위로 관리 (소수점 입력·표시 없음)
  const unfmt=v=>{ const n=Number(String(v).replace(/[^0-9.-]/g,'').trim()); return isNaN(n)?null:Math.round(n); };
  const planEl=document.querySelector(`.pe-plan[data-i="${i}"]`);
  const plan=unfmt(planEl?planEl.value:'');
  // 실적은 MES 원본 고정 — 화면 입력값을 쓰지 않고 항상 원본값을 정수로 반영
  const actual=Math.round(Number(s.actual_qty));
  if(plan===null){ toast('계획 값을 확인하세요','err'); return; }
  if(plan<0){ toast('계획은 0 미만일 수 없습니다','err'); if(planEl)planEl.focus(); return; }
  // ── 계획 ≥ 실적 검증 : 계획을 실적보다 낮게 넣으면 로스가 부풀려지므로 거부 ──
  if(plan<actual){
    const short=actual-plan;
    toast(`등록 불가 — 계획(${fmt0(plan)})이 실적(${fmt0(actual)})보다 ${fmt0(short)} 적습니다. 계획은 실적 이상이어야 합니다.`,'err');
    if(planEl){ planEl.style.border='2px solid #b42318'; planEl.style.background='#fef3f2'; planEl.focus(); planEl.select(); }
    return;
  }
  if(planEl){ planEl.style.border=''; planEl.style.background='#fff8e8'; }
  try{
    const {error}=await sb.rpc('set_plan_override',{
      p_work_date:date, p_team:team, p_prod_code:s.prod_code, p_mat_code:s.mat_code,
      p_hoki:s.hoki||'', p_plan:plan, p_actual:actual,
      p_by:(S.user&&S.user.name)||'-'
    });
    if(error)throw error;
    // ── 그 행만 제자리 갱신 (재정렬·재렌더 없음 → 위치·순서 유지) ──
    const newPlan  = plan;                       // 정수
    const newActual= actual;                     // 정수
    const newDiff  = newActual - newPlan;        // 정수 편차
    const newLoss  = Math.round(newDiff * Number(s.unit_price||0));
    s.plan_qty=newPlan; s.actual_qty=newActual; s.diff=newDiff;
    s.loss_amount=newLoss; s.is_edited=true;
    const tr=document.querySelector(`tr[data-loss="${i}"]`);
    if(tr){
      const tds=tr.querySelectorAll('td');
      // [2]자재명(뱃지) [3]계획 [4]실적 [5]편차 [7]로스금액
      if(tds[2] && !/edit-badge/.test(tds[2].innerHTML))
        tds[2].innerHTML += ' <span class="edit-badge" title="MES값에서 수정됨">✎수정</span>';
      if(planEl){ planEl.value=fmt0(newPlan); planEl.dataset.orig=newPlan; }
      if(tds[4]){ const ai=tds[4].querySelector('input'); if(ai) ai.value=fmt0(newActual); }
      const dcls=newDiff>0?'neg':newDiff<0?'pos':''; const diffSign=newDiff>0?'+':'';
      tds[5].className='mono '+dcls; tds[5].textContent=newDiff===0?'0':diffSign+fmt0(newDiff);
      // 편차율 = |편차| ÷ 계획 × 100 (정수 기준)
      const dr=newPlan>0?Math.abs(newDiff)/newPlan*100:null;
      tr.dataset.dr=(dr==null?'':dr.toFixed(2));
      if(tds[6]){ tds[6].className='mono '+drCls(dr); tds[6].textContent=(dr==null?'–':dr.toFixed(1)+'%'); }
      const lossVal=newDiff>0?-Math.abs(newLoss):Math.abs(newLoss);
      const lossCls=lossVal<0?'neg':lossVal>0?'pos':''; const lossSign=lossVal<0?'-':lossVal>0?'+':'';
      tds[8].className='mono '+lossCls; tds[8].style.fontWeight='800';
      tds[8].textContent=newDiff===0?'0':lossSign+fmt0(Math.abs(lossVal));
      // 적용버튼 숨기고, ↺복원 버튼이 없으면 추가
      const applyBtn=document.getElementById('peApply_'+i);
      if(applyBtn) applyBtn.style.display='none';
      const actWrap=tds[tds.length-1];
      if(actWrap && !/resetPlanOverride/.test(actWrap.innerHTML)){
        const b=document.createElement('button');
        b.className='rowbtn del'; b.title='MES 원본값으로 되돌리기'; b.textContent='↺MES복원';
        b.setAttribute('onclick',`resetPlanOverride(${i})`);
        actWrap.insertBefore(b, actWrap.firstChild);
      }
    }
    // ── 편차 0 = 로스 없음 → 목록에서 제거 (저장 후 자연 소멸) ──
    if(newDiff===0){
      const tr2=document.querySelector(`tr[data-loss="${i}"]`);
      if(tr2){
        tr2.style.transition='opacity .35s'; tr2.style.opacity='0';
        setTimeout(()=>{ if(tr2&&tr2.parentNode) tr2.parentNode.removeChild(tr2);
          if(typeof applyLossFilters==='function') applyLossFilters(); },360);
      }
      recalcLossTotals();
      toast(`편차 0 — 로스 해소되어 목록에서 제외됩니다`,'ok');
      return;
    }
    recalcLossTotals();
    if(typeof applyLossFilters==='function') applyLossFilters();   // 편차율 필터 재적용
    toast('수정 반영 (제자리 유지 · MES 재업로드해도 유지)','ok');
  }catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}
/* 로스 총액/스코어카드만 조용히 갱신 (목록 재정렬 없음) */

async function saveLossRow(i){

  if(!type){ alert('로스유형을 선택하세요. 유형을 선택해야 나중에 로스 집계·개선분석이 가능합니다.'); return; }
  try{

      scrap_type:type,reason
    },{onConflict:'work_date,team,proc_sub1,proc_sub2,prod_code,mat_code'});

    lockLossRow(i,type,reason);  // 그 행만 잠금 상태로
    toast('저장완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
/* 로스 행 잠금(저장됨) 상태로 UI 변경 */

/* 로스 행 수정 모드 (잠금 해제) */

async function delLossRow(i){

/* 로스 행 → 그 자재를 제외품목으로 등록 (박스 등 별도회계). 등록 즉시 로스금액에서 빠짐 */
async function excludeLossRow(i){
  if(S.user.role!=='admin'){ toast('제외 등록은 관리자만 가능합니다','err'); return; }
  const s=CUR_DAY.losses[i]; if(!s)return;
  const reason=prompt(`[${s.mat_name}] 을(를) 로스금액 제외 품목으로 등록합니다.\n\n박스 등 별도 계정으로 처리되는 품목이면 아래에 사유를 적고 확인하세요.\n(모든 날짜·대시보드의 로스금액에서 이 자재가 빠집니다. 해제는 설정 → 로스 제외품목에서 가능)\n\n제외 사유:`,'박스 별도회계 처리');
  if(reason===null)return; // 취소
  try{
    const {error}=await sb.rpc('set_mat_exclude',{
      p_mat_code:s.mat_code, p_mat_name:s.mat_name||'', p_reason:(reason||'').trim(), p_active:true});
    if(error)throw error;
    // 이미 저장된 로스유형이 있으면 함께 삭제 (제외품목이 스크랩 집계에 남지 않도록)
    try{
      await sb.from('t_cl_scrap').delete()
        .eq('work_date',CUR_DAY.date).eq('team',CUR_DAY.team)
        .eq('mat_code',s.mat_code);
      CUR_DAY.savedScraps=(CUR_DAY.savedScraps||[]).filter(x=>x.mat_code!==s.mat_code);
    }catch(_){}
    // 로컬 반영: 같은 mat_code 행을 로스 목록에서 제거 후 재렌더 (위치·집계 즉시 갱신)
    CUR_DAY.losses=(CUR_DAY.losses||[]).filter(l=>l.mat_code!==s.mat_code);
    toast(`${s.mat_name} 제외 등록완료 · 로스금액에서 제외됨`,'ok');
    rerenderClosing();
  }catch(e){ toast('제외 등록 실패: '+(e.message||e),'err'); }
}

    .concat((types||[]).map(t=>{
      const n=t.type_name;
      return `<option value="${n}"${n===cur?' selected':''}>${n}</option>`;
    })).join('');
  // 로스 행 드롭다운 (여러 개)
  document.querySelectorAll('select.loss-type').forEach(sel=>{
    sel.innerHTML=build(CUR_DAY.lossTypes, sel.value);
  });

    const [prodRes,scrapRes,workRes]=await Promise.all([
      sb.rpc('get_po_products',{p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2}),
      sb.rpc('get_po_scraps',{p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2}),
      sb.from('t_po_work').select('*').eq('work_date',date).eq('team',team)
        .eq('proc_sub1',sub1).eq('proc_sub2',sub2)
    ]);
    if(prodRes.error)throw prodRes.error;
    CUR_PO.products=prodRes.data||[];
    CUR_PO.scraps=scrapRes.data||[];
    CUR_PO.work=(workRes.data&&workRes.data[0])||{};
  }catch(e){ toast('PO 상세 실패: '+(e.message||e),'err'); return; }
  renderPO();
}
function renderPO(){
  const {sub1,sub2,products,scraps,work}=CUR_PO;
  const {date,team}=CUR_DAY;
  const w=work||{};
  // 제품 리스트(계획/실적/달성률 - 4번)
  const prodRows=products.map(p=>{
    const ach=Number(p.achieve||0);
    return `<tr>
      <td class="l"><span class="kind-badge ${p.kind}">${p.kind==='fin'?'완제품':p.kind==='semi'?'반제품':'기타'}</span> ${p.prod_code}</td>
      <td class="l">${p.prod_name}</td>
      <td class="mono">${p.hoki||'–'}</td>
      <td class="mono">${fmt(p.plan_sum)}</td>
      <td class="mono">${fmt(p.actual_sum)}</td>
      <td class="mono ${ach>=.98?'pos':'neg'}">${pct(ach)}</td>
    </tr>`;
  }).join('');
  // 스크랩(편차≠0 - 5번)
  const scrapRows=scraps.map((s,i)=>`<tr>
    <td class="l">${s.prod_name||s.prod_code}</td>
    <td class="l">${s.mat_name}</td>
    <td class="mono">${fmt(s.diff)} ${s.mat_unit||''}</td>
    <td class="mono">${fmt(s.unit_price)}</td>
    <td class="mono neg">${fmt(s.loss_amount)}</td>
    <td><input class="inp-cell" style="width:180px;text-align:left" id="scrapReason${i}" placeholder="사유 입력" value="${s.reason||''}"></td>
  </tr>`).join('');

  $('#wrap').innerHTML=`
  <div class="po-back"><button onclick="openDay('${date}','${team}')">← ${date} PO 목록</button></div>
  <div class="day-hd">
    <div><h2>${sub1} / ${sub2}</h2><div class="en">${team} · ${date}</div></div>
    <div class="meta">제품 <b>${products.length}</b>종</div>
  </div>

  <!-- 1. 제품별 계획/실적/달성률 -->
  <div class="sec"><div class="sec-hd"><span class="no">1</span><h3>제품별 생산실적</h3>
    <span class="desc">부자재(5시작) 제외 · 계획/실적/달성률</span></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품코드</th><th>제품명</th><th>호기</th><th>계획(KG)</th><th>실적(KG)</th><th>달성률</th></tr></thead>
      <tbody>${prodRows||'<tr><td colspan="6" style="color:var(--mut);padding:16px">제품이 없습니다.</td></tr>'}</tbody>
    </table></div>
  </div>

  <!-- 2. PO 작업기록 (수기입력) -->
  <div class="sec"><div class="sec-hd"><span class="no">2</span><h3>작업 기록</h3>
    <span class="desc">인원·생산시간·정지시간 입력</span><span class="sp"></span>
    <button class="tbtn save" onclick="savePOWork()">저장</button></div>
    <div class="sec-bd">
      <div class="work-grid">
        <div class="work-field"><label>호기</label><input id="wHoki" value="${w.hoki||''}" placeholder="호기"></div>
        <div class="work-field"><label>투입인원(명)</label><input id="wHead" type="number" value="${w.input_head||''}" placeholder="0"></div>
        <div class="work-field"><label></label><div></div></div>
        <div class="work-field"><label>생산시작</label><input id="wStart" type="text" class="t24" inputmode="numeric" maxlength="5" placeholder="--:--" autocomplete="off" oninput="fmtTime24(this)" onblur="normTime24(this)" onfocus="this.select()" value="${w.start_time||''}"></div>
        <div class="work-field"><label>생산종료</label><input id="wEnd" type="text" class="t24" inputmode="numeric" maxlength="5" placeholder="--:--" autocomplete="off" oninput="fmtTime24(this)" onblur="normTime24(this)" onfocus="this.select()" value="${w.end_time||''}"></div>
        <div class="work-field"><label>메모</label><input id="wMemo" value="${w.memo||''}" placeholder="비고"></div>
        <div class="work-field"><label>계획정지(분)</label><input id="wStopPlan" type="number" value="${w.stop_plan||''}" placeholder="0"></div>
        <div class="work-field"><label>비계획정지(분)</label><input id="wStopUnplan" type="number" value="${w.stop_unplan||''}" placeholder="0"></div>
        <div class="work-field"><label>돌발정지(분)</label><input id="wStopSudden" type="number" value="${w.stop_sudden||''}" placeholder="0"></div>
      </div>
    </div>
  </div>

  <!-- 3. 스크랩 사유 (편차≠0) -->
  <div class="sec"><div class="sec-hd"><span class="no">3</span><h3>스크랩 사유</h3>
    <span class="desc">편차 발생 자재 · 사유 작성</span><span class="sp"></span>
    ${scraps.length?`<button class="tbtn save" onclick="savePOScrap()">사유 저장</button>`:''}</div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품</th><th>자재명</th><th>편차</th><th>편차율</th><th>단가</th><th>로스금액</th><th>발생사유</th></tr></thead>
      <tbody>${scrapRows||'<tr><td colspan="6" style="color:var(--mut);padding:16px">편차 발생 없음</td></tr>'}</tbody>
    </table></div>
  </div>

  <!-- 4. 불량 등록 -->
  <div class="sec"><div class="sec-hd"><span class="no">4</span><h3>불량 등록</h3>
    <span class="desc">제품 선택 → 불량유형·수량</span><span class="sp"></span>
    <button class="tbtn save" onclick="addDefectRow()">+ 불량 추가</button></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품 선택</th><th>불량유형</th><th>수량</th><th>단위</th><th>사유</th><th></th></tr></thead>
      <tbody id="defectBody"><tr><td colspan="6" style="color:var(--mut);padding:16px">"+ 불량 추가"로 등록</td></tr></tbody>
    </table></div>
  </div>`;
}

async function savePOWork(){
  const {date,team}=CUR_DAY, {sub1,sub2}=CUR_PO;
  const n=id=>{const v=Number($(id).value);return isNaN(v)?0:v;};
  try{
    const {error}=await sb.rpc('save_po_work',{
      p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2,p_hoki:$('#wHoki').value,
      p_head:n('#wHead'),p_start:normTime24($('#wStart')),p_end:normTime24($('#wEnd')),
      p_stop_plan:n('#wStopPlan'),p_stop_unplan:n('#wStopUnplan'),p_stop_sudden:n('#wStopSudden'),
      p_memo:$('#wMemo').value
    });
    if(error)throw error;
    toast('작업기록 저장 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

async function savePOScrap(){
  const {date,team}=CUR_DAY, {sub1,sub2,scraps}=CUR_PO;
  const rows=scraps.map((s,i)=>({
    work_date:date,team,proc_sub1:sub1,proc_sub2:sub2,
    prod_code:s.prod_code,mat_code:s.mat_code,mat_name:s.mat_name,
    diff:s.diff,unit_price:s.unit_price,loss_amount:s.loss_amount,
    reason:($('#scrapReason'+i)||{}).value||''
  }));
  try{
    const {error}=await sb.from('t_po_scrap').upsert(rows,{onConflict:'work_date,team,proc_sub1,proc_sub2,prod_code,mat_code'});
    if(error)throw error;
    toast('스크랩 사유 저장 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

/* 불량 등록 (제품 드롭다운) */
function addDefectRow(){
  const body=$('#defectBody');
  if(body.querySelector('td[colspan]')) body.innerHTML='';
  const idx=body.children.length;
  const opts=CUR_PO.products.map(p=>`<option value="${p.prod_code}|${p.prod_name}">${p.prod_code} ${p.prod_name}</option>`).join('');
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><select class="inp-cell" style="width:200px;text-align:left" id="dProd${idx}"><option value="">선택</option>${opts}</select></td>
    <td><input class="inp-cell" style="width:110px;text-align:left" id="dType${idx}" placeholder="불량유형"></td>
    <td><input class="inp-cell" id="dQty${idx}" type="number" placeholder="0"></td>
    <td><input class="inp-cell" style="width:56px" id="dUnit${idx}" value="EA"></td>
    <td><input class="inp-cell" style="width:150px;text-align:left" id="dReason${idx}" placeholder="사유"></td>
    <td><button class="tbtn" onclick="saveDefect(${idx})">저장</button></td>`;
  body.appendChild(tr);
}
async function saveDefect(idx){
  const {date,team}=CUR_DAY, {sub1,sub2}=CUR_PO;
  const prodVal=($('#dProd'+idx)||{}).value||'';
  if(!prodVal){toast('제품을 선택하세요','err');return;}
  const [code,name]=prodVal.split('|');
  try{
    const {error}=await sb.from('t_po_defect').insert({
      work_date:date,team,proc_sub1:sub1,proc_sub2:sub2,
      prod_code:code,prod_name:name,
      defect_type:$('#dType'+idx).value,qty:Number($('#dQty'+idx).value)||0,
      unit:$('#dUnit'+idx).value,reason:$('#dReason'+idx).value
    });
    if(error)throw error;
    toast('불량 등록 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}</script>
</body>
</html>
