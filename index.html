  if(!txt.trim()){ toast('붙여넣은 내용이 없습니다','err'); return; }
  const p=parseBomPaste(txt);
  if(!p.rows.length){ toast('유효한 행이 없습니다 — 열 구분(탭)을 확인하세요','err'); renderBomCheck(null); return; }
  const d=dedupBom(p.rows);                       // 중복 키 제거 (업로드 실패 방지)
  const v=validateBom(d.rows);
  BOM_PARSED={...p, rows:d.rows, dups:d.dups, v};
  renderBomCheck(BOM_PARSED);
  const btn=$('#bomUpBtn'); if(btn) btn.disabled=false;
  toast(`검증 완료 — 유효 ${d.rows.length}행 · 소계 ${p.skipped.length}행 제외${d.dups.length?` · 중복 ${d.dups.length}행 병합`:''}`,'ok');
}

function renderBomCheck(P){
  const box=$('#bomCheck'); if(!box)return;
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
  if(!P){ box.innerHTML=''; set('#bkRow','–');set('#bkCoat','–');set('#bkRev','–');set('#bkBad','–');
          const b=$('#bomUpBtn'); if(b)b.disabled=true; return; }
  const v=P.v;
  set('#bkRow',fmt(v.rowCnt)); set('#bkCoat',fmt(v.coatCnt));
  set('#bkRev',fmt(v.revCnt)); set('#bkBad',fmt(v.badSum.length));
  const badEl=$('#bkBad'); if(badEl) badEl.style.color=v.badSum.length?'#b42318':'var(--grn)';

  const rows=v.coatList.slice().sort((a,b)=>Math.abs(b.sum-1)-Math.abs(a.sum-1)).slice(0,12);
  box.innerHTML=`
    ${P.bad.length?`<div class="bom-chk bom-err">⚠ <b>제외된 오류 행 ${P.bad.length}건</b> — 현장배합률이 0이거나 코드가 없는 행입니다.<br>${P.bad.slice(0,5).join('<br>')}${P.bad.length>5?`<br>… 외 ${P.bad.length-5}건`:''}</div>`:''}
    ${(P.dups&&P.dups.length)?`<div class="bom-chk bom-warn">🔁 <b>중복 키 ${P.dups.length}행 병합</b> — 같은 (품목·원료·버전) 이 여러 번 있어 <b>배합률이 큰 행</b>만 남겼습니다.<br>${P.dups.slice(0,5).map(d=>`${d.item} · ${d.mat} ${d.mat_name||''} <b>${d.a}</b> / <b>${d.b}</b>`).join('<br>')}${P.dups.length>5?`<br>… 외 ${P.dups.length-5}건`:''}</div>`:''}
    ${v.badSum.length
      ? `<div class="bom-chk bom-warn">⚠ <b>코터 합계가 1.0을 벗어난 제품 ${v.badSum.length}건</b> — 배합률 누락 가능성이 있습니다.<br>${v.badSum.slice(0,5).map(c=>`${c.code} ${c.name||''} <b>${c.sum.toFixed(6)}</b>`).join('<br>')}</div>`
      : `<div class="bom-chk bom-ok">✅ <b>코터 합계 검증 통과</b> — ${v.coatCnt}개 제품 모두 1.0 ± 0.01 범위입니다.</div>`}
    ${v.revMix.length?`<div class="bom-chk bom-warn">⚠ 같은 품목에 배합비버전이 2개 이상인 항목 ${v.revMix.length}건 — 최신 버전만 사용됩니다.</div>`:''}
    <div class="bom-chk" style="background:#f7f9fc;border:1.5px solid var(--line);color:var(--sub)">
      소계 행 <b>${P.skipped.length}건</b> 자동 제외 · 공정 <b>${v.lineSet.length}종</b>: ${v.lineSet.join(' · ')}
    </div>
    <div class="bom-tree" style="margin-bottom:12px">
      <div class="bom-thd" style="cursor:default"><b style="font-size:12.5px">코터 합계 미리보기</b>
        <span class="bom-rev" style="margin-left:auto">1.0 에 가까울수록 정상</span></div>
      ${rows.map(c=>{
        const ok=(c.sum>=0.99&&c.sum<=1.01);
        return `<div style="display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid #f1f4f9">
          <span class="bom-code">${c.code}</span>
          <span style="font-size:12px;color:#1f2937">${c.item_name||c.name||''}</span>
          <span class="bom-rev">v${c.rev||'-'} · 원료 ${c.n}</span>
          <span class="bom-sum" style="color:${ok?'var(--grn)':'#b42318'}">${c.sum.toFixed(6)}${ok?' ✓':' ⚠'}</span>
        </div>`;}).join('')}
    </div>`;
}

/* 분할 업로드 : 대량(수천 행)을 한 번에 보내면 요청 크기 한계로 일부만 저장됨
   500행씩 나눠 순차 전송하고 진행률을 표시한다. 실패한 묶음은 즉시 중단·보고. */
const BOM_CHUNK=500;
async function doBomUpload(){
  if(!BOM_PARSED||!BOM_PARSED.rows.length){ toast('먼저 검증을 실행하세요','err'); return; }
  const rows=BOM_PARSED.rows, n=rows.length;
  const chunks=Math.ceil(n/BOM_CHUNK);
  if(!confirm(`BOM ${fmt(n)}행을 등록합니다.\n${chunks}회로 나눠 전송하며 같은 품목·원료·버전은 덮어쓰기됩니다.\n계속할까요?`)) return;
  const btn=$('#bomUpBtn'); const by=(S.user&&S.user.name)||'-';
  let done=0, saved=0;
  const setP=()=>{ if(btn) btn.textContent=`업로드 중… ${done}/${chunks} (${fmt(saved)}행)`; };
  if(btn){ btn.disabled=true; setP(); }
  try{
    for(let i=0;i<n;i+=BOM_CHUNK){
      const part=rows.slice(i,i+BOM_CHUNK);
      const {data,error}=await sb.rpc('upsert_bom_bulk',{p_rows:part,p_by:by});
      if(error) throw new Error(`${done+1}번째 묶음(${i+1}~${i+part.length}행): ${error.message||error}`);
      saved+=Number(data)||part.length; done++; setP();
    }
    // 전 묶음 저장이 끝난 뒤 base_code(제품 계보) 일괄 전개 — 중간에 하면 불완전
    if(btn) btn.textContent='제품 계보 정리 중…';
    let baseMsg='';
    try{
      const {data:left,error:be}=await sb.rpc('rebuild_bom_base');
      if(be) throw be;
      baseMsg=(left>0)?` · 계보 미전개 ${fmt(left)}행`:' · 계보 전개 완료';
    }catch(e){
      // 전개 실패는 조용히 넘기지 않는다 (제품수 0 이 되어 BOM 계획 산출이 불가)
      toast(`행 저장은 됐지만 계보 전개 실패 — SQL 편집기에서 SELECT rebuild_bom_base(); 실행 필요 (${e.message||e})`,'err');
      baseMsg=' · ⚠ 계보 전개 실패';
    }
    toast(`BOM ${fmt(saved)}행 등록 완료 (${chunks}회 전송)${baseMsg}`,'ok');
    BOM_PARSED=null; BOM_TREE_CACHE={};
    const ta=$('#bomPaste'); if(ta) ta.value='';
    renderBomMgmt();
  }catch(e){
    toast(`업로드 중단 — ${fmt(saved)}행 저장 후 실패: ${e.message||e}`,'err');
    if(btn){ btn.disabled=false; btn.textContent='업로드 (이어서)'; }
  }
}

/* 등록 현황 : 코터 품목 기준 목록 (누를 때만 조회) */
async function loadBomList(){
  const box=$('#bomList'); if(!box)return;
  box.innerHTML='<div class="skel" style="height:200px;border-radius:12px"></div>';
  try{
    const {data,error}=await sb.from('m_bom')
      .select('item_code,item_name,rev,line,mat_code,rate,base_code')
      .like('line','%진공코터%').order('item_code');
    if(error)throw error;
    const g={};
    (data||[]).forEach(r=>{
      const k=r.item_code;
      const o=(g[k]=g[k]||{code:k,name:r.item_name,rev:r.rev,sum:0,n:0});
      o.sum+=Number(r.rate)||0; o.n++;
    });
    const list=Object.values(g).sort((a,b)=>String(a.code).localeCompare(String(b.code)));
    if(!list.length){ box.innerHTML='<div style="padding:18px;color:var(--mut)">등록된 코터 BOM이 없습니다.</div>'; return; }
    box.innerHTML=`<div class="bom-tree">
      <div class="bom-thd" style="cursor:default"><b style="font-size:12.5px">등록 현황 · 제품(코터) ${list.length}건</b>
        <span class="bom-rev" style="margin-left:auto">클릭하면 공정별 상세</span></div>
      ${list.map(c=>{
        const ok=(c.sum>=0.99&&c.sum<=1.01);
        return `<div class="bom-thd" onclick="toggleBomTree('${c.code}')" style="background:#fff">
            <span class="bom-code">${c.code}</span>
            <span style="font-size:12px;color:#1f2937">${c.name||''}</span>
            <span class="bom-rev">v${c.rev||'-'} · 원료 ${c.n}</span>
            <span class="bom-sum" style="color:${ok?'var(--grn)':'#b42318'}">${c.sum.toFixed(6)}${ok?' ✓':' ⚠'}</span>
          </div>
          <div id="bt_${c.code}" style="display:none"></div>`;}).join('')}
    </div>`;
  }catch(e){ box.innerHTML='<div style="padding:18px;color:#b42318">조회 실패: '+(e.message||e)+'</div>'; }
}

async function toggleBomTree(code){
  const el=document.getElementById('bt_'+code); if(!el)return;
  if(el.style.display!=='none'){ el.style.display='none'; return; }
  el.style.display='';
  if(BOM_TREE_CACHE[code]){ el.innerHTML=BOM_TREE_CACHE[code]; return; }
  el.innerHTML='<div style="padding:10px 14px;color:var(--mut);font-size:12px">불러오는 중…</div>';
  try{
    const {data,error}=await sb.from('m_bom')
      .select('line,item_code,item_name,mat_code,mat_name,rate,unit,rev')
      .eq('base_code',code).order('line');
    if(error)throw error;
    const g={};
    (data||[]).forEach(r=>{ (g[r.line]=g[r.line]||[]).push(r); });
    const keys=Object.keys(g).sort(procOrderCmp);
    const html=keys.map(ln=>{
      const rs=g[ln].slice().sort((a,b)=>Number(b.rate)-Number(a.rate));
      const sum=rs.reduce((a,b)=>a+Number(b.rate||0),0);
      return `<div style="padding:6px 14px;background:#fafbfd;border-bottom:1px solid #eef1f6;font-size:11.5px;font-weight:800;color:#4a5568">
          ${ln} <span style="color:#98a2b3;font-weight:700">· ${rs.length}건 · 소계 ${sum.toFixed(6)}</span></div>
        ${rs.map(r=>`<div style="display:flex;gap:9px;padding:5px 14px 5px 26px;border-bottom:1px solid #f5f7fa;font-size:11.5px">
          <span class="mono" style="color:${String(r.mat_code).charAt(0)==='6'?'#8a94a6':'#1f2937'};min-width:64px">${r.mat_code}</span>
          <span style="color:#4a5568;flex:1">${r.mat_name||''}</span>
          <span class="mono" style="font-weight:700">${Number(r.rate).toFixed(6)}</span>
          <span style="color:#98a2b3;min-width:26px">${r.unit||''}</span>
        </div>`).join('')}`;
    }).join('');
    BOM_TREE_CACHE[code]=html; el.innerHTML=html;
  }catch(e){ el.innerHTML='<div style="padding:10px 14px;color:#b42318;font-size:12px">조회 실패: '+(e.message||e)+'</div>'; }
}

/* ════════════════════════════════════════════════════════════════════
   설계수율 관리 (설정 탭)
   · 코터·오븐 반제품(6번대)의 설계 기준수율(%) 마스터
   · 계획 업로드에 새 품목이 나타나면 sync_design_yield 로 자동 등록(수율 NULL)
     → 관리자가 미등록 목록을 보고 채워 넣는 방식
   · 로딩: 진입 시 1회 조회, 필터·검색은 전부 클라이언트(0ms), 저장은 변경분만
   ════════════════════════════════════════════════════════════════════ */
let DY_LIST=[], DY_FILTER='none';   // none=미등록 우선, all, coat, oven
function dyMark(code){
  const el=document.querySelector(`.dy-in[data-code="${code}"]`); if(!el)return;
  const orig=el.dataset.orig==='null'?null:Number(el.dataset.orig);
  const cur=String(el.value).trim()===''?null:Number(el.value);
  const dirty=(orig===null?cur!==null:(cur===null||Math.abs(cur-orig)>0.001));
  el.style.border=dirty?'2px solid #d97706':'';
  el.style.background=dirty?'#fff3dd':(cur==null?'#fff5f5':'#fff');
  dyUpdateBar();
}
function dyDirty(){
  const out=[];
  document.querySelectorAll('.dy-in').forEach(el=>{
    const orig=el.dataset.orig==='null'?null:Number(el.dataset.orig);
    const v=String(el.value).trim(); const cur=(v===''?null:Number(v));
    if(cur!==null && (isNaN(cur)||cur<=0||cur>200)) return;
    const same=(orig===null?cur===null:(cur!==null&&Math.abs(cur-orig)<=0.001));
    if(!same) out.push({code:el.dataset.code, val:cur});
  });
  return out;
}
function dyUpdateBar(){
  const n=dyDirty().length, b=$('#dyBar'); if(!b)return;
  b.style.display=n?'flex':'none';
  const c=$('#dyCnt'); if(c) c.textContent=n;
}
async function dySaveAll(){
  const jobs=dyDirty();
  if(!jobs.length){ toast('변경된 값이 없습니다','err'); return; }
  const btn=$('#dySaveBtn'); if(btn){btn.disabled=true;btn.textContent='저장 중…';}
  let ok=0; const fail=[];
  for(const j of jobs){
    try{
      const {error}=await sb.rpc('set_design_yield',{p_code:j.code,p_yield:j.val,p_by:(S.user&&S.user.name)||'-'});
      if(error)throw error; ok++;
    }catch(e){ fail.push(j.code); }
  }
  if(btn){btn.disabled=false;btn.textContent='변경분 저장';}
  if(fail.length) toast(`${ok}건 저장 · 실패 ${fail.length}건`,'err');
  else toast(`설계수율 ${ok}건 저장완료`,'ok');
  renderDYieldMgmt();
}
async function dySync(){
  try{
    const {data,error}=await sb.rpc('sync_design_yield');
    if(error)throw error;
    toast(Number(data)>0?`신규 품목 ${fmt(data)}건 등록 — 수율을 입력하세요`:'신규 품목 없음','ok');
    renderDYieldMgmt();
  }catch(e){ toast('동기화 실패: '+(e.message||e),'err'); }
}

        <div><label style="font-size:12px;font-weight:700;color:var(--sub)">PIN (변경 시에만 입력)</label>
          <input id="euPin" type="password" placeholder="미입력=기존 유지" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-top:4px"></div>
        <div><label style="font-size:12px;font-weight:700;color:var(--sub)">이메일 <span style="font-weight:500;color:var(--mut)">· 결재 알림 수신용</span></label>
          <input id="euEmail" type="email" value="${(u.email||'').replace(/"/g,'&quot;')}" placeholder="name@harimpetfood.com" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-top:4px"></div>
        <div style="display:flex;gap:10px">

            <select id="euRole" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;margin-top:4px">${roleOpts}</select></div>

async function submitEditUser(userId){
  const name=$('#euName').value.trim(), pin=$('#euPin').value.trim();
  const email=($('#euEmail')?$('#euEmail').value.trim():'');
  if(!name){ toast('이름 필수','err'); return; }
  try{
    const {error}=await sb.rpc('upsert_user',{
      p_user_id:userId, p_name:name, p_pin:pin,
      p_role:$('#euRole').value, p_team:$('#euTeam').value});
    if(error)throw error;
    // 이메일은 별도 업데이트 (결재 알림 수신용)
    await sb.from('m_users').update({email:email||null}).eq('user_id',userId);
    toast('수정완료','ok');
    document.getElementById('editUserModal').remove();
    renderUserMgmt();
  }catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}
function resetUserForm(){
  $('#uUserId').value=''; $('#uName').value=''; $('#uPin').value='';
  $('#uPin').placeholder='123456';
  $('#uTeam').value='생산1팀'; $('#uRole').value='writer';
}
async function saveUser(){
  const name=$('#uName').value.trim(), pin=$('#uPin').value.trim();
  if(!name){ toast('이름 필수','err'); return; }
  if(!pin){ toast('신규 등록은 PIN 필수','err'); return; }
  try{
    const {data,error}=await sb.rpc('upsert_user',{
      p_user_id:'', p_name:name, p_pin:pin,
      p_role:$('#uRole').value, p_team:$('#uTeam').value});
    if(error)throw error;
    toast('등록완료','ok'); resetUserForm(); renderUserMgmt();
  }catch(e){ toast('등록 실패: '+(e.message||e),'err'); }
}
async function toggleActive(id){
  try{
    const {data,error}=await sb.rpc('toggle_user_active',{p_user_id:id});
    if(error)throw error;
    toast(data.active?'활성화됨':'비활성화됨','ok');
    renderUserMgmt();
  }catch(e){ toast('상태 변경 실패: '+(e.message||e),'err'); }
}
async function delUser(id){
  const u=USERS_CACHE.find(x=>x.user_id===id);
  const name=u?u.name:'';
  if(!confirm(name+' 사용자를 DB에서 완전히 삭제할까요?\n(되돌릴 수 없습니다. 잠시 막으려면 상태를 비활성으로 바꾸세요.)'))return;
  try{
    const {data,error}=await sb.rpc('delete_user_hard',{p_user_id:id});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'삭제 불가','err'); return; }
    toast('삭제완료','ok'); renderUserMgmt();
  }catch(e){ toast('삭제 실패: '+(e.message||e),'err'); }
}
async function unlockUser(id){
  const u=USERS_CACHE.find(x=>x.user_id===id);
  const name=u?u.name:'';
  try{ await sb.rpc('unlock_user',{p_user_id:id});
    toast(name+' 잠금해제 완료','ok'); renderUserMgmt();
  }catch(e){ toast('해제 실패: '+(e.message||e),'err'); }
}

/* --- 기준시간 관리 탭 (생산2팀 공정별 기준·계획 가동시간) --- */
/* ════════════════════════════════════════════════════════════════════
   생산기준시간 관리 (재설계) — 생산1팀 · 생산2팀 · 공통 모두 관리
   · 팀 전환 시에만 서버 조회, 입력·편성률 계산은 전부 클라이언트 → 0ms
   · 변경분 일괄 저장(stdSaveAll) : 공정 여러 개 입력 후 버튼 한 번
   · 편성률(계획÷기준) 실시간 미리보기 — 입력 즉시 색상으로 판정
   ════════════════════════════════════════════════════════════════════ */
let STD_LIST=[];
const STD_TEAMS=['생산1팀','생산2팀','공통'];
const STD_TEAMCLR={'생산1팀':'#2670c9','생산2팀':'#1a9d5c','공통':'#9b6dc9'};
// 기본 팀 = 로그인 사용자 소속팀(생산1팀·생산2팀·공통 중), 없으면 생산1팀
let STD_TEAM=(()=>{ const t=(typeof S!=='undefined'&&S&&S.user&&S.user.team)||''; return STD_TEAMS.includes(t)?t:'생산1팀'; })();

function stdSetTeam(t){ STD_TEAM=t; renderStdTimeMgmt(); }

/* 편성률 실시간 재계산 (서버 호출 없음) */
function stdRecalc(i){
  const st=Number(($('#std_'+i)||{}).value)||0;
  const pl=Number(($('#plan_'+i)||{}).value)||0;
  const cell=document.getElementById('stdratio_'+i);
  if(cell){
    if(st>0&&pl>0){
      const r=pl/st*100;
      const clr=r>100?'#b42318':(r>=90?'var(--grn)':(r>0?'#d97706':'var(--mut)'));
      cell.innerHTML=`<b style="color:${clr}">${r.toFixed(1)}%</b>`;
      cell.title=r>100?'계획시간이 기준시간을 초과합니다 (연장가동)':'';
    }else{ cell.innerHTML='<span style="color:var(--mut)">–</span>'; cell.title=''; }
  }
  stdMarkDirty(i);
}
function stdMarkDirty(i){
  const s=STD_LIST[i]; if(!s)return;
  const st=Number(($('#std_'+i)||{}).value)||0;
  const pl=Number(($('#plan_'+i)||{}).value)||0;
  const dirty=(st!==(Number(s.std_hours)||0))||(pl!==(Number(s.plan_hours)||0));
  const row=document.getElementById('stdrow_'+i);
  if(row) row.classList.toggle('dirty',dirty);
  stdUpdateDirtyBar();
}
function stdDirtyList(){
  const out=[];
  STD_LIST.forEach((s,i)=>{
    const se=$('#std_'+i), pe=$('#plan_'+i);
    if(!se||!pe)return;
    const st=Number(se.value)||0, pl=Number(pe.value)||0;
    if(st!==(Number(s.std_hours)||0)||pl!==(Number(s.plan_hours)||0)) out.push({i,st,pl,s});
  });
  return out;
}
function stdUpdateDirtyBar(){
  const n=stdDirtyList().length;
  const bar=$('#stdDirtyBar'); if(!bar)return;
  bar.style.display=n?'flex':'none';
  const c=$('#stdDirtyCnt'); if(c) c.textContent=n;
}
async function stdSaveAll(){
  const jobs=stdDirtyList();
  if(!jobs.length){ toast('변경된 값이 없습니다','err'); return; }
  const btn=$('#stdSaveAllBtn'); if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  let ok=0; const fail=[];
  for(const j of jobs){
    try{
      const {error}=await sb.rpc('set_std_time',{p_team:STD_TEAM,p_line:j.s.line,
        p_std:j.st,p_plan:j.pl,p_active:j.s.active!==false});
      if(error)throw error;
      j.s.std_hours=j.st; j.s.plan_hours=j.pl; ok++;
    }catch(e){ fail.push(j.s.line); }
  }
  if(btn){ btn.disabled=false; btn.textContent='변경분 일괄 저장'; }
  if(fail.length) toast(`${ok}건 저장 · 실패 ${fail.length}건 (${fail.slice(0,3).join(', ')})`,'err');
  else toast(`${ok}건 일괄 저장완료`,'ok');
  renderStdTimeMgmt();
}

async function renderStdTimeMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:300px;border-radius:14px"></div>';
  let loadErr='';
  try{ const {data,error}=await sb.rpc('get_std_time',{p_team:STD_TEAM}); if(error)throw error; STD_LIST=data||[]; }
  catch(e){ loadErr=(e.message||String(e)); toast('생산기준시간 조회 실패: '+loadErr,'err'); STD_LIST=[]; }

  const M={total:STD_LIST.length,
           nostd:STD_LIST.filter(s=>!(Number(s.std_hours)>0)).length,
           noplan:STD_LIST.filter(s=>!(Number(s.plan_hours)>0)).length,
           off:STD_LIST.filter(s=>s.active===false).length};

  const rows=STD_LIST.slice()
    .sort((a,b)=>String(a.line||'').localeCompare(String(b.line||''),'ko'))
    .map(s=>{
      const i=STD_LIST.indexOf(s);
      const off=s.active===false;
      const st=Number(s.std_hours)||0, pl=Number(s.plan_hours)||0;
      let ratio='<span style="color:var(--mut)">–</span>';
      if(st>0&&pl>0){
        const r=pl/st*100;
        const clr=r>100?'#b42318':(r>=90?'var(--grn)':'#d97706');
        ratio=`<b style="color:${clr}">${r.toFixed(1)}%</b>`;
      }
      return `<tr id="stdrow_${i}" class="std2-row ${off?'off':''}">
        <td class="l"><b>${s.line}</b>${off?'<span class="std2-offb">비활성</span>':''}</td>
        <td><span class="std2-in">
          <input type="number" step="0.1" id="std_${i}" value="${st>0?st:''}" placeholder="0" ${off?'disabled':''}
            oninput="stdRecalc(${i})" onkeydown="if(event.key==='Enter'){event.preventDefault();stdSaveAll();}">
          <span class="u">hr</span>
          ${!(st>0)&&!off?'<span class="std2-dot" title="기준시간 미입력 — 편성률 계산 불가">!</span>':''}
        </span></td>
        <td><span class="std2-in">
          <input type="number" step="0.1" id="plan_${i}" value="${pl>0?pl:''}" placeholder="0" ${off?'disabled':''}
            oninput="stdRecalc(${i})" onkeydown="if(event.key==='Enter'){event.preventDefault();stdSaveAll();}">
          <span class="u">hr</span>
        </span></td>
        <td class="mono" id="stdratio_${i}">${ratio}</td>
        <td><span class="cap-badge ${off?'off':'on'}">${off?'비활성':'활성'}</span></td>
        <td style="white-space:nowrap">
          <button class="rowbtn edit" ${off?'disabled':''} onclick="saveStd(${i})" title="이 공정만 저장">저장</button>
          <button class="rowbtn ${off?'act':'del'}" onclick="toggleStd(${i})">${off?'↻ 활성화':'비활성'}</button>
        </td></tr>`;
    }).join('');

  const teamChips=STD_TEAMS.map(t=>{
    const on=STD_TEAM===t, clr=STD_TEAMCLR[t]||'#6b7688';
    return `<button class="std2-chip ${on?'on':''}" style="${on?`background:${clr};border-color:${clr};color:#fff`:''}" onclick="stdSetTeam('${t}')">${t}</button>`;
  }).join('');

  const kpi=(lb,vl,clr,sb)=>`<div class="std2-kpi"><div class="k-lb">${lb}</div><div class="k-vl" style="color:${clr}">${vl}</div><div class="k-sb">${sb}</div></div>`;

  const emptyMsg = loadErr
    ? `<div style="padding:26px;border:1.5px solid #fda29b;background:#fef3f2;border-radius:12px;color:#912018;font-size:13px;line-height:1.7">
         <b>조회 실패</b> — ${loadErr}<br>
         get_std_time 함수가 <code>p_team</code> 인자를 받지 않거나 반환 타입이 바뀐 경우입니다. 관리자에게 함수 정의 확인을 요청하세요.
       </div>`
    : `<div style="padding:26px;border:1.5px dashed var(--line);border-radius:12px;color:var(--sub);font-size:13px;line-height:1.75;background:#fafbfd">
         <b>${STD_TEAM}</b>에 등록된 공정이 없습니다.<br>
         · 공정 목록은 <b>설정 → CAPA 관리</b>의 라인에서 만들어집니다. 해당 팀 라인이 CAPA 관리에 있는지 먼저 확인하세요.<br>
         · CAPA 관리에는 있는데 여기가 비어 있으면 <code>get_std_time</code>이 팀 조건을 적용하지 못하는 경우입니다.
       </div>`;

/* --- CAPA 관리 탭 (호기별 + 활성/비활성) --- */
let CAPA_LIST=[];
/* ════════════════════════════════════════════════════════════════════
   CAPA 관리 (재설계) — 팀 > 라인 > 호기 3단 구조를 시각적으로 분리
   · 서버 호출 1회(get_capa_list) 후 필터·검색은 전부 클라이언트 처리 → 0ms
   · 변경분 일괄 저장(capaSaveAll) : 여러 호기 입력 후 버튼 한 번
   · 미지정 호기 = 반제품(6xxx) 공정 : MES가 호기를 부여하지 않음 (정상)
   ════════════════════════════════════════════════════════════════════ */
let CAPA_UI={team:'ALL', q:'', filter:'all', fold:new Set()};
const CAPA_TEAMCLR={'생산1팀':'#2670c9','생산2팀':'#1a9d5c','공통':'#9b6dc9'};
const capaEsc=s=>String(s==null?'':s).replace(/'/g,"\\'");
const capaIsOff=c=>(c.line_active===false)||c.active===false;
const capaNoCapa=c=>!(Number(c.capa_hourly)>0);
const capaNoHoki=c=>!String(c.hoki||'').trim();

async function renderCapaMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:320px;border-radius:14px"></div>';
  try{ const {data}=await sb.rpc('get_capa_list',{p_team:null}); CAPA_LIST=data||[]; }
  catch(e){ toast('CAPA 조회 실패: '+(e.message||e),'err'); CAPA_LIST=[]; }
  CAPA_LIST.forEach((c,i)=>{ c._i=i; });          // 고정 인덱스 (saveCapa/toggleHoki 호환)
  CAPA_UI.fold=new Set();
  capaRenderBody();
}

/* 필터·검색·접기 — 서버 재조회 없이 즉시 재렌더 */
function capaSetTeam(t){ CAPA_UI.team=t; capaRenderBody(); }
function capaSetFilter(f){ CAPA_UI.filter=(CAPA_UI.filter===f?'all':f); capaRenderBody(); }
function capaSearch(v){ CAPA_UI.q=String(v||'').trim(); capaRenderBody(); }
function capaFoldTeam(t){ if(CAPA_UI.fold.has(t))CAPA_UI.fold.delete(t); else CAPA_UI.fold.add(t); capaRenderBody(); }
function capaFoldAll(open){
  const teams=[...new Set(CAPA_LIST.map(c=>c.team))];
  CAPA_UI.fold = open ? new Set() : new Set(teams);
  capaRenderBody();
}

/* 입력 변경 감지 → 미저장 건수 표시 */
function capaMarkDirty(el){
  const i=Number(el.dataset.idx); const c=CAPA_LIST[i]; if(!c)return;
  const hv=Number(($('#capa_'+i)||{}).value)||0;
  const dv=Number(($('#days_'+i)||{}).value)||0;
  const dirty=(hv!==(Number(c.capa_hourly)||0))||(dv!==(Number(c.work_days_month)||22));
  const row=document.getElementById('caprow_'+i);
  if(row) row.classList.toggle('dirty',dirty);
  capaUpdateDirtyBar();
}
function capaDirtyList(){
  const out=[];
  CAPA_LIST.forEach((c,i)=>{
    const he=$('#capa_'+i), de=$('#days_'+i);
    if(!he||!de)return;                                    // 필터로 화면에 없으면 제외
    const hv=Number(he.value)||0, dv=Number(de.value)||0;
    if(hv!==(Number(c.capa_hourly)||0)||dv!==(Number(c.work_days_month)||22)) out.push({i,hv,dv,c});
  });
  return out;
}
function capaUpdateDirtyBar(){
  const n=capaDirtyList().length;
  const bar=$('#capaDirtyBar'); if(!bar)return;
  bar.style.display=n?'flex':'none';
  const cnt=$('#capaDirtyCnt'); if(cnt) cnt.textContent=n;
}

/* 변경분 일괄 저장 */
async function capaSaveAll(){
  const jobs=capaDirtyList();
  if(!jobs.length){ toast('변경된 값이 없습니다','err'); return; }
  const btn=$('#capaSaveAllBtn'); if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  let ok=0; const fail=[];
  for(const j of jobs){
    try{
      const {error}=await sb.rpc('set_capa',{p_team:j.c.team,p_line:j.c.line,p_hoki:j.c.hoki||'',
        p_hourly:j.hv,p_days:j.dv,p_active:j.c.active!==false});
      if(error)throw error;
      j.c.capa_hourly=j.hv; j.c.work_days_month=j.dv; ok++;
    }catch(e){ fail.push(`${j.c.line}${j.c.hoki?' '+j.c.hoki+'호기':''}`); }
  }
  if(btn){ btn.disabled=false; btn.textContent='변경분 일괄 저장'; }
  if(fail.length) toast(`${ok}건 저장 · 실패 ${fail.length}건 (${fail.slice(0,3).join(', ')})`,'err');
  else toast(`${ok}건 일괄 저장완료`,'ok');
  capaRenderBody();
}

/* ── 본체 렌더 ── */
function capaRenderBody(){
  const L=CAPA_LIST||[];
  const teams=[...new Set(L.map(c=>c.team))].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
  // 스코어카드 지표 (전체 기준)
  const M={total:L.length, nocapa:L.filter(capaNoCapa).length, nohoki:L.filter(capaNoHoki).length,
           off:L.filter(capaIsOff).length,
           lines:new Set(L.map(c=>c.team+'||'+c.line)).size, teams:teams.length};

  // 필터 적용
  const q=CAPA_UI.q.toLowerCase();
  const view=L.filter(c=>{
    if(CAPA_UI.team!=='ALL' && c.team!==CAPA_UI.team) return false;
    if(q && !String(c.line||'').toLowerCase().includes(q)) return false;
    if(CAPA_UI.filter==='nocapa' && !capaNoCapa(c)) return false;
    if(CAPA_UI.filter==='nohoki' && !capaNoHoki(c)) return false;
    if(CAPA_UI.filter==='off'    && !capaIsOff(c))  return false;
    return true;
  });

  const card=(key,label,val,clr,sub)=>{
    const on=CAPA_UI.filter===key;
    const clickable=['nocapa','nohoki','off'].includes(key);
    return `<div class="cap2-kpi ${on?'on':''} ${clickable?'clk':''}" ${clickable?`onclick="capaSetFilter('${key}')"`:''} title="${clickable?'클릭하면 이 항목만 필터링':''}">
      <div class="k-lb">${label}</div>
      <div class="k-vl" style="color:${clr}">${val}</div>
      <div class="k-sb">${sub||''}</div>
    </div>`;
  };

  // 팀 > 라인 그룹화
  const groups={};

async function saveCapa(i){
  const c=CAPA_LIST[i]; if(!c)return;
  const hourly=Number($('#capa_'+i).value)||0;
  const days=Number($('#days_'+i).value)||22;
  try{
    const {error}=await sb.rpc('set_capa',{p_team:c.team,p_line:c.line,p_hoki:c.hoki||'',
      p_hourly:hourly,p_days:days,p_active:c.active!==false});
    if(error)throw error;
    c.capa_hourly=hourly; c.work_days_month=days;
    const row=document.getElementById('caprow_'+i); if(row) row.classList.remove('dirty');
    if(typeof capaUpdateDirtyBar==='function') capaUpdateDirtyBar();
    toast(`${c.line}${c.hoki?' '+c.hoki+'호기':''} 저장완료`,'ok');
    // 버튼에 잠깐 체크 표시 → 저장됐음을 눈으로 확인
    const btns=document.querySelectorAll(`button[onclick="saveCapa(${i})"]`);
    btns.forEach(b=>{ const o=b.textContent; b.textContent='✓ 저장됨';
      b.style.background='var(--grn)'; b.style.color='#fff'; b.style.borderColor='var(--grn)';
      setTimeout(()=>{ b.textContent=o; b.style.background=''; b.style.color=''; b.style.borderColor=''; },1400); });
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function toggleHoki(i){

  const label=`${c.line}${c.hoki?' '+c.hoki+'호기':''}`;

/* --- 결재 알림 문구 관리 탭 (HTML 없이 색/볼드 선택) --- */
const MAILMSG_COLORS=[
  {k:'',   label:'기본',  hex:'#1f2937'},
  {k:'red',label:'빨강',  hex:'#c0392b'},
  {k:'blue',label:'파랑', hex:'#2563eb'},
  {k:'green',label:'초록',hex:'#1e874b'},
  {k:'orange',label:'주황',hex:'#c2410c'},
];
let MAILMSG_LINES=[]; // [{text, bold, color}]

// HTML → 줄 배열 파싱 (기존 저장값 불러오기). 단순 규칙만 인식
function mailmsgParse(html){
  if(!html) return [{text:'{name}님, 결재를 기다리는 문서가 있습니다.', bold:false, color:''}];
  // <br> 로 줄 분리
  const parts=String(html).split(/<br\s*\/?>/i);
  const lines=parts.map(seg=>{
    let t=seg, bold=false, color='';
    // 색상 추출
    const cm=t.match(/color:\s*(#[0-9a-fA-F]{6})/);
    if(cm){ const found=MAILMSG_COLORS.find(c=>c.hex.toLowerCase()===cm[1].toLowerCase()); if(found)color=found.k; }
    // 볼드 추출 (<b> 또는 font-weight:800/700/bold)
    if(/<b>|font-weight:\s*(?:bold|[6-9]00)/i.test(t)) bold=true;
    // 태그 제거 → 순수 텍스트
    t=t.replace(/<[^>]+>/g,'').trim();
    return {text:t, bold, color};
  }).filter(l=>l.text!=='');
  return lines.length?lines:[{text:'{name}님, 결재를 기다리는 문서가 있습니다.', bold:false, color:''}];
}
// 줄 배열 → HTML 생성 (저장/발송용)
function mailmsgToHtml(lines){
  return lines.filter(l=>(l.text||'').trim()!=='').map(l=>{
    const col=MAILMSG_COLORS.find(c=>c.k===l.color);
    let styles=[];
    if(col&&col.k) styles.push('color:'+col.hex);
    if(l.bold) styles.push('font-weight:800');
    const inner=(l.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return styles.length?`<span style="${styles.join(';')}">${inner}</span>`:inner;
  }).join('<br>');
}
async function renderMailMsgMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:280px;border-radius:14px"></div>';
  let html='';
  try{ const {data}=await sb.rpc('get_config',{p_key:'approval_mail_msg'}); html=data||''; }
  catch(e){ html=''; }
  MAILMSG_LINES=mailmsgParse(html);
  mailmsgRender();
}
function mailmsgRender(){
  const rows=MAILMSG_LINES.map((l,i)=>{
    const colOpts=MAILMSG_COLORS.map(c=>`<option value="${c.k}" ${l.color===c.k?'selected':''}>${c.label}</option>`).join('');
    return `<div class="mm-row" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <input class="mm-text" data-i="${i}" value="${(l.text||'').replace(/"/g,'&quot;')}"

/* ===== 단가 마스터 등록 ===== */
function parseCostPaste(txt){
  const rows=[];
  (txt||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t');
    const code=(c[0]||'').trim();
    if(!code)return;
    // 단가는 마지막 숫자 컬럼 (품목명/단위가 없을 수도 있어 유연 처리)
    let name=(c[1]||'').trim(), unit=(c[2]||'').trim(), priceRaw=(c[3]||'').trim();
    // 4열이 안 되면: 품번+단가만 있는 경우 (2열)
    if(c.length===2){ name=''; unit=''; priceRaw=(c[1]||'').trim(); }
    else if(c.length===3){ // 품번+품목명+단가 (단위 생략)
      const maybe=(c[2]||'').trim();
      if(/^[\d,.\-]+$/.test(maybe)){ priceRaw=maybe; unit=''; }
    }
    const price=Number(priceRaw.replace(/,/g,''));
    rows.push({item_code:code, item_name:name, unit:unit, unit_price:isNaN(price)?0:price});
  });
  return rows;
}
async function checkCostUpload(){
  const res=$('#costResult');
  const rows=parseCostPaste($('#costPaste').value);
  if(!rows.length){ res.className='upload-result err'; res.style.display='block';
    res.textContent='붙여넣은 데이터가 없습니다. (품번·품목명·단위·단가)'; return; }
  const withPrice=rows.filter(r=>r.unit_price>0).length;
  const noPrice=rows.length-withPrice;
  const sample=rows.slice(0,3).map(r=>`· ${r.item_code} ${r.item_name||''} → ${r.unit_price.toLocaleString()}원`).join('\n');

/* 붙여넣기 파싱: 탭 구분 15컬럼 (작업일자 포함) → JSON 배열 */
/* 업로드 파싱 중 발견된 공정(proc_sub1/proc_sub2) 이상 행 기록 — checkUpload에서 표시 */
let LAST_PARSE_ISSUES={fixed:[],blank:[]};
function parsePaste(text){
  LAST_PARSE_ISSUES={fixed:[],blank:[]};
  const num=v=>{const n=Number(String(v).replace(/,/g,'').trim());return isNaN(n)?0:n;};
  const cleanTeam=t=>String(t).trim().replace(/생산\s+/,'생산').replace(/\s/g,'');
  const normDate=d=>{
    d=String(d).trim();
    // 2026.1.3 / 2026/1/3 → 2026-01-03
    const m=d.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    return d;
  };
  const out=[];
  text.trim().split('\n').forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t');
    // ── 양식 자동 판별 ──────────────────────────────────────────────
    //  신양식(14열) : 작업일자 · 생산계획번호 · 팀구분 · 공정명 · 제품코드 · 제품명 · 호기
    //                · 원료코드 · 원료명 · 원료타입 · 계획량 · 원료사용량 · 편차 · 원료단위
    //  구양식(15열) : … proc_sub1 · proc_sub2 가 마지막에 별도 컬럼으로 존재
    //  두 번째 칸이 숫자로만 된 10자리 이상이면 생산계획번호로 보고 신양식으로 처리
    // 신양식(14열) : 작업일자 · 팀구분 · 공정명 · 생산계획번호 · 제품코드 · 제품명 · 호기
    //               · 원료코드 · 원료명 · 원료타입 · 계획량 · 원료사용량 · 편차 · 원료단위
    //  → 4번째 칸(D)이 9자리 이상 숫자면 생산계획번호로 판정
    const isNew = /^\d{9,}$/.test(String(c[3]||'').trim());
    let r;
    if(isNew){
      if(c.length<14)return;
      r={
        work_date:normDate(c[0]), team:cleanTeam(c[1]), process:c[2].trim(),
        plan_no:String(c[3]||'').trim(), prod_code:c[4].trim(), prod_name:c[5].trim(), hoki:c[6].trim(),
        mat_code:c[7].trim(), mat_name:c[8].trim(), mat_type:c[9].trim(),
        plan_qty:num(c[10]), actual_qty:num(c[11]), diff:num(c[12]), mat_unit:(c[13]||'').trim(),
        proc_sub1:'', proc_sub2:''      // 공정명에서 아래 정규화 블록이 채움
      };
    }else{
      if(c.length<15)return;
      r={
        work_date:normDate(c[0]), plan_no:'', team:cleanTeam(c[1]), process:c[2].trim(),
        prod_code:c[3].trim(), prod_name:c[4].trim(), hoki:c[5].trim(),
        mat_code:c[6].trim(), mat_name:c[7].trim(), mat_type:c[8].trim(),
        plan_qty:num(c[9]), actual_qty:num(c[10]), diff:num(c[11]), mat_unit:c[12].trim(),
        proc_sub1:c[13].trim(), proc_sub2:c[14].trim()
      };
    }
    // ── 공정 정규화 : MES가 proc_sub1을 비운 채 내보내는 행 자동 보정 ──
    // 예: 공정="주식_포장 공정", proc_sub1="", proc_sub2="주식"  →  proc_sub1="주식", proc_sub2="포장"
    // "/주식" 같은 쓰레기 라인이 m_capa·대시보드에 등록되는 것을 업로드 시점에 차단
    if(!r.proc_sub1 || !r.proc_sub2){
      const before=`${r.proc_sub1}/${r.proc_sub2}`;
      const parts=(r.process||'').split('_').map(x=>x.trim()).filter(Boolean);
      if(parts.length>=2){
        const s1=parts[0];
        const s2=parts.slice(1).join('_').replace(/\s*공정\s*$/,'').trim();
        if(s1&&s2){
          r.proc_sub1=s1; r.proc_sub2=s2;
          LAST_PARSE_ISSUES.fixed.push(`${r.work_date} ${r.team} ${r.prod_code} · 공정"${r.process}" : ${before} → ${s1}/${s2}`);
        }
      }
      if(!r.proc_sub1 || !r.proc_sub2){
        LAST_PARSE_ISSUES.blank.push(`${r.work_date} ${r.team} ${r.prod_code} ${r.prod_name} · 공정"${r.process}" : ${r.proc_sub1}/${r.proc_sub2}`);
      }
    }
    out.push(r);
  });
  return out;
}

/* ================= 하림산업식 통합 마감화면 (일자 클릭) ================= */
const pct = n => (n==null||isNaN(n))?'–':(n*100).toFixed(1)+'%';
let CUR_DAY={date:null,team:null,lines:[],orders:[],losses:[],defects:[],downtime:[],manpower:[],pareto:[]};
// 관리자가 임시로 잠금 해제한 (일자+팀) 집합 (세션 한정)
const ADMIN_UNLOCKED=new Set();
// 마감기한: 해당 날짜가 속한 달의 "다음달 10일". 오늘이 그 기한을 지났으면 true
function isDeadlinePassed(dateStr){
  if(!dateStr) return false;
  const [y,m]=dateStr.split('-').map(Number);          // 데이터 월
  // 마감기한 = (그 다음달) 10일 23:59:59
  const deadline=new Date(y, m, 10, 23, 59, 59);        // m은 0-based로 다음달 → 자동 처리
  // 오늘(KST) 기준
  const t=kstToday();                                    // 'YYYY-MM-DD'
  const [ty,tm,td]=t.split('-').map(Number);
  const today=new Date(ty, tm-1, td, 12, 0, 0);
  return today > deadline;
}
// 이 (일자+팀)이 기한마감으로 잠겼는지 (관리자 임시해제면 풀림)
function isDeadlineLocked(dateStr, team){
  if(!isDeadlinePassed(dateStr)) return false;
  if(ADMIN_UNLOCKED.has(dateStr+'|'+team)) return false; // 관리자가 열어둠
  return true;
}

        options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:111}},

      ${d.memo?`<div style="font-size:12px;color:var(--sub);margin-top:2px">${d.memo}</div>`:''}</div></div>`).join(''):'<div style="color:var(--mut);padding:16px;text-align:center;font-size:13px">최근 비계획정지 없음</div>';
  }catch(e){ toast('상세 조회 실패: '+(e.message||e),'err'); }
}
async function openDay(date, team){
  CUR_DAY={date,team,lines:[],orders:[],losses:[],defects:[],downtime:[],manpower:[],pareto:[]};
  S.view='day';
  $('#wrap').innerHTML='<div class="skel" style="height:100px;border-radius:14px"></div><div class="skel" style="height:400px;margin-top:14px;border-radius:14px"></div>';
  try{
    const [lineRes,orderRes,lossRes,clRes,parRes,ltRes,dtRes,ldRes,capaRes,sugRes,bomRes,packRes,dyRes,logRes]=await Promise.all([
      sb.rpc('get_line_summary',{p_date:date,p_team:team}),
      sb.rpc('get_order_detail',{p_date:date,p_team:team}),
      sb.rpc('get_loss_detail',{p_date:date,p_team:team}),
      sb.rpc('get_closing_data',{p_date:date,p_team:team}),
      sb.rpc('get_downtime_pareto',{p_date:date,p_team:team}),
      sb.rpc('get_loss_types',{p_team:team}),
      sb.rpc('get_defect_types',{p_team:team}),
      sb.rpc('get_line_downtime',{p_date:date,p_team:team}),
      sb.rpc('get_capa_list',{p_team:team}),
      sb.rpc('suggest_plan',{p_date:date,p_team:team}),
      sb.rpc('get_bom_plan',{p_date:date,p_team:team}),    // BOM 계획(병렬 → 지연 없음)
      sb.rpc('get_pack_summary',{p_date:date,p_team:team}), // 계획번호별 포장 묶음
      sb.rpc('get_design_yield'),                           // 설계수율 마스터
      sb.from('t_approval_log').select('action,actor,actor_role,memo,created_at')
        .eq('work_date',date).eq('team',team).order('created_at')
    ]);
    if(lineRes.error)throw lineRes.error;
    CUR_DAY.lines=lineRes.data||[];
    CUR_DAY.orders=orderRes.data||[];
    // ③ 로스관리는 원료·부자재만 대상. 반제품(6번대)은 ② 오더별 생산실적에서 관리
    CUR_DAY.losses=(lossRes.data||[]).filter(l=>String(l.mat_code||'').charAt(0)!=='6');
    CUR_DAY.lossSemiCnt=(lossRes.data||[]).length-CUR_DAY.losses.length;
    // 공정 흐름 기준 제안계획 (진공코터 계획 = EP 실적 / 완제품 제안 = 코터 실적)
    // 결재 의견 : 단계별 최신 메모 (카드 아래 표시용)
    CUR_DAY.apprMemo={};
    // 조회 실패를 조용히 삼키면 기능이 죽은 줄도 모른다 → 콘솔에 남긴다
    if(logRes&&logRes.error) console.warn('[결재의견] t_approval_log 조회 실패:', logRes.error);
    ((logRes&&!logRes.error&&logRes.data)||[]).forEach(r=>{
      if(!r.memo||!String(r.memo).trim())return;
      const k={submit:'draft',lead_ok:'lead_ok',div_ok:'div_ok',done:'done',reject:'reject'}[r.action];
      if(k) CUR_DAY.apprMemo[k]={memo:r.memo, actor:r.actor, at:r.created_at, action:r.action};
    });
    // 설계수율(기준 건조수율) : 품번 → %
    CUR_DAY.dtTypes={};
    loadDtTypes().then(()=>{ try{ refreshDtSelects(); }catch(_){} });   // 비가동 사유유형 마스터
    CUR_DAY.dy={};
    ((dyRes&&!dyRes.error&&dyRes.data)||[]).forEach(r=>{ if(r.design_yield!=null) CUR_DAY.dy[r.item_code]=Number(r.design_yield); });
    // 계획번호별 포장 묶음 (코터/오븐 산출 = 계획, SKU 실적 합 = 실적)
    CUR_DAY.pack=(packRes&&!packRes.error&&packRes.data)?packRes.data:[];
    // BOM 계획 : (오더|자재) → 계획량. ③ 로스관리 BOM 모드에서 사용
    CUR_DAY.bom={};
    ((bomRes&&!bomRes.error&&bomRes.data)||[]).forEach(r=>{
      CUR_DAY.bom[r.prod_code+'|'+r.mat_code]=r;
    });
    CUR_DAY.suggest={};
    ((sugRes&&!sugRes.error&&sugRes.data)||[]).forEach(r=>{
      CUR_DAY.suggest[r.prod_code+'|'+(r.proc_sub1||'')+'/'+(r.proc_sub2||'')]=r;
      if(!CUR_DAY.suggest[r.prod_code]) CUR_DAY.suggest[r.prod_code]=r;   // 코드만으로도 조회
    });
    await loadDevMin();          // 편차율 하한(해당 일자·팀 고정값) 로드
    const cl=clRes.data||{};
    CUR_DAY.defects=cl.defects||[];
    CUR_DAY.downtime=cl.downtime||[];
    CUR_DAY.manpower=cl.manpower||[];
    CUR_DAY.pareto=parRes.data||[];
    CUR_DAY.lossTypes=ltRes.data||[];
    CUR_DAY.defectTypes=dtRes.data||[];
    CUR_DAY.lineDown=ldRes.data||[];
    // ── 라인 활성 여부: 해당 라인의 호기가 전부 비활성이면 ② 공정 탭에서 숨김 ──
    (function(){
      const agg={};
      ((capaRes&&capaRes.data)||[]).forEach(c=>{
        const k=String(c.line||'');
        if(!k)return;
        const a=(agg[k]=agg[k]||{n:0,off:0});
        a.n++; if(c.line_active===false||c.active===false) a.off++;
      });
      const off=new Set();
      Object.keys(agg).forEach(k=>{ if(agg[k].n>0 && agg[k].off===agg[k].n) off.add(k); });
      CUR_DAY.lineOff=off;
    })();
    CUR_DAY.savedScraps=cl.scraps||[];
    CUR_DAY.closing=cl.closing||null;
    // 결재라인(예정 결재자) 조회 — 아직 결재 전 단계에도 담당자 이름 표시용
    try{
      const {data:al}=await sb.rpc('get_approval_line',{p_team:team});
      const map={}; (al||[]).forEach(r=>{ map[r.step]=r.approver_name; });
      CUR_DAY.apprLine=map;
    }catch(e){ CUR_DAY.apprLine={}; }

    // ── 생산2팀: 별도 로직용 추가 데이터 로드 ──
    // stdTime(기준시간)·mhMap(투입공수)는 양 팀 모두 로드 (①·② 생산성 표시용)
    try{
      const [stRes,mhRes]=await Promise.all([
        sb.rpc('get_std_time',{p_team:team}),
        sb.from('t_cl_mh').select('*').eq('work_date',date).eq('team',team)
      ]);
      CUR_DAY.stdTime=stRes.data||[];
      const mhMap={}; (mhRes.data||[]).forEach(m=>{mhMap[m.prod_code]={mh:m.mh,note:m.note};});
      CUR_DAY.mhMap=mhMap;
    }catch(e){ CUR_DAY.stdTime=[]; CUR_DAY.mhMap={}; }
  }catch(e){ toast('조회 실패: '+(e.message||e),'err'); return; }

  // 팀별 분기: 생산2팀은 전용 렌더
  if(CUR_DAY.team==='생산2팀') renderClosing2();
  else renderClosing();
  // 캘린더 복귀 대비 : 이 달의 서버 캐시를 유휴시간에 미리 확인/구축
  (function(){ const idle=window.requestIdleCallback||(f=>setTimeout(f,800));
    idle(()=>{ const ym=String(date).slice(0,7); if(!CAL_CACHE.has(ym)) calFetch(ym,false).catch(()=>{}); }); })();
  // 렌더 직후 편차율 필터 재적용 (고정값이 있으면 즉시 숨김)
  setTimeout(()=>{ if(typeof applyDevFilter==='function') applyDevFilter(DEV_MIN, DEV_MIN>0);
                   if(typeof filterRunList==='function') filterRunList(); },0);
}

/* ═══════════════════════════════════════════════════════════
   생산2팀 전용 렌더 (B안: 별도 로직)
   ① 완제품 라인별 가동 요약 — 계획/실적 가동시간·생산량·생산성 자동계산
   ═══════════════════════════════════════════════════════════ */
let T2_KIND='fin'; // (구) 호환용 — 미사용
let T2_SUM='fin';  // ① 라인별 요약: fin | semi | all
let T2_ORD='fin';  // ② 오더별 실적: fin | semi
function renderClosing2(){
  const {lines,orders,stdTime,mhMap,downtime}=CUR_DAY;
  const c=CUR_DAY.closing||{};
  // 잠금 판정 (결재완료 또는 월+10일 기한마감, 관리자 예외) — 1팀과 동일
  const cst2=c.status||'none';
  const isAdmin2=S.user.role==='admin';
  const dlLocked2=isDeadlineLocked(CUR_DAY.date, CUR_DAY.team);
  CUR_DAY.locked = dlLocked2 || (cst2==='done' && !isAdmin2);
  CUR_DAY._dlLocked=dlLocked2;

  // 공정별 기준시간 맵 (설정값)
  const stdMap={}; (stdTime||[]).forEach(s=>{ stdMap[s.line]={std:Number(s.std_hours||0)}; });

  // 완제품/반제품 분류: get_order_detail의 kind 우선(1팀과 동일 기준), 없으면 prod_code 앞자리
  const isFin=(o)=>{
    if(o&&typeof o==='object'){ if(o.kind==='fin'||o.kind==='완제품')return true;
      if(o.kind==='semi'||o.kind==='반제품')return false;
      return ['2','3'].includes(String(o.prod_code||'')[0]); }
    return ['2','3'].includes(String(o||'')[0]);
  };
  const isSemi=(o)=>{
    if(o&&typeof o==='object'){ if(o.kind==='semi'||o.kind==='반제품')return true;
      if(o.kind==='fin'||o.kind==='완제품')return false;
      return String(o.prod_code||'')[0]==='6'; }
    return String(o||'')[0]==='6';
  };

  // 라인별 가동시간: 계획=run 합, 실적=run - (계획정지+비계획정지)
  const runByLine={}, planStopByLine={}, unplanStopByLine={};
  (downtime||[]).forEach(t=>{
    const k=(t.proc_sub1||'')+'/'+(t.proc_sub2||'');
    const dur=diffMin(t.start_time,t.end_time);
    if(t.category==='run') runByLine[k]=(runByLine[k]||0)+dur;
    else if(t.category==='plan') planStopByLine[k]=(planStopByLine[k]||0)+dur;
    else if(t.category==='unplan'||t.category==='sudden') unplanStopByLine[k]=(unplanStopByLine[k]||0)+dur;
  });

  const kindFilter=(o)=>T2_SUM==='all'?(isFin(o)||isSemi(o)):(T2_SUM==='fin'?isFin(o):isSemi(o));
  const qtyByLine={};  // {line:{plan,actual,mh}}
  (orders||[]).forEach(o=>{
    if(!kindFilter(o))return;
    const k=(o.proc_sub1||'')+'/'+(o.proc_sub2||'');
    const q=qtyByLine[k]||(qtyByLine[k]={plan:0,actual:0,mh:0});
    q.plan+=Number(o.plan_sum??o.plan_qty??0); q.actual+=Number(o.actual_sum??o.actual_qty??0);
    const mh=mhMap[o.prod_code]; if(mh)q.mh+=Number(mh.mh||0);
  });

  const lineNames=[...new Set([...lines.map(l=>l.line_name), ...Object.keys(qtyByLine)])].sort();
  const finCnt=orders.filter(o=>isFin(o)).length;
  const semiCnt=orders.filter(o=>isSemi(o)).length;

  // ── 스코어카드 집계 : 완제품 기준(반제품은 공정마다 재집계되어 중복) ──
  let scPlan=0, scActual=0, scSemiPlan=0, scSemiActual=0;
  (orders||[]).forEach(o=>{
    const p=Number(o.plan_sum??o.plan_qty??0), a=Number(o.actual_sum??o.actual_qty??0);
    if(isFin(o)){ scPlan+=p; scActual+=a; }
    else if(isSemi(o)){ scSemiPlan+=p; scSemiActual+=a; }
  });
  // 당일 계획·실적 기준 확정 (1팀=코터·오븐 산출 / 2팀=MES)
  const SC=dayPlanActual(scPlan, scActual);
  const scAch=SC.plan>0?SC.actual/SC.plan:0;
  // 종합수율 = 완제품 산출 ÷ 원자재 투입 (원자재 = 반제품 오더의 자재 투입 실적)
  const scLoss=(CUR_DAY.losses||[]).reduce((a,l)=>a+Math.round((l.diff||0)*(l.unit_price||0)),0);
  const scScrap=(CUR_DAY.losses||[]).length;

  let T={std:0,planH:0,actH:0,planQ:0,actQ:0,mh:0};
  const rows=lineNames.map((name,i)=>{
    const st=stdMap[name]||{std:0};
    const planH=(runByLine[name]||0)/60;          // 계획 가동시간 = run 합(작업시간)
    const stopH=((planStopByLine[name]||0)+(unplanStopByLine[name]||0))/60;
    const actH=Math.max(planH-stopH,0);           // 실적 가동시간 = 계획 - 정지
    const q=qtyByLine[name]||{plan:0,actual:0,mh:0};
    const planEff=st.std>0?(planH/st.std*100):0;  // 편성률 = 계획 ÷ 기준
    const rate=planH>0?(actH/planH*100):0;        // 가동률 = 실적 ÷ 계획
    const achieve=q.plan>0?(q.actual/q.plan*100):0;
    const hrProd=actH>0?(q.actual/actH):0;        // 시간당 생산성 = 실적량 ÷ 실적시간
    const mhProd=q.mh>0?(q.actual/q.mh):0;        // 인시당 생산성 = 실적량 ÷ MH
    T.std+=st.std; T.planH+=planH; T.actH+=actH; T.planQ+=q.plan; T.actQ+=q.actual; T.mh+=q.mh;
    return `<tr>
      <td class="l"><span class="t2-lno">L${i+1}</span> ${name}</td>
      <td class="mono">${st.std||'–'}</td>
      <td class="mono">${planH?planH.toFixed(1):'–'}</td>
      <td class="mono">${actH?actH.toFixed(1):'–'}</td>
      <td class="mono">${planEff?planEff.toFixed(1)+'%':'–'}</td>
      <td class="mono"><b style="color:${rate>=90?'var(--grn)':rate>0?'var(--org,#d97706)':'var(--mut)'}">${planH?rate.toFixed(1)+'%':'–'}</b></td>
      <td class="mono">${q.plan?fmt(q.plan):'–'}</td>
      <td class="mono">${q.actual?fmt(q.actual):'0'}</td>
      <td class="mono"><b style="color:${achieve>=90?'var(--grn)':achieve>0?'var(--org,#d97706)':'var(--red)'}">${q.plan?achieve.toFixed(1)+'%':'–'}</b></td>
      <td class="mono">${hrProd?fmt(Math.round(hrProd)):'–'}</td>
      <td class="mono">${mhProd?mhProd.toFixed(1):'–'}</td>
      <td class="mono">${q.mh?q.mh.toFixed(1):'–'}</td>
      <td></td>
    </tr>`;
  }).join('');

  $('#wrap').innerHTML=`
  ${renderApprovalBar()}
  <div id="apprHistBox"></div>
  ${renderClosingHeader2()}
  <div class="closing-body ${CUR_DAY.locked?'locked':''}">

  <!-- 스코어카드 (생산1팀과 동일) -->
  <div class="score-row">
    <div class="sc b"><div class="l">당일 실적 <span style="font-size:9px;color:#98a2b3;font-weight:700">완제품</span></div>${scTon(SC.actual)}
      <div class="sc-sub" title="${SC.basis==='pack'?'포장 SKU 실적 합계 (생산계획번호 묶음 '+SC.n+'건). 반제품은 공정마다 재집계되어 중복이 포함된 참고값입니다':'MES 완제품 실적. 반제품은 공정마다 재집계되어 중복이 포함된 참고값입니다'}">[반제품 ${(scSemiActual/1000).toFixed(1)}t]</div></div>
    <div class="sc"><div class="l">당일 계획 <span style="font-size:9px;color:#98a2b3;font-weight:700">완제품</span></div>${scTon(SC.plan)}
      <div class="sc-sub" title="${SC.basis==='pack'?'진공코터·오븐에서 나온 산출 수량이 당일 포장 계획입니다. ②오더별 화면과 동일 기준':'MES 완제품 계획. 건조공정이 없어 MES 계획을 그대로 사용합니다'}">${SC.basis==='pack'?'코터·오븐 산출':'MES 계획'} <span style="color:#b8c0cc">·</span> [반제품 ${(scSemiPlan/1000).toFixed(1)}t]</div></div>
    <div class="sc ${scAch>=.98?'g':'r'}"><div class="l">달성률</div><div class="v mono">${SC.plan>0?(scAch*100).toFixed(1)+'%':'–'}</div>
      <div class="sc-sub">${SC.basis==='pack'?'포장수율':'완제품 기준'}</div></div>
    ${(()=>{
      const cy=coaterYield();               // 건조 평균수율 = (코터+오븐) 산출 ÷ EP 실적
      const y=cy?cy.pct:null;
      // 기준 70~80% (원료 수분율에 따라 정상폭이 달라져 신호등만 표시)
      const col=(y==null)?'':(y>=70&&y<=80?'var(--grn)':(y>80?'#7fc99a':'#e8918c'));

          .map(ln=>`<option value="${ln}">${ln}</option>`).join('');
        const dtypeOpt=dtTypeOpts('unplan','');   // 구분 select 기본값(비계획정지) 기준
        // [E] 리스트
        const eRows=stopList.map(t=>{
          const cat=t.category==='plan'?'계획정지':t.category==='unplan'?'비계획정지':'돌발';

          <span id="stHokiBox" class="hoki-badge" title="MES 원본(생산계획 호기)에서 자동 표기됩니다. 값이 틀리면 MES 데이터를 바로잡아야 합니다">호기 –</span>
          <input type="hidden" id="stHoki" value="">
          <select id="stCat" onchange="refreshDtSelects();if($('#dtTypeMgr')&&$('#dtTypeMgr').style.display!=='none')renderDtMgr();"><option value="unplan">비계획정지</option><option value="plan">계획정지</option></select>
          <select id="stType"><option value="">유형 *</option>${dtypeOpt}</select>
          <button class="rowbtn" onclick="toggleDtMgr('stCat')" title="선택한 구분(계획/비계획)의 사유유형을 등록·수정합니다. 등록하면 바로 쓸 수 있습니다">⚙ 유형관리</button>

/* ⑥ 투입인원 — 1팀·2팀 공용. 2팀 레이아웃(라인 + 공통부문·예비인력 고정행) +
   1팀의 관리자 1/n 배분(실공수 컬럼)까지 병합. 오더 기준 라인 목록 사용 */
/* 전일(가장 최근 입력일) 인원을 현재 날짜 화면에 채움 — 저장 전까지 DB 무변경 */
async function loadPrevManpower(){
  const {date,team}=CUR_DAY;
  if(!date||!team){ toast('날짜/팀 정보 없음','err'); return; }
  try{
    const {data,error}=await sb.from('t_cl_manpower')
      .select('work_date,proc_sub1,proc_sub2,plan_head,regular_head,dispatch_head,memo')
      .eq('team',team).lt('work_date',date)
      .order('work_date',{ascending:false}).limit(200);
    if(error)throw error;
    if(!data||!data.length){ toast('이전 입력 이력이 없습니다','err'); return; }
    const src=data[0].work_date;                       // 가장 최근 입력일
    const prev=data.filter(r=>r.work_date===src);
    let filled=0, skipped=0;
    prev.forEach(r=>{
      const ln=(r.proc_sub1||'')+'/'+(r.proc_sub2||'');
      const set=(cls,val)=>{
        const el=document.querySelector(`.${cls}[data-line="${ln}"]`);
        if(!el) return false;
        if(String(el.value).trim()!=='') return false;  // 이미 입력된 칸은 덮어쓰지 않음
        if(val===null||val===undefined||val===0||val==='') return false;
        el.value=val; el.style.background='#eef7ee'; return true;
      };
      let any=false;
      any=set('mp-plan',r.plan_head)||any;
      any=set('mp-reg', r.regular_head)||any;
      any=set('mp-disp',r.dispatch_head)||any;
      set('mp-memo',r.memo);
      if(any) filled++; else skipped++;
    });
    if(typeof updateManpowerFooter==='function') updateManpowerFooter();
    if(!filled){ toast(`${src} 값과 채울 빈칸이 없습니다 (이미 입력됨)`,'err'); return; }
    toast(`${src} 인원 ${filled}개 라인 불러옴 — 확인 후 [인원 저장]`,'ok');
  }catch(e){ toast('불러오기 실패: '+(e.message||e),'err'); }
}
function buildManpower6(){
  const manpower=CUR_DAY.manpower||[];
  const orders=CUR_DAY.orders||[];
  const manByLine={}; manpower.forEach(m=>{ manByLine[(m.proc_sub1||'')+'/'+(m.proc_sub2||'')]=m; });
  const lineNames=[...new Set((orders||[]).map(o=>(o.proc_sub1||'')+'/'+(o.proc_sub2||'')))].sort();
  // 고정 행: 공통부문·예비인력(2팀) + 관리자1·2(1팀 1/n 배분 대상)
  const FIXED=[['공통','공통부문','공통'],['기타','예비인력','예비인력']];
  const MGR_KEYS=[['관리','관리자1'],['관리','관리자2']];
  // 관리자 총원 → 인원이 투입된 라인 수로 1/n 배분
  const mgrRows=MGR_KEYS.map(([s1,s2])=>manByLine[s1+'/'+s2]||{regular_head:0,dispatch_head:0,memo:''});
  const mgrTotal=mgrRows.reduce((a,m)=>a+Number(m.regular_head||0)+Number(m.dispatch_head||0),0);
  const linesWithMan=lineNames.filter(name=>{
    const m=manByLine[name]; if(!m)return false;
    return (Number(m.regular_head||0)+Number(m.dispatch_head||0))>0;
  });
  const share=linesWithMan.length>0?mgrTotal/linesWithMan.length:0;
  const shareOf=(name)=>linesWithMan.includes(name)?share:0;
  const fmtN=n=>n?n.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1'):'–';

  let tReg=0,tDisp=0,tPlan=0;
  const lineRows=lineNames.map((name,i)=>{
    const m=manByLine[name]||{plan_head:0,regular_head:0,dispatch_head:0,memo:''};
    const inp=(Number(m.regular_head||0)+Number(m.dispatch_head||0));
    const sh=shareOf(name); const eff=inp+sh;
    tPlan+=Number(m.plan_head||0); tReg+=Number(m.regular_head||0); tDisp+=Number(m.dispatch_head||0);
    return `<tr>
      <td class="l"><span class="t2-lno">L${i+1}</span> ${name}</td>
      <td><input class="inp-cell mp-plan" data-line="${name}" value="${m.plan_head||''}" placeholder="0" style="width:80px"></td>
      <td><input class="inp-cell mp-reg" data-line="${name}" value="${m.regular_head||''}" placeholder="0" style="width:80px"></td>
      <td><input class="inp-cell mp-disp" data-line="${name}" value="${m.dispatch_head||''}" placeholder="0" style="width:80px"></td>
      <td class="mono"><b>${inp||'–'}</b></td>
      <td class="mono"><b style="color:${sh?'var(--blue)':'inherit'}">${fmtN(eff)}</b></td>
      <td><input class="inp-cell mp-memo" data-line="${name}" value="${(m.memo||'').replace(/"/g,'&quot;')}" placeholder="비고" style="width:130px;text-align:left"></td>
    </tr>`;
  }).join('');
  const fixedRows=FIXED.map(([s1,s2,badge])=>{
    const ln=s1+'/'+s2;
    const m=manByLine[ln]||{plan_head:0,regular_head:0,dispatch_head:0,memo:badge==='예비인력'?'예비인력':''};
    const inp=(Number(m.regular_head||0)+Number(m.dispatch_head||0));
    tPlan+=Number(m.plan_head||0); tReg+=Number(m.regular_head||0); tDisp+=Number(m.dispatch_head||0);
    const badgeColor=s2==='예비인력'?'background:#fef3e0;color:#c2410c':'background:#eef2f9;color:#5b6675';
    return `<tr class="mp-fixed">
      <td class="l"><span class="t2-lno" style="${badgeColor}">${s1}</span> ${s2}</td>
      <td><input class="inp-cell mp-plan" data-line="${ln}" value="${m.plan_head||''}" placeholder="0" style="width:80px"></td>
      <td><input class="inp-cell mp-reg" data-line="${ln}" value="${m.regular_head||''}" placeholder="0" style="width:80px"></td>
      <td><input class="inp-cell mp-disp" data-line="${ln}" value="${m.dispatch_head||''}" placeholder="0" style="width:80px"></td>
      <td class="mono"><b>${inp||'–'}</b></td>
      <td class="mono" style="color:var(--mut);font-size:11px">–</td>
      <td><input class="inp-cell mp-memo" data-line="${ln}" value="${(m.memo||'').replace(/"/g,'&quot;')}" placeholder="비고" style="width:130px;text-align:left"></td>
    </tr>`;
  }).join('');
  // 관리자 1·2 행 (1/n 배분원): 실공수 열에 "1/n 배분" 표기
  const mgrFixedRows=MGR_KEYS.map(([s1,s2],i)=>{
    const ln=s1+'/'+s2; const m=mgrRows[i];
    const inp=(Number(m.regular_head||0)+Number(m.dispatch_head||0));
    tReg+=Number(m.regular_head||0); tDisp+=Number(m.dispatch_head||0);
    return `<tr class="mp-fixed">
      <td class="l"><span class="t2-lno" style="background:#ede9fe;color:#6d28d9">관리</span> ${s2} <span style="font-size:11px;color:var(--mut)">· 공정 공통</span></td>
      <td style="color:var(--mut);font-size:11px">–</td>
      <td><input class="inp-cell mp-reg" data-line="${ln}" value="${m.regular_head||''}" placeholder="0" style="width:80px"></td>
      <td><input class="inp-cell mp-disp" data-line="${ln}" value="${m.dispatch_head||''}" placeholder="0" style="width:80px"></td>
      <td class="mono"><b>${inp||'–'}</b></td>
      <td class="mono" style="color:var(--mut);font-size:11px">1/n 배분</td>
      <td><input class="inp-cell mp-memo" data-line="${ln}" value="${(m.memo||'').replace(/"/g,'&quot;')}" placeholder="반장·공정관리자 등" style="width:130px;text-align:left"></td>
    </tr>`;
  }).join('');

  return `<div class="sec sec2"><div class="sec-hd sec2-hd"><span class="no c6">6</span><h3>투입인원</h3>
    <span class="desc">수기 입력 · 관리자 1/n 배분 · 일별 누적관리</span><span class="sp"></span>
    <button class="tbtn" onclick="loadPrevManpower()" title="가장 최근에 인원을 입력한 날의 값을 불러옵니다. 저장 전까지는 화면에만 채워지며, 값을 고친 뒤 [인원 저장]을 누르세요." style="margin-right:6px">⤓ 전일 인원 불러오기</button>
    <button class="tbtn save" onclick="saveManpowerAll()">인원 저장</button></div>
    <div class="sec-bd" style="overflow-x:auto"><table class="t2-table">
      <thead><tr><th>라인</th><th>계획인원 (명)</th><th>정규직 (명)</th><th>파견/일용 (명)</th><th>투입계</th><th>실공수</th><th>비고</th></tr></thead>
      <tbody>${lineRows||'<tr><td colspan="7" style="color:var(--mut);padding:14px">라인 없음</td></tr>'}${fixedRows}${mgrFixedRows}</tbody>

      ${mgrTotal>0&&linesWithMan.length>0?`<br>현재: 관리자 ${mgrTotal}명 ÷ ${linesWithMan.length}개 공정 = 공정당 <b style="color:var(--blue)">+${fmtN(share)}</b>명`:''}

/* ② 오더별 생산실적·투입공수 — 1팀·2팀 공용.
   완/반 탭 + 공정 서브탭 + 투입공수(MH)/인시당/특이사항 입력. T2_ORD/T2_PROC 상태 사용 */
/* ── 공정(라인) 표시 순서 : 실제 생산 흐름 순 ──────────────────────
   생산1팀 : 계량/배합 자동계량 → 생육 → EP → 분체배합 → 진공코터 → 오븐 → 포장
     · 자동계량이 원료 투입의 시작점이므로 맨 앞
     · 분체배합은 코팅분말을 만드는 공정이라 EP 뒤·진공코터 앞에 위치
   ※ 배열 안에서 구체적인 이름(자동계량·리싸이클)이 일반명(계량/배합)보다
     앞에 와야 부분일치 보조가 정확히 동작합니다. 순서를 바꿀 때 주의.
   목록에 없는 공정은 뒤쪽에 가나다순으로 붙습니다(누락 방지).
   ※ 순서만 바꿉니다. 집계·계산 로직에는 영향 없음.                    */
const PROC_FLOW_ORDER=[
  '계량/배합 자동계량','계량/배합 리싸이클','계량/배합',
  '생육',
  'EP','EP 리싸이클',
  '분체배합',
  '진공코터','진공코터 리싸이클',
  '오븐',
  '포장'
];
function procOrderIdx(key){
  // key 형식: "주식/포장"  →  sub2("포장") 기준으로 순서 결정
  const s=String(key||'');
  const cut=s.indexOf('/');
  const sub2=(cut>=0?s.slice(cut+1):s).trim();
  let i=PROC_FLOW_ORDER.indexOf(sub2);
  if(i<0){ // 부분일치 보조(표기 흔들림 대비)
    i=PROC_FLOW_ORDER.findIndex(p=>sub2.indexOf(p)===0);
  }
  return i<0?999:i;
}
function procOrderCmp(a,b){
  const ia=procOrderIdx(a), ib=procOrderIdx(b);
  if(ia!==ib) return ia-ib;
  return String(a).localeCompare(String(b),'ko');
}
/* ③ 로스: 계획 > 실적(초과) 건 진단 배너 — 기존 데이터 정정 안내 */
function lossOverBanner(){
  const rows=(CUR_DAY.losses||[]).filter(l=>Math.round(Number(l.plan_qty))<Math.round(Number(l.actual_qty)));
  if(!rows.length) return '';
  const top=rows.slice(0,4).map(l=>`${l.mat_name||l.mat_code} <b>${fmt0(l.plan_qty)}</b>&lt;<b>${fmt0(l.actual_qty)}</b>`).join(' · ');
  return `<div style="margin:0 16px 10px;padding:9px 12px;border:1px solid #fda29b;background:#fef3f2;border-radius:8px;font-size:12px;color:#912018;line-height:1.6">
    ⚠ <b>계획이 실적보다 적은 원료·부자재 ${rows.length}건</b> — 계획(투입 소요량)은 실적(실투입량) 이상이어야 합니다.
    해당 행의 계획을 실적 이상으로 정정해 주세요. ${top}${rows.length>4?` 외 ${rows.length-4}건`:''}

/* ⚡ 계획 제안값 채우기 — 공정 흐름 기준으로 계획 입력칸을 채움(저장 전까지 DB 무변경)
   · 완제품 계획   ← 진공코터 실적 (같은 반제품을 쓰는 오더끼리 실적 비율로 안분)
   · 진공코터 계획 ← EP 실적 (동일 방식)
   · 근거 공정 실적이 없으면(전날 생산분 포장 등) 건드리지 않음               */
async function fillSuggestPlan(){
  const {date,team}=CUR_DAY;
  if(!date||!team){ toast('날짜/팀 정보 없음','err'); return; }
  let rows=[];
  try{
    const {data,error}=await sb.rpc('suggest_plan',{p_date:date,p_team:team});
    if(error)throw error;
    rows=data||[];
  }catch(e){ toast('제안계획 조회 실패: '+(e.message||e),'err'); return; }
  if(!rows.length){ toast('제안할 계획이 없습니다 (근거 공정 실적 없음)','err'); return; }

  // 현재 화면(선택된 공정 탭)에 떠 있는 입력칸만 채움
  const byCode={}; rows.forEach(r=>{ byCode[r.prod_code]=r; });
  let filled=0, skipped=0;
  document.querySelectorAll('.op-plan').forEach(inp=>{
    const r=byCode[inp.dataset.code];
    if(!r||!(Number(r.suggest)>0)){ skipped++; return; }
    const v=Math.round(Number(r.suggest)*10)/10;
    inp.value=fmt(v);
    inp.title=`제안 근거: ${r.src} · 현재계획 ${fmt(Number(r.cur_plan))}`;
    markOrderPlanEdit(inp.dataset.rid||inp.dataset.code);
    filled++;
  });
  if(!filled){ toast(`이 공정 탭에는 제안 대상이 없습니다 (전체 ${rows.length}건 · 다른 탭 확인)`,'err'); return; }
  const coatCnt=Object.values(byCode).filter(r=>r.src==='EP 실적').length;
  toast(`계획 제안값 ${filled}건 입력됨 — 확인 후 [투입공수 · 계획 저장]${coatCnt?' · 진공코터 제안은 EP 물량 기준이라 검토 필요':''}`,'ok');
}
/* 코터 평균수율 = Σ(진공코터 산출) ÷ Σ(EP 실적)
   진공코터 산출이 최종 출고 형태(키블)이므로 이 값이 그날의 대표 수율.
   suggest_plan 이 이미 로드돼 있어 추가 조회 없이 계산(0ms).            */
function coaterYield(){
  const orders=CUR_DAY.orders||[];
  const items=[];
  let out=0, inp=0, nCoat=0, nOven=0;
  orders.forEach(o=>{
    // [검증 반영] 오븐 통과품이 빠져 있었음 → 건조공정(코터+오븐) 전체로 확장
    if(!/진공코터|오븐/.test(String(o.proc_sub2||''))) return;
    const ep=dryEpBasis(o);                       // 교차 오배정 차단 조회
    if(ep==null) return;
    const a=Number(o.actual_sum??o.actual_qty??0);
    const isOven=/오븐/.test(String(o.proc_sub2||''));
    isOven?nOven++:nCoat++;
    inp+=ep; out+=a;
    items.push({code:o.prod_code, name:o.prod_name||'', ep, act:a, pct:a/ep*100, proc:isOven?'오븐':'코터'});
  });
  if(!items.length) return null;
  var _split={coat:nCoat, oven:nOven};
  // 평균수율 = 제품별 수율의 단순평균
  //  (물량가중이 아니라 제품 단위 평균 → 특정 제품의 이상치가 그대로 드러나
  //   "어느 제품 때문인지" 바로 설명할 수 있음)
  const avg=items.reduce((a,b)=>a+b.pct,0)/items.length;
  items.sort((a,b)=>a.pct-b.pct);          // 낮은 순
  return {pct:avg, items, n:items.length, out, inp, wPct:(inp>0?out/inp*100:0), split:_split};
}
/* 스코어카드 툴팁 : 평균을 끌어내린 제품을 바로 보여줌 */
function coaterYieldTip(cy){
  if(!cy) return '';
  const low=cy.items.filter(x=>x.pct<70).slice(0,4);
  const list=cy.items.slice(0,5).map(x=>`[${x.proc}] ${x.name||x.code} ${x.pct.toFixed(1)}%`).join('\n');
  const sp=cy.split||{};
  return `건조공정(진공코터+오븐) 제품별 수율의 평균 (${cy.n}개 제품 · 코터 ${sp.coat||0} · 오븐 ${sp.oven||0})\n물량가중 평균은 ${cy.wPct.toFixed(1)}%\n기준 구간 70~80%\n\n[낮은 순]\n${list}`
       + (low.length?`\n\n70% 미만 ${low.length}건 — 평균을 끌어내린 제품입니다.`:'');
}
/* ════════════════════════════════════════════════════════════════════
   ② 포장 실적 — 생산계획번호 묶음 뷰
   ── 구조
     계획(셀 병합) = 코터/오븐 산출 실적   ·  실적 = SKU별 MES 실적
     합계(셀 병합) = SKU 실적 합            ·  달성률 = 합계 ÷ 계획 = 포장수율
   ── 계획 수정 불가(자동 산출), 투입공수·특이사항만 입력
   ── 전날 코터분을 당일 포장한 이월 건은 생산일자 배지로 표시
   ════════════════════════════════════════════════════════════════════ */
/* 포장 완결 판정 임계값(%) — 누계 포장수율이 이 값 이상이면 완결로 본다 */
const PK_DONE=95;
function packGroups(){
  const rows=CUR_DAY.pack||[];
  const g=new Map();
  rows.forEach(r=>{
    const k=(r.plan_no||'-')+'|'+r.base_code;
    if(!g.has(k)) g.set(k,{key:k, plan_no:r.plan_no||'', base_code:r.base_code,
      base_name:r.base_name, base_type:r.base_type, base_actual:Number(r.base_actual)||0,
      base_date:r.base_date, base_team:r.base_team,
      grp_actual:Number(r.grp_actual)||0, achieve:(r.achieve==null?null:Number(r.achieve)),
      // 계획번호 누계 (일자 무관) — 이월 포장까지 합산된 값
      grp_cum:(r.grp_actual_cum==null?Number(r.grp_actual)||0:Number(r.grp_actual_cum)),
      ach_cum:(r.achieve_cum==null?(r.achieve==null?null:Number(r.achieve)):Number(r.achieve_cum)),
      cum_days:Number(r.cum_days)||1,
      first_pack:r.first_pack_date||null, last_pack:r.last_pack_date||null,
      // 코터 산출 매칭 방식 : 'plan'=계획번호 일치(정확) / 'code'=품번 추정 / 'none'=없음
      base_match:r.base_match||'plan', base_days:Number(r.base_days)||1,
      skus:[]});
    g.get(k).skus.push(r);
  });
  const arr=[...g.values()];
  arr.forEach(x=>x.skus.sort((a,b)=>Number(b.sku_actual)-Number(a.sku_actual)));
  // 이월(전일 생산분) 먼저 → 눈에 띄게
  arr.sort((a,b)=>String(a.plan_no).localeCompare(String(b.plan_no)));
  return arr;
}
/* ════════════════════════════════════════════════════════════════════
   스코어카드 '당일 계획 / 당일 실적' 산출 기준
   ── 생산1팀(코터·오븐 보유)
        계획 = 코터/오븐 산출 실적 (포장 묶음 base_actual 합)
        실적 = 포장 SKU 실적 합    (grp_actual 합)
        ※ MES 완제품 계획은 0·1 이 절반 이상이라 달성률이 338% 처럼 튐.
          ②오더별 화면과 동일한 기준으로 통일해 화면 간 숫자 불일치를 없앤다.
   ── 생산2팀(건조공정 없음)
        계획·실적 모두 MES 완제품 값 (계획 수정 가능)
   ── 판정은 팀명이 아니라 데이터(base_actual 유무)로 한다.
      전일 코터분을 당일 포장한 이월 건도 정확히 잡히기 때문.
   ════════════════════════════════════════════════════════════════════ */
function dayPlanActual(mesPlan, mesActual){
  const G=packGroups();
  if(!G.length) return {plan:Number(mesPlan)||0, actual:Number(mesActual)||0, basis:'mes', n:0};
  let p=0, a=0, nDry=0;
  G.forEach(x=>{
    const pb=packPlanOf(x);                 // 묶음별 기준 (코터·오븐 산출 or MES 계획)
    if(pb.src==='dry') nDry++;
    p+=pb.plan; a+=Number(x.grp_actual)||0;
  });
  if(p<=0) return {plan:Number(mesPlan)||0, actual:Number(mesActual)||0, basis:'mes', n:0};
  return {plan:p, actual:a, basis:(nDry>0?'pack':'mes'), n:G.length};
}
/* 계획번호 묶음의 계획 기준
   ── 코터·오븐 산출(base_actual)이 있으면 그것이 계획 (생산1팀, 수정 불가)
   ── 없으면 그 묶음에 속한 SKU 들의 MES 완제품 계획 합 (생산2팀, 수정 가능)
      · CUR_DAY.orders 는 get_order_detail 결과라 t_order_override 가 이미 반영돼 있다.
        따라서 계획을 수정하면 여기 합계도 자동으로 따라온다. */
function skuMesPlan(code){
  const o=(CUR_DAY.orders||[]).find(x=>x.prod_code===code);
  return o?(Number(o.plan_sum??o.plan_qty??0)||0):0;
}
function skuPlanEdited(code){
  const o=(CUR_DAY.orders||[]).find(x=>x.prod_code===code);
  return !!(o&&o.plan_edited);
}
/* 계획 근거 우선순위 (B안)
   ① 수기 수정  — 묶음 안 SKU 중 하나라도 계획을 고쳤으면 그 합을 계획으로 쓴다
                  (BOM·MES 가 불안정한 라인에서 현장 판단을 최우선으로 두기 위함)
   ② 공정 산출  — 코터·오븐 산출 또는 반제품 생산공정 원부재료 투입 합
   ③ MES 계획   — 위 둘이 모두 없을 때
   ※ ①은 수정한 적이 있을 때만 발동하므로, 손대지 않은 묶음은 ②를 그대로 따른다. */
function packPlanOf(g){
  const skus=g.skus||[];
  const edited=skus.some(s=>skuPlanEdited(s.sku_code));
  if(edited){
    let p=0; skus.forEach(s=>{ p+=skuMesPlan(s.sku_code); });
    if(p>0) return {plan:p, src:'edit'};
  }
  const base=Number(g.base_actual)||0;
  if(base>0) return {plan:base, src:'dry'};
  let p=0; skus.forEach(s=>{ p+=skuMesPlan(s.sku_code); });
  return {plan:p, src:'mes'};
}
/* 계획 수정칸을 열어둘지 — 코터·오븐 자동 산출만 잠그고 나머지는 개방 */
function packPlanEditable(g){
  return !(Number(g.base_actual)>0 && g.base_match==='plan');
}
function buildPackSection(){
  const G=packGroups();
  if(!G.length) return '';
  // MES 계획 기준 묶음이 하나라도 있으면 'SKU 계획' 입력 컬럼을 띄운다
  const anyMes=G.some(g=>packPlanEditable(g));
  // 계획 근거 라벨 — 팀·라인 구조에 따라 자동으로 달라진다
  const _srcs=[...new Set(G.map(g=>{
    const pb=packPlanOf(g);
    if(pb.src==='edit') return '수정 계획';
    if(pb.src==='mes')  return 'MES 계획';
    return g.base_match==='proc' ? (g.base_type||'투입')+' 투입' : '코터·오븐 산출';
  }))];
  const planSrcLabel=_srcs.join(' · ');
  const {date}=CUR_DAY;
  const mhMap=CUR_DAY.mhMap||{};
  const t=v=>fmt1(Number(v)||0);
  const carry=G.filter(x=>x.base_date&&x.base_date!==date).length;
  const noBase=G.filter(x=>!(x.base_actual>0)&&packPlanOf(x).plan<=0).length;   // 계획을 아예 못 잡는 건
  const mesCnt=G.filter(x=>!(x.base_actual>0)&&packPlanOf(x).plan>0).length;     // MES 계획으로 대체한 건
  const going=G.filter(x=>x.base_actual>0&&x.ach_cum!=null&&x.ach_cum<PK_DONE).length;
  const guess=G.filter(x=>x.base_actual>0&&x.base_match==='code').length;

  // 완결 판정 : 누계 포장수율이 PK_DONE 이상이면 더 이상 추적할 필요가 없다
  const rows=G.map(g=>{
    const n=g.skus.length;
    const isCarry=(g.base_date&&g.base_date!==date);
    const pb=packPlanOf(g);                    // {plan, src:'edit'|'dry'|'mes'}
    const canEditP=packPlanEditable(g);        // 코터·오븐 자동 산출만 잠금
    // 계획 기준이 MES 로 바뀌면 수율도 그 기준으로 다시 낸다 (SQL 값은 코터 기준)
    const achC=(pb.src==='dry')?g.ach_cum:(pb.plan>0?(Number(g.grp_cum)||0)/pb.plan*100:null);
    const achCol=(achC==null)?'var(--mut)':(achC>=PK_DONE?'var(--grn)':(achC>=90?'#d97706':'#e8918c'));
    const rest=Math.max(pb.plan-(Number(g.grp_cum)||0),0);
    const done=(achC!=null&&achC>=PK_DONE);
    const multi=(g.cum_days>1);
    const typeCls=g.base_type==='오븐'?'pk-oven':(g.base_type==='코터'?'pk-coat':'pk-etc');
    return g.skus.map((s,i)=>{
      const mh=mhMap[s.sku_code]||{mh:'',note:''};
      const act=Number(s.sku_actual)||0;
      const prod=(mh.mh&&act)?(act/Number(mh.mh)):0;
      const first=(i===0);
      return `<tr class="pk-row ${first?'pk-first':''}">
        ${first?`<td rowspan="${n}" class="pk-grp">
            <div class="pk-no">${g.plan_no||'-'}</div>
            <span class="pk-type ${typeCls}">${g.base_type}</span>
            ${achC==null?'':(done
              ? `<div class="pk-done" title="누계 포장수율 ${achC.toFixed(1)}% — 이 계획번호는 포장이 마무리된 것으로 봅니다.">✓ 완결</div>`
              : `<div class="pk-going" title="누계 포장수율 ${achC.toFixed(1)}%. ${pb.src==='edit'?'수정 계획':(pb.src==='mes'?'MES 계획':(g.base_match==='proc'?g.base_type+' 투입':'코터·오븐 산출'))} 대비 ${fmt1(rest)}kg 이 아직 포장되지 않았습니다. 익일 포장이 이어질 계획이면 다음 일보에서 누계가 올라갑니다.">▷ 진행중 · 잔여 ${fmt1(rest)}kg</div>`)}
            ${isCarry?`<div class="pk-carry" title="${g.base_date} 생산분을 ${date} 에 포장한 이월 건입니다. 달성률이 낮게 보일 수 있습니다.">⚠ ${String(g.base_date).slice(5)} 생산분</div>`:''}
            <div class="pk-base" title="${g.base_name||''}">${g.base_code}${g.base_team&&g.base_team!==CUR_DAY.team?` · ${g.base_team}`:''}</div>
          </td>
          <td rowspan="${n}" class="mono pk-plan">${pb.plan>0?t(pb.plan):'<span style="color:#b42318;font-size:11px">계획 없음</span>'}
            ${pb.src==='edit'?`<div style="font-size:9.5px;font-weight:800;color:#0d8a4f" title="현장에서 수정한 계획이 우선 적용된 묶음입니다.${Number(g.base_actual)>0?` 원래 근거(${g.base_type} 투입)는 ${fmt1(g.base_actual)}kg 였습니다.`:''} SKU 계획칸의 ↺ 로 되돌릴 수 있습니다.">✎ 수정 계획</div>`:''}
            ${pb.src==='mes'&&pb.plan>0?`<div style="font-size:9.5px;font-weight:800;color:#8a6d1f" title="반제품 생산공정 기록이 없어 MES 완제품 계획 합계를 계획으로 씁니다. SKU 계획칸에서 수정하면 즉시 반영됩니다.">MES 계획</div>`:''}
            ${pb.src==='dry'&&g.base_match==='proc'?`<div style="font-size:9.5px;font-weight:800;color:#0d7a8a" title="이 계획번호의 ${g.base_type} 공정에 투입된 원부재료·반제품 합계입니다(부자재 제외). 중간 계량이 없는 라인이라 투입량을 계획으로 봅니다.">원재료 투입</div>`:''}
            ${pb.src==='dry'&&g.base_match==='code'?`<div style="font-size:9.5px;font-weight:800;color:#b54708" title="이 계획번호로 반제품 생산 기록을 찾지 못해, 같은 반제품 품번의 가장 최근 1일치 산출을 대신 사용했습니다. 다른 계획번호의 물량일 수 있으니 수율 판단 시 주의하세요.">⚠ 품번 추정</div>`:''}
            ${pb.src==='dry'&&g.base_days>1?`<div style="font-size:9.5px;color:#8b7bbd;font-weight:700" title="이 계획번호의 코터·오븐 생산이 ${g.base_days}일에 걸쳐 있어 합산했습니다">${g.base_days}일 합산</div>`:''}</td>`:''}
        <td class="mono">${s.sku_code}</td>
        <td class="l">${s.sku_name||'-'}</td>
        ${anyMes?(canEditP
          ? `<td><input class="inp-cell op-plan" id="pk_${s.sku_code}_in" data-code="${s.sku_code}" data-rid="pk_${s.sku_code}" data-orig="${skuMesPlan(s.sku_code)}" value="${skuMesPlan(s.sku_code)?fmt1(skuMesPlan(s.sku_code)):''}" placeholder="0" title="완제품 계획 — 비워두면 ${pb.src==='edit'?'원래 근거':'왼쪽 계획'}를 그대로 씁니다. 값을 넣으면 그 값이 계획번호 합계와 포장수율에 우선 적용됩니다." style="width:76px;text-align:right;background:#fff8e8" oninput="markOrderPlanEdit('pk_${s.sku_code}')" onkeydown="if(event.key==='Enter'){event.preventDefault();saveOrderOverride('${s.sku_code}','pk_${s.sku_code}');}">
              ${skuPlanEdited(s.sku_code)?`<div style="font-size:9.5px;font-weight:800;color:#0d8a4f;margin-top:2px">✎수정 <span class="rowbtn del" style="cursor:pointer;padding:0 4px" onclick="resetOrderOverride('${s.sku_code}')" title="MES 원본 계획으로 복원">↺</span></div>`:''}
              <button id="pk_${s.sku_code}_btn" class="rowbtn" style="display:none;margin-top:3px;padding:2px 7px;font-size:10.5px" onclick="saveOrderOverride('${s.sku_code}','pk_${s.sku_code}')">저장</button></td>`
          : `<td class="mono" style="color:#98a2b3" title="코터·오븐 산출이 계획이라 수정할 수 없습니다">–</td>`):''}
        <td class="mono" title="${Number(s.sku_actual_cum)>act?`계획번호 누계 ${t(s.sku_actual_cum)}kg (이월 포함)`:''}">${t(act)}${Number(s.sku_actual_cum)>act?`<div style="font-size:9.5px;color:#8b7bbd;font-weight:700">누계 ${t(s.sku_actual_cum)}</div>`:''}</td>
        ${first?`<td rowspan="${n}" class="mono pk-sum">${t(g.grp_actual)}
            ${multi?`<div style="font-size:10px;font-weight:800;color:#6d47c9;letter-spacing:-.2px" title="계획번호 ${g.plan_no} 의 전체 포장 실적 (${g.first_pack||'-'} ~ ${g.last_pack||'-'} · ${g.cum_days}일)">누계 ${t(g.grp_cum)}</div>`:''}</td>
          <td rowspan="${n}" class="mono pk-ach"><b style="color:${achCol}">${achC==null?'–':achC.toFixed(1)+'%'}</b>
            <div style="font-size:9.5px;color:#98a2b3;font-weight:700">${multi?'누계÷계획':'합계÷계획'}</div></td>`:''}
        <td><input class="inp-cell t2-mh" data-code="${s.sku_code}" type="number" step="0.1" value="${mh.mh?Number(mh.mh).toFixed(1):''}" placeholder="0" style="width:76px;text-align:right;background:#fffbe8"></td>
        <td class="mono">${prod?prod.toFixed(1):'–'}</td>
        <td><input class="inp-cell t2-note" data-code="${s.sku_code}" value="${(mh.note||'').replace(/"/g,'&quot;')}" placeholder="특이사항" style="text-align:left;background:#fffbe8"></td>
      </tr>`;
    }).join('');
  }).join('');

  return `
    ${carry?`<div class="pk-note">⚠ <b>이월 ${carry}건</b> — 전일 생산한 코터·오븐 반제품을 오늘 포장한 건입니다. 계획번호 칸의 날짜 배지를 확인하세요.</div>`:''}
    ${going?`<div class="pk-note" style="background:#f7f5ff;border-color:#d6ccf5;color:#4b3b8f">▷ <b>진행중 ${going}건</b> — 코터·오븐 산출 대비 포장이 덜 끝난 계획번호입니다.
      <b>익일 포장이 이어지면 다음 일보에서 누계와 수율이 함께 올라갑니다.</b> 리뷰 시 "잔여 물량은 익일 포장 예정"으로 설명하시면 됩니다.</div>`:''}
    ${guess?`<div class="pk-note">⚠ <b>품번 추정 ${guess}건</b> — 해당 계획번호로 코터·오븐 생산 기록을 찾지 못해 같은 반제품 품번의 최근 산출로 대신했습니다.
      <b>다른 계획번호의 물량일 수 있어 수율이 왜곡될 수 있습니다.</b> MES에서 코터 공정의 생산계획번호가 비어 있지 않은지 확인하세요.</div>`:''}
    ${mesCnt?`<div class="pk-note">ℹ <b>MES 계획 기준 ${mesCnt}건</b> — 반제품 생산공정 기록이 없어 MES 완제품 계획 합계를 계획으로 사용합니다.
      <b>SKU 계획칸에서 수정하면 계획번호 합계와 포장수율에 바로 반영</b>됩니다.</div>`:''}
    ${noBase?`<div class="pk-note" style="background:#fef3f2;border-color:#fda29b;color:#912018">⚠ <b>계획 없음 ${noBase}건</b> — 반제품 생산 기록도 MES 계획도 없습니다. 수율을 낼 수 없습니다.</div>`:''}
    <div class="sec-bd" style="overflow-x:auto"><table class="t2-table pk-table">
      <thead><tr><th>생산계획번호</th><th>계획(KG)<br><span style="font-weight:600;font-size:9.5px">${planSrcLabel}</span></th>
        <th>제품코드</th><th>제품명</th>
        ${anyMes?'<th>SKU 계획<br><span style="font-weight:600;font-size:9.5px">수정하면 우선 적용</span></th>':''}
        <th>SKU 실적<br><span style="font-weight:600;font-size:9.5px">당일 · 누계</span></th>
        <th>합계 실적<br><span style="font-weight:600;font-size:9.5px">당일 · 누계</span></th>
        <th class="th-hl">포장수율<br><span style="font-weight:600;font-size:9.5px">누계 기준</span></th>
        <th>투입공수(MH)</th><th>인시당(KG/MH)</th><th>특이사항</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ════════════════════════════════════════════════════════════════════
   건조공정(진공코터·오븐) 공용 헬퍼
   ── ① 기준대비 달성률 색상 밴드 : 임계값을 한 곳에서만 관리
   ── ② EP 근거 조회 안전화     : 코터↔오븐 교차 오배정 차단
   ════════════════════════════════════════════════════════════════════ */
const DY_BAND={ok:100, warn:98.5, bad:95};   // ← 임계값은 여기만 고치면 전 화면 반영
function dyRateStyle(v){
  if(v==null) return null;
  if(v>=DY_BAND.ok)   return {col:'#0d8a4f', bg:'#eaf8f0', bd:'#a7e3c4', tag:'달성'};   // 100%↑ 녹색
  if(v>=DY_BAND.warn) return {col:'#b54708', bg:'#fffaeb', bd:'#fedf89', tag:'주의'};   // 98.5~100 경고(약)
  if(v>=DY_BAND.bad)  return {col:'#c4320a', bg:'#fff4ed', bd:'#fdb082', tag:'경고'};   // 95~98.5 경고
  return                     {col:'#b42318', bg:'#fef3f2', bd:'#fda29b', tag:'미달'};   // 95% 미만
}
function dryProcLabel(o){ return /오븐/.test(String(o.proc_sub2||''))?'오븐':'진공코터'; }
/* 건조공정 계획 근거 = 같은 오더의 EP 실적
   ① 정확키(품번|공정) 우선
   ② 정확키가 없을 때만 품번 폴백. 단 src='EP 실적' 후보가 "유일할 때만" 채택
      → 같은 품번이 코터·오븐 양쪽에 걸린 경우 엉뚱한 EP를 끌어오는 것을 차단 */
function dryEpBasis(o){
  const sg=CUR_DAY.suggest||{};
  let r=sg[o.prod_code+'|'+(o.proc_sub1||'')+'/'+(o.proc_sub2||'')];
  if(!r){
    const cands=Object.keys(sg).filter(k=>k.indexOf(o.prod_code+'|')===0)
                               .map(k=>sg[k]).filter(x=>x&&x.src==='EP 실적');
    r=(cands.length===1)?cands[0]:null;
  }
  if(!r||r.src!=='EP 실적') return null;
  const v=Number(r.suggest);
  return v>0?v:null;
}
function isDryProcKey(k){ return /진공코터|오븐/.test(String(k||'')); }
function buildSection2(){
  const orders=CUR_DAY.orders||[], mhMap=CUR_DAY.mhMap||{};
  const isFin=(o)=>{ if(o&&typeof o==='object'){ if(o.kind==='fin'||o.kind==='완제품')return true; if(o.kind==='semi'||o.kind==='반제품')return false; return ['2','3'].includes(String(o.prod_code||'')[0]); } return ['2','3'].includes(String(o||'')[0]); };
  const isSemi=(o)=>{ if(o&&typeof o==='object'){ if(o.kind==='semi'||o.kind==='반제품')return true; if(o.kind==='fin'||o.kind==='완제품')return false; return String(o.prod_code||'')[0]==='6'; } return String(o||'')[0]==='6'; };
  const kindOrders=(orders||[]).filter(o=>T2_ORD==='fin'?isFin(o):isSemi(o));
  const byProc={};
  kindOrders.forEach(o=>{ const k=(o.proc_sub1||'')+'/'+(o.proc_sub2||''); (byProc[k]=byProc[k]||[]).push(o); });
  // 진공코터 공정이 있는 팀에서만 코터 관련 안내를 노출 (생산2팀은 코터가 없음)
  const hasCoat=(orders||[]).some(o=>/진공코터|오븐/.test(String(o.proc_sub2||'')));
  const procs=Object.keys(byProc)
    .filter(k=>{
      // 비활성 라인은 숨기되, 오더 자체가 있으면 유지 (탭이 사라져 클릭 불가해지는 문제 방지)
      if(!(CUR_DAY.lineOff && CUR_DAY.lineOff.has(k))) return true;
      return (byProc[k]||[]).length>0;
    })
    .sort(procOrderCmp);
  if(!T2_PROC||!procs.includes(T2_PROC)) T2_PROC=procs[0]||'';
  const curOrders=byProc[T2_PROC]||[];
  const orderRows=curOrders.map((o,oi)=>{
    const mh=mhMap[o.prod_code]||{mh:'',note:''};
    const oPlanRaw=Number(o.plan_sum??o.plan_qty??0), oAct=Number(o.actual_sum??o.actual_qty??0);
    const mhProd=(mh.mh&&oAct)?(oAct/Number(mh.mh)):0;
    const pedit=!!o.plan_edited;
    // 계획 수정 허용 범위
    //  · 완제품 : 수정 가능 (kind 누락 시 prod_code 앞자리 2·3 폴백)
    //  · 진공코터 : 계획 = 같은 오더의 EP 실적으로 자동 산출 → 수정 잠금
    //  · 그 외 반제품 : 원부자재 합산값이라 잠금
    const isCoat=/진공코터|오븐/.test(String(o.proc_sub2||''));   // 건조공정(코터·오븐)
    const pLbl=dryProcLabel(o);                                   // '진공코터' | '오븐'
    const canEditPlan=isFin(o)&&!isCoat;
    // 건조공정 자동 계획 = 같은 오더의 EP 실적 (코터↔오븐 교차 오배정 차단 조회)
    const coatPlan=isCoat?dryEpBasis(o):null;
    const oPlan = (coatPlan!=null) ? coatPlan : oPlanRaw;
    const ach   = oPlan>0 ? (oAct/oPlan*100) : 0;
    // ※ 아래 세 줄은 반드시 oPlan·ach 선언 뒤에 와야 함 (const TDZ)
    // [검증 반영] 기준대비는 'EP 실적 기준 드라이수율'일 때만 의미가 있다.
    //   EP 근거가 없어 MES 계획(원부자재 합산)이 분모가 된 행은 산출하지 않는다.
    const dyStd=isCoat?(CUR_DAY.dy||{})[o.prod_code]:null;                     // 설계 기준수율(%)
    const dyRate=(dyStd>0 && coatPlan!=null && ach>0)?(ach/dyStd*100):null;    // 기준대비 비율(색 판정용)
    const dyGap =(dyRate!=null)?(ach-dyStd):null;                              // 기준대비 편차(%p) — 표시값
    const dySt=dyRateStyle(dyRate);
    const rid='op'+oi;   // 행 고유 id — 동일 품번이 여러 공정에 걸쳐도 충돌 없음
    const planCell = canEditPlan
      ? `<td style="white-space:nowrap">
          <input class="inp-cell op-plan" id="${rid}_in" data-code="${o.prod_code}" data-orig="${oPlan||0}" data-rid="${rid}" value="${oPlan?fmt1(oPlan):''}" placeholder="0" title="완제품 계획 — 제안값은 진공코터·오븐 산출 실적 기준입니다." style="width:74px;text-align:right;background:#fff8e8" oninput="markOrderPlanEdit('${rid}')" onkeydown="if(event.key==='Enter'){event.preventDefault();saveOrderOverride('${o.prod_code}','${rid}');}">
          <button class="rowbtn op-apply" id="${rid}_btn" onclick="saveOrderOverride('${o.prod_code}','${rid}')" style="display:none;margin-left:3px">적용</button>
          ${pedit?`<button class="rowbtn del" onclick="resetOrderOverride('${o.prod_code}')" title="MES 원본 계획으로 복원" style="margin-left:3px">↺</button>`:''}
        </td>`
      : (coatPlan!=null
        ? `<td class="mono" style="background:#f7f5ff" title="${pLbl} 계획 = 같은 오더의 EP 실적 ${fmt1(coatPlan)}kg. EP 압출 → ${pLbl}(수분 증발) 순서라 산출은 계획보다 적은 것이 정상입니다(기준 구간 70~80%). 자동 산출이라 수정할 수 없습니다.">
             <b style="color:#6d47c9">${fmt1(coatPlan)}</b>
             <div style="font-size:9.5px;color:#8b7bbd;font-weight:700;letter-spacing:-.2px">EP실적 자동</div>
           </td>`
