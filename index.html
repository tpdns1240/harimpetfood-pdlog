<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 생산마감 · 하림펫푸드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230c2350'/><text y='73' x='50' text-anchor='middle' font-size='62' font-weight='bold' fill='white' font-family='sans-serif'>H</text></svg>">
<style>
:root{
  --navy:#3b556e; --navy2:#4a6784; --navy3:#6b85a0;
  --smoke:#eef3f8; --card:#fff; --line:#dce4ee;
  --ink:#1f2d3d; --sub:#5a6b82; --mut:#93a1b5;
  --red:#d15a4e; --grn:#4e9a72; --grn-soft:#eef4f0;
  --blue:#4a6784; --blue-soft:#eef2f6;
  --r:12px; --sh:0 1px 2px rgba(26,58,92,.06),0 4px 16px rgba(26,58,92,.05);
  --sh-lg:0 16px 48px rgba(26,58,92,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--smoke);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* 로그인 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0f1628,#1b2740);display:grid;place-items:center;z-index:50}
.loginbox{background:#fff;border-radius:20px;padding:38px 34px;width:380px;box-shadow:var(--sh-lg);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.loginbox h2{font-size:21px;font-weight:800}
.loginbox .en{font-size:10.5px;color:var(--mut);letter-spacing:.16em;font-weight:600;margin:4px 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:7px}
.field select,.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.field select:focus,.field input:focus{outline:none;border-color:var(--navy3);background:#fff}
.btn-lg{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:11px;font-weight:800;font-size:15px;margin-top:6px}
.btn-lg:hover{background:var(--navy2)}
.err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;font-weight:600}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:18px}
.admin-link{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer}
.admin-link:hover{color:var(--sub);text-decoration:underline}
.admin-link.on{color:var(--blue)}

/* 상단바/헤더 */
.topbar{background:var(--navy);color:var(--hdr-text,#fff);height:52px;display:flex;align-items:center;padding:0 22px;gap:14px;font-size:12.5px}
.topbar .brandtag{background:rgba(255,255,255,.92);color:var(--navy);font-weight:800;border-radius:6px;padding:5px 10px}
.topbar .sys{color:var(--hdr-text,#8ea0c8);opacity:.72;font-weight:600}
.topbar .spacer{flex:1}
.topbar .who b{color:var(--hdr-text,#fff)}.topbar .who{color:var(--hdr-text,#c9d4ec);opacity:.9}
.topbar .lo{color:var(--hdr-text,#8ea0c8);opacity:.82;font-weight:600}
.header{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;gap:16px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.header h1{font-size:19px;font-weight:800}
.header .en{font-size:11px;color:var(--mut);letter-spacing:.18em;font-weight:600;margin-top:2px}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--sub)}
.nav button:hover{background:var(--smoke)}
.nav button.on{background:var(--blue-soft);color:var(--blue)}
.nav button.primary{background:var(--navy);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 80px}

/* 캘린더 */
.cal-head{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:20px 24px;display:flex;align-items:center}
.cal-head h2{font-size:18px;font-weight:800}
.cal-head .sub{font-size:12px;color:#8ea0c8;margin-top:3px}
.cal-stats{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cal-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;
  padding:9px 13px;text-align:center;min-width:74px;position:relative;overflow:hidden}
.cal-stat .n{font-size:21px;font-weight:800;line-height:1}
.cal-stat .l{font-size:10px;color:#a9b7d6;margin-top:5px;white-space:nowrap}
/* 결재 단계별 색 — 캘린더 배지와 동일 체계 (위쪽 띠로 표시) */
.cal-stat::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:transparent}
.cal-stat.s-plan::before{background:#f59e0b}
.cal-stat.s-lead::before{background:#38bdf8}
.cal-stat.s-div::before {background:#2563eb}
.cal-stat.s-ceo::before {background:#7c3aed}
.cal-stat.s-done::before{background:#22c55e}
.cal-stat.s-rej::before {background:#ef4444}
.cal-stat.s-plan .n{color:#fcd34d}
.cal-stat.s-lead .n{color:#7dd3fc}
.cal-stat.s-div  .n{color:#93c5fd}
.cal-stat.s-ceo  .n{color:#c4b5fd}
.cal-stat.s-done .n{color:#86efac}
.cal-stat.s-rej  .n{color:#fca5a5}
@media(max-width:1100px){.cal-stat{min-width:64px;padding:8px 10px}.cal-stat .n{font-size:18px}.cal-stat .l{font-size:9.5px}}
.cal-tool{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-top:none}
.cal-nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.cal-nav button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.cal-nav button:hover{background:var(--smoke)}
.cal-nav .ym{font-weight:800;font-size:15px;min-width:96px;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{margin-left:10px;padding:7px 14px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.refresh-btn:hover{background:var(--navy2)}
.cal-grid{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow div{padding:10px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.cal-dow div:first-child{color:var(--red)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.pad{background:#fafbfd}
.cal-cell .dn{font-size:13px;font-weight:700;color:var(--sub)}
.cal-cell.today{background:rgba(38,112,201,.06);box-shadow:inset 0 0 0 2.5px var(--blue);border-radius:4px}
.cal-cell.today .dn{color:var(--blue);display:flex;align-items:center;gap:5px}
.today-badge{background:var(--blue);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.03em}
.cal-tag{display:block;width:100%;text-align:left;margin-top:5px;font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;border:1px solid;background:#fff7ed;color:#c2410c;border-color:#fed7aa;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;transform-origin:left center}
.cal-tag:hover{transform:scale(1.05);box-shadow:0 3px 10px rgba(26,58,92,.18);filter:brightness(1.03);position:relative;z-index:3}
.cal-tag:active{transform:scale(.97)}
/* 결재 단계별 색 : 미작성(주황) → 작성중(회색) → 팀장(하늘) → 본부장(파랑) → CEO(보라) → 완료(초록) / 반려(빨강)
   왼쪽 굵은 테두리로 단계가 진행될수록 색이 짙어지도록 배치해 순서를 직관적으로 인지 */
.cal-tag{padding-left:9px;border-left-width:3.5px}
.cal-tag .ct-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor;opacity:.85}
.cal-tag.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa;border-left-color:#f59e0b}
.cal-tag.draft  {background:#f8fafc;color:#6b7690;border-color:#e4e8f0;border-left-color:#94a3b8}
.cal-tag.st-lead{background:#f0f9ff;color:#0369a1;border-color:#bae6fd;border-left-color:#38bdf8}
.cal-tag.st-div {background:#eff6ff;color:#1d4ed8;border-color:#c7dbff;border-left-color:#2563eb}
.cal-tag.st-ceo {background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe;border-left-color:#7c3aed}
.cal-tag.submitted{background:#f0f9ff;color:#0369a1;border-color:#bae6fd;border-left-color:#38bdf8}
.cal-tag.done   {background:#f0fdf4;color:#16a34a;border-color:#bbf7d0;border-left-color:#22c55e}
.cal-tag.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca;border-left-color:#ef4444}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend .chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0;background:currentColor}
.chip.draft  {background:#f8fafc;color:#6b7690;border-color:#e4e8f0}
.chip.st-lead{background:#f0f9ff;color:#0369a1;border-color:#bae6fd}
.chip.st-div {background:#eff6ff;color:#1d4ed8;border-color:#c7dbff}
.chip.st-ceo {background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid}
.chip.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.chip.submitted{background:#eff6ff;color:#2563eb;border-color:#c7dbff}
.chip.done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.chip.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca}

/* 패널/업로드 */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.panel-hd{background:var(--navy);color:#fff;padding:20px 24px;border-radius:var(--r) var(--r) 0 0}
.panel-hd h2{font-size:19px;font-weight:800}
.panel-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.panel-bd{padding:24px}
.pick{margin-bottom:20px}
.pick label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:9px}
.pick input[type=date]{padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.paste-area{width:100%;min-height:220px;padding:14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke);font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.paste-area:focus{outline:none;border-color:var(--navy3);background:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.upload-result{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none}
.upload-result.ok{background:var(--grn-soft);color:var(--grn);display:block}
.upload-result.err{background:#fef2f2;color:var(--red);display:block}

/* 토스트 */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--sh-lg);opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#15803d}#toast.err{background:var(--red)}
.skel{background:linear-gradient(90deg,#eef1f7 25%,#e3e8f2 37%,#eef1f7 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== PO 화면 ===== */
.po-back{margin-bottom:14px}
.po-back button{padding:8px 16px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.po-back button:hover{background:var(--smoke)}
.day-hd{background:linear-gradient(135deg,#0f1628,#26365a);color:#fff;border-radius:var(--r);padding:22px 26px;display:flex;align-items:center;margin-bottom:16px}
.day-hd h2{font-size:20px;font-weight:800}
.day-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.day-hd .meta{margin-left:auto;text-align:right;font-size:13px;color:#a9b7d6}
.day-hd .meta b{color:#fff;font-size:18px}
.po-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.po-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s}
.po-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.po-card .po-t{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.po-card .po-team{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.po-card .po-sub{font-size:12px;color:var(--mut);margin-top:4px}
.po-card .po-stats{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.po-card .po-stat{flex:1}
.po-card .po-stat .l{font-size:10.5px;color:var(--sub);font-weight:600}
.po-card .po-stat .v{font-size:18px;font-weight:800;margin-top:3px}
.po-card .achieve-badge{margin-left:auto;font-size:20px;font-weight:800}
.po-card .achieve-badge.g{color:var(--grn)}.po-card .achieve-badge.r{color:var(--red)}
.po-card .scrap-warn{font-size:11px;color:var(--red);font-weight:700;margin-top:8px}

/* PO 상세 */
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.sec-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfe,#fff)}
/* 섹션 번호 : 각이 둥근 사각 배지 (보고서 느낌) */
.sec-hd .no{min-width:26px;height:26px;padding:0 8px;border-radius:8px;
  background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;
  display:inline-grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:-.3px;
  box-shadow:0 2px 7px rgba(26,58,92,.24),inset 0 1px 0 rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.14)}
/* 대시보드 섹션 타이틀 : [1. 달성률 추이] 각이 둥근 사각 라벨 */
.sec-hd .sec-tag{display:inline-flex;align-items:center;height:28px;padding:0 13px;border-radius:9px;
  background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;
  font-size:13.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(26,58,92,.22),inset 0 1px 0 rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.14)}
.sec-tag.c1{background:linear-gradient(135deg,#2670c9,#4a90d9)}
.sec-tag.c2{background:linear-gradient(135deg,#0e8a8a,#16b3b3)}
.sec-tag.c3{background:linear-gradient(135deg,#c2410c,#e8813a)}
.sec-tag.c4{background:linear-gradient(135deg,#c0392b,#e0483a)}
.sec-tag.c5{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
/* 섹션별 색조 (스크롤 시 인지) */
.no.c1{background:linear-gradient(135deg,#2670c9,#4a90d9)!important}
.no.c2{background:linear-gradient(135deg,#0e8a8a,#16b3b3)!important}
.no.c3{background:linear-gradient(135deg,#c2410c,#e8813a)!important}
.no.c4{background:linear-gradient(135deg,#c0392b,#e0483a)!important}
.no.c5{background:linear-gradient(135deg,#6d28d9,#8b5cf6)!important}
.no.c6{background:linear-gradient(135deg,#15803d,#22a55a)!important}
.no.cx{background:linear-gradient(135deg,#475569,#64748b)!important}
.sec-hd{background:linear-gradient(100deg,#fbfdff,#f2f7fc)}
.sec-hd h3{font-size:15.5px;font-weight:800}
.sec-hd .desc{font-size:12px;color:var(--mut)}
.sec-hd .sp{flex:1}
.sec-bd{padding:16px 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:#fff;padding:10px;font-weight:700;font-size:12px;text-align:center;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid #eef3f8;text-align:center}
tbody tr:nth-child(even){background:#f8fbfe}
tbody tr:hover{background:var(--grn-soft)}
tbody td.l{text-align:left}
.inp-cell{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;background:#fffdf5}
.inp-cell:focus{outline:none;border-color:var(--navy3);background:#fff}
.kind-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.kind-badge.fin{background:var(--blue-soft);color:var(--blue)}
.kind-badge.semi{background:#fef9c3;color:#a16207}
.pos{color:var(--grn);font-weight:700}.neg{color:var(--red);font-weight:700}
.tbtn{padding:9px 15px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:13px;color:var(--sub);background:#fff}
.tbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.work-field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.work-field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--smoke)}
.work-field input:focus{outline:none;border-color:var(--navy3);background:#fff}
@media(max-width:640px){.work-grid{grid-template-columns:1fr 1fr}}
/* 스코어카드 */
.score-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.score-row .sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.score-row .sc:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.score-row .sc::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--navy3)}
.score-row .sc.g::after{background:var(--grn)}.score-row .sc.r::after{background:var(--red)}.score-row .sc.b::after{background:var(--blue)}
.score-row .sc .l{font-size:11px;color:var(--sub);font-weight:700}
.score-row .sc .v{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.score-row .sc .v .u{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px;letter-spacing:0}
.score-row .sc .sub{font-size:11px;font-weight:600;color:var(--mut);margin-top:3px;letter-spacing:0;font-variant-numeric:tabular-nums}
.score-row .sc .sub .u{font-size:10px;color:#9aa8bd;margin-left:1px}
@media(max-width:900px){.score-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.score-row{grid-template-columns:repeat(2,1fr)}}
/* 탭 */
.tabbar{display:flex;gap:6px;padding:12px 20px 0}
.tabbar .tab{padding:8px 16px;border-radius:9px 9px 0 0;font-weight:700;font-size:13px;color:var(--sub);border:1px solid transparent}
.tabbar .tab.on{background:var(--navy);color:#fff}
tfoot td{padding:11px 10px;border-top:2px solid var(--navy3)}
.delx{color:var(--red);font-weight:800;cursor:pointer;font-size:15px}

#lossTable th:nth-child(8),#lossTable td:nth-child(8){width:54px}    /* 단가 */
#lossTable th:nth-child(9),#lossTable td:nth-child(9){width:74px}    /* 로스금액 */
#lossTable th:nth-child(10),#lossTable td:nth-child(10){width:92px}  /* 로스유형 */
#lossTable th:nth-child(11),#lossTable td:nth-child(11){width:auto;min-width:210px} /* 사유 */

#lossTable td:nth-child(12) .rowbtn{padding:4px 6px;font-size:10.5px;margin:1px}
#lossTable td:nth-child(12) .tbtn{padding:4px 8px;font-size:11px;margin:1px}
/* 입력칸은 셀 폭에 자동 맞춤 */
#lossTable td:nth-child(4) input,#lossTable td:nth-child(5) input{width:100%;font-size:11.5px;padding:4px 5px}
#lossTable td:nth-child(10) select{width:100%;font-size:11.5px;padding:4px 3px}
#lossTable td:nth-child(11) input{width:100%;font-size:12.5px;padding:5px 8px;text-align:left}
#lossTable td:nth-child(11) input{outline:none}
#lossTable select,#lossTable input{max-width:100%;box-sizing:border-box}
#lossTable .inp-cell{width:100%;max-width:100%}
.t2-table tbody tr:nth-child(even){background:#f6f9fd}
.t2-lno{display:inline-block;background:#2954a0;color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:5px;margin-right:5px}
/* 접기/펼치기 상세 영역 */
.fold-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f7f9fc;border-top:1px solid var(--line);
  cursor:pointer;user-select:none;transition:background .15s}
.fold-bar:hover{background:#eef3fa}
.fold-arrow{font-size:11px;color:var(--mut);transition:transform .22s;display:inline-block}
.fold-bar.open .fold-arrow{transform:rotate(90deg)}
.fold-title{font-size:12.5px;font-weight:800;color:var(--sub)}
.fold-cnt{font-size:11px;font-weight:700;color:#fff;background:var(--mut);padding:1px 8px;border-radius:20px}
.fold-bar.open .fold-cnt{background:var(--navy)}
.fold-hint{margin-left:auto;font-size:11px;color:var(--mut)}
.fold-body{display:none}
.fold-body.open{display:block;animation:foldIn .18s ease}
@keyframes foldIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 요약 스트립 (타이틀 옆 핵심 수치) */
.sum-strip{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fbfcfe;border-top:1px solid var(--line)}
.sum-item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;min-width:96px}
.sum-item .k{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.02em}
.sum-item .v{font-size:15px;font-weight:800;color:var(--ink);margin-top:2px;font-family:'JetBrains Mono',monospace}
.sum-item.neg .v{color:var(--red)}
.sum-item.pos .v{color:var(--grn)}
.edit-badge{display:inline-block;background:#fef3c7;color:#b45309;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:middle}
/* 써머리 값: 금액 작게 + 본문 글자체 (mono 아님) */
.sum-strip.sm .v{font-size:12.5px;font-weight:700;font-family:inherit;letter-spacing:0}
.sum-strip.sm .sum-item{min-width:88px;padding:7px 12px}
/* 비가동 상세 라인 필터 */
.dt-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 14px;background:#f7f9fc;border-top:1px solid var(--line)}
.dtf-label{font-size:11.5px;font-weight:800;color:var(--mut);margin-right:4px;letter-spacing:.02em}
.dtf-chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--sub);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .16s;white-space:nowrap}
.dtf-chip b{font-weight:800;opacity:.6;margin-left:2px;font-size:11px}
.dtf-chip:hover{border-color:var(--navy);color:var(--navy)}
.dtf-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dtf-chip.on b{opacity:.75}
/* 인원표 관리자 행 (공정 공통, 1/n 배분) */
.mp-mgr td{background:#f7f9fc;border-top:2px solid #dde5f0}
.mp-mgr td.l{box-shadow:inset 3px 0 0 var(--blue)}
/* 데이터 출처 배지 (시트 자동 / 사이트 직접) */
.src-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;cursor:help}
.src-tag.auto{background:#eef2f7;color:#64748b;border:1px solid #dde3ec}
.src-tag.manual{background:var(--blue-soft);color:var(--blue);border:1px solid #c7dbff}
/* 수정 팝업 다이얼로그 */
.dlg-back{position:fixed;inset:0;background:rgba(12,35,80,.42);backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:dlgIn .16s ease}
@keyframes dlgIn{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(12,35,80,.28);width:100%;max-width:620px;max-height:90vh;overflow:auto;animation:dlgUp .2s cubic-bezier(.2,.8,.3,1)}
@keyframes dlgUp{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.dlg-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.dlg-hd h3{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
.dlg-bd{padding:18px 20px 22px}
.cap-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.cap-badge.on{background:var(--grn-soft);color:var(--grn)}
.cap-badge.off{background:#f1f3f6;color:#8a93a3}
.cap-linehd td{background:#f7f9fc;border-top:2px solid var(--line);font-size:13.5px}
/* 비활성 행: 텍스트·입력칸만 흐리게, 버튼(cap-act)은 선명하게 유지 */
.cap-off td{background:#fafbfc}
.cap-off td:not(.cap-act){opacity:.45}
.cap-off td.l{box-shadow:inset 3px 0 0 #b9c0cc}
.rowbtn.act{background:var(--grn-soft);color:var(--grn);border-color:var(--grn);font-weight:800}
.rowbtn.act:hover{background:var(--grn);color:#fff}
.rowbtn:disabled{opacity:.4;cursor:not-allowed}
.rowbtn{padding:5px 11px;border-radius:7px;font-weight:700;font-size:12px;margin:0 2px;border:1px solid var(--line)}
.rowbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.rowbtn.edit{background:var(--blue-soft);color:var(--blue);border-color:#c7dbff}
.rowbtn.del{background:#fef2f2;color:var(--red);border-color:#fecaca}
.rowbtn.cancel{background:#f1f4fa;color:var(--sub)}
.rowbtn.xcl{background:#fff7ed;color:#c2560c;border-color:#fed7aa;cursor:pointer}
.rowbtn.xcl:hover{background:#c2560c;color:#fff;border-color:#c2560c}
tr.row-saved{background:var(--grn-soft)!important}
tr.row-saved .inp-cell{background:transparent;border-color:transparent;font-weight:600;color:var(--ink)}
/* 긴 표 타이틀 고정 스크롤 */
.table-scroll{max-height:520px;overflow:auto;border-radius:8px}
table.sticky-head thead th{position:sticky;top:0;z-index:2;box-shadow:0 2px 0 rgba(26,58,92,.15)}
.input-row{background:#fffef5}
.input-row td{border-bottom:2px solid var(--line)}
/* 모바일/태블릿 반응형 */
@media(max-width:768px){
  .wrap{padding:14px 10px 60px}
  .header{padding:14px 16px;flex-wrap:wrap;gap:10px}
  .header h1{font-size:16px}
  .nav{margin-left:0;width:100%;overflow-x:auto}
  .nav button{padding:8px 12px;font-size:12.5px;white-space:nowrap}
  .day-hd{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
  .day-hd .meta{margin-left:0;text-align:left}
  .toolbar{flex-wrap:wrap}
  .toolbar .sp{display:none}
  .toolbar .tbtn{flex:1;min-width:calc(50% - 5px);text-align:center}
  .score-row{grid-template-columns:repeat(2,1fr)}
  .pareto-grid{grid-template-columns:1fr}
  .sec-hd{flex-wrap:wrap;gap:8px}
  .sec-hd .sp{display:none}
  .sec-hd .tbtn{font-size:12px;padding:7px 10px}
  .work-grid{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:70px;padding:4px}
  .cal-tag{font-size:9.5px;padding:3px 4px}
  .cal-stats{gap:6px}
  .cal-stat{padding:8px 12px;min-width:70px}
  .cal-stat .n{font-size:19px}
  table{font-size:12px}
  thead th{padding:8px 6px;font-size:11px}
  tbody td{padding:7px 6px}
}
@media(max-width:480px){
  .score-row{grid-template-columns:1fr 1fr}
  .work-grid{grid-template-columns:1fr}
  .loginbox{width:92vw;padding:28px 22px}
}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.toolbar .tb-status{font-size:13px;font-weight:800;color:var(--navy);background:var(--blue-soft);padding:6px 14px;border-radius:8px}
.tb-status.wait{background:#fff7ed;color:#c2410c}
.tb-status.done{background:var(--grn-soft);color:var(--grn)}
.tb-status.rej{background:#fef2f2;color:var(--red)}
/* 결재 이력 — 결재바 바로 아래 */
.appr-hist{border:2px solid var(--navy);margin-bottom:16px;animation:histIn .22s ease-out}
@keyframes histIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.appr-hist table td{font-size:12.5px}
.appr-hist table td.l{white-space:normal;line-height:1.45;color:#1f2937}
/* 결재 진행바 */
.appr-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 20px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.appr-flow{display:flex;align-items:flex-start;justify-content:center;gap:0}
.appr-step{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:150px}
/* 이름이 들어가는 큰 둥근 네모 카드 */
.as-card{width:158px;padding:15px 11px 13px;border-radius:16px;background:#f4f6fa;border:2px solid #e2e8f2;
  text-align:center;transition:all .24s cubic-bezier(.2,.8,.3,1)}
.as-role{font-size:12px;font-weight:700;color:#9aa5b5;letter-spacing:.03em;margin-bottom:5px}
.as-name{font-size:18px;font-weight:800;color:#b3bccb;line-height:1.25;word-break:keep-all}
.as-en{font-size:10.5px;font-weight:600;color:#c2cad6;letter-spacing:.04em;margin-top:5px;text-transform:uppercase}
/* 완료: 아주 연한 세이지 */
.appr-step.done .as-card{background:#f2f8f4;border-color:#bcd9c6}
.appr-step.done .as-role{color:#7ba58c}
.appr-step.done .as-name{color:#4a8c66}
.appr-step.done .as-en{color:#a6c8b4}
/* 진행 중(현재 차례): 차분한 세이지 그린 + 확대 */
.appr-step.now .as-card{background:linear-gradient(135deg,#5faa7d,#4d9670);border-color:#41855f;
  transform:scale(1.09);box-shadow:0 8px 22px rgba(77,150,112,.28);animation:nowPulse 2.4s infinite}
.appr-step.now .as-role{color:rgba(255,255,255,.82)}
.appr-step.now .as-name{color:#fff;font-size:19px}
.appr-step.now .as-en{color:rgba(255,255,255,.6)}
@keyframes nowPulse{0%,100%{box-shadow:0 8px 20px rgba(77,150,112,.26)}50%{box-shadow:0 8px 28px rgba(77,150,112,.42)}}
/* 다음 차례(결재예정): 부드러운 앰버 */
.appr-step.next .as-card{background:#fdf8f0;border-color:#e8c89a}
.appr-step.next .as-role{color:#b08046}
.appr-step.next .as-name{color:#a9752f}
.appr-step.next .as-en{color:#d0b189}
/* 예정: 회색 (기본) */
.as-badge{padding:3px 13px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.as-badge.done{background:#eaf3ee;color:#4a8c66}
.as-badge.now{background:#4d9670;color:#fff;box-shadow:0 2px 6px rgba(77,150,112,.26)}
.as-badge.next{background:#fdf8f0;color:#a9752f;border:1px solid #e8c89a}
.as-badge.idle{background:#f1f3f6;color:#aab3c0}
/* 단계 연결부 : 굵은 선 + 큰 화살표 (다음 결재자로 흐르는 느낌) */
.appr-conn{flex:1;display:flex;align-items:center;gap:0;margin:0 2px;margin-top:42px;min-width:52px;position:relative}
.appr-conn .ac-line{flex:1;height:5px;background:#e4e9f2;transition:background .35s}
.appr-conn .ac-line:first-child{border-radius:3px 0 0 3px}
.appr-conn .ac-line:last-child{border-radius:0 3px 3px 0}
.appr-conn .ac-arw{flex:none;width:0;height:0;margin:0 -1px;
  border-top:11px solid transparent;border-bottom:11px solid transparent;
  border-left:14px solid #e4e9f2;transition:border-left-color .35s;font-size:0;line-height:0}
/* 완료 구간 : 진한 초록 + 화살표 강조 */
.appr-conn.fill .ac-line{background:linear-gradient(90deg,#7ab894,#4d9670)}
.appr-conn.fill .ac-arw{border-left-color:#4d9670;filter:drop-shadow(0 2px 4px rgba(77,150,112,.35))}
/* 지금 넘어가는 구간 : 흐르는 애니메이션 */
.appr-conn.flow .ac-line{background:linear-gradient(90deg,#4d9670 0%,#8fd0ab 50%,#4d9670 100%);
  background-size:200% 100%;animation:connFlow 1.6s linear infinite}
.appr-conn.flow .ac-arw{border-left-color:#4d9670;animation:arwPush 1.6s ease-in-out infinite;
  filter:drop-shadow(0 2px 6px rgba(77,150,112,.45))}
@keyframes connFlow{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes arwPush{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
/* 결재 의견 : 카드 바로 아래 */
.as-memo{margin-top:7px;max-width:158px;background:#f7f9fc;border:1px solid #e2e8f2;border-radius:9px;
  padding:6px 9px;font-size:11px;line-height:1.45;color:#4a5568;text-align:left;
  display:flex;gap:5px;align-items:flex-start;cursor:help}
.as-memo .am-i{flex:none;font-size:10px;opacity:.8}
.as-memo .am-t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.as-memo.rej{background:#fef3f2;border-color:#fda29b;color:#912018}
@media(max-width:900px){.as-memo{max-width:none;width:100%}}
@media(max-width:760px){
  .appr-flow{flex-wrap:wrap;gap:10px}
  .appr-conn{display:none}
  .appr-step{min-width:calc(50% - 8px)}
  .as-card{width:100%}
}
.tbtn.approve{background:var(--grn);color:#fff;border-color:var(--grn)}
.tbtn.reject{background:#fff;color:var(--red);border-color:#fecaca}
.reject-box{margin-top:12px;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;color:var(--red);font-size:13px;font-weight:600}
.comment-box{margin-top:8px;padding:10px 14px;background:var(--blue-soft);border:1px solid #c7dbff;border-radius:9px;color:var(--blue);font-size:13px;font-weight:600}
.lock-banner{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:16px;color:#92660c;font-size:13px;font-weight:600}
/* 대시보드 */
.dash-filter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.dash-filter label{font-size:12px;font-weight:700;color:var(--sub)}
.dash-filter input,.dash-filter select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px}

.settings-tabs{display:flex;gap:8px;margin-bottom:16px}
.settings-tabs .stab{padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub);background:#fff;border:1px solid var(--line)}
.settings-tabs .stab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.status-toggle{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid;cursor:pointer;transition:all .15s}
.status-toggle:hover{transform:scale(1.06)}
.status-toggle.on{background:var(--grn-soft);color:var(--grn);border-color:var(--grn)}
.status-toggle.off{background:#f1f4fa;color:var(--mut);border-color:var(--line)}
/* 팀별 월 현황 카드 (캘린더 하단) */
.team-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.team-stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:transform .18s,box-shadow .18s}

.tsc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tsc-hd h4{margin:0;font-size:15px;color:var(--ink)}
.tsc-badge{color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px}
.tsc-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tsc-num{background:#f8fafc;border-radius:8px;padding:10px;text-align:center}
.tsc-l{font-size:11px;color:var(--mut);margin-bottom:4px}
.tsc-v{font-size:22px;font-weight:800;color:var(--ink)}
.tsc-more{margin-top:12px;font-size:12px;color:var(--blue);font-weight:600;text-align:right}
/* 팀 리포트 드릴다운 */
.tr-hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--hdr-text,#fff);border-radius:16px;padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.tr-hero h2{margin:6px 0 2px;font-size:24px}
.tr-hero .en{font-size:11px;opacity:.8;letter-spacing:.05em}
.tr-crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:10px;padding:7px 14px;border-radius:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:var(--hdr-text,#fff);transition:background .15s}

.tr-nav button:hover{background:rgba(255,255,255,.28)}
.tr-nav .tr-cal{background:#fff;color:var(--navy)}
.line-row:hover{background:var(--blue-soft) !important}
/* 팀별 현황 */
.ts-grid{display:flex;flex-direction:column;gap:20px}
.ts-plant-hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px}
.ts-bar{width:4px;height:16px;border-radius:2px;display:inline-block}
.ts-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;max-width:560px}
.ts-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ts-card-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ts-card-hd h4{margin:0;font-size:17px;color:var(--ink)}

const fmt = (n)=> (n==null||isNaN(n))?'–':Number(n).toLocaleString('ko-KR');
// 금액: 부호 + 단위(원). 손실(양수)=빨강 -, 절감(음수)=초록 +
const fmtWon = (n)=>{
  if(n==null||isNaN(n))return '–';
  const v=Math.round(n);
  if(v===0)return '0원';
  const sign=v>0?'-':'+'; // 순로스 양수=손실이므로 -표기
  return sign+fmt(Math.abs(v))+'원';
};
const wonCls = (n)=> n>0?'neg':(n<0?'pos':'');
// 수량: 단위(KG)
const fmtKg = (n)=> (n==null||isNaN(n))?'–':fmt(Math.round(n))+' KG';

/* ── 스코어카드 표기: 큰 단위(ton/백만원) + 아래에 원본 수치를 작고 연하게 ── */
// 중량: 65,074kg → "65.0 ton" + "65,074 kg"
const scTon = (n)=>{
  const v=Number(n)||0;
  const t=v/1000;
  const main=`${t>=100?t.toFixed(0):t.toFixed(1)}<span class="u">ton</span>`;
  return `<div class="v mono">${main}</div><div class="sub">${fmt(Math.round(v))}<span class="u">kg</span></div>`;
};
// 금액: 22,701,543원 → "22.7 백만원" + "22,701,543 원"
const scWon = (n)=>{
  const v=Math.round(Number(n)||0);
  if(v===0) return `<div class="v mono">0<span class="u">원</span></div><div class="sub">&nbsp;</div>`;
  const a=Math.abs(v), m=a/1000000;
  const sign=v>0?'-':'+'; // 순로스 양수=손실이므로 - 표기
  const main=`${sign}${m>=100?m.toFixed(0):m.toFixed(1)}<span class="u">백만원</span>`;
  return `<div class="v mono">${main}</div><div class="sub">${sign}${fmt(a)}<span class="u">원</span></div>`;
};

/* ================= 캘린더 ================= */
/* ═══════════════════════════════════════════════════════════════
   캘린더 : 월 단위 캐시 + 경쟁조건 차단 + 인접월 프리페치
   ── 기존 : 진입/이전/다음 매번 get_calendar_v2 왕복 → 스켈레톤 노출
   ── 개선 : ①캐시 히트 시 즉시 그림(0ms) ②TTL 경과분만 백그라운드 갱신
             ③요청 시퀀스 토큰으로 늦게 온 응답 무시(월 뒤바뀜 방지)
             ④유휴시간에 ±1개월 미리 받아 이전/다음 클릭이 즉시 반응
   ═══════════════════════════════════════════════════════════════ */
const CAL_CACHE=new Map();          // ym -> {list, ts}
const CAL_TTL=90*1000;              // 90초. 과거월은 사실상 안 바뀌므로 더 길게
let CAL_SEQ=0;                      // 렌더 요청 일련번호
let CAL_INFLIGHT=new Map();         // ym -> Promise (중복 요청 합치기)
function calTtl(ym){ return ym<kstMonth() ? 30*60*1000 : CAL_TTL; }
/* 무효화 : 브라우저 캐시 + 서버 캐시(t_cal_meta.dirty) 동시 처리
   ── 내 화면만 갱신하면 다른 4명은 옛 상태를 계속 보게 되므로 서버까지 전파한다
   ── fire-and-forget : 실패해도 서버 TTL(현재월 60초)이 안전망 역할 */
function calInvalidate(ym){
  if(ym) CAL_CACHE.delete(ym); else CAL_CACHE.clear();
  try{ return sb.rpc('cal_invalidate',{p_ym:ym||null}).then(()=>true,()=>false); }
  catch(_){ return Promise.resolve(false); }
}
/* 워밍업 : 재구축 비용을 첫 사용자가 물지 않도록 미리 서버 캐시를 채운다 */
function calWarm(ym){
  try{ return sb.rpc('cal_warm',{p_ym:ym}).then(()=>{},()=>{}); }catch(_){ return null; }
}
function calFetch(ym,force){
  const c=CAL_CACHE.get(ym);
  if(!force && c && (Date.now()-c.ts)<calTtl(ym)) return Promise.resolve(c.list);
  if(CAL_INFLIGHT.has(ym)) return CAL_INFLIGHT.get(ym);
  const pr=sb.rpc('get_calendar_v2',{p_ym:ym}).then(({data,error})=>{
    CAL_INFLIGHT.delete(ym);
    if(error) throw error;
    const list=data||[];
    CAL_CACHE.set(ym,{list,ts:Date.now()});
    return list;
  }).catch(e=>{ CAL_INFLIGHT.delete(ym); throw e; });
  CAL_INFLIGHT.set(ym,pr);
  return pr;
}
function calPrefetch(ym){
  const idle=window.requestIdleCallback||(f=>setTimeout(f,300));
  idle(()=>{ [-1,1].forEach(d=>{
    let [y,m]=ym.split('-').map(Number); m+=d;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    const k=`${y}-${String(m).padStart(2,'0')}`;
    if(!CAL_CACHE.has(k)) calFetch(k,false).catch(()=>{});
  }); });
}
/* 순수 렌더 — 네트워크 호출 없음. 캐시 히트 시 이 함수만 돌아 즉시 표시 */

async function renderCalendar(force){
  const ym=S.ym, seq=++CAL_SEQ;
  const c=CAL_CACHE.get(ym);
  // ① 캐시가 있으면 스켈레톤 없이 즉시 그린다
  if(c && !force){
    $('#wrap').innerHTML=calHtml(c.list,ym);
    calPrefetch(ym);
    // ② TTL 지난 캐시면 조용히 갱신 (stale-while-revalidate)
    if((Date.now()-c.ts)>=calTtl(ym)){
      calFetch(ym,true).then(list=>{
        if(seq!==CAL_SEQ||S.ym!==ym||S.view!=='cal') return;   // 늦게 온 응답 무시
        $('#wrap').innerHTML=calHtml(list,ym);
      }).catch(()=>{});
    }
    return;
  }
  $('#wrap').innerHTML='<div class="skel" style="height:70px;border-radius:14px 14px 0 0"></div><div class="skel" style="height:420px;margin-top:2px;border-radius:0 0 14px 14px"></div>';
  let list=[];
  try{ list=await calFetch(ym,!!force); }
  catch(e){ toast('캘린더 로드 실패: '+(e.message||e),'err'); }
  if(seq!==CAL_SEQ||S.ym!==ym) return;    // 빠르게 이전/다음을 누른 경우 최신 요청만 반영
  $('#wrap').innerHTML=calHtml(list,ym);
  calPrefetch(ym);
}
function shiftMonth(delta){
  let [y,m]=S.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  S.ym=`${y}-${String(m).padStart(2,'0')}`;
  renderCalendar();
}

function hbRange(preset){
  const t=kstToday(); const d=new Date(t+'T00:00:00');
  const pad=n=>String(n).padStart(2,'0');
  const f=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  if(preset==='w'){ const s2=new Date(d); s2.setDate(d.getDate()-6); return {from:f(s2), to:t}; }
  if(preset==='m'){ return {from:t.slice(0,8)+'01', to:t}; }
  if(preset==='pm'){ const y=new Date(d.getFullYear(), d.getMonth()-1, 1);
    const e=new Date(d.getFullYear(), d.getMonth(), 0); return {from:f(y), to:f(e)}; }
  if(preset==='3m'){ const s2=new Date(d.getFullYear(), d.getMonth()-2, 1); return {from:f(s2), to:t}; }
  return {from:t.slice(0,8)+'01', to:t};
}

      <thead><tr><th>제품코드</th><th>제품명</th><th>생산일수</th><th>기간</th><th>생산량</th><th>비중</th><th>배분 운영시간</th><th>시간당</th><th>일자별</th></tr></thead>
      <tbody>${d.length?d.map(x=>{
        const kh=x.kg_per_hr!=null?Number(x.kg_per_hr):null;
        const dev=(kh!=null&&avgHr>0)?((kh-avgHr)/avgHr*100):null;
        const open=HB.dOpen===x.prod_code;
        return `<tr${open?' style="background:#eef4ff"':''}>
        <td class="mono">${x.prod_code}</td><td class="l">${x.prod_name||'-'}</td>
        <td class="mono">${fmt(x.work_days)}일</td>
        <td class="mono" style="font-size:11.5px;color:var(--sub)">${String(x.first_date).slice(5)} ~ ${String(x.last_date).slice(5)}</td>
        <td class="mono"><b>${fmt(Math.round(x.qty_kg))}</b>kg</td>
        <td class="mono">${tot>0?(x.qty_kg/tot*100).toFixed(1)+'%':'–'}</td>
        <td class="mono">${Number(x.run_min)>0?(Number(x.run_min)/60).toFixed(1)+'hr':'–'}</td>
        <td class="mono">${kh!=null?`<b>${fmt(Math.round(kh))}</b>kg/hr${dev!=null?`<div style="font-size:9.5px;font-weight:800;color:${dev>=0?'#0d8a4f':'#c4320a'}">${dev>=0?'+':'−'}${Math.abs(dev).toFixed(0)}% <span style="color:#98a2b3;font-weight:700">평균대비</span></div>`:''}`:'–'}</td>
        <td><button class="rowbtn" onclick="hbDaily('${String(x.prod_code).replace(/'/g,"\\'")}')">${open?'닫기':'일자별 ▸'}</button></td>
      </tr>${open?`<tr><td colspan="9" style="padding:0;background:#f7f9fc"><div id="hbDailyBox" style="padding:12px 14px"></div></td></tr>`:''}`;}).join('')
        :'<tr><td colspan="9" style="text-align:center;color:var(--mut);padding:24px">해당 기간 생산 실적이 없습니다</td></tr>'}</tbody>
      </table></div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:9px;line-height:1.6">
        ※ <b>배분 운영시간</b>은 호기 전체 운영시간을 제품별 생산량 비중으로 나눈 <b>추정치</b>입니다.
        ⑤에서 오더를 지정해 가동을 등록하면 그 제품은 실측값으로 바뀝니다.</div>
    </div>
  </div>`;
}
async function hbDaily(prod){
  if(HB.dOpen===prod){ HB.dOpen=null; hbDetailPaint(); return; }
  HB.dOpen=prod; hbDetailPaint();
  const box=$('#hbDailyBox'); if(box) box.innerHTML='<div class="skel" style="height:120px;border-radius:10px"></div>';
  let rows=[];
  try{
    const {data,error}=await sb.rpc('hoki_product_daily',
      {p_team:HB.team,p_from:HB.from,p_to:HB.to,p_line:HB.dLine,p_hoki:HB.dHoki,p_prod:prod});
    if(error)throw error; rows=data||[];
  }catch(e){ toast('일자별 조회 실패: '+(e.message||e),'err'); }
  const b=$('#hbDailyBox'); if(!b) return;
  const tq=rows.reduce((a,x)=>a+Number(x.qty_kg||0),0);
  const tm=rows.reduce((a,x)=>a+Number(x.run_min||0),0);
  const avg=tm>0?tq/(tm/60):0;
  const vals=rows.filter(x=>x.kg_per_hr!=null).map(x=>Number(x.kg_per_hr));
  const mx=vals.length?Math.max(...vals):0, mn=vals.length?Math.min(...vals):0;
  b.innerHTML=`
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:9px;font-size:12px">
      <b style="font-size:12.5px;color:#243b63">${prod} · 일자별 생산</b>
      <span style="color:#5a6b85">${rows.length}일 · ${fmt(Math.round(tq))}kg · ${(tm/60).toFixed(1)}hr</span>
      <span style="padding:2px 9px;border-radius:99px;background:#eaf4ff;border:1px solid #b9d4f5;color:#1d4ed8;font-weight:800">평균 ${tm>0?fmt(Math.round(avg)):'–'} kg/hr</span>
      ${vals.length>1?`<span style="color:#7a8699">최고 ${fmt(Math.round(mx))} · 최저 ${fmt(Math.round(mn))} kg/hr</span>`:''}
    </div>
    <table class="tdd-table" style="min-width:0">
      <thead><tr><th>일자</th><th>생산량</th><th>운영시간</th><th>시간당</th><th>평균대비</th><th>산출근거</th></tr></thead>
      <tbody>${rows.length?rows.map(x=>{
        const kh=x.kg_per_hr!=null?Number(x.kg_per_hr):null;
        const dv=(kh!=null&&avg>0)?((kh-avg)/avg*100):null;
        return `<tr>
          <td class="mono">${String(x.work_date).slice(5)}</td>
          <td class="mono"><b>${fmt(Math.round(x.qty_kg))}</b>kg</td>
          <td class="mono">${Number(x.run_min)>0?(Number(x.run_min)/60).toFixed(1)+'hr':'–'}</td>
          <td class="mono">${kh!=null?`<b>${fmt(Math.round(kh))}</b>`:'–'}</td>
          <td class="mono">${dv!=null?`<b style="color:${dv>=0?'#0d8a4f':'#c4320a'}">${dv>=0?'+':'−'}${Math.abs(dv).toFixed(0)}%</b>`:'–'}</td>
          <td><span style="font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;${x.run_src==='direct'?'background:#eaf8f0;border:1px solid #a7e3c4;color:#0d6b40':(x.run_src==='share'?'background:#f4f1ff;border:1px solid #cfc3f0;color:#5a3fb8':'background:#f1f4f9;border:1px solid #d8e0ec;color:#8a94a6')}" title="${x.run_src==='direct'?'⑤에서 이 오더로 직접 등록된 가동시간':(x.run_src==='share'?'호기 전체 가동시간을 생산량 비중으로 배분한 추정치':'가동시간 기록이 없습니다')}">${x.run_src==='direct'?'실측':(x.run_src==='share'?'배분':'없음')}</span></td>
        </tr>`;}).join('')
        :'<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:18px">일자별 실적이 없습니다</td></tr>'}</tbody>
    </table>`;
}

/* ============ 개선접수 게시판 ============ */
let IMPROVE_FILTER=null;
let IMPROVE_CACHE=[];
async function renderImprove(){
  $('#wrap').innerHTML='<div class="skel" style="height:400px;border-radius:14px"></div>';
  await loadImprove();
}
async function loadImprove(){
  const isAdmin=S.user.role==='admin';
  let stats={},list=[];
  try{
    const [st,lst]=await Promise.all([
      sb.rpc('get_improve_stats'),
      sb.rpc('get_improvements',{p_status:IMPROVE_FILTER})
    ]);
    stats=st.data||{}; list=lst.data||[];
  }catch(e){ toast('개선접수 조회 실패: '+(e.message||e),'err'); }
  IMPROVE_CACHE=list;

  const statusMeta={
    received:{ko:'접수',cls:'st-received'},
    review:{ko:'검토중',cls:'st-review'},
    done:{ko:'완료',cls:'st-done'}
  };
  const cards=list.map(im=>{
    const sm=statusMeta[im.status]||statusMeta.received;
    const dt=new Date(im.created_at).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'});
    const answerBox=im.answer?`
      <div class="im-answer">
        <div class="im-answer-hd">💬 관리자 답변 · ${im.answer_by||''} · ${im.answer_at?new Date(im.answer_at).toLocaleDateString('ko-KR'):''}</div>
        <div class="im-answer-body">${(im.answer||'').replace(/\n/g,'<br>')}</div>
      </div>`:'';
    const isMine=im.writer===S.user.name;
    let btns='';
    if(isAdmin || isMine){
      btns=`<div class="im-admin">
        ${isAdmin?`<button class="rowbtn edit" onclick="openAnswer(${im.id})">답변/상태변경</button>`:''}
        ${isMine?`<button class="rowbtn edit" onclick="openEditImprove(${im.id})">수정</button>`:''}
        ${(isAdmin||isMine)?`<button class="rowbtn del" onclick="delImprove(${im.id})">삭제</button>`:''}
      </div>`;
    }
    return `<div class="im-card">
      <div class="im-top">
        <h4>${im.title}</h4>
        <span class="im-status ${sm.cls}">${sm.ko}</span>
      </div>
      <div class="im-meta">작성자 ${im.writer||'-'}${im.writer_team?' · '+im.writer_team:''} · ${dt}${isMine?' · <b style="color:var(--blue)">내 글</b>':''}</div>
      <div class="im-body">${(im.content||'').replace(/\n/g,'<br>')}</div>
      ${answerBox}
      ${btns}
    </div>`;
  }).join('');

  const chip=(key,label)=>`<button class="im-chip ${IMPROVE_FILTER===key?'on':''}" onclick="filterImprove(${key===null?'null':`'${key}'`})">${label}</button>`;

  $('#wrap').innerHTML=`
  <div class="day-hd"><div><h2>시스템 개선접수</h2>
    <div class="en">IMPROVEMENT REQUESTS · 현장 개선 제안</div></div>
    <div class="meta">전체 ${stats.total||0}건</div></div>

  <!-- 통계 스코어카드 -->
  <div class="score-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="sc"><div class="l">전체</div><div class="v mono">${stats.total||0}</div></div>
    <div class="sc" style="--acc:#c2410c"><div class="l">접수</div><div class="v mono" style="color:#c2410c">${stats.received||0}</div></div>
    <div class="sc b"><div class="l">검토중</div><div class="v mono" style="color:var(--blue)">${stats.review||0}</div></div>
    <div class="sc g"><div class="l">완료</div><div class="v mono" style="color:var(--grn)">${stats.done||0}</div></div>
  </div>

  <!-- 등록 폼 -->
  <div class="sec"><div class="sec-hd"><span class="no c1">＋</span><h3>개선요청 등록</h3>
    <span class="desc">작성자: ${S.user.name}</span></div>
    <div class="sec-bd">
      <input id="imTitle" placeholder="제목" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:10px;box-sizing:border-box">
      <textarea id="imContent" placeholder="요청 내용" style="width:100%;min-height:110px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;resize:vertical;font-family:inherit"></textarea>
      <div style="text-align:right;margin-top:12px"><button class="tbtn submit" onclick="addImprove()">등록</button></div>
    </div>
  </div>

  <!-- 필터 -->
  <div class="im-filters">
    ${chip(null,'전체')}${chip('received','접수')}${chip('review','검토중')}${chip('done','완료')}
  </div>

  <!-- 목록 -->
  <div class="im-list">${cards||'<div style="color:var(--mut);padding:30px;text-align:center">등록된 개선요청이 없습니다.</div>'}</div>`;
}
function filterImprove(status){ IMPROVE_FILTER=status; loadImprove(); }
async function addImprove(){
  const title=$('#imTitle').value.trim(), content=$('#imContent').value.trim();
  if(!title){ toast('제목을 입력하세요','err'); return; }
  try{
    const {error}=await sb.rpc('add_improvement',{p_title:title,p_content:content,p_writer:S.user.name,p_team:S.user.team});
    if(error)throw error;
    toast('개선요청 등록완료','ok');
    // 관리자 전체에게 등록 알림 메일
    getAdminEmails().then(emails=>{
      emails.forEach(em=>sendImproveMail('new', em, {
        title, writer:S.user.name, team:S.user.team||'', content:content.slice(0,500)
      }));
    });
    loadImprove();
  }catch(e){ toast('등록 실패: '+(e.message||e),'err'); }
}

async function submitAnswer(id){
  const answer=$('#anText').value.trim(), status=$('#anStatus').value;
  const im=(IMPROVE_CACHE||[]).find(x=>String(x.id)===String(id))||{};
  const prevStatus=im.status||'received';
  try{
    const {error}=await sb.rpc('answer_improvement',{p_id:id,p_answer:answer,p_status:status,p_by:S.user.name});
    if(error)throw error;
    toast('답변 저장완료','ok');
    document.getElementById('answerModal').remove();
    // 상태가 바뀌었으면 작성자에게 알림 (본인이 본인 글 처리한 경우는 제외)
    if(im.writer && im.writer!==S.user.name){
      const stKo={received:'접수',review:'검토중',done:'완료'};
      getEmailByName(im.writer).then(em=>{
        if(em) sendImproveMail('status', em, {
          title:im.title||'', writer:im.writer,
          status_ko:stKo[status]||status, answer:(answer||'').slice(0,500),
          by:S.user.name
        });
      });
    }
    loadImprove();
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function delImprove(id){
  if(!confirm('이 개선요청을 삭제할까요?'))return;
  try{ await sb.rpc('del_improvement',{p_id:id});
    toast('삭제완료','ok'); loadImprove();
  }catch(e){ toast('삭제 실패','err'); }
}
/* 개선접수 메일 발송 (JSONP · 응답 대기 안 함). kind='new'(등록→관리자) | 'status'(상태변경→작성자) */
function sendImproveMail(kind, toEmail, params){
  if(!toEmail) return;
  const q=new URLSearchParams(Object.assign({
    action:'improve_mail', kind, to:toEmail, url:location.origin
  }, params||{}));
  const cb='imMailCb_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  window[cb]=(r)=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); };
  const s=document.createElement('script');
  s.src=`${MES_WEBAPP_URL}?${q.toString()}&callback=${cb}`;
  s.onerror=()=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); };
  document.body.appendChild(s);
}
// 관리자(admin) 전체 이메일 목록
async function getAdminEmails(){
  try{
    const {data}=await sb.rpc('get_users',{p_team:null});
    return (data||[]).filter(u=>u.role==='admin'&&u.email&&u.active).map(u=>u.email);
  }catch(e){ return []; }
}
// 이름으로 이메일 찾기 (작성자 알림용)
async function getEmailByName(name){
  try{
    const {data}=await sb.rpc('get_users',{p_team:null});
    const u=(data||[]).find(x=>x.name===name&&x.email);
    return u?u.email:'';
  }catch(e){ return ''; }
}

/* ============ 팀별 월간 종합일보 (드릴다운) ============ */
let TR={team:null,from:null,to:null,charts:[]};
function ymRange(ym){
  const [y,m]=ym.split('-').map(Number);
  const from=`${ym}-01`;
  const last=new Date(y,m,0).getDate();
  const to=`${ym}-${String(last).padStart(2,'0')}`;
  return {from,to};
}
async function openTeamReport(team,ym){
  const {from,to}=ymRange(ym);
  TR={team,from,to,ym,unit:'day',kind:'fin',charts:[]};   // 기본 완제품 — 반제품은 공정마다 재집계되어 중복
  S.view='teamreport';
  $('#wrap').innerHTML='<div class="skel" style="height:500px;border-radius:14px"></div>';
  await loadTeamReport();
}

function setTRTeam(t){ TR.team=t; loadTeamReport(); }

let TD={team:null,ym:null,from:null,to:null,tab:'order',kind:null,charts:[]};
async function openTeamDetail(team,ym){
  const {from,to}=ymRange(ym);
  TD={team,ym,from,to,tab:'order',kind:'fin',charts:[]};   // 기본 완제품
  S.view='teamdetail';
  $('#wrap').innerHTML='<div class="skel" style="height:500px;border-radius:14px"></div>';
  await loadTeamDetail();
}
function shiftTeamDetail(delta){
  let [y,m]=TD.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  openTeamDetail(TD.team,`${y}-${String(m).padStart(2,'0')}`);
}
function applyTDPeriod(){
  const f=$('#tdFrom').value, t=$('#tdTo').value;
  if(f&&t){ TD.from=f; TD.to=t; TD.ym=f.slice(0,7); loadTeamDetail(); }
}

      sb.rpc('team_scrap_types',{p_team:TD.team,p_from:TD.from,p_to:TD.to}),

    <!-- 라인별 성과와 손실 표 -->

    <div class="dash-2col">
      <div class="sec"><div class="sec-hd"><span class="no c2">◆</span><h3>오더별 리스크 우선순위</h3>

      const el=$('#'+id); if(!el)return;

      const c=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:donutColors}]},

      TD.charts.push(c);
    };
    mkDonut('tdScrap',sc.map(x=>x.scrap_type),sc.map(x=>Math.round(x.amt)));

      const od=data||[];

        <div style="text-align:right"><div class="rank-v ${o.defect_qty>0?'neg':''}">불량 ${fmt(o.defect_qty)}</div><div class="rank-s">스크랩 ${fmtWon(o.scrap_amt)}</div></div>
      </div>`).join('')||'<div style="color:var(--mut);padding:16px">데이터 없음</div>';
    });

    // 제품별 품질 우선순위
    sb.rpc('team_product_quality',{p_team:TD.team,p_from:TD.from,p_to:TD.to,p_limit:8}).then(({data})=>{
      const pd=data||[];
      const el=$('#productQualBody');
      if(el) el.innerHTML=pd.map(p=>`<div class="rank-row">
        <div><div class="rank-t">${p.prod_name||'-'}</div><div class="rank-s">${p.order_cnt}개 오더 · 실적 ${fmt(Math.round(p.actual))}</div></div>
        <div style="text-align:right"><div class="rank-v ${p.defect_rate>0?'neg':''}">${p.defect_rate}%</div><div class="rank-s">불량 ${fmt(p.defect_qty)}</div></div>
      </div>`).join('')||'<div style="color:var(--mut);padding:16px">데이터 없음</div>';
    });

    loadTDTab();
  }catch(e){ toast('팀 상세 조회 실패: '+(e.message||e),'err'); }
}
function setTDTab(t){ TD.tab=t; document.querySelectorAll('.ldtab').forEach(b=>b.classList.remove('on')); $('#tdtab_'+t).classList.add('on'); loadTDTab(); }
function setTDKind(k){ TD.kind=k||null; loadTeamDetail(); }

/* ═══════════════════════════════════════════════════════════════════
   전체보기 → 오더별/제품별 드릴다운
   ── 스크롤(헤더 고정) · 검색 필터 · 컬럼 정렬 지원
   ── 데이터는 TDD 에 보관하고 표만 다시 그린다 (재조회 없음 = 즉시 반응)
   ═══════════════════════════════════════════════════════════════════ */
let TDD={kind:null, rows:[], q:'', sk:null, sd:-1};
const TDD_COLS={
  order:[
    {k:'prod_code', t:'제품코드', ty:'s', cls:'mono'},
    {k:'prod_name', t:'제품명',   ty:'s', cls:'l'},
    {k:'line',      t:'라인',     ty:'s', cls:'sub'},
    {k:'kind',      t:'구분',     ty:'s', cls:'tag'},
    {k:'plan_sum',  t:'계획',     ty:'n', cls:'mono', f:v=>fmt(Math.round(v||0))},
    {k:'actual_sum',t:'실적',     ty:'n', cls:'mono', f:v=>fmt(Math.round(v||0))},
    {k:'achieve',   t:'달성률',   ty:'n', cls:'mono', f:v=>(v==null?'–':v+'%'), c:v=>v>=100?'pos':'neg'},
    {k:'productivity',t:'생산성', ty:'n', cls:'mono', f:v=>v>0?fmt(v):'–'},
    {k:'scrap_rate',t:'스크랩률', ty:'n', cls:'mono', f:v=>v>0?v+'%':'–'},
    {k:'defect_rate',t:'불량률',  ty:'n', cls:'mono', f:v=>v>0?v+'%':'–'},
    {k:'unplan_min',t:'비계획정지',ty:'n', cls:'mono', f:v=>v>0?fmt(v)+'분':'–'},
    {k:'net_loss',  t:'로스금액', ty:'n', cls:'mono', f:v=>fmtWon(v), c:v=>wonCls(v)}
  ],
  product:[
    {k:'prod_name', t:'제품명',   ty:'s', cls:'l'},
    {k:'order_cnt', t:'오더수',   ty:'n', cls:'mono'},
    {k:'plan_sum',  t:'계획',     ty:'n', cls:'mono', f:v=>fmt(Math.round(v||0))},
    {k:'actual_sum',t:'실적',     ty:'n', cls:'mono', f:v=>fmt(Math.round(v||0))},
    {k:'achieve',   t:'달성률',   ty:'n', cls:'mono', f:v=>(v==null?'–':v+'%'), c:v=>v>=100?'pos':'neg'},
    {k:'scrap_rate',t:'스크랩률', ty:'n', cls:'mono', f:v=>v>0?v+'%':'–'},
    {k:'defect_rate',t:'불량률',  ty:'n', cls:'mono', f:v=>v>0?v+'%':'–'},
    {k:'net_loss',  t:'로스금액', ty:'n', cls:'mono', f:v=>fmtWon(v), c:v=>wonCls(v)}
  ]
};
async function openTDDrill(kind){
  S.view='tddrill';
  $('#wrap').innerHTML='<div class="skel" style="height:500px;border-radius:14px"></div>';
  const p={p_team:TD.team,p_from:TD.from,p_to:TD.to,p_kind:null};
  try{
    const {data}=await sb.rpc(kind==='order'?'team_order_detail':'team_product_detail',p);
    TDD={kind:(kind==='order'?'order':'product'), rows:data||[], q:'', sk:null, sd:-1};
    $('#wrap').innerHTML=tddShell();
    tddPaint();
  }catch(e){ toast('드릴다운 조회 실패: '+(e.message||e),'err'); }
}
function tddShell(){
  const isOrd=TDD.kind==='order';
  return `
  <div class="tr-hero"><div>
    <div class="tr-crumb" onclick="openTeamDetail('${TD.team}','${TD.ym}')" style="cursor:pointer">← 뒤로 · ${TD.team} 경영현황</div>
    <h2>${isOrd?'오더별':'제품별'} 드릴다운</h2>
    <div class="en">${isOrd?'제품코드(오더)':'제품명'} 단위 전체 · <span id="tddCnt">${TDD.rows.length}</span>건 · ${TD.from} ~ ${TD.to}</div></div>
    <div class="tr-nav"><button class="tr-cal" onclick="go('cal')">캘린더</button></div></div>
  <div class="sec">
    <div class="sec-hd" style="gap:8px;flex-wrap:wrap">
      <input id="tddQ" placeholder="제품코드·제품명·라인 검색" oninput="tddFilter(this.value)" autocomplete="off"
             style="flex:1;min-width:200px;max-width:340px;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px">
      <span id="tddSortInfo" style="font-size:11.5px;color:var(--mut)"></span>
      <span class="sp" style="flex:1"></span>
      <button class="tbtn" onclick="tddReset()" title="검색·정렬 초기화">↺ 초기화</button>
    </div>
    <div class="sec-bd" style="padding-top:0">
      <div class="tdd-scroll"><table class="tdd-table" id="tddTable"></table></div>
    </div>
  </div>`;
}
function tddFilter(v){ TDD.q=String(v||''); tddPaint(); }
function tddReset(){ TDD.q=''; TDD.sk=null; TDD.sd=-1; const q=$('#tddQ'); if(q)q.value=''; tddPaint(); }
function tddSort(k){
  if(TDD.sk===k) TDD.sd=-TDD.sd; else { TDD.sk=k; TDD.sd=-1; }   // 첫 클릭은 내림차순(큰 값 먼저)
  tddPaint();
}
function tddPaint(){
  const cols=TDD_COLS[TDD.kind]||[];
  const q=TDD.q.trim().toLowerCase();
  let rows=TDD.rows;
  if(q) rows=rows.filter(r=>cols.some(c=>c.ty==='s'&&String(r[c.k]||'').toLowerCase().includes(q)));
  if(TDD.sk){
    const col=cols.find(c=>c.k===TDD.sk)||{ty:'s'};
    rows=rows.slice().sort((a,b)=>{
      if(col.ty==='n'){ const x=Number(a[TDD.sk])||0, y=Number(b[TDD.sk])||0; return (x-y)*TDD.sd; }
      return String(a[TDD.sk]||'').localeCompare(String(b[TDD.sk]||''),'ko')*TDD.sd;
    });
  }
  const th=cols.map(c=>{
    const on=TDD.sk===c.k;
    const ar=on?(TDD.sd<0?'▼':'▲'):'<span style="opacity:.3">↕</span>';
    return `<th class="tdd-th${on?' on':''}" onclick="tddSort('${c.k}')" title="클릭하면 이 컬럼으로 정렬합니다">${c.t} ${ar}</th>`;
  }).join('');
  const body=rows.length?rows.map(o=>'<tr>'+cols.map(c=>{
    const v=o[c.k];
    const txt=c.f?c.f(v):(v==null?'–':(c.ty==='n'?fmt(v):v||'-'));
    if(c.cls==='tag') return `<td><span class="kind-tag ${v==='완제품'?'fin':v==='반제품'?'semi':''}">${v||'-'}</span></td>`;
    if(c.cls==='sub') return `<td style="font-size:12px;color:var(--sub)">${v||'-'}</td>`;
    const extra=c.c?(' '+c.c(v)):'';
    return `<td class="${c.cls||''}${extra}">${txt}</td>`;
  }).join('')+'</tr>').join('')
   :`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--mut);padding:30px">검색 결과가 없습니다</td></tr>`;
  const t=$('#tddTable'); if(t) t.innerHTML=`<thead><tr>${th}</tr></thead><tbody>${body}</tbody>`;
  const c=$('#tddCnt'); if(c) c.textContent=rows.length+(q?` / ${TDD.rows.length}`:'');
  const si=$('#tddSortInfo');

// 기간 계산: 오늘 기준 N일/개월 전 ~ 오늘
function lossPeriodRange(key){
  const t=kstToday(); const [y,m,d]=t.split('-').map(Number);
  const to=t; let from;
  const dt=new Date(y,m-1,d);
  if(key==='10d'){ dt.setDate(dt.getDate()-9); }
  else if(key==='1m'){ dt.setMonth(dt.getMonth()-1); }
  else if(key==='3m'){ dt.setMonth(dt.getMonth()-3); }
  else return {from:LD.from,to:LD.to};   // now=라인상세 기본 기간
  from=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  return {from,to};
}

async function loadProductTrend(){
  const box=document.getElementById('ptTable'); if(box)box.innerHTML='<div class="skel" style="height:60px;border-radius:10px"></div>';
  if(PT.chart){try{PT.chart.destroy()}catch(e){}PT.chart=null;}
  PT.metric=PT.metric||'actual';   // actual(실적) | achieve(달성률)
  try{
    const {data,error}=await sb.rpc('product_achieve_history',{p_team:LD.team,p_prod_code:PT.code,p_limit:PT.limit});
    if(error)throw error;
    const rows=(data||[]).slice().reverse(); // 과거→현재
    PT.rows=rows;
    const cv=document.getElementById('ptChart'); if(!cv)return;
    if(!rows.length){ cv.parentNode.innerHTML='<div style="color:var(--mut);padding:40px;text-align:center">생산 이력이 없습니다.</div>';
      if(box)box.innerHTML=''; return; }
    const labels=rows.map(r=>String(r.work_date).slice(5));
    const validCnt=rows.filter(r=>r.plan_valid).length;
    let ds, yTitle, kpiHtml;
    if(PT.metric==='achieve'){
      // 달성률: 계획 정상인 날만 값, 부실한 날은 null(빈 막대)
      const vals=rows.map(r=>r.plan_valid&&r.achieve!=null?Number(r.achieve):null);
      const bg=rows.map(r=>{ if(!r.plan_valid||r.achieve==null)return '#d5dbe6'; const v=Number(r.achieve); return v>=100?'#2e9e6a':v>=90?'#4a6784':v>=70?'#c99a4a':'#c0392b'; });
      ds=[{label:'달성률(%)',data:vals,backgroundColor:bg,borderRadius:5,maxBarThickness:46}];
      yTitle='%';
      const okVals=vals.filter(v=>v!=null);
      const avg=okVals.length?(okVals.reduce((a,b)=>a+b,0)/okVals.length).toFixed(1):'–';
      const mx=okVals.length?Math.max(...okVals):'–', mn=okVals.length?Math.min(...okVals):'–';
      const kpi='display:inline-block;padding:5px 12px;background:#f1f4fa;border-radius:8px;font-size:12.5px';
      kpiHtml=`<span style="${kpi}">평균 <b>${avg}%</b></span>
        <span style="${kpi};color:#2e9e6a">최고 <b>${mx}%</b></span>
        <span style="${kpi};color:#c0392b">최저 <b>${mn}%</b></span>
        <span style="${kpi}">계획정상 <b>${validCnt}/${rows.length}회</b></span>`;
    }else{
      // 실적량: 항상 정확
      const vals=rows.map(r=>Number(r.actual_sum));
      ds=[{label:'실적량(KG)',data:vals,backgroundColor:'#4a6784',borderRadius:5,maxBarThickness:46}];
      yTitle='KG';
      const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(0);
      const mx=Math.max(...vals), mn=Math.min(...vals);
      const kpi='display:inline-block;padding:5px 12px;background:#f1f4fa;border-radius:8px;font-size:12.5px';
      kpiHtml=`<span style="${kpi}">평균 <b>${fmt(Math.round(avg))}</b></span>
        <span style="${kpi};color:#2e9e6a">최다 <b>${fmt(Math.round(mx))}</b></span>
        <span style="${kpi};color:#c17a5a">최소 <b>${fmt(Math.round(mn))}</b></span>
        <span style="${kpi}">회차 <b>${rows.length}회</b></span>`;
    }
    PT.chart=new Chart(cv,{type:'bar',
      data:{labels,datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const r=rows[c.dataIndex];
          return [' 실적 '+fmt(r.actual_sum)+' / 계획 '+fmt(r.plan_sum), r.plan_valid?(' 달성률 '+r.achieve+'%'):' (계획 미입력·달성률 제외)'];}}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>v+(yTitle==='%'?'%':'')}}}}});
    const warn=(PT.metric==='achieve'&&validCnt<rows.length)?`<div style="font-size:11.5px;color:#c2410c;margin-bottom:8px">⚠ 계획 미입력(회색) ${rows.length-validCnt}건은 달성률에서 제외됩니다.</div>`:'';
    if(box)box.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">${kpiHtml}</div>${warn}
      <table style="width:100%;font-size:12.5px"><thead><tr><th style="text-align:left">일자</th><th>계획</th><th>실적</th><th>달성률</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>`<tr><td class="l">${r.work_date}</td><td class="mono">${fmt(r.plan_sum)}</td><td class="mono">${fmt(r.actual_sum)}</td><td class="mono ${r.plan_valid?(r.achieve>=90?'pos':'neg'):'mut'}">${r.plan_valid?r.achieve+'%':'–'}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){ if(box)box.innerHTML='<div style="color:var(--red);padding:12px">조회 실패: '+(e.message||e)+'</div>'; }
}

  const m=document.createElement('div'); m.id='osModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,22,40,.5);display:grid;place-items:center;z-index:999;padding:20px';

  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m)m.remove(); });
  try{
    const {data,error}=await sb.rpc('order_summary_popup',{p_team:LD.team,p_prod_code:code,p_from:LD.from,p_to:LD.to});
    if(error)throw error;
    const d=data||{};
    const plan=Number(d.plan_sum||0), act=Number(d.actual_sum||0);
    const planValid=plan>1;

/* ============ 경영 대시보드 ============ */
let DASH={from:null,to:null,team:null,kind:'fin',charts:[],month:null,custom:false};
// 'YYYY-MM' → 그 달의 1일, 말일
function monthBounds(ym){
  const [y,m]=ym.split('-').map(Number);
  const first=`${ym}-01`;
  const last=new Date(y,m,0).getDate(); // m월의 말일
  const lastStr=`${ym}-${String(last).padStart(2,'0')}`;
  return {from:first,to:lastStr};
}
function dashShiftMonth(ym,delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function dashMonthMove(delta){
  DASH.month=dashShiftMonth(DASH.month,delta);
  const b=monthBounds(DASH.month); DASH.from=b.from; DASH.to=b.to;
  DASH.custom=false;
  renderDashboard();
}
// 기간 직접 지정 조회 (여러 달 가능, 넓으면 경고)
function dashCustomRange(){
  const f=$('#dashFrom').value, t=$('#dashTo').value;
  if(!f||!t){ toast('시작일과 종료일을 모두 지정하세요','err'); return; }
  if(f>t){ toast('시작일이 종료일보다 늦습니다','err'); return; }
  const days=(new Date(t)-new Date(f))/86400000;
  if(days>92 && !confirm(`조회 기간이 ${Math.round(days)}일입니다.\n기간이 넓으면 조회가 느려질 수 있습니다(수 초 소요).\n계속할까요?`)) return;
  DASH.from=f; DASH.to=t; DASH.custom=true;

}

function renderParetoRows(data){
  const tot=data.reduce((s,d)=>s+Number(d.total_loss||0),0);
  return data.map(d=>{

    return `<tr><td class="l">${d.scrap_type}</td>
      <td class="mono neg">${fmt(Math.round(d.total_loss))}원</td>
      <td class="mono">${d.cnt}</td>
      <td class="mono">${pctv.toFixed(1)}%</td></tr>`;
  }).join('')||'<tr><td colspan="4" style="color:var(--mut);padding:16px">로스유형 저장 데이터 없음</td></tr>';
}

/* ════════════════════════════════════════════════════════════════════
   대시보드 추이 기간 토글 (당월 / 당월 일자별 / 3·6·12개월)
   ── 로딩 최적화 설계
     · 화면 진입 시에는 추가 호출 0회 — 기존 dash_achieve_trend / dash_loss_trend
       결과를 'now' 키로 캐시에 넣고 그대로 그린다.
     · 다른 기간은 사용자가 누를 때만 조회(lazy). 한 번 받은 구간은
       TREND_CACHE 에 보관해 재클릭 시 네트워크 0회·0ms 로 전환.
     · 달성률·로스금액을 한 번의 Promise.all 로 동시 조회(왕복 1회).
     · 팀·구분·월을 바꾸면 캐시 무효화(loadDashboard 에서 초기화).
   ════════════════════════════════════════════════════════════════════ */
let TREND_KEY='now';
let TREND_CACHE={};      // {key: {ach:[], loss:[]}}
let TREND_BUSY=false;

const TREND_TABS=[
  ['now',  '당월'],
  ['day',  '당월 일자별'],
  ['3m',   '3개월'],
  ['6m',   '6개월'],
  ['12m',  '12개월']
];

/* 기간 계산 — 기준일은 대시보드 조회 종료일(DASH.to) */
function trendRange(key){
  const base=DASH.to||kstToday();
  const [y,m]=base.split('-').map(Number);
  if(key==='now'||key==='day') return {from:DASH.from,to:DASH.to};
  const n={'3m':3,'6m':6,'12m':12}[key]||3;
  let ty=y, tm=m-(n-1);
  while(tm<1){ tm+=12; ty--; }
  const from=`${ty}-${String(tm).padStart(2,'0')}-01`;
  return {from,to:DASH.to};
}

function trendTabBar(){
  return `<div class="tr-tabs">${TREND_TABS.map(([k,lb])=>
    `<button class="tr-tab ${TREND_KEY===k?'on':''}" data-tr="${k}" onclick="switchTrend('${k}')">${lb}</button>`
  ).join('')}<span class="tr-hint" id="trHint"></span></div>`;
}

async function switchTrend(key){
  if(TREND_BUSY||key===TREND_KEY) return;
  const prev=TREND_KEY; TREND_KEY=key;
  document.querySelectorAll('.tr-tab').forEach(b=>b.classList.toggle('on',(b.dataset.tr||'')===key));
  const hint=$('#trHint');
  // 캐시 적중 → 네트워크 없이 즉시 전환
  if(TREND_CACHE[key]){
    redrawTrends(TREND_CACHE[key]);
    if(hint) hint.textContent='';
    return;
  }
  TREND_BUSY=true;
  if(hint) hint.innerHTML='<span class="tr-load">불러오는 중…</span>';
  const r=trendRange(key);
  const unit=(key==='day')?'day':'month';
  const p={p_from:r.from,p_to:r.to,p_team:DASH.team,p_kind:DASH.kind,p_unit:unit};
  const pNo={p_from:r.from,p_to:r.to,p_team:DASH.team,p_unit:unit};
  try{
    const [a,l]=await Promise.all([
      sb.rpc('dash_achieve_trend',p),
      sb.rpc('dash_loss_trend',pNo)
    ]);
    if(a.error||l.error) throw (a.error||l.error);
    const pack={ach:a.data||[], loss:l.data||[]};
    TREND_CACHE[key]=pack;
    redrawTrends(pack);
    if(hint) hint.textContent='';
  }catch(e){
    TREND_KEY=prev;
    document.querySelectorAll('.tr-tab').forEach(b=>b.classList.toggle('on',(b.dataset.tr||'')===prev));
    if(hint) hint.innerHTML='<span style="color:#b42318">조회 실패 · p_unit 인자 확인</span>';

/* ════════════════════════════════════════════════════════════════════
   BOM 관리 (설정 탭)
   ── 로딩 설계
     · 진입 시 요약 1회만 조회(집계 RPC 아닌 count) → 가볍게 시작
     · 붙여넣기 검증은 100% 클라이언트 (네트워크 0회)
     · 업로드는 upsert_bom_bulk RPC 1회 (200~2000행 한 번에)
     · 제품 트리는 펼칠 때만 조회(lazy) + 캐시
   ── 파싱 규칙
     12열 탭 구분 / 소계행(공정명·품목코드·원료코드 모두 빈 행) 제외
     공정명 "주식_진공코터 공정" → line "주식/진공코터" (첫 '_'만 치환, 끝 ' 공정' 제거)
   ════════════════════════════════════════════════════════════════════ */
let BOM_PARSED=null;       // 검증 결과 보관
let BOM_TREE_CACHE={};     // 제품별 트리 캐시

/* 공정명 → db_plan 라인 표기 */
function bomLine(proc){
  let p=String(proc||'').trim();
  p=p.replace(/\s*공정\s*$/,'');            // 끝의 " 공정" 제거
  const i=p.indexOf('_');
  return i<0 ? p : (p.slice(0,i)+'/'+p.slice(i+1));
}
/* 붙여넣기 파싱 : 12열 탭 구분 */
function parseBomPaste(text){
  const out=[], skipped=[], bad=[];
  const lines=String(text||'').split(/\r?\n/);
  lines.forEach((ln,idx)=>{
    if(!ln.trim())return;
    const c=ln.split('\t');
    if(c.length<8){ if(idx>0) bad.push(`${idx+1}행: 열 부족(${c.length})`); return; }
    const team=(c[0]||'').trim(), proc=(c[2]||'').trim();
    const item=(c[3]||'').trim(),  mat=(c[5]||'').trim();
    if(team==='팀구분'||proc==='공정명') return;              // 헤더
    if(!proc && !item && !mat){ skipped.push(idx+1); return; } // 소계 행
    if(!item||!mat){ bad.push(`${idx+1}행: 품목/원료코드 누락`); return; }
    const num=v=>{ const n=Number(String(v||'').replace(/,/g,'').trim()); return isNaN(n)?0:n; };
    const rate=num(c[7]);
    if(!(rate>0)){ bad.push(`${idx+1}행: 현장배합률 0`); return; }
    out.push({
      team, proc_name:proc, line:bomLine(proc),
      item_code:item, item_name:(c[4]||'').trim(),
      mat_code:mat,  mat_name:(c[6]||'').trim(),
      rate, rate_exact:num(c[8])||rate,
      unit:(c[9]||'').trim(), rev:(c[10]||'').trim()
    });
  });
  return {rows:out, skipped, bad};
}
/* 검증 : 제품 단위 집계 + 코터 합계 1.0 체크 */
/* 배치 내 중복 제거 : 같은 (품목·원료·버전) 은 rate 큰 행만 남김
   (Postgres 는 한 INSERT 에서 같은 PK 를 두 번 갱신할 수 없어 업로드가 실패함) */
function dedupBom(rows){
  const map=new Map(), dups=[];
  rows.forEach(r=>{
    const k=r.item_code+'|'+r.mat_code+'|'+r.rev;
    const prev=map.get(k);
    if(prev){
      dups.push({key:k, item:r.item_code, mat:r.mat_code, mat_name:r.mat_name,
                 rev:r.rev, a:prev.rate, b:r.rate});
      if(Number(r.rate)>Number(prev.rate)) map.set(k,r);   // 큰 rate 채택
    }else map.set(k,r);
  });
  return {rows:[...map.values()], dups};
}
function validateBom(rows){
  const coat={};   // item_code(코터) → {sum, name, rev, n}
  const byItem={}, revByItem={};
  rows.forEach(r=>{
    (byItem[r.item_code]=byItem[r.item_code]||[]).push(r);
    (revByItem[r.item_code]=revByItem[r.item_code]||new Set()).add(r.rev);
    if(/진공코터/.test(r.line)){
      const c=(coat[r.item_code]=coat[r.item_code]||{sum:0,name:r.item_name,rev:r.rev,n:0});
      c.sum+=Number(r.rate)||0; c.n++;
    }
  });
  const coatList=Object.keys(coat).map(k=>({code:k,...coat[k]}));
  const badSum=coatList.filter(c=>c.sum<0.99||c.sum>1.01);
  const revMix=Object.keys(revByItem).filter(k=>revByItem[k].size>1);
  return {
    rowCnt:rows.length,
    itemCnt:Object.keys(byItem).length,
    coatCnt:coatList.length,
    revCnt:new Set(rows.map(r=>r.rev)).size,
    lineSet:[...new Set(rows.map(r=>r.line))].sort(procOrderCmp),
    coatList, badSum, revMix
  };
}

/* 계보(base_code) 재전개 — 업로드 후 제품수가 0이거나 미전개가 많을 때 */
async function rebuildBomBase(){
  const btn=event&&event.target; if(btn){btn.disabled=true;btn.textContent='정리 중…';}
  try{
    const {data,error}=await sb.rpc('rebuild_bom_base');

    toast(Number(data)>0?`계보 전개 완료 · 미전개 ${fmt(data)}행 남음`:'계보 전개 완료','ok');
    renderBomMgmt();
  }catch(e){
    toast('재전개 실패: '+(e.message||e),'err');
    if(btn){btn.disabled=false;btn.textContent='↻ 계보 재전개';}
  }
}
async function renderBomMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:260px;border-radius:14px"></div>';
  // 계보 미전개는 대부분 정상(포장 SKU·생산2팀 등 코터 계보 밖).
  // 실제로 BOM 계획을 쓰는 공정(진공코터·분체배합) 기준으로만 판정한다.
  let stat={cnt:0,prod:0,coatRow:0,mixRow:0,noBaseUse:0};
  try{
    const [a,use]=await Promise.all([
      sb.from('m_bom').select('*',{count:'exact',head:true}),
      sb.from('m_bom').select('line,base_code').or('line.like.%진공코터%,line.like.%분체배합%').limit(20000)
    ]);
    stat.cnt=a.count||0;
    const u=use.data||[];
    stat.coatRow=u.filter(r=>/진공코터/.test(r.line)).length;
    stat.mixRow =u.filter(r=>/분체배합/.test(r.line)).length;
    stat.noBaseUse=u.filter(r=>!r.base_code).length;
    stat.prod=new Set(u.filter(r=>r.base_code).map(r=>r.base_code)).size;
  }catch(_){}
  BOM_PARSED=null; BOM_TREE_CACHE={};
  $('#settingsBody').innerHTML=bomBodyHtml(stat);
}
