<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 생산마감 · 하림펫푸드</title>
<style>
:root{
  --navy:#3b556e; --navy2:#4a6784; --navy3:#6b85a0;
  --smoke:#eef3f8; --card:#fff; --line:#dce4ee;
  --ink:#1f2d3d; --sub:#5a6b82; --mut:#93a1b5;
  --red:#d15a4e; --grn:#4e9a72; --grn-soft:#eef4f0;
  --blue:#4a6784; --blue-soft:#eef2f6;
  --r:12px; --sh:0 1px 2px rgba(26,58,92,.06),0 4px 16px rgba(26,58,92,.05);
  --sh-lg:0 16px 48px rgba(26,58,92,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--smoke);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* 로그인 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0f1628,#1b2740);display:grid;place-items:center;z-index:50}
.loginbox{background:#fff;border-radius:20px;padding:38px 34px;width:380px;box-shadow:var(--sh-lg);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.loginbox h2{font-size:21px;font-weight:800}
.loginbox .en{font-size:10.5px;color:var(--mut);letter-spacing:.16em;font-weight:600;margin:4px 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:7px}
.field select,.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.field select:focus,.field input:focus{outline:none;border-color:var(--navy3);background:#fff}
.btn-lg{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:11px;font-weight:800;font-size:15px;margin-top:6px}
.btn-lg:hover{background:var(--navy2)}
.err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;font-weight:600}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:18px}
.admin-link{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer}
.admin-link:hover{color:var(--sub);text-decoration:underline}
.admin-link.on{color:var(--blue)}

/* 상단바/헤더 */
.topbar{background:var(--navy);color:var(--hdr-text,#fff);height:52px;display:flex;align-items:center;padding:0 22px;gap:14px;font-size:12.5px}
.topbar .brandtag{background:rgba(255,255,255,.92);color:var(--navy);font-weight:800;border-radius:6px;padding:5px 10px}
.topbar .sys{color:var(--hdr-text,#8ea0c8);opacity:.72;font-weight:600}
.topbar .spacer{flex:1}
.topbar .who b{color:var(--hdr-text,#fff)}.topbar .who{color:var(--hdr-text,#c9d4ec);opacity:.9}
.topbar .lo{color:var(--hdr-text,#8ea0c8);opacity:.82;font-weight:600}
.header{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;gap:16px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.header h1{font-size:19px;font-weight:800}
.header .en{font-size:11px;color:var(--mut);letter-spacing:.18em;font-weight:600;margin-top:2px}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--sub)}
.nav button:hover{background:var(--smoke)}
.nav button.on{background:var(--blue-soft);color:var(--blue)}
.nav button.primary{background:var(--navy);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 80px}

/* 캘린더 */
.cal-head{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:20px 24px;display:flex;align-items:center}
.cal-head h2{font-size:18px;font-weight:800}
.cal-head .sub{font-size:12px;color:#8ea0c8;margin-top:3px}
.cal-stats{margin-left:auto;display:flex;gap:10px}
.cal-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:10px 18px;text-align:center;min-width:92px}
.cal-stat .n{font-size:24px;font-weight:800;line-height:1}
.cal-stat .l{font-size:10.5px;color:#a9b7d6;margin-top:5px}
.cal-tool{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-top:none}
.cal-nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.cal-nav button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.cal-nav button:hover{background:var(--smoke)}
.cal-nav .ym{font-weight:800;font-size:15px;min-width:96px;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{margin-left:10px;padding:7px 14px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.refresh-btn:hover{background:var(--navy2)}
.cal-grid{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow div{padding:10px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.cal-dow div:first-child{color:var(--red)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.pad{background:#fafbfd}
.cal-cell .dn{font-size:13px;font-weight:700;color:var(--sub)}
.cal-cell.today{background:rgba(38,112,201,.06);box-shadow:inset 0 0 0 2.5px var(--blue);border-radius:4px}
.cal-cell.today .dn{color:var(--blue);display:flex;align-items:center;gap:5px}
.today-badge{background:var(--blue);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.03em}
.cal-tag{display:block;width:100%;text-align:left;margin-top:5px;font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;border:1px solid;background:#fff7ed;color:#c2410c;border-color:#fed7aa;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;transform-origin:left center}
.cal-tag:hover{transform:scale(1.05);box-shadow:0 3px 10px rgba(26,58,92,.18);filter:brightness(1.03);position:relative;z-index:3}
.cal-tag:active{transform:scale(.97)}
.cal-tag.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.cal-tag.submitted{background:#eff6ff;color:#2563eb;border-color:#c7dbff}
.cal-tag.done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.cal-tag.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca}
.cal-tag.draft{background:#f8fafc;color:#6b7690;border-color:#e4e8f0}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid}
.chip.planned{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.chip.submitted{background:#eff6ff;color:#2563eb;border-color:#c7dbff}
.chip.done{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.chip.rejected{background:#fef2f2;color:#ef4444;border-color:#fecaca}

/* 패널/업로드 */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.panel-hd{background:var(--navy);color:#fff;padding:20px 24px;border-radius:var(--r) var(--r) 0 0}
.panel-hd h2{font-size:19px;font-weight:800}
.panel-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.panel-bd{padding:24px}
.pick{margin-bottom:20px}
.pick label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:9px}
.pick input[type=date]{padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke)}
.paste-area{width:100%;min-height:220px;padding:14px;border:1.5px solid var(--line);border-radius:11px;background:var(--smoke);font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.paste-area:focus{outline:none;border-color:var(--navy3);background:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.upload-result{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none}
.upload-result.ok{background:var(--grn-soft);color:var(--grn);display:block}
.upload-result.err{background:#fef2f2;color:var(--red);display:block}

/* 토스트 */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--sh-lg);opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#15803d}#toast.err{background:var(--red)}
.skel{background:linear-gradient(90deg,#eef1f7 25%,#e3e8f2 37%,#eef1f7 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===== PO 화면 ===== */
.po-back{margin-bottom:14px}
.po-back button{padding:8px 16px;border:1px solid var(--line);border-radius:9px;font-weight:700;color:var(--sub);background:#fff}
.po-back button:hover{background:var(--smoke)}
.day-hd{background:linear-gradient(135deg,#0f1628,#26365a);color:#fff;border-radius:var(--r);padding:22px 26px;display:flex;align-items:center;margin-bottom:16px}
.day-hd h2{font-size:20px;font-weight:800}
.day-hd .en{font-size:11px;color:#8ea0c8;letter-spacing:.14em;margin-top:3px}
.day-hd .meta{margin-left:auto;text-align:right;font-size:13px;color:#a9b7d6}
.day-hd .meta b{color:#fff;font-size:18px}
.po-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.po-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s}
.po-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.po-card .po-t{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.po-card .po-team{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.po-card .po-sub{font-size:12px;color:var(--mut);margin-top:4px}
.po-card .po-stats{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.po-card .po-stat{flex:1}
.po-card .po-stat .l{font-size:10.5px;color:var(--sub);font-weight:600}
.po-card .po-stat .v{font-size:18px;font-weight:800;margin-top:3px}
.po-card .achieve-badge{margin-left:auto;font-size:20px;font-weight:800}
.po-card .achieve-badge.g{color:var(--grn)}.po-card .achieve-badge.r{color:var(--red)}
.po-card .scrap-warn{font-size:11px;color:var(--red);font-weight:700;margin-top:8px}

/* PO 상세 */
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.sec-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfe,#fff)}
.sec-hd .no{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(26,58,92,.25)}
/* 섹션별 색조 (스크롤 시 인지) */
.no.c1{background:linear-gradient(135deg,#2670c9,#4a90d9)!important}
.no.c2{background:linear-gradient(135deg,#0e8a8a,#16b3b3)!important}
.no.c3{background:linear-gradient(135deg,#c2410c,#e8813a)!important}
.no.c4{background:linear-gradient(135deg,#c0392b,#e0483a)!important}
.no.c5{background:linear-gradient(135deg,#6d28d9,#8b5cf6)!important}
.no.c6{background:linear-gradient(135deg,#15803d,#22a55a)!important}
.no.cx{background:linear-gradient(135deg,#475569,#64748b)!important}
.sec-hd{background:linear-gradient(100deg,#fbfdff,#f2f7fc)}
.sec-hd h3{font-size:15.5px;font-weight:800}
.sec-hd .desc{font-size:12px;color:var(--mut)}
.sec-hd .sp{flex:1}
.sec-bd{padding:16px 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:#fff;padding:10px;font-weight:700;font-size:12px;text-align:center;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid #eef3f8;text-align:center}
tbody tr:nth-child(even){background:#f8fbfe}
tbody tr:hover{background:var(--grn-soft)}
tbody td.l{text-align:left}
.inp-cell{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;background:#fffdf5}
.inp-cell:focus{outline:none;border-color:var(--navy3);background:#fff}
.kind-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.kind-badge.fin{background:var(--blue-soft);color:var(--blue)}
.kind-badge.semi{background:#fef9c3;color:#a16207}
.pos{color:var(--grn);font-weight:700}.neg{color:var(--red);font-weight:700}
.tbtn{padding:9px 15px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:13px;color:var(--sub);background:#fff}
.tbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.work-field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.work-field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--smoke)}
.work-field input:focus{outline:none;border-color:var(--navy3);background:#fff}
@media(max-width:640px){.work-grid{grid-template-columns:1fr 1fr}}
/* 스코어카드 */
.score-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.score-row .sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.score-row .sc:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.score-row .sc::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--navy3)}
.score-row .sc.g::after{background:var(--grn)}.score-row .sc.r::after{background:var(--red)}.score-row .sc.b::after{background:var(--blue)}
.score-row .sc .l{font-size:11px;color:var(--sub);font-weight:700}
.score-row .sc .v{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
@media(max-width:900px){.score-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.score-row{grid-template-columns:repeat(2,1fr)}}
/* 탭 */
.tabbar{display:flex;gap:6px;padding:12px 20px 0}
.tabbar .tab{padding:8px 16px;border-radius:9px 9px 0 0;font-weight:700;font-size:13px;color:var(--sub);border:1px solid transparent}
.tabbar .tab.on{background:var(--navy);color:#fff}
tfoot td{padding:11px 10px;border-top:2px solid var(--navy3)}
.delx{color:var(--red);font-weight:800;cursor:pointer;font-size:15px}
.type-tag{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.type-chips{display:flex;flex-wrap:wrap;gap:8px}
.type-chip{display:inline-flex;align-items:center;gap:6px;background:var(--grn-soft);color:var(--grn);border:1px solid #bbf0d2;font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px}
.type-chip .x{cursor:pointer;font-weight:800;color:var(--red)}
.type-panel{padding:14px 20px;background:#f8fbfe;border-bottom:1px solid var(--line)}
.pareto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pareto-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;transition:transform .15s,box-shadow .15s}
.pareto-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.pc-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pc-no{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.pc-hd b{font-size:15px}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.pc-l{font-size:11px;color:var(--sub);font-weight:600}
.pc-v{font-size:16px;font-weight:800;margin-top:2px}
.pc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pc-bar{height:5px;background:#eef3f8;border-radius:3px;margin-top:8px;overflow:hidden}
.pc-bar>div{height:100%;background:var(--red);border-radius:3px}
@media(max-width:900px){.pareto-grid{grid-template-columns:1fr}}
/* 행별 편집 버튼 */
.row-actions{white-space:nowrap}
.cap-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.cap-badge.on{background:var(--grn-soft);color:var(--grn)}
.cap-badge.off{background:#f1f3f6;color:#8a93a3}
.cap-linehd td{background:#f7f9fc;border-top:2px solid var(--line);font-size:13.5px}
.rowbtn:disabled{opacity:.4;cursor:not-allowed}
.rowbtn{padding:5px 11px;border-radius:7px;font-weight:700;font-size:12px;margin:0 2px;border:1px solid var(--line)}
.rowbtn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.rowbtn.edit{background:var(--blue-soft);color:var(--blue);border-color:#c7dbff}
.rowbtn.del{background:#fef2f2;color:var(--red);border-color:#fecaca}
.rowbtn.cancel{background:#f1f4fa;color:var(--sub)}
tr.row-saved{background:var(--grn-soft)!important}
tr.row-saved .inp-cell{background:transparent;border-color:transparent;font-weight:600;color:var(--ink)}
/* 긴 표 타이틀 고정 스크롤 */
.table-scroll{max-height:520px;overflow:auto;border-radius:8px}
table.sticky-head thead th{position:sticky;top:0;z-index:2;box-shadow:0 2px 0 rgba(26,58,92,.15)}
.input-row{background:#fffef5}
.input-row td{border-bottom:2px solid var(--line)}
/* 모바일/태블릿 반응형 */
@media(max-width:768px){
  .wrap{padding:14px 10px 60px}
  .header{padding:14px 16px;flex-wrap:wrap;gap:10px}
  .header h1{font-size:16px}
  .nav{margin-left:0;width:100%;overflow-x:auto}
  .nav button{padding:8px 12px;font-size:12.5px;white-space:nowrap}
  .day-hd{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
  .day-hd .meta{margin-left:0;text-align:left}
  .toolbar{flex-wrap:wrap}
  .toolbar .sp{display:none}
  .toolbar .tbtn{flex:1;min-width:calc(50% - 5px);text-align:center}
  .score-row{grid-template-columns:repeat(2,1fr)}
  .pareto-grid{grid-template-columns:1fr}
  .sec-hd{flex-wrap:wrap;gap:8px}
  .sec-hd .sp{display:none}
  .sec-hd .tbtn{font-size:12px;padding:7px 10px}
  .work-grid{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:70px;padding:4px}
  .cal-tag{font-size:9.5px;padding:3px 4px}
  .cal-stats{gap:6px}
  .cal-stat{padding:8px 12px;min-width:70px}
  .cal-stat .n{font-size:19px}
  table{font-size:12px}
  thead th{padding:8px 6px;font-size:11px}
  tbody td{padding:7px 6px}
}
@media(max-width:480px){
  .score-row{grid-template-columns:1fr 1fr}
  .work-grid{grid-template-columns:1fr}
  .loginbox{width:92vw;padding:28px 22px}
}

/* ===== 한국시각(KST) 날짜 헬퍼 · toISOString(UTC) 대신 사용 ===== */
function kstDate(){ // 현재 KST 기준 Date
  const now=new Date();
  return new Date(now.getTime()+(now.getTimezoneOffset()*60000)+(9*3600000));
}
function kstToday(){ // 'YYYY-MM-DD' (KST)
  const d=kstDate();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function kstMonth(){ return kstToday().slice(0,7); } // 'YYYY-MM'

function applyTheme(key){
  const t=THEMES[key]||THEMES.navy;
  const r=document.documentElement.style;
  r.setProperty('--navy',t.navy); r.setProperty('--navy2',t.navy2); r.setProperty('--navy3',t.navy3);
  r.setProperty('--blue',t.blue); r.setProperty('--blue-soft',t.blueSoft);
  r.setProperty('--hdr-text',t.hdrText);
  try{ localStorage.setItem('harim_theme',key); }catch(e){}
  const dd=$('#themeSelect'); if(dd) dd.value=key;
}
function getTheme(){ try{ return localStorage.getItem('harim_theme')||'navy'; }catch(e){ return 'navy'; } }
function themeSelectHtml(){
  const cur=getTheme();
  const groups={'짙은':[],'옅은':[]};
  Object.keys(THEMES).forEach(k=>groups[THEMES[k].cat].push({k,...THEMES[k]}));
  const opt=arr=>arr.map(t=>`<option value="${t.k}" ${cur===t.k?'selected':''}>${t.name}</option>`).join('');
  return `<select id="themeSelect" class="theme-select" onchange="applyTheme(this.value)" title="화면 색상 테마">
    <optgroup label="짙은 테마 (배경 진함)">${opt(groups['짙은'])}</optgroup>
    <optgroup label="옅은 테마 (글자 강조)">${opt(groups['옅은'])}</optgroup>

}

const fmt = (n)=> (n==null||isNaN(n))?'–':Number(n).toLocaleString('ko-KR');
// 금액: 부호 + 단위(원). 손실(양수)=빨강 -, 절감(음수)=초록 +
const fmtWon = (n)=>{
  if(n==null||isNaN(n))return '–';
  const v=Math.round(n);
  if(v===0)return '0원';
  const sign=v>0?'-':'+'; // 순로스 양수=손실이므로 -표기
  return sign+fmt(Math.abs(v))+'원';
};
const wonCls = (n)=> n>0?'neg':(n<0?'pos':'');
// 수량: 단위(KG)

async function submitChangePin(){
  const oldP=$('#cpOld').value, newP=$('#cpNew').value, new2=$('#cpNew2').value;
  if(!oldP||!newP){ toast('모든 칸을 입력하세요','err'); return; }
  if(newP.length<4){ toast('새 PIN은 4자리 이상','err'); return; }
  if(newP!==new2){ toast('새 PIN이 서로 다릅니다','err'); return; }
  try{
    const {data,error}=await sb.rpc('change_my_pin',{p_name:S.user.name,p_old_pin:oldP,p_new_pin:newP});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'변경 실패','err'); return; }
    toast('PIN 변경완료','ok');
    document.getElementById('pinModal').remove();
  }catch(e){ toast('변경 실패: '+(e.message||e),'err'); }

  else if(view==='dash') renderDashboard();

async function renderCalendar(){
  $('#wrap').innerHTML='<div class="skel" style="height:70px;border-radius:14px 14px 0 0"></div><div class="skel" style="height:420px;margin-top:2px;border-radius:0 0 14px 14px"></div>';
  let list=[];
  try{
    const {data,error}=await sb.rpc('get_calendar_v2',{p_ym:S.ym});
    if(error)throw error;
    list=data||[];
  }catch(e){ toast('캘린더 로드 실패: '+(e.message||e),'err'); }

  const [y,m]=S.ym.split('-').map(Number);
  const byDate={};
  list.forEach(x=>{
    const d=String(x.work_date).slice(0,10);
    (byDate[d]=byDate[d]||[]).push(x);
  });
  // 상태별 카운트 (planned=미작성, submitted/lead_ok/div_ok=결재중, done=완료)
  let cntPlan=0,cntProg=0,cntDone=0;
  list.forEach(x=>{
    const st=x.status||'planned';
    if(st==='planned'||st==='draft') cntPlan++;
    else if(st==='done') cntDone++;
    else cntProg++;
  });

  const statusKo=s=>({planned:'계획',draft:'작성',submitted:'결재중',lead_ok:'팀장✓',div_ok:'본부장✓',done:'완료',rejected:'반려'}[s]||'계획');
  const statusCls=s=>({planned:'planned',draft:'draft',submitted:'submitted',lead_ok:'submitted',div_ok:'submitted',done:'done',rejected:'rejected'}[s]||'planned');

  let html=`
  <div class="cal-head">
    <div><h2>마감 진행 캘린더</h2><div class="sub">${y}년 ${m}월 · 생산계획 있는 팀 표시</div></div>
    <div class="cal-stats">
      <div class="cal-stat"><div class="n mono">${cntPlan}</div><div class="l">작성 대기</div></div>
      <div class="cal-stat"><div class="n mono">${cntProg}</div><div class="l">결재 진행</div></div>
      <div class="cal-stat"><div class="n mono">${cntDone}</div><div class="l">최종 완료</div></div>
    </div>
  </div>
  <div class="cal-tool">
    <div class="legend">
      <span class="chip planned">계획(미작성)</span>
      <span class="chip submitted">결재진행</span>
      <span class="chip done">완료</span>
      <span class="chip rejected">반려</span>
    </div>
    ${S.user.role==='admin'?`<button class="refresh-btn" onclick="go('upload')">＋ 계획 업로드</button>`:''}
    <div class="cal-nav">
      <button onclick="shiftMonth(-1)">이전</button>
      <span class="ym mono">${S.ym}</span>
      <button onclick="shiftMonth(1)">다음</button>
    </div>
  </div>
  <div class="cal-grid">
    <div class="cal-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="cal-body">`;
  const first=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  const todayStr=kstToday();
  for(let i=0;i<first;i++) html+='<div class="cal-cell pad"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${S.ym}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const tags=(byDate[ds]||[]).map(x=>
      `<div class="cal-tag ${statusCls(x.status)}" onclick="openDay('${ds}','${x.team}')">${x.team} ${statusKo(x.status)} ·${x.order_count}</div>`).join('');
    html+=`<div class="cal-cell ${isToday?'today':''}"><div class="dn">${d}${isToday?'<span class="today-badge">Today</span>':''}</div>${tags}</div>`;
  }
  html+='</div></div>';

  // ===== 하단: 팀별 월 현황 카드 =====
  const teamStat={};
  list.forEach(x=>{
    const t=x.team||'기타';
    if(!teamStat[t]) teamStat[t]={plan:new Set(),draft:new Set(),done:new Set()};
    const d=String(x.work_date).slice(0,10);
    const st=x.status||'planned';
    teamStat[t].plan.add(d);  // 계획 있는 날
    if(st==='done') teamStat[t].done.add(d);
    else if(st!=='planned') teamStat[t].draft.add(d);  // 작성/결재중
  });
  const teamColors={'생산1팀':'#2670c9','생산2팀':'#1a9d5c','공통':'#9b6dc9'};
  const cards=Object.keys(teamStat).sort().map(t=>{
    const s=teamStat[t];
    const badge=teamColors[t]||'#64748b';
    return `<div class="team-stat-card" onclick="openTeamReport('${t}','${y}-${String(m).padStart(2,'0')}')" style="cursor:pointer">
      <div class="tsc-hd">
        <h4>${t}</h4>
        <span class="tsc-badge" style="background:${badge}">${y}.${String(m).padStart(2,'0')}</span>
      </div>
      <div class="tsc-nums">
        <div class="tsc-num"><div class="tsc-l">계획일</div><div class="tsc-v mono">${s.plan.size}</div></div>
        <div class="tsc-num"><div class="tsc-l">작성일</div><div class="tsc-v mono" style="color:var(--blue)">${s.draft.size}</div></div>
        <div class="tsc-num"><div class="tsc-l">완료일</div><div class="tsc-v mono" style="color:var(--grn)">${s.done.size}</div></div>
      </div>
      <div class="tsc-more">월간 종합일보 열기 →</div>
    </div>`;
  }).join('');
  html+=`
  <div class="sec" style="margin-top:18px"><div class="sec-hd"><span class="no c2">◆</span><h3>팀별 월 현황</h3>
    <span class="desc">생산계획 있는 팀의 월 누적 요약 · 생산계획 기준</span></div>
    <div class="sec-bd"><div class="team-stat-grid">${cards||'<div style="color:var(--mut);padding:16px">데이터 없음</div>'}</div></div>
  </div>`;

  $('#wrap').innerHTML=html;
}
function shiftMonth(delta){
  let [y,m]=S.ym.split('-').map(Number);
  m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  S.ym=`${y}-${String(m).padStart(2,'0')}`;
  renderCalendar();
}

  $('#wrap').innerHTML='<div class="skel" style="height:300px;border-radius:14px"></div>';

/* ============ 개선접수 게시판 ============ */
let IMPROVE_FILTER=null;
let IMPROVE_CACHE=[];
async function renderImprove(){
  $('#wrap').innerHTML='<div class="skel" style="height:400px;border-radius:14px"></div>';
  await loadImprove();
}
async function loadImprove(){
  const isAdmin=S.user.role==='admin';
  let stats={},list=[];
  try{
    const [st,lst]=await Promise.all([
      sb.rpc('get_improve_stats'),
      sb.rpc('get_improvements',{p_status:IMPROVE_FILTER})
    ]);
    stats=st.data||{}; list=lst.data||[];
  }catch(e){ toast('개선접수 조회 실패: '+(e.message||e),'err'); }
  IMPROVE_CACHE=list;

  const statusMeta={
    received:{ko:'접수',cls:'st-received'},
    review:{ko:'검토중',cls:'st-review'},
    done:{ko:'완료',cls:'st-done'}
  };
  const cards=list.map(im=>{
    const sm=statusMeta[im.status]||statusMeta.received;
    const dt=new Date(im.created_at).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'});
    const answerBox=im.answer?`
      <div class="im-answer">
        <div class="im-answer-hd">💬 관리자 답변 · ${im.answer_by||''} · ${im.answer_at?new Date(im.answer_at).toLocaleDateString('ko-KR'):''}</div>
        <div class="im-answer-body">${(im.answer||'').replace(/\n/g,'<br>')}</div>
      </div>`:'';
    const isMine=im.writer===S.user.name;
    let btns='';
    if(isAdmin || isMine){
      btns=`<div class="im-admin">
        ${isAdmin?`<button class="rowbtn edit" onclick="openAnswer(${im.id})">답변/상태변경</button>`:''}
        ${isMine?`<button class="rowbtn edit" onclick="openEditImprove(${im.id})">수정</button>`:''}
        ${(isAdmin||isMine)?`<button class="rowbtn del" onclick="delImprove(${im.id})">삭제</button>`:''}
      </div>`;
    }
    return `<div class="im-card">
      <div class="im-top">
        <h4>${im.title}</h4>
        <span class="im-status ${sm.cls}">${sm.ko}</span>
      </div>
      <div class="im-meta">작성자 ${im.writer||'-'}${im.writer_team?' · '+im.writer_team:''} · ${dt}${isMine?' · <b style="color:var(--blue)">내 글</b>':''}</div>
      <div class="im-body">${(im.content||'').replace(/\n/g,'<br>')}</div>
      ${answerBox}
      ${btns}
    </div>`;
  }).join('');

  const chip=(key,label)=>`<button class="im-chip ${IMPROVE_FILTER===key?'on':''}" onclick="filterImprove(${key===null?'null':`'${key}'`})">${label}</button>`;

  $('#wrap').innerHTML=`
  <div class="day-hd"><div><h2>시스템 개선접수</h2>
    <div class="en">IMPROVEMENT REQUESTS · 현장 개선 제안</div></div>
    <div class="meta">전체 ${stats.total||0}건</div></div>

  <!-- 통계 스코어카드 -->
  <div class="score-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="sc"><div class="l">전체</div><div class="v mono">${stats.total||0}</div></div>
    <div class="sc" style="--acc:#c2410c"><div class="l">접수</div><div class="v mono" style="color:#c2410c">${stats.received||0}</div></div>
    <div class="sc b"><div class="l">검토중</div><div class="v mono" style="color:var(--blue)">${stats.review||0}</div></div>
    <div class="sc g"><div class="l">완료</div><div class="v mono" style="color:var(--grn)">${stats.done||0}</div></div>
  </div>

  <!-- 등록 폼 -->
  <div class="sec"><div class="sec-hd"><span class="no c1">＋</span><h3>개선요청 등록</h3>
    <span class="desc">작성자: ${S.user.name}</span></div>
    <div class="sec-bd">
      <input id="imTitle" placeholder="제목" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:10px;box-sizing:border-box">
      <textarea id="imContent" placeholder="요청 내용" style="width:100%;min-height:110px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;resize:vertical;font-family:inherit"></textarea>
      <div style="text-align:right;margin-top:12px"><button class="tbtn submit" onclick="addImprove()">등록</button></div>
    </div>
  </div>

  <!-- 필터 -->
  <div class="im-filters">
    ${chip(null,'전체')}${chip('received','접수')}${chip('review','검토중')}${chip('done','완료')}
  </div>

  <!-- 목록 -->
  <div class="im-list">${cards||'<div style="color:var(--mut);padding:30px;text-align:center">등록된 개선요청이 없습니다.</div>'}</div>`;
}
function filterImprove(status){ IMPROVE_FILTER=status; loadImprove(); }
async function addImprove(){
  const title=$('#imTitle').value.trim(), content=$('#imContent').value.trim();
  if(!title){ toast('제목을 입력하세요','err'); return; }
  try{
    const {error}=await sb.rpc('add_improvement',{p_title:title,p_content:content,p_writer:S.user.name,p_team:S.user.team});
    if(error)throw error;
    toast('개선요청 등록완료','ok');
    loadImprove();
  }catch(e){ toast('등록 실패: '+(e.message||e),'err'); }
}
function openAnswer(id){
  const m=document.createElement('div');
  m.id='answerModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,22,40,.5);display:grid;place-items:center;z-index:999;padding:20px';
  m.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:26px;width:460px;max-width:100%;box-shadow:var(--sh-lg)">
      <h3 style="margin:0 0 16px;font-size:18px">답변 / 상태 변경</h3>
      <label style="font-size:12px;font-weight:700;color:var(--sub)">상태</label>
      <select id="anStatus" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;margin:6px 0 14px">
        <option value="received">접수</option>
        <option value="review">검토중</option>
        <option value="done">완료</option>
      </select>
      <label style="font-size:12px;font-weight:700;color:var(--sub)">관리자 답변</label>
      <textarea id="anText" placeholder="답변 내용" style="width:100%;min-height:100px;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-top:6px;resize:vertical;font-family:inherit"></textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="tbtn" style="flex:1" onclick="document.getElementById('answerModal').remove()">취소</button>
        <button class="tbtn submit" style="flex:1" onclick="submitAnswer(${id})">저장</button>
      </div>
    </div>`;
  document.body.appendChild(m);
}
async function submitAnswer(id){
  const answer=$('#anText').value.trim(), status=$('#anStatus').value;
  try{
    const {error}=await sb.rpc('answer_improvement',{p_id:id,p_answer:answer,p_status:status,p_by:S.user.name});
    if(error)throw error;
    toast('답변 저장완료','ok');
    document.getElementById('answerModal').remove();
    loadImprove();
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function delImprove(id){
  if(!confirm('이 개선요청을 삭제할까요?'))return;
  try{ await sb.rpc('del_improvement',{p_id:id});
    toast('삭제완료','ok'); loadImprove();
  }catch(e){ toast('삭제 실패','err'); }
}
/* 작성자 본인 글 수정 */
function openEditImprove(id){
  const im=IMPROVE_CACHE.find(x=>x.id===id);
  if(!im){ toast('항목을 찾을 수 없습니다','err'); return; }
  const m=document.createElement('div');
  m.id='editImModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,22,40,.5);display:grid;place-items:center;z-index:999;padding:20px';
  m.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:26px;width:460px;max-width:100%;box-shadow:var(--sh-lg)">
      <h3 style="margin:0 0 16px;font-size:18px">개선요청 수정</h3>
      <input id="eimTitle" value="${(im.title||'').replace(/"/g,'&quot;')}" style="width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;margin-bottom:10px">
      <textarea id="eimContent" style="width:100%;min-height:120px;padding:11px;border:1.5px solid var(--line);border-radius:9px;box-sizing:border-box;resize:vertical;font-family:inherit">${im.content||''}</textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="tbtn" style="flex:1" onclick="document.getElementById('editImModal').remove()">취소</button>
        <button class="tbtn submit" style="flex:1" onclick="submitEditImprove(${im.id})">저장</button>
      </div>
    </div>`;
  document.body.appendChild(m);
}
async function submitEditImprove(id){
  const title=$('#eimTitle').value.trim(), content=$('#eimContent').value.trim();
  if(!title){ toast('제목을 입력하세요','err'); return; }
  try{
    const {error}=await sb.rpc('edit_improvement',{p_id:id,p_title:title,p_content:content,p_writer:S.user.name});
    if(error)throw error;
    toast('수정완료','ok');
    document.getElementById('editImModal').remove();
    loadImprove();
  }catch(e){ toast('수정 실패: '+(e.message||e),'err'); }
}

function setTRTeam(t){ TR.team=t; loadTeamReport(); }
function setTRUnit(u){ TR.unit=u; loadTeamReport(); }

function shiftTeamReport(delta){

      const c=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:donutColors}]},

      </div>`).join('')||'<div style="color:var(--mut);padding:16px">데이터 없음</div>';
    });

    loadTDTab();
  }catch(e){ toast('팀 상세 조회 실패: '+(e.message||e),'err'); }
}

function renderParetoRows(data){
  const tot=data.reduce((s,d)=>s+Number(d.total_loss||0),0);
  return data.map(d=>{
    const pctv=tot>0?(Number(d.total_loss)/tot*100):0;
    return `<tr><td class="l">${d.scrap_type}</td>
      <td class="mono neg">${fmt(Math.round(d.total_loss))}원</td>
      <td class="mono">${d.cnt}</td>
      <td class="mono">${pctv.toFixed(1)}%</td></tr>`;
  }).join('')||'<tr><td colspan="4" style="color:var(--mut);padding:16px">로스유형 저장 데이터 없음</td></tr>';
}

function drawAchieveChart(data){
  const ctx=$('#chartAchieve'); if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',
    data:{labels:data.map(d=>d.ym),
      datasets:[
        {type:'bar',label:'계획',data:data.map(d=>Math.round(d.plan_sum)),backgroundColor:'#c7dbff',order:2},
        {type:'bar',label:'실적',data:data.map(d=>Math.round(d.actual_sum)),backgroundColor:'#2670c9',order:2},
        {type:'line',label:'달성률(%)',data:data.map(d=>(d.achieve*100).toFixed(1)),borderColor:'#e0483a',backgroundColor:'#e0483a',yAxisID:'y1',tension:.3,order:1,pointRadius:4}
      ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      scales:{y:{title:{display:true,text:'KG'}},y1:{position:'right',title:{display:true,text:'달성률 %'},grid:{drawOnChartArea:false},min:80,max:140}},
      plugins:{legend:{position:'top'}}}});
  DASH.charts.push(c);
}
function drawLossChart(data){
  const ctx=$('#chartLoss'); if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',
    data:{labels:data.map(d=>d.ym),
      datasets:[
        {label:'손실(초과사용)',data:data.map(d=>Math.round(d.over_loss)),backgroundColor:'#e0483a'},
        {label:'절감',data:data.map(d=>Math.round(d.save_amt)),backgroundColor:'#1a9d5c'}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{title:{display:true,text:'원'}}},
      plugins:{legend:{position:'top'}}}});
  DASH.charts.push(c);
}

}

/* --- CAPA 관리 탭 (호기별 + 활성/비활성) --- */
let CAPA_LIST=[];
async function renderCapaMgmt(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:300px;border-radius:14px"></div>';
  try{ const {data}=await sb.rpc('get_capa_list',{p_team:null}); CAPA_LIST=data||[]; }
  catch(e){ toast('CAPA 조회 실패: '+(e.message||e),'err'); CAPA_LIST=[]; }

  // 팀 > 라인 단위로 그룹핑
  const groups={};
  CAPA_LIST.forEach((c,i)=>{
    const k=c.team+'||'+c.line;
    if(!groups[k])groups[k]={team:c.team,line:c.line,line_active:c.line_active!==false,items:[]};
    groups[k].items.push({...c,_i:i});
  });
  const gk=Object.keys(groups);
  let offCnt=0; CAPA_LIST.forEach(c=>{ if(c.active===false||c.line_active===false)offCnt++; });

  const body=gk.map(k=>{
    const g=groups[k]; const lOff=!g.line_active;
    const esc=s=>String(s).replace(/'/g,"\\'");
    const rows=g.items.map(c=>{
      const off=lOff||c.active===false;
      return `<tr style="${off?'opacity:.45;background:#fafafa':''}">
        <td class="l" style="padding-left:22px">${c.hoki?`<b>${c.hoki}</b>호기`:'<span style="color:var(--mut)">호기 미지정</span>'}</td>
        <td><input type="number" id="capa_${c._i}" value="${c.capa_hourly||''}" placeholder="0" ${off?'disabled':''}
          style="width:110px;padding:7px;border:1.5px solid var(--line);border-radius:7px;text-align:right"></td>
        <td><input type="number" id="days_${c._i}" value="${c.work_days_month||22}" ${off?'disabled':''}
          style="width:66px;padding:7px;border:1.5px solid var(--line);border-radius:7px;text-align:right"></td>
        <td><span class="cap-badge ${off?'off':'on'}">${off?'비활성':'활성'}</span></td>
        <td style="white-space:nowrap">
          <button class="rowbtn edit" ${off?'disabled':''} onclick="saveCapa(${c._i})">저장</button>
          <button class="rowbtn ${c.active===false?'':'del'}" ${lOff?'disabled':''}
            onclick="toggleHoki(${c._i})">${c.active===false?'활성화':'비활성'}</button>
        </td></tr>`;
    }).join('');
    return `<tr class="cap-linehd" style="${lOff?'opacity:.5':''}">
        <td class="l"><b>${g.line}</b> <span style="color:var(--mut);font-size:12px">· ${g.team} · 호기 ${g.items.length}</span></td>
        <td colspan="3"></td>
        <td><button class="rowbtn ${lOff?'edit':'del'}" onclick="toggleLine('${esc(g.team)}','${esc(g.line)}',${lOff})">
          ${lOff?'라인 활성화':'라인 전체 비활성'}</button></td>
      </tr>${rows}`;
  }).join('');

  $('#settingsBody').innerHTML=`
  <div class="lock-banner" style="background:var(--blue-soft);border-color:#c7dbff;color:var(--blue)">
    ℹ <b>호기별</b> 시간당 생산능력(kg/hr)을 입력하면 성능가동률이 계산됩니다. (예: EP 1호기·2호기 능력이 다를 때)<br>
    · <b>비활성</b> 처리하면 해당 호기(또는 라인 전체)는 <b>계획·실적·가동시간·비가동·생산량 등 모든 지표에서 제외</b>됩니다.<br>
    · 성능가동률 = 실제 생산량 ÷ (호기 CAPA 합계 × 실제 가동시간) × 100
  </div>
  <div class="sec"><div class="sec-hd"><span class="no c1">⚙</span><h3>호기별 CAPA · 활성 관리</h3>
    <span class="desc">${gk.length}개 라인 · ${CAPA_LIST.length}개 호기${offCnt?` · <b style="color:var(--red)">비활성 ${offCnt}</b>`:''}</span></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>라인 / 호기</th><th>시간당 능력(kg/hr)</th><th>월 가동일수</th><th>상태</th><th>관리</th></tr></thead>
      <tbody>${body||'<tr><td colspan="5" style="color:var(--mut);padding:16px">라인 없음</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
async function saveCapa(i){
  const c=CAPA_LIST[i]; if(!c)return;
  const hourly=Number($('#capa_'+i).value)||0;
  const days=Number($('#days_'+i).value)||22;
  try{
    const {error}=await sb.rpc('set_capa',{p_team:c.team,p_line:c.line,p_hoki:c.hoki||'',
      p_hourly:hourly,p_days:days,p_active:c.active!==false});
    if(error)throw error;
    c.capa_hourly=hourly; c.work_days_month=days;
    toast(`${c.line}${c.hoki?' '+c.hoki+'호기':''} 저장완료`,'ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function toggleHoki(i){
  const c=CAPA_LIST[i]; if(!c)return;
  const next=!(c.active!==false);
  const label=`${c.line}${c.hoki?' '+c.hoki+'호기':''}`;
  if(!next && !confirm(`[${label}]를 비활성화합니다.\n\n계획·실적·가동시간·비가동 등 모든 지표에서 제외됩니다.\n(과거 데이터 포함)\n\n진행할까요?`))return;
  try{
    const {error}=await sb.rpc('set_capa',{p_team:c.team,p_line:c.line,p_hoki:c.hoki||'',
      p_hourly:Number($('#capa_'+i).value)||c.capa_hourly||0,
      p_days:Number($('#days_'+i).value)||c.work_days_month||22,p_active:next});
    if(error)throw error;
    toast(`${label} ${next?'활성화':'비활성'}`,'ok');
    renderCapaMgmt();
  }catch(e){ toast('변경 실패: '+(e.message||e),'err'); }
}
async function toggleLine(team,line,isOff){
  const next=isOff;
  if(!next && !confirm(`[${line}] 라인 전체를 비활성화합니다.\n\n이 라인의 모든 호기(호기 미지정 포함)가\n계획·실적·가동시간·비가동 등 모든 지표에서 제외됩니다.\n\n진행할까요?`))return;
  try{
    const {error}=await sb.rpc('set_line_active',{p_team:team,p_line:line,p_active:next});
    if(error)throw error;
    toast(`${line} 라인 ${next?'활성화':'전체 비활성'}`,'ok');
    renderCapaMgmt();
  }catch(e){ toast('변경 실패: '+(e.message||e),'err'); }
}

async function renderApprLine(){
  $('#settingsBody').innerHTML='<div class="skel" style="height:300px;border-radius:14px"></div>';

    try{
      const {data}=await sb.rpc('get_approval_line',{p_team:t});
      lineData[t]={};
      (data||[]).forEach(r=>{ lineData[t][r.step]=r.approver_name; });
    }catch(e){ lineData[t]={}; }

    const cur=lineData[t];
    const curTxt=[cur.lead&&`팀장: ${cur.lead}`,cur.division&&`본부장: ${cur.division}`,cur.ceo&&`CEO: ${cur.ceo}`].filter(Boolean).join(' / ');
    return `
    <div class="sec"><div class="sec-hd"><span class="no c1">◆</span><h3>${t} 결재라인</h3>
      <span class="desc">팀장 → 본부장 → CEO 순서</span></div>
      <div class="sec-bd">
        <div style="background:#f1f4fa;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--sub)">
          현재 저장된 결재라인: <b style="color:var(--ink)">${curTxt||'미지정'}</b></div>
        <div class="work-grid">
        <div class="work-field"><label>팀장</label>
          <select id="al_${t}_lead">${userOpts(cur.lead)}</select></div>
        <div class="work-field"><label>본부장</label>
          <select id="al_${t}_division">${userOpts(cur.division)}</select></div>
        <div class="work-field"><label>CEO</label>
          <select id="al_${t}_ceo">${userOpts(cur.ceo)}</select></div>
      </div>
      <button class="tbtn save" style="margin-top:14px" onclick="saveApprLine('${t}')">${t} 결재라인 저장</button>
      <div id="alsaved_${t}" style="display:none;margin-top:10px;padding:8px 12px;background:var(--grn-soft);color:var(--grn);border-radius:8px;font-size:13px;font-weight:600"></div>
      </div>
    </div>`;}).join('');
  $('#settingsBody').innerHTML=`
  <div class="lock-banner" style="background:var(--blue-soft);border-color:#c7dbff;color:var(--blue)">
    ℹ 각 팀의 팀장·본부장·CEO를 지정하면, 그 사람이 로그인 시 자기 차례의 문서를 결재할 수 있습니다.
    결재자는 먼저 <b>사용자 관리</b> 탭에서 권한(팀장/본부장/대표)이 설정되어야 합니다.
  </div>
  ${teamBlocks}`;
}
async function saveApprLine(team){
  const steps=['lead','division','ceo'];
  const stepKo={lead:'팀장',division:'본부장',ceo:'CEO'};
  try{
    const saved=[];
    for(const step of steps){
      const name=$(`#al_${team}_${step}`).value;
      if(name){
        const {error}=await sb.rpc('set_approval_line',{p_team:team,p_step:step,p_name:name});
        if(error)throw error;
        saved.push(`${stepKo[step]}: ${name}`);
      }
    }
    // 저장 확인 표시
    const badge=$(`#alsaved_${team}`);
    if(badge){
      badge.innerHTML=`✓ 저장됨 · ${saved.join(' / ')||'미지정'} · ${new Date().toLocaleTimeString('ko-KR')}`;
      badge.style.display='block';
    }
    toast(team+' 결재라인 저장완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

/* ===== MES 가동시간 가져오기 (Apps Script 웹앱 호출) ===== */
const MES_WEBAPP_URL='https://script.google.com/macros/s/AKfycbwrLSWuf6vEDCA2rce2iTbXQuLDEjEnDPuhA9pWDVVxNNL2O0Dsp48fIGjHkke08Uai/exec';
function fetchMES(){
  const date=$('#mesDate').value;
  const res=$('#mesResult'); const btn=$('#mesBtn');
  if(!date){ res.className='upload-result err'; res.textContent='날짜를 선택하세요.'; return; }
  btn.disabled=true; const _t=btn.textContent; btn.textContent='가져오는 중…';
  res.className='upload-result'; res.style.display='block'; res.style.background='#eff6ff'; res.style.color='#2563eb';
  res.textContent=`${date} 데이터를 구글시트에서 가져오는 중입니다…`;

  // Apps Script 웹앱은 CORS 제약이 있어 JSONP 콜백 방식으로 호출
  const cb='mesCb_'+Date.now();
  const done=(data)=>{
    delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer);
    btn.disabled=false; btn.textContent=_t;
    if(data&&data.ok){
      res.className='upload-result ok';
      res.textContent=`✓ 완료 · ${data.date} — 가동 ${data.run}건, 정지 ${data.stops}건 반영 (${(data.teams||[]).join(', ')})`;
      toast('MES 데이터 반영 완료','ok');
    }else{
      res.className='upload-result err';
      res.textContent='실패: '+((data&&data.error)||'응답 오류');
    }
  };
  window[cb]=done;
  const s=document.createElement('script');
  s.src=`${MES_WEBAPP_URL}?date=${encodeURIComponent(date)}&callback=${cb}`;
  s.onerror=()=>{ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer);
    btn.disabled=false; btn.textContent=_t;
    res.className='upload-result err'; res.textContent='웹앱 호출 실패 — 배포 상태·URL을 확인하세요.'; };
  const timer=setTimeout(()=>{ if(window[cb]){ delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s);
    btn.disabled=false; btn.textContent=_t;
    res.className='upload-result err'; res.textContent='시간 초과 — 잠시 후 다시 시도하세요.'; } },30000);
  document.body.appendChild(s);
}
/* 1단계: 영향 확인 → 경고 → 확인 시 업로드 */
async function checkUpload(){
  const paste=$('#upPaste').value;
  const res=$('#upResult');
  const rows=parsePaste(paste);
  if(rows.length===0){res.className='upload-result err';res.style.display='block';res.textContent='붙여넣은 데이터가 없거나 형식이 맞지 않습니다. (15개 컬럼 확인)';return;}
  res.className='upload-result';res.style.display='block';res.style.background='#eff6ff';res.style.color='#2563eb';
  res.textContent='데이터 확인 중…';
  try{
    const {data,error}=await sb.rpc('check_plan_impact',{p_rows:rows});
    if(error)throw error;
    let warn='';
    if(data.done_count>0) warn+=`🔴 결재 완료된 마감 ${data.done_count}건이 포함됩니다: ${data.done_dates}\n   → 덮어쓰면 완료된 계획·실적이 변경됩니다. 작성한 로스·불량·비가동·인원은 유지됩니다.\n\n`;
    if(data.submitted_count>0) warn+=`🟡 결재 진행중 마감 ${data.submitted_count}건이 포함됩니다.\n   → 계획·실적이 변경됩니다.\n\n`;
    if(data.scrap_count>0) warn+=`ℹ 기존 로스 사유 ${data.scrap_count}건 범위입니다. 편차가 사라진 자재의 사유는 자동 정리됩니다.\n\n`;
    const msg=`[업로드 대상]\n· ${rows.length}행\n· 날짜: ${data.dates}\n\n${warn||'✓ 결재·사유 충돌 없음\n\n'}진행할까요?`;
    if(confirm(msg)){ doUpload(rows); }
    else { res.className='upload-result';res.style.background='#f1f4fa';res.style.color='var(--sub)';res.textContent='취소되었습니다.'; }
  }catch(e){ res.className='upload-result err';res.textContent='확인 실패: '+(e.message||e); }
}
async function doUpload(rows){
  const res=$('#upResult');
  res.className='upload-result';res.style.display='block';res.style.background='#eff6ff';res.style.color='#2563eb';
  res.textContent=`업로드 중… (${rows.length}행)`;

    const {data,error}=await sb.rpc('replace_plan_partial',{p_rows:rows});
    if(error)throw error;
    res.className='upload-result ok';
    res.textContent=`✓ 교체 완료 · 기존 ${data.deleted}행 삭제 → 새 ${data.inserted}행 삽입`
      + (data.scrap_cleaned>0?` · 편차 사라진 로스사유 ${data.scrap_cleaned}건 자동정리`:'');
    toast('업로드 완료','ok');
    $('#upPaste').value='';
  }catch(e){
    res.className='upload-result err';
    res.textContent='업로드 실패: '+(e.message||e);
  }
}
/* 붙여넣기 파싱: 탭 구분 15컬럼 (작업일자 포함) → JSON 배열 */
function parsePaste(text){
  const num=v=>{const n=Number(String(v).replace(/,/g,'').trim());return isNaN(n)?0:n;};
  const cleanTeam=t=>String(t).trim().replace(/생산\s+/,'생산').replace(/\s/g,'');
  const normDate=d=>{
    d=String(d).trim();
    // 2026.1.3 / 2026/1/3 → 2026-01-03
    const m=d.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    return d;
  };
  const out=[];
  text.trim().split('\n').forEach(line=>{
    if(!line.trim())return;
    const c=line.split('\t');
    if(c.length<15)return;  // 15컬럼 필요
    out.push({
      work_date:normDate(c[0]), team:cleanTeam(c[1]), process:c[2].trim(),
      prod_code:c[3].trim(), prod_name:c[4].trim(), hoki:c[5].trim(),
      mat_code:c[6].trim(), mat_name:c[7].trim(), mat_type:c[8].trim(),
      plan_qty:num(c[9]), actual_qty:num(c[10]), diff:num(c[11]), mat_unit:c[12].trim(),
      proc_sub1:c[13].trim(), proc_sub2:c[14].trim()
    });
  });
  return out;
}

  const c=CUR_DAY.closing||{};

  const steps=[
    {key:'draft',label:'작성',by:c.writer},
    {key:'lead_ok',label:'팀장',by:c.lead_by},
    {key:'div_ok',label:'본부장',by:c.div_by},
    {key:'done',label:'CEO',by:c.ceo_by}
  ];
  const order=['draft','submitted','lead_ok','div_ok','done'];
  const curIdx=order.indexOf(status);
  const stepHtml=steps.map((s,i)=>{
    let done=false, active=false;
    if(s.key==='draft') done = curIdx>=1;
    if(s.key==='lead_ok') done = curIdx>=2;
    if(s.key==='div_ok') done = curIdx>=3;
    if(s.key==='done') done = curIdx>=4;
    if(status==='submitted'&&s.key==='lead_ok') active=true;
    if(status==='lead_ok'&&s.key==='div_ok') active=true;
    if(status==='div_ok'&&s.key==='done') active=true;
    if(status==='draft'&&s.key==='draft') active=true;
    return `<div class="appr-step ${done?'done':''} ${active?'active':''}">
      <div class="as-dot">${done?'✓':i+1}</div>
      <div class="as-txt"><b>${s.label}</b>${s.by?`<span>${s.by}</span>`:''}</div>
    </div>`;
  }).join('<div class="appr-line"></div>');

    none:'미작성',draft:'작성 중',submitted:'팀장 결재 대기',

  }[status]||status;

  const rejectBox = status==='rejected'
    ? `<div class="reject-box">⚠ 반려 (${c.reject_by||''}): ${c.reject_reason||''}</div>` : '';
  const commentBox = c.submit_comment
    ? `<div class="comment-box">💬 작성자 의견: ${c.submit_comment}</div>` : '';
  return `
  <div class="appr-wrap">
    <div class="appr-flow">${stepHtml}</div>
    <div class="toolbar" style="margin-top:12px;margin-bottom:0">
      <span class="tb-status ${statusCls}" id="tbStatus">${statusLabel}</span>
      <button class="tbtn" onclick="showApprovalLog()">결재이력</button>
      <span class="sp"></span>
      ${isWriter&&['none','draft','rejected'].includes(status)?`
        <button class="tbtn" onclick="saveClosing(false)">임시저장</button>
        <button class="tbtn submit" onclick="saveClosing(true)">제출</button>`:''}
      ${canApprove?`
        <button class="tbtn reject" onclick="doReject()">반려</button>
        <button class="tbtn approve" onclick="doApprove()">승인</button>`:''}
      <button class="tbtn" onclick="window.print()">인쇄 / PDF</button>
      <button class="tbtn" onclick="go('cal')">대시보드</button>
    </div>
    ${rejectBox}
    ${commentBox}
  </div>`;
}
async function doApprove(){
  const {date,team}=CUR_DAY;
  const memo=prompt('결재 의견 (선택). 예: "코터기 수율저하 별도 보고"\n없으면 그냥 확인:');
  if(memo===null) return; // 취소
  try{
    const {data,error}=await sb.rpc('do_approval',{
      p_date:date,p_team:team,p_action:'approve',
      p_actor:S.user.name,p_role:S.user.role,p_memo:memo||null});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'승인 불가','err'); return; }
    toast('승인 완료','ok'); openDay(date,team);
  }catch(e){ toast('승인 실패: '+(e.message||e),'err'); }
}
async function doReject(){
  const {date,team}=CUR_DAY;
  const reason=prompt('반려 사유를 입력하세요 (필수). 예: "실적 수치 재확인 요망":');
  if(reason===null) return;
  if(!reason.trim()){ toast('반려 사유 필수','err'); return; }
  try{
    const {data,error}=await sb.rpc('do_approval',{
      p_date:date,p_team:team,p_action:'reject',
      p_actor:S.user.name,p_role:S.user.role,p_memo:reason});
    if(error)throw error;
    if(!data.ok){ toast(data.msg||'반려 불가','err'); return; }
    toast('반려 처리됨','ok'); openDay(date,team);
  }catch(e){ toast('반려 실패: '+(e.message||e),'err'); }
}

    <div class="sc ${totAch>=.98?'g':'r'}"><div class="l">달성률</div><div class="v mono">${pct(totAch)}</div></div>

  <!-- ① 라인별 요약 -->
  <div class="sec"><div class="sec-hd"><span class="no c1">1</span><h3>라인별 가동 요약</h3>
    <span class="desc">라인(공정)별 오더·계획·실적·달성률</span></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>라인</th><th>오더수</th><th>계획(KG)</th><th>실적(KG)</th><th>달성률</th><th>스크랩</th></tr></thead>

/* ④⑤⑥ 렌더 */
function renderMoreSections(){
  const {lines,defects,downtime,manpower,pareto,orders,lossTypes,defectTypes}=CUR_DAY;
  const lineOpts=lines.map(l=>`<option value="${l.proc_sub1}|${l.proc_sub2}">${l.line_name}</option>`).join('');
  const prodOpts=orders.map(o=>`<option value="${o.prod_code}|${o.prod_name}">${o.prod_code} ${o.prod_name}</option>`).join('');
  const defTypeOpts=(defectTypes||[]).map(t=>`<option value="${t.type_id}|${t.type_name}">${t.type_name}</option>`).join('');
  CUR_DAY._lineOpts=lineOpts; CUR_DAY._prodOpts=prodOpts; CUR_DAY._defTypeOpts=defTypeOpts;

  // ④ 불량: 등록 목록
  const defRows=(defects||[]).map(d=>`<tr data-defect="${d.id}">
    <td class="l">${(d.proc_sub1||'')}/${(d.proc_sub2||'')}</td>
    <td class="l">${d.prod_name||d.prod_code||'–'}</td>
    <td><span class="type-tag">${d.defect_type||'–'}</span></td>
    <td class="mono">${fmt(d.qty)}</td><td>${d.unit||'EA'}</td>
    <td class="l">${d.reason||'–'}</td>
    <td class="row-actions">
      <button class="rowbtn del" onclick="delDefect(${d.id})">삭제</button>
    </td>
  </tr>`).join('');

  // ⑤ 비가동: 라인(파트) 고정 + 라인별 집계
  const downByLine={};
  (downtime||[]).forEach(t=>{
    const k=(t.proc_sub1||'')+'/'+(t.proc_sub2||'');
    const d=downByLine[k]||(downByLine[k]={plan:0,unplan:0,sudden:0});
    const dur=diffMin(t.start_time,t.end_time);
    if(t.category==='plan')d.plan+=dur; else if(t.category==='unplan')d.unplan+=dur; else if(t.category==='sudden')d.sudden+=dur;
  });
  const downFixedRows=lines.map(l=>{
    const k=l.line_name, d=downByLine[k]||{plan:0,unplan:0,sudden:0};
    const tot=d.plan+d.unplan+d.sudden;
    return `<tr>
      <td class="l"><b>${l.line_name}</b></td>
      <td class="mono">${d.plan||'–'}</td>
      <td class="mono ${d.unplan?'neg':''}">${d.unplan||'–'}</td>
      <td class="mono ${d.sudden?'neg':''}">${d.sudden||'–'}</td>
      <td class="mono"><b>${tot||'–'}</b></td>
    </tr>`;
  }).join('');
  // 비가동 상세 목록
  const downDetail=(downtime||[]).map(t=>{
    const catKo={plan:'계획정지',unplan:'비계획정지',sudden:'돌발정지'}[t.category]||t.category;
    return `<tr>
      <td class="l">${(t.proc_sub1||'')}/${(t.proc_sub2||'')}</td>
      <td><span class="type-tag">${catKo}</span></td><td>${t.reason_type||'–'}</td>
      <td class="mono">${t.start_time||'–'}</td><td class="mono">${t.end_time||'–'}</td>
      <td class="mono">${diffMin(t.start_time,t.end_time)}분</td>
      <td><span class="delx" onclick="delDown(${t.id})">✕</span></td>
    </tr>`;
  }).join('');

  // ⑤ 파레토: 라인(파트)별 스코어카드 (캡쳐1 스타일)
  const lineDownMap={};
  (CUR_DAY.lineDown||[]).forEach(d=>{ lineDownMap[d.line_name]=d; });
  const parTotalUnplan=(CUR_DAY.lineDown||[]).reduce((s,d)=>s+Number(d.unplan_min||0),0);
  let parCum=0;
  const parCards=lines.map((l,idx)=>{
    const d=lineDownMap[l.line_name]||{plan_min:0,unplan_min:0,sudden_min:0};
    const planH=(Number(d.plan_min||0)/60), unplanH=(Number(d.unplan_min||0)/60);
    const contrib=parTotalUnplan>0?(Number(d.unplan_min||0)/parTotalUnplan*100):0;
    parCum+=contrib;
    // 가동률: (기준480분 - 정지) / 480 가정
    const stdMin=480, totStop=Number(d.plan_min||0)+Number(d.unplan_min||0)+Number(d.sudden_min||0);
    const runRate=stdMin>0?Math.max(0,(stdMin-totStop)/stdMin*100):0;
    return `<div class="pareto-card" onclick="openParetoDetail('${l.line_name.replace(/'/g,"")}',${runRate.toFixed(1)})" style="cursor:pointer">
      <div class="pc-hd"><span class="pc-no">${idx+1}</span><b>${l.line_name}</b></div>
      <div class="pc-grid">
        <div><div class="pc-l">계획정지</div><div class="pc-v mono">${planH.toFixed(1)} hr</div></div>
        <div><div class="pc-l">비계획정지</div><div class="pc-v mono ${unplanH>0?'neg':''}">${unplanH.toFixed(1)} hr</div></div>
        <div><div class="pc-l">비계획 비중</div><div class="pc-v mono">${contrib>0?contrib.toFixed(1)+'%':'–'}</div></div>
        <div><div class="pc-l">가동률</div><div class="pc-v mono ${runRate>=90?'pos':runRate>0?'neg':''}">${totStop>0?runRate.toFixed(1)+'%':'–'}</div></div>
      </div>
      <div class="pc-foot"><span>비계획 기여도 ${contrib.toFixed(1)}%</span><span>누적 ${parCum.toFixed(1)}%</span></div>
      <div class="pc-bar"><div style="width:${contrib}%"></div></div>
    </div>`;
  }).join('');

  // ⑥ 투입인원: 계획 + 정규직/파견 구분
  const manByLine={};
  (manpower||[]).forEach(m=>{ manByLine[(m.proc_sub1||'')+'/'+(m.proc_sub2||'')]=m; });
  let totPlanH=0,totReg=0,totDisp=0;
  const manFixedRows=lines.map(l=>{
    const m=manByLine[l.line_name]||{plan_head:0,regular_head:0,dispatch_head:0,memo:''};
    const inputH=(Number(m.regular_head||0)+Number(m.dispatch_head||0));
    totPlanH+=Number(m.plan_head||0); totReg+=Number(m.regular_head||0); totDisp+=Number(m.dispatch_head||0);
    return `<tr>
      <td class="l"><b>${l.line_name}</b></td>
      <td><input class="inp-cell mp-plan" data-line="${l.line_name}" value="${m.plan_head||''}" placeholder="0"></td>
      <td><input class="inp-cell mp-reg" data-line="${l.line_name}" value="${m.regular_head||''}" placeholder="0"></td>
      <td><input class="inp-cell mp-disp" data-line="${l.line_name}" value="${m.dispatch_head||''}" placeholder="0"></td>
      <td class="mono mp-total"><b>${inputH||'–'}</b></td>
      <td><input class="inp-cell mp-memo" data-line="${l.line_name}" style="width:150px;text-align:left" value="${m.memo||''}" placeholder="비고"></td>
    </tr>`;
  }).join('');

  $('#secMore').style.cssText='text-align:left';
  $('#secMore').className=CUR_DAY.locked?'closing-body locked':'';

function diffMin(s,e){
  if(!s||!e)return 0;
  const p=x=>{const[h,m]=x.split(':').map(Number);return h*60+m;};
  let a=p(s),b=p(e); if(b<a)b+=1440; return b-a;
}

/* 불량등록: 라인 선택 시 그 라인의 제품만 표시 (로그 정확성) */
function filterDefectProds(){
  const lineVal=$('#dfLine').value; // "proc_sub1|proc_sub2"
  const [s1,s2]=(lineVal||'|').split('|');
  const prodSel=$('#dfProd');
  if(!lineVal){ prodSel.innerHTML='<option value="">먼저 라인 선택</option>'; return; }
  // 그 라인에 속한 제품만 (중복 제거)
  const seen=new Set(); const opts=[];
  (CUR_DAY.orders||[]).forEach(o=>{
    if(o.proc_sub1===s1 && o.proc_sub2===s2){
      const key=o.prod_code;
      if(!seen.has(key)){ seen.add(key);
        opts.push(`<option value="${o.prod_code}|${o.prod_name}">${o.prod_code} ${o.prod_name}</option>`);
      }
    }
  });
  prodSel.innerHTML=`<option value="">제품선택</option>${opts.join('')}`;
}

/* ④ 불량 등록 (인라인 입력행 → 즉시 목록 추가, 포커스 유지) */
async function saveDefectNew(){
  const {date,team}=CUR_DAY;
  const lineV=$('#dfLine').value;
  const typeVal=$('#dfType').value;
  if(!lineV){ alert('라인을 선택하세요.'); return; }
  if(!$('#dfProd').value){ alert('제품을 선택하세요. 라인에 맞는 제품을 선택해야 기록이 정확합니다.'); return; }
  if(!typeVal){ alert('불량유형을 선택하세요. 유형을 선택해야 나중에 불량 집계·개선분석이 가능합니다.'); return; }
  const [s1,s2]=(lineV||'|').split('|');
  const [pc,pn]=($('#dfProd').value||'|').split('|');
  const [,typeName]=typeVal.split('|');
  const qty=Number($('#dfQty').value)||0;
  const unit=$('#dfUnit').value, reason=$('#dfReason').value;
  try{
    const {data,error}=await sb.from('t_cl_defect').insert({
      work_date:date,team,proc_sub1:s1,proc_sub2:s2,prod_code:pc,prod_name:pn,
      defect_type:typeName,qty,unit,reason
    }).select();
    if(error)throw error;
    const newRow=(data&&data[0])||{id:Date.now(),proc_sub1:s1,proc_sub2:s2,prod_name:pn,prod_code:pc,defect_type:typeName,qty,unit,reason};
    const tr=document.createElement('tr');
    tr.setAttribute('data-defect',newRow.id);
    tr.innerHTML=`
      <td class="l">${s1}/${s2}</td>
      <td class="l">${pn||pc||'–'}</td>
      <td><span class="type-tag">${typeName}</span></td>
      <td class="mono">${fmt(qty)}</td><td>${unit||'EA'}</td>
      <td class="l">${reason||'–'}</td>
      <td class="row-actions"><button class="rowbtn del" onclick="delDefect(${newRow.id})">삭제</button></td>`;
    const inputRow=document.querySelector('#defectBody .input-row');
    inputRow.insertAdjacentElement('afterend',tr);
    // 입력행 초기화 (라인은 유지 → 연속 입력 편의) + 포커스
    $('#dfQty').value=''; $('#dfReason').value=''; $('#dfType').value='';
    $('#dfProd').focus();
    CUR_DAY.defects=CUR_DAY.defects||[]; CUR_DAY.defects.push(newRow);
    toast('불량 등록완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
async function delDefect(id){
  if(!confirm('이 불량을 삭제할까요?'))return;

}

async function saveManpowerAll(){
  const {date,team}=CUR_DAY;
  const rows=[];
  document.querySelectorAll('.mp-plan').forEach(inp=>{
    const line=inp.dataset.line;
    const [s1,s2]=line.split('/');
    const plan=Number(inp.value)||0;
    const reg=Number(document.querySelector(`.mp-reg[data-line="${line}"]`).value)||0;
    const disp=Number(document.querySelector(`.mp-disp[data-line="${line}"]`).value)||0;
    const memo=document.querySelector(`.mp-memo[data-line="${line}"]`).value||'';
    if(plan||reg||disp||memo) rows.push({work_date:date,team,proc_sub1:s1,proc_sub2:s2,
      plan_head:plan,regular_head:reg,dispatch_head:disp,input_head:reg+disp,memo});
  });
  if(rows.length===0){toast('입력된 인원 없음','err');return;}
  try{
    const {error}=await sb.from('t_cl_manpower').upsert(rows,{onConflict:'work_date,team,proc_sub1,proc_sub2'});
    if(error)throw error;
    CUR_DAY.manpower=rows;  // 즉시 반영
    updateManpowerFooter();  // 합계만 갱신
    toast('인원 저장완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
/* 인원 합계 footer만 즉시 갱신 (새로고침 없이) */
function updateManpowerFooter(){
  let tp=0,tr=0,td=0;
  document.querySelectorAll('.mp-plan').forEach(inp=>{
    const line=inp.dataset.line;
    tp+=Number(inp.value)||0;
    tr+=Number(document.querySelector(`.mp-reg[data-line="${line}"]`).value)||0;
    td+=Number(document.querySelector(`.mp-disp[data-line="${line}"]`).value)||0;
    // 각 행 투입계 갱신
    const row=inp.closest('tr');
    const totCell=row.querySelector('.mp-total');
    const reg=Number(document.querySelector(`.mp-reg[data-line="${line}"]`).value)||0;
    const disp=Number(document.querySelector(`.mp-disp[data-line="${line}"]`).value)||0;
    if(totCell) totCell.innerHTML='<b>'+((reg+disp)||'–')+'</b>';
  });

async function saveLossRow(i){
  const {date,team}=CUR_DAY;
  const s=CUR_DAY.losses[i];
  const typeEl=document.querySelector(`.loss-type[data-i="${i}"]`);
  const reasonEl=document.querySelector(`.loss-reason[data-i="${i}"]`);
  const type=typeEl.value, reason=reasonEl.value.trim();

  try{
    const {error}=await sb.from('t_cl_scrap').upsert({
      work_date:date,team,proc_sub1:s.proc_sub1,proc_sub2:s.proc_sub2,
      prod_code:s.prod_code,mat_code:s.mat_code,mat_name:s.mat_name,
      diff:s.diff,unit_price:s.unit_price,loss_amount:s.loss_amount,
      scrap_type:type,reason
    },{onConflict:'work_date,team,proc_sub1,proc_sub2,prod_code,mat_code'});

    lockLossRow(i,type,reason);  // 그 행만 잠금 상태로
    toast('저장완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

  const inp=$('#newTypeName_'+kind)||$('#newTypeName');
  const name=inp?inp.value.trim():'';
  if(!name){toast('유형 이름 입력','err');return;}
  const fn=kind==='defect'?'add_defect_type':'add_loss_type';
  try{
    const {error}=await sb.rpc(fn,{p_name:name,p_team:team});
    if(error)throw error;
    // 유형 목록만 다시 불러 패널 갱신 (화면 유지)
    await reloadTypes(team);
    refreshTypePanel(kind);
    toast(name+' 저장완료','ok');
  }catch(e){ toast('추가 실패: '+(e.message||e),'err'); }
}
async function delType(kind,id){
  const {team}=CUR_DAY;
  if(!confirm('이 유형을 삭제할까요?'))return;
  const fn=kind==='defect'?'del_defect_type':'del_loss_type';
  try{
    await sb.rpc(fn,{p_id:id});
    await reloadTypes(team);
    refreshTypePanel(kind);
    toast('삭제완료','ok');
  }catch(e){ toast('삭제 실패','err'); }
}
/* 유형 목록만 재로드 (화면 전체 안 그림) */
async function reloadTypes(team){
  const [lt,dt]=await Promise.all([
    sb.rpc('get_loss_types',{p_team:team}),
    sb.rpc('get_defect_types',{p_team:team})
  ]);
  CUR_DAY.lossTypes=lt.data||[];
  CUR_DAY.defectTypes=dt.data||[];
}
/* 유형 패널 내용만 다시 그림 (열린 상태 유지, 스크롤 유지) */
function refreshTypePanel(kind){
  const panel=$('#typePanel_'+kind);
  if(!panel||panel.style.display==='none')return;
  const types=kind==='defect'?CUR_DAY.defectTypes:CUR_DAY.lossTypes;
  const chips=(types||[]).map(t=>`<span class="type-chip">${t.type_name}<span class="x" onclick="delType('${kind}','${t.type_id}')">✕</span></span>`).join('');
  panel.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="newTypeName_${kind}" placeholder="새 ${kind==='defect'?'불량':'로스'}유형 입력 후 Enter" style="flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px"
        onkeydown="if(event.key==='Enter')addType('${kind}')">
      <button class="tbtn save" onclick="addType('${kind}')">+ 추가</button>
    </div>
    <div class="type-chips">${chips||'<span style="color:var(--mut);font-size:12px">등록된 유형 없음</span>'}</div>`;
  const ni=$('#newTypeName_'+kind); if(ni) ni.focus();
}

/* 마감 저장/제출 (문서번호 자동) */
async function saveClosing(submit){
  const {date,team}=CUR_DAY;
  const status=submit?'submitted':'draft';
  let comment=null;
  if(submit){
    comment=prompt('제출 의견 (선택). 예: "밥이보약 제품 코터기 설비이상으로 수율저하"\n없으면 그냥 확인:');
    if(comment===null) return; // 취소
  }
  try{
    const {data,error}=await sb.rpc('upsert_closing',{p_date:date,p_team:team,p_status:status,p_writer:S.user.name,p_comment:comment});
    if(error)throw error;
    if(submit){
      await sb.from('t_approval_log').insert({
        closing_id:team+'_'+date, work_date:date, team,
        action:'submit', actor:S.user.name, actor_role:S.user.role||'writer', memo:comment
      });
      toast('제출 완료 · '+(data.doc_no||''),'ok');
      openDay(date,team);
    }else{
      const st=$('#tbStatus'); if(st) st.textContent='임시저장됨';
      toast('임시저장 완료 · '+(data.doc_no||''),'ok');
    }
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}
function switchOrderTab(k){
  $('#tabFin').classList.toggle('on',k==='fin');
  $('#tabSemi').classList.toggle('on',k==='semi');
  const rows=CUR_DAY.orders.filter(o=>o.kind===k).map(o=>{
    const ach=Number(o.achieve||0);
    return `<tr>
      <td class="l">${o.proc_sub1}/${o.proc_sub2}</td>
      <td class="l mono">${o.prod_code}</td>
      <td class="l">${o.prod_name}</td>
      <td class="mono">${o.hoki||'–'}</td>
      <td class="mono">${fmt(o.plan_sum)}</td>
      <td class="mono">${fmt(o.actual_sum)}</td>
      <td class="mono ${ach>=.98?'pos':'neg'}">${pct(ach)}</td>
    </tr>`;
  }).join('');
  $('#orderBody').innerHTML=rows||`<tr><td colspan="7" style="color:var(--mut);padding:16px">${k==='fin'?'완제품':'반제품'} 없음</td></tr>`;
}

/* ===== (구 PO 상세 — 미사용, 참조용 보존) ===== */
let CUR_PO={sub1:null,sub2:null,products:[],scraps:[]};
async function openPO(sub1, sub2){
  CUR_PO={sub1,sub2,products:[],scraps:[]};
  S.view='po';
  $('#wrap').innerHTML='<div class="skel" style="height:400px;border-radius:14px"></div>';
  const {date,team}=CUR_DAY;
  try{
    const [prodRes,scrapRes,workRes]=await Promise.all([
      sb.rpc('get_po_products',{p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2}),
      sb.rpc('get_po_scraps',{p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2}),
      sb.from('t_po_work').select('*').eq('work_date',date).eq('team',team)
        .eq('proc_sub1',sub1).eq('proc_sub2',sub2)
    ]);
    if(prodRes.error)throw prodRes.error;
    CUR_PO.products=prodRes.data||[];
    CUR_PO.scraps=scrapRes.data||[];
    CUR_PO.work=(workRes.data&&workRes.data[0])||{};
  }catch(e){ toast('PO 상세 실패: '+(e.message||e),'err'); return; }
  renderPO();
}
function renderPO(){
  const {sub1,sub2,products,scraps,work}=CUR_PO;
  const {date,team}=CUR_DAY;
  const w=work||{};
  // 제품 리스트(계획/실적/달성률 - 4번)
  const prodRows=products.map(p=>{
    const ach=Number(p.achieve||0);
    return `<tr>
      <td class="l"><span class="kind-badge ${p.kind}">${p.kind==='fin'?'완제품':p.kind==='semi'?'반제품':'기타'}</span> ${p.prod_code}</td>
      <td class="l">${p.prod_name}</td>
      <td class="mono">${p.hoki||'–'}</td>
      <td class="mono">${fmt(p.plan_sum)}</td>
      <td class="mono">${fmt(p.actual_sum)}</td>
      <td class="mono ${ach>=.98?'pos':'neg'}">${pct(ach)}</td>
    </tr>`;
  }).join('');
  // 스크랩(편차≠0 - 5번)
  const scrapRows=scraps.map((s,i)=>`<tr>
    <td class="l">${s.prod_name||s.prod_code}</td>
    <td class="l">${s.mat_name}</td>
    <td class="mono">${fmt(s.diff)} ${s.mat_unit||''}</td>
    <td class="mono">${fmt(s.unit_price)}</td>
    <td class="mono neg">${fmt(s.loss_amount)}</td>
    <td><input class="inp-cell" style="width:180px;text-align:left" id="scrapReason${i}" placeholder="사유 입력" value="${s.reason||''}"></td>
  </tr>`).join('');

  $('#wrap').innerHTML=`
  <div class="po-back"><button onclick="openDay('${date}','${team}')">← ${date} PO 목록</button></div>
  <div class="day-hd">
    <div><h2>${sub1} / ${sub2}</h2><div class="en">${team} · ${date}</div></div>
    <div class="meta">제품 <b>${products.length}</b>종</div>
  </div>

  <!-- 1. 제품별 계획/실적/달성률 -->
  <div class="sec"><div class="sec-hd"><span class="no">1</span><h3>제품별 생산실적</h3>
    <span class="desc">부자재(5시작) 제외 · 계획/실적/달성률</span></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품코드</th><th>제품명</th><th>호기</th><th>계획(KG)</th><th>실적(KG)</th><th>달성률</th></tr></thead>
      <tbody>${prodRows||'<tr><td colspan="6" style="color:var(--mut);padding:16px">제품이 없습니다.</td></tr>'}</tbody>
    </table></div>
  </div>

  <!-- 2. PO 작업기록 (수기입력) -->
  <div class="sec"><div class="sec-hd"><span class="no">2</span><h3>작업 기록</h3>
    <span class="desc">인원·생산시간·정지시간 입력</span><span class="sp"></span>
    <button class="tbtn save" onclick="savePOWork()">저장</button></div>
    <div class="sec-bd">
      <div class="work-grid">
        <div class="work-field"><label>호기</label><input id="wHoki" value="${w.hoki||''}" placeholder="호기"></div>
        <div class="work-field"><label>투입인원(명)</label><input id="wHead" type="number" value="${w.input_head||''}" placeholder="0"></div>
        <div class="work-field"><label></label><div></div></div>
        <div class="work-field"><label>생산시작</label><input id="wStart" type="time" value="${w.start_time||''}"></div>
        <div class="work-field"><label>생산종료</label><input id="wEnd" type="time" value="${w.end_time||''}"></div>
        <div class="work-field"><label>메모</label><input id="wMemo" value="${w.memo||''}" placeholder="비고"></div>
        <div class="work-field"><label>계획정지(분)</label><input id="wStopPlan" type="number" value="${w.stop_plan||''}" placeholder="0"></div>
        <div class="work-field"><label>비계획정지(분)</label><input id="wStopUnplan" type="number" value="${w.stop_unplan||''}" placeholder="0"></div>
        <div class="work-field"><label>돌발정지(분)</label><input id="wStopSudden" type="number" value="${w.stop_sudden||''}" placeholder="0"></div>
      </div>
    </div>
  </div>

  <!-- 3. 스크랩 사유 (편차≠0) -->
  <div class="sec"><div class="sec-hd"><span class="no">3</span><h3>스크랩 사유</h3>
    <span class="desc">편차 발생 자재 · 사유 작성</span><span class="sp"></span>
    ${scraps.length?`<button class="tbtn save" onclick="savePOScrap()">사유 저장</button>`:''}</div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품</th><th>자재명</th><th>편차</th><th>단가</th><th>로스금액</th><th>발생사유</th></tr></thead>
      <tbody>${scrapRows||'<tr><td colspan="6" style="color:var(--mut);padding:16px">편차 발생 없음</td></tr>'}</tbody>
    </table></div>
  </div>

  <!-- 4. 불량 등록 -->
  <div class="sec"><div class="sec-hd"><span class="no">4</span><h3>불량 등록</h3>
    <span class="desc">제품 선택 → 불량유형·수량</span><span class="sp"></span>
    <button class="tbtn save" onclick="addDefectRow()">+ 불량 추가</button></div>
    <div class="sec-bd" style="overflow-x:auto"><table>
      <thead><tr><th>제품 선택</th><th>불량유형</th><th>수량</th><th>단위</th><th>사유</th><th></th></tr></thead>
      <tbody id="defectBody"><tr><td colspan="6" style="color:var(--mut);padding:16px">"+ 불량 추가"로 등록</td></tr></tbody>
    </table></div>
  </div>`;
}

async function savePOWork(){
  const {date,team}=CUR_DAY, {sub1,sub2}=CUR_PO;
  const n=id=>{const v=Number($(id).value);return isNaN(v)?0:v;};
  try{
    const {error}=await sb.rpc('save_po_work',{
      p_date:date,p_team:team,p_sub1:sub1,p_sub2:sub2,p_hoki:$('#wHoki').value,
      p_head:n('#wHead'),p_start:$('#wStart').value,p_end:$('#wEnd').value,
      p_stop_plan:n('#wStopPlan'),p_stop_unplan:n('#wStopUnplan'),p_stop_sudden:n('#wStopSudden'),
      p_memo:$('#wMemo').value
    });
    if(error)throw error;
    toast('작업기록 저장 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

async function savePOScrap(){
  const {date,team}=CUR_DAY, {sub1,sub2,scraps}=CUR_PO;
  const rows=scraps.map((s,i)=>({
    work_date:date,team,proc_sub1:sub1,proc_sub2:sub2,
    prod_code:s.prod_code,mat_code:s.mat_code,mat_name:s.mat_name,
    diff:s.diff,unit_price:s.unit_price,loss_amount:s.loss_amount,
    reason:($('#scrapReason'+i)||{}).value||''
  }));
  try{
    const {error}=await sb.from('t_po_scrap').upsert(rows,{onConflict:'work_date,team,proc_sub1,proc_sub2,prod_code,mat_code'});
    if(error)throw error;
    toast('스크랩 사유 저장 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}

/* 불량 등록 (제품 드롭다운) */
function addDefectRow(){
  const body=$('#defectBody');
  if(body.querySelector('td[colspan]')) body.innerHTML='';
  const idx=body.children.length;
  const opts=CUR_PO.products.map(p=>`<option value="${p.prod_code}|${p.prod_name}">${p.prod_code} ${p.prod_name}</option>`).join('');
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><select class="inp-cell" style="width:200px;text-align:left" id="dProd${idx}"><option value="">선택</option>${opts}</select></td>
    <td><input class="inp-cell" style="width:110px;text-align:left" id="dType${idx}" placeholder="불량유형"></td>
    <td><input class="inp-cell" id="dQty${idx}" type="number" placeholder="0"></td>
    <td><input class="inp-cell" style="width:56px" id="dUnit${idx}" value="EA"></td>
    <td><input class="inp-cell" style="width:150px;text-align:left" id="dReason${idx}" placeholder="사유"></td>
    <td><button class="tbtn" onclick="saveDefect(${idx})">저장</button></td>`;
  body.appendChild(tr);
}
async function saveDefect(idx){
  const {date,team}=CUR_DAY, {sub1,sub2}=CUR_PO;
  const prodVal=($('#dProd'+idx)||{}).value||'';
  if(!prodVal){toast('제품을 선택하세요','err');return;}
  const [code,name]=prodVal.split('|');
  try{
    const {error}=await sb.from('t_po_defect').insert({
      work_date:date,team,proc_sub1:sub1,proc_sub2:sub2,
      prod_code:code,prod_name:name,
      defect_type:$('#dType'+idx).value,qty:Number($('#dQty'+idx).value)||0,
      unit:$('#dUnit'+idx).value,reason:$('#dReason'+idx).value
    });
    if(error)throw error;
    toast('불량 등록 완료','ok');
  }catch(e){ toast('저장 실패: '+(e.message||e),'err'); }
}</script>
</body>
</html>
